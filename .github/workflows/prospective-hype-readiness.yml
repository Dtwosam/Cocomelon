name: Prospective HYPE Readiness Audit

on:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-readiness.yml"
      - ".github/workflows/prospective-hype-clean.yml"
      - "src/cocomelon/research/prospective_campaign_readiness.py"
      - "src/cocomelon/research/prospective_readiness_failure.py"
      - "src/cocomelon/prospective_hype_readiness_cli.py"
      - "src/cocomelon/prospective_hype_readiness_failure_cli.py"
      - "tests/test_prospective_campaign_readiness.py"
      - "tests/test_prospective_readiness_failure.py"
      - "tests/test_prospective_readiness_failure_cli.py"
      - "tests/test_prospective_hype_readiness_workflow.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-readiness.yml"
      - ".github/workflows/prospective-hype-clean.yml"
      - "src/cocomelon/research/prospective_campaign_readiness.py"
      - "src/cocomelon/research/prospective_readiness_failure.py"
      - "src/cocomelon/prospective_hype_readiness_cli.py"
      - "src/cocomelon/prospective_hype_readiness_failure_cli.py"
      - "tests/test_prospective_campaign_readiness.py"
      - "tests/test_prospective_readiness_failure.py"
      - "tests/test_prospective_readiness_failure_cli.py"
      - "tests/test_prospective_hype_readiness_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-hype-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Capture readiness audit identity
        id: audit_identity
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import time
          from pathlib import Path

          workflow = Path(".github/workflows/prospective-hype-clean.yml")
          workflow_sha = (
              hashlib.sha256(workflow.read_bytes()).hexdigest()
              if workflow.is_file()
              else "none"
          )
          print(f"audited_at_ms={time.time_ns() // 1_000_000}")
          print(f"observer_workflow_sha256={workflow_sha}")
          PY

      - name: Build immutable readiness receipt
        id: build
        continue-on-error: true
        env:
          AUDIT_MS: ${{ steps.audit_identity.outputs.audited_at_ms }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/prospective-hype-readiness
          cocomelon-prospective-hype-readiness \
            --workflow .github/workflows/prospective-hype-clean.yml \
            --as-of-ms "$AUDIT_MS" \
            > artifacts/prospective-hype-readiness/readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "artifacts/prospective-hype-readiness/readiness.json"
              ).read_text(encoding="utf-8")
          )
          assert payload["readiness_status"] in {
              "ready_pre_cutover",
              "post_cutover_contract_valid",
          }
          assert payload["expected_anchor_count"] == 1080
          assert len(payload["candidate_spec_id"]) == 64
          assert len(payload["validation_plan_id"]) == 64
          assert len(payload["observer_source_revision"]) == 40
          assert len(payload["observer_workflow_sha256"]) == 64
          assert len(payload["readiness_id"]) == 64
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload readiness receipt
        id: success_upload
        continue-on-error: true
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-readiness/readiness.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9


      - name: Preserve redacted readiness failure receipt
        if: >-
          always() &&
          (
            steps.build.outcome == 'failure' ||
            steps.success_upload.outcome == 'failure'
          )
        env:
          AUDIT_MS: ${{ steps.audit_identity.outputs.audited_at_ms }}
          WORKFLOW_SHA: ${{ steps.audit_identity.outputs.observer_workflow_sha256 }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.success_upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_OUTCOME" == "failure" ]]; then
            stage="build"
            reason_code="READINESS_CONTRACT_VERIFY_FAILED"
          elif [[ "$UPLOAD_OUTCOME" == "failure" ]]; then
            stage="upload"
            reason_code="READINESS_RECEIPT_UPLOAD_FAILED"
          else
            echo "readiness failure stage could not be resolved" >&2
            exit 2
          fi

          cocomelon-prospective-hype-readiness-failure \
            --audited-at-ms "$AUDIT_MS" \
            --stage "$stage" \
            --reason-code "$reason_code" \
            --observer-workflow-sha256 "$WORKFLOW_SHA" \
            > artifacts/prospective-hype-readiness/failure.json

      - name: Upload readiness failure receipt
        if: >-
          always() &&
          (
            steps.build.outcome == 'failure' ||
            steps.success_upload.outcome == 'failure'
          )
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-failed-readiness-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-readiness/failure.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Preserve readiness failure status
        if: >-
          always() &&
          (
            steps.build.outcome == 'failure' ||
            steps.success_upload.outcome == 'failure'
          )
        run: exit 1
