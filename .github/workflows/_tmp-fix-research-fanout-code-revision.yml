name: Temporary fix research fanout code revision binding

on:
  push:
    branches:
      - feat/research-single-capture-fanout-20260911
    paths:
      - .github/workflows/_tmp-fix-research-fanout-code-revision.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/research-single-capture-fanout-20260911
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bind candidate code revision into replay bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cocomelon/research/cohort.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _freeze_research_replay_payload(\n    recording_root: Path,\n    bundle_path: Path,\n    replay_config: BaselineReplayConfig,\n) -> dict[str, object]:\n    _assert_research_replay_config(replay_config)\n    code_revision = resolve_code_revision(None, cwd=Path.cwd())\n'''
          new = '''def _freeze_research_replay_payload(\n    recording_root: Path,\n    bundle_path: Path,\n    replay_config: BaselineReplayConfig,\n    *,\n    code_revision: str | None = None,\n) -> dict[str, object]:\n    _assert_research_replay_config(replay_config)\n    resolved_code_revision = (\n        resolve_code_revision(None, cwd=Path.cwd())\n        if code_revision is None\n        else _require_sha(code_revision, "research replay code_revision")\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected replay freeze anchor")
          text = text.replace(old, new, 1)
          old = '''        code_revision=code_revision,\n    )\n'''
          new = '''        code_revision=resolved_code_revision,\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected freeze code_revision call")
          text = text.replace(old, new, 1)
          old = '''    freeze = _freeze_research_replay_payload(\n        recording,\n        output / "bundle.json",\n        replay_config,\n    )\n    bundle = load_baseline_replay_bundle(output / "bundle.json")\n'''
          new = '''    freeze = _freeze_research_replay_payload(\n        recording,\n        output / "bundle.json",\n        replay_config,\n        code_revision=candidate.code_revision,\n    )\n    bundle = load_baseline_replay_bundle(output / "bundle.json")\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected candidate materialization freeze call")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify code revision binding
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff format src/cocomelon/research/cohort.py tests/test_research_capture_source_fanout.py
          python -m ruff check src tests scripts --exclude scripts/_tmp_apply_research_fanout.py
          python -m mypy src
          python -m pytest tests/test_research_capture_source_fanout.py tests/test_research_candidate_execution_binding.py -q
          git diff --check
      - name: Commit candidate code revision binding
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cocomelon/research/cohort.py tests/test_research_capture_source_fanout.py
          git commit -m "fix: bind fanout replay to candidate code revision"
          git push origin HEAD:feat/research-single-capture-fanout-20260911
