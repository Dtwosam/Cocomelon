name: Prospective HYPE V3 Control Heartbeat

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-v3-control-heartbeat.yml"
  pull_request:
    paths:
      - ".github/workflows/prospective-hype-v3-control-heartbeat.yml"
      - "tests/test_prospective_hype_v3_control_heartbeat_workflow.py"
  workflow_dispatch:
    inputs:
      target_heartbeat_ms:
        description: Exact UTC minute-10 heartbeat target in epoch milliseconds
        required: true
        type: string
      queue_parent_run_id:
        description: Run that replenished this heartbeat target, or manual
        required: true
        default: "manual"
        type: string

run-name: Prospective HYPE V3 heartbeat ${{ inputs.target_heartbeat_ms }}

permissions:
  contents: read
  actions: write

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify V3 control heartbeat contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_prospective_hype_v3_control_heartbeat_workflow.py -q

  heartbeat:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      HEARTBEAT_WORKFLOW_FILE: prospective-hype-v3-control-heartbeat.yml
      AUDIT_WORKFLOW_FILE: prospective-hype-v3-audit.yml
      CUTOVER_WORKFLOW_FILE: prospective-hype-v3-cutover-acceptance.yml
      RUN_TITLE_PREFIX: Prospective HYPE V3 heartbeat
      QUEUE_DEPTH: "4"
      HEARTBEAT_MINUTE_UTC: "10"
      INPUT_TARGET_HEARTBEAT_MS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_heartbeat_ms || 'bootstrap' }}
      INPUT_QUEUE_PARENT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.queue_parent_run_id || 'none' }}

    steps:
      - name: Resolve heartbeat leader and queue base
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            sleep 2
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$HEARTBEAT_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=100" \
              > /tmp/v3-heartbeat-runs.json
          else
            printf '%s\n' '{"workflow_runs":[]}' > /tmp/v3-heartbeat-runs.json
          fi

          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          HOUR_MS = 3_600_000
          MINUTE_MS = 60_000
          heartbeat_minute = int(os.environ["HEARTBEAT_MINUTE_UTC"])
          offset = heartbeat_minute * MINUTE_MS
          output = Path(os.environ["GITHUB_OUTPUT"])
          event = os.environ["GITHUB_EVENT_NAME"]

          def validate_target(value: int) -> None:
              if value < 0 or value % HOUR_MS != offset:
                  raise SystemExit("V3_HEARTBEAT_TARGET_PHASE_INVALID")

          if event == "push":
              now_ms = time.time_ns() // 1_000_000
              hour_start = (now_ms // HOUR_MS) * HOUR_MS
              next_target = hour_start + offset
              if next_target <= now_ms:
                  next_target += HOUR_MS
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("proceed=true\n")
                  handle.write("target_heartbeat_ms=bootstrap\n")
                  handle.write(f"queue_base_target_ms={next_target - HOUR_MS}\n")
              raise SystemExit(0)

          if event != "workflow_dispatch":
              raise SystemExit("V3_HEARTBEAT_EVENT_INVALID")

          try:
              target = int(os.environ["INPUT_TARGET_HEARTBEAT_MS"])
          except ValueError as exc:
              raise SystemExit("V3_HEARTBEAT_TARGET_INVALID") from exc
          validate_target(target)

          parent = os.environ["INPUT_QUEUE_PARENT_RUN_ID"]
          if parent != "manual" and not parent.isdigit():
              raise SystemExit("V3_HEARTBEAT_PARENT_INVALID")

          raw = json.loads(
              Path("/tmp/v3-heartbeat-runs.json").read_text(encoding="utf-8")
          )
          if not isinstance(raw, dict) or not isinstance(raw.get("workflow_runs"), list):
              raise SystemExit("V3_HEARTBEAT_RUN_PAYLOAD_INVALID")

          title = f"{os.environ['RUN_TITLE_PREFIX']} {target}"
          matching = []
          for run in raw["workflow_runs"]:
              if not isinstance(run, dict):
                  continue
              if run.get("display_title") != title:
                  continue
              if run.get("event") != "workflow_dispatch":
                  continue
              if run.get("head_branch") != "main":
                  continue
              if run.get("status") == "completed" and run.get("conclusion") != "success":
                  continue
              run_id = run.get("id")
              if isinstance(run_id, bool) or not isinstance(run_id, int):
                  raise SystemExit("V3_HEARTBEAT_RUN_ID_INVALID")
              matching.append(run_id)

          if not matching:
              raise SystemExit("V3_HEARTBEAT_LEADER_NOT_FOUND")
          leader = min(matching)
          current = int(os.environ["GITHUB_RUN_ID"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"proceed={'true' if leader == current else 'false'}\n")
              handle.write(f"target_heartbeat_ms={target}\n")
              handle.write(f"queue_base_target_ms={target}\n")
          PY

      - name: Hold leader until heartbeat target
        if: ${{ steps.identity.outputs.proceed == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_HEARTBEAT_MS: ${{ steps.identity.outputs.target_heartbeat_ms }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time

          target = int(os.environ["TARGET_HEARTBEAT_MS"])
          now_ms = time.time_ns() // 1_000_000
          if now_ms < target:
              delay = (target - now_ms) / 1_000
              if delay > (4 * 60 * 60 + 60):
                  raise SystemExit("V3_HEARTBEAT_DELAY_OUT_OF_BOUNDS")
              print(f"heartbeat_delay_seconds={delay:.3f}")
              time.sleep(delay)
          PY

      - name: Refill heartbeat queue
        if: ${{ steps.identity.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_TARGET_MS: ${{ steps.identity.outputs.queue_base_target_ms }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$HEARTBEAT_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > /tmp/v3-heartbeat-runs.json

          python - <<'PY' > /tmp/v3-heartbeat-missing.txt
          import json
          import os
          from pathlib import Path

          HOUR_MS = 3_600_000
          depth = int(os.environ["QUEUE_DEPTH"])
          base = int(os.environ["QUEUE_BASE_TARGET_MS"])
          prefix = os.environ["RUN_TITLE_PREFIX"]

          raw = json.loads(
              Path("/tmp/v3-heartbeat-runs.json").read_text(encoding="utf-8")
          )
          if not isinstance(raw, dict) or not isinstance(raw.get("workflow_runs"), list):
              raise SystemExit("V3_HEARTBEAT_RUN_PAYLOAD_INVALID")
          runs = raw["workflow_runs"]

          for index in range(1, depth + 1):
              target = base + index * HOUR_MS
              title = f"{prefix} {target}"
              covered = any(
                  isinstance(run, dict)
                  and run.get("display_title") == title
                  and run.get("event") == "workflow_dispatch"
                  and run.get("head_branch") == "main"
                  and (
                      run.get("status") != "completed"
                      or run.get("conclusion") == "success"
                  )
                  for run in runs
              )
              if not covered:
                  print(target)
          PY

          while read -r target; do
            [[ -n "$target" ]] || continue
            attempt=1
            while true; do
              set +e
              output="$(
                gh workflow run "$HEARTBEAT_WORKFLOW_FILE" \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f "target_heartbeat_ms=$target" \
                  -f "queue_parent_run_id=$GITHUB_RUN_ID" 2>&1
              )"
              rc=$?
              set -e
              if [[ "$rc" -eq 0 ]]; then
                break
              fi
              if [[ "$attempt" -ge 5 ]] || ! grep -Eq 'HTTP (500|502|503|504)' <<<"$output"; then
                printf '%s\n' "$output" >&2
                exit "$rc"
              fi
              sleep "$((attempt * 2))"
              attempt="$((attempt + 1))"
            done
            sleep 1
          done < /tmp/v3-heartbeat-missing.txt

      - name: Dispatch independent V3 audit
        id: audit
        if: ${{ steps.identity.outputs.proceed == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$AUDIT_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=1" \
              --jq '.workflow_runs[0].id // 0'
          )"
          gh workflow run "$AUDIT_WORKFLOW_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          audit_run_id=""
          for attempt in {1..15}; do
            candidate="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$AUDIT_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=10" \
                --jq --argjson prior "$prior_id" '[.workflow_runs[] | select(.id > $prior)] | sort_by(.id) | first | .id // empty'
            )"
            if [[ -n "$candidate" ]]; then
              audit_run_id="$candidate"
              break
            fi
            sleep 2
          done
          if [[ -z "$audit_run_id" ]]; then
            echo "V3_HEARTBEAT_AUDIT_RUN_NOT_FOUND" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            status="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$audit_run_id" \
                --jq '.status'
            )"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$GITHUB_REPOSITORY/actions/runs/$audit_run_id" \
                  --jq '.conclusion'
              )"
              if [[ "$conclusion" != "success" ]]; then
                echo "V3_HEARTBEAT_AUDIT_NOT_SUCCESSFUL:$conclusion" >&2
                exit 1
              fi
              echo "run_id=$audit_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "V3_HEARTBEAT_AUDIT_TIMEOUT" >&2
          exit 1

      - name: Dispatch V3 cutover acceptance
        id: cutover
        if: ${{ steps.audit.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$CUTOVER_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=1" \
              --jq '.workflow_runs[0].id // 0'
          )"
          gh workflow run "$CUTOVER_WORKFLOW_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          cutover_run_id=""
          for attempt in {1..15}; do
            candidate="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$CUTOVER_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=10" \
                --jq --argjson prior "$prior_id" '[.workflow_runs[] | select(.id > $prior)] | sort_by(.id) | first | .id // empty'
            )"
            if [[ -n "$candidate" ]]; then
              cutover_run_id="$candidate"
              break
            fi
            sleep 2
          done
          if [[ -z "$cutover_run_id" ]]; then
            echo "V3_HEARTBEAT_CUTOVER_RUN_NOT_FOUND" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            status="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$cutover_run_id" \
                --jq '.status'
            )"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$GITHUB_REPOSITORY/actions/runs/$cutover_run_id" \
                  --jq '.conclusion'
              )"
              if [[ "$conclusion" != "success" ]]; then
                echo "V3_HEARTBEAT_CUTOVER_NOT_SUCCESSFUL:$conclusion" >&2
                exit 1
              fi
              echo "run_id=$cutover_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "V3_HEARTBEAT_CUTOVER_TIMEOUT" >&2
          exit 1

      - name: Build non-economic heartbeat receipt
        if: ${{ steps.identity.outputs.proceed == 'true' }}
        env:
          TARGET_HEARTBEAT_MS: ${{ steps.identity.outputs.target_heartbeat_ms }}
          AUDIT_RUN_ID: ${{ steps.audit.outputs.run_id }}
          CUTOVER_RUN_ID: ${{ steps.cutover.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/prospective-hype-v3-control-heartbeat
          python - <<'PY' > artifacts/prospective-hype-v3-control-heartbeat/receipt.json
          import hashlib
          import json
          import os
          import time

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          payload = {
              "kind": "prospective-hype-v3-control-heartbeat",
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "target_heartbeat_ms": (
                  None
                  if os.environ["TARGET_HEARTBEAT_MS"] == "bootstrap"
                  else int(os.environ["TARGET_HEARTBEAT_MS"])
              ),
              "audit_run_id": (
                  int(os.environ["AUDIT_RUN_ID"])
                  if os.environ.get("AUDIT_RUN_ID", "").isdigit()
                  else None
              ),
              "cutover_run_id": (
                  int(os.environ["CUTOVER_RUN_ID"])
                  if os.environ.get("CUTOVER_RUN_ID", "").isdigit()
                  else None
              ),
              "queue_depth": int(os.environ["QUEUE_DEPTH"]),
              "heartbeat_minute_utc": int(os.environ["HEARTBEAT_MINUTE_UTC"]),
              "economic_evidence": False,
              "promotion_eligible": False,
              "observed_at_ms": time.time_ns() // 1_000_000,
              "schema_version": 1,
          }
          payload["receipt_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          print(canonical(payload))
          PY

      - name: Upload heartbeat receipt
        if: ${{ steps.identity.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-v3-control-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-v3-control-heartbeat/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
