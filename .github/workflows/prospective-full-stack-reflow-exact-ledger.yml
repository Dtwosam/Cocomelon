name: Prospective Full-Stack Reflow Exact PnL Ledger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-full-stack-reflow-exact-ledger.yml"
      - "scripts/update_prospective_full_stack_reflow_exact_ledger.py"
      - "src/cocomelon/research/prospective_full_stack_reflow_exact_ledger.py"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-full-stack-reflow-exact-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEDGER_ISSUE: "738"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact source paper run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail
          echo "source_eligible=true" >> "$GITHUB_OUTPUT"

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local expected_name="continuous-paper-learning-source-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$expected_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if not matches:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected at most one non-expired source artifact named {name}"
              )
          item = matches[0]
          digest = item.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("source artifact digest is missing or invalid")
          print(item["id"], item["name"], digest, sep="\t")
          '
          }

          wait_for_paper_run_completion() {
            local candidate_run_id="$1"
            local attempts=120
            local status=""
            for _ in $(seq 1 "$attempts"); do
              status="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" \
                  --jq '.status'
              )"
              if [ "$status" = "completed" ]; then
                return 0
              fi
              sleep 5
            done
            echo "source paper run did not complete within 10 minutes" >&2
            return 1
          }

          paper_run_is_evidence_eligible() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local run_path="/tmp/continuous-paper-evidence-source-run-$candidate_run_id.json"
            local jobs_path="/tmp/continuous-paper-evidence-source-jobs-$candidate_run_id.json"

            gh api               "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id"               > "$run_path"
            gh api               "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100"               > "$jobs_path"

            python -               "$run_path"               "$jobs_path"               "$candidate_attempt"               "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_attempt, expected_repo = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit(1)
          if run.get("head_branch") != "main":
              raise SystemExit(1)
          if run.get("status") != "completed":
              raise SystemExit(1)
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit(1)
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              raise SystemExit(1)
          conclusion = run.get("conclusion")
          if conclusion not in {"success", "failure"}:
              raise SystemExit(1)
          if conclusion == "success":
              raise SystemExit(0)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs_payload = json.load(handle)
          paper_jobs = [
              job
              for job in jobs_payload.get("jobs", [])
              if job.get("name") == "paper"
          ]
          if len(paper_jobs) != 1:
              raise SystemExit(1)
          paper_job = paper_jobs[0]
          if paper_job.get("conclusion") != "failure":
              raise SystemExit(1)

          steps = {
              step.get("name"): step.get("conclusion")
              for step in paper_job.get("steps", [])
              if isinstance(step.get("name"), str)
          }
          required_successes = (
              "Run continuous paper trader",
              "Measure durable continuous paper state",
              "Upload durable continuous paper state",
              "Upload compact continuous learning source",
          )
          if any(steps.get(name) != "success" for name in required_successes):
              raise SystemExit(1)
          failed_steps = {
              name
              for name, step_conclusion in steps.items()
              if step_conclusion == "failure"
          }
          allowed_failed_steps = {
              frozenset({"Fail closed on upgrade handoff source"}),
              frozenset(
                  {
                      "Queue fallback exact successor continuous paper worker",
                      "Fail closed on upgrade handoff source",
                  }
              ),
          }
          if frozenset(failed_steps) not in allowed_failed_steps:
              raise SystemExit(1)
          if (
              "Queue fallback exact successor continuous paper worker"
              in failed_steps
              and steps.get("Queue exact successor from fast resume")
              != "success"
          ):
              raise SystemExit(1)
          PY
          }

          run_id=""
          run_attempt=""
          artifact_line=""
          resolution_mode=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
              echo "manual source paper run identity is invalid" >&2
              exit 1
            fi
            if ! wait_for_paper_run_completion "$run_id"; then
              exit 1
            fi
            if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
              echo "manual source paper run is not evidence-eligible" >&2
              exit 1
            fi
            artifact_line="$(artifact_for_run "$run_id" "$run_attempt")"
            resolution_mode="manual_exact"
          elif [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ && "$EVENT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            if paper_run_is_evidence_eligible "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"; then
              candidate_artifact_line="$(
                artifact_for_run "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$EVENT_RUN_ID"
                run_attempt="$EVENT_RUN_ATTEMPT"
                artifact_line="$candidate_artifact_line"
                if [ "$EVENT_CONCLUSION" = "success" ]; then
                  resolution_mode="successful_event"
                else
                  resolution_mode="durable_upgrade_handoff_event"
                fi
              fi
            fi
          fi

          if [ -z "$artifact_line" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=100"
            )"
            mapfile -t artifact_candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${artifact_candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if ! paper_run_is_evidence_eligible                 "$candidate_run_id"                 "$candidate_attempt"; then
                continue
              fi
              candidate_artifact_line="$(
                artifact_for_run "$candidate_run_id" "$candidate_attempt"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$candidate_run_id"
                run_attempt="$candidate_attempt"
                artifact_line="$candidate_artifact_line"
                resolution_mode="latest_evidence_eligible_with_compact_artifact"
                break
              fi
            done
          fi

          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "source paper run identity is invalid" >&2
            exit 1
          fi
          if [ -z "$artifact_line" ]; then
            echo "selected source has no authenticated compact artifact" >&2
            exit 1
          fi
          if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
            echo "selected source paper run is not evidence-eligible" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed":
              raise SystemExit("source run must be completed")
          if run.get("conclusion") not in {"success", "failure"}:
              raise SystemExit("source run conclusion is not evidence-eligible")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download compact full-stack source
        if: ${{ steps.source.outputs.source_eligible == 'true' }}
        id: compact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/full-stack-reflow-source
          mkdir -p /tmp/full-stack-reflow-source
          gh api             "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/full-stack-reflow-source.zip
          unzip -q             /tmp/full-stack-reflow-source.zip             -d /tmp/full-stack-reflow-source

          summary_path="$(
            find /tmp/full-stack-reflow-source               -type f               -name prospective-full-stack-capacity-reflow-summary.json               -print -quit
          )"
          if [ -z "$summary_path" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "summary_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$summary_path"
          if ! python - "$summary_path" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          realized = payload.get("realized_pnl")
          eligible = (
              isinstance(realized, dict)
              and realized.get("exact_realized_return_modeled") is True
              and realized.get("entry_notional_normalized") is True
              and isinstance(realized.get("horizons_ms"), list)
              and isinstance(realized.get("option_results"), list)
              and payload.get("cross_horizon_economics_aggregated") is False
              and payload.get("strategy_level_realized_pnl_claimed") is False
          )
          raise SystemExit(0 if eligible else 1)
          PY
          then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"

      - name: Publish waiting-for-summary status
        if: ${{ steps.source.outputs.source_eligible == 'true' && steps.compact.outputs.eligible != 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
        run: |
          cat > /tmp/full-stack-reflow-ledger-status.md <<EOF
          ## Full-stack reflow exact realized-PnL ledger

          **Status:** waiting for new-format compact source

          - source paper run: \`$SOURCE_RUN_ID\`
          - source paper attempt: \`$SOURCE_RUN_ATTEMPT\`
          - source resolution: \`$RESOLUTION_MODE\`
          - reason: compact source predates the return-normalized exact-PnL summary format

          No exact replacement option-horizon row is credited from this run.

          **Execution authority:** \`false\`
          **Promotion authority:** \`false\`
          **Changes readiness gates:** \`false\`
          **LIVE TRADING: DISABLED.**
          EOF
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/full-stack-reflow-ledger-status.md)"

      - name: Restore previous exact reflow ledger
        if: ${{ steps.source.outputs.source_eligible == 'true' && steps.compact.outputs.eligible == 'true' }}
        id: previous
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous_path=""
          previous_workflow_run_id=""
          runs_json="$(
            gh api               "repos/$GITHUB_REPOSITORY/actions/workflows/prospective-full-stack-reflow-exact-ledger.yml/runs?status=success&per_page=100"
          )"
          mapfile -t prior_runs < <(
            jq -r               --arg current "$CURRENT_RUN_ID"               '.workflow_runs
               | map(select((.id | tostring) != $current))
               | sort_by(.updated_at)
               | reverse
               | .[].id'               <<<"$runs_json"
          )
          for run_id in "${prior_runs[@]}"; do
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"
            )"
            artifact_line="$(
              jq -r '
                .artifacts
                | map(
                    select(
                      (.expired | not)
                      and (
                        .name
                        | startswith("prospective-full-stack-reflow-exact-ledger-")
                      )
                    )
                  )
                | if length > 0
                  then [.[0].id, .[0].name] | @tsv
                  else ""
                  end
              ' <<<"$artifacts_json"
            )"
            if [ -z "$artifact_line" ]; then
              continue
            fi
            IFS=$'\t' read -r artifact_id artifact_name <<<"$artifact_line"
            rm -rf /tmp/previous-full-stack-reflow-ledger
            mkdir -p /tmp/previous-full-stack-reflow-ledger
            gh api               "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/previous-full-stack-reflow-ledger.zip
            unzip -q               /tmp/previous-full-stack-reflow-ledger.zip               -d /tmp/previous-full-stack-reflow-ledger
            candidate="$(
              find /tmp/previous-full-stack-reflow-ledger                 -type f                 -name prospective-full-stack-reflow-exact-ledger.json                 -print -quit
            )"
            if [ -n "$candidate" ] && [ -s "$candidate" ]; then
              previous_path="$candidate"
              previous_workflow_run_id="$run_id"
              break
            fi
          done
          echo "previous_path=$previous_path" >> "$GITHUB_OUTPUT"
          echo "previous_workflow_run_id=$previous_workflow_run_id" >> "$GITHUB_OUTPUT"

      - name: Extend append-only exact reflow ledger
        if: ${{ steps.source.outputs.source_eligible == 'true' && steps.compact.outputs.eligible == 'true' }}
        id: ledger
        continue-on-error: true
        shell: bash
        env:
          SUMMARY_PATH: ${{ steps.compact.outputs.summary_path }}
          PREVIOUS_LEDGER_PATH: ${{ steps.previous.outputs.previous_path }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set +e
          args=(
            "$SUMMARY_PATH"
            --source-paper-run-id "$SOURCE_RUN_ID"
            --source-paper-run-attempt "$SOURCE_RUN_ATTEMPT"
            --source-artifact-name "$SOURCE_ARTIFACT_NAME"
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"
            --json-out prospective-full-stack-reflow-exact-ledger.json
          )
          if [ -n "$PREVIOUS_LEDGER_PATH" ]; then
            args+=(--previous "$PREVIOUS_LEDGER_PATH")
          fi
          python scripts/update_prospective_full_stack_reflow_exact_ledger.py             "${args[@]}"             > /tmp/full-stack-reflow-ledger.stdout.json             2> /tmp/full-stack-reflow-ledger.error
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test -s prospective-full-stack-reflow-exact-ledger.json
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo "error<<EOF"
              cat /tmp/full-stack-reflow-ledger.error
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish blocked exact reflow ledger status
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean != 'true'
        shell: bash
        env:
          ERROR_TEXT: ${{ steps.ledger.outputs.error }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          error="${ERROR_TEXT:-unknown error}"
          cat > /tmp/full-stack-reflow-ledger-status.md <<EOF
          ## Full-stack reflow exact realized-PnL ledger

          **Status:** BLOCKED — append-only invariant failure

          - source paper run: \`$SOURCE_RUN_ID\`
          - source paper attempt: \`$SOURCE_RUN_ATTEMPT\`
          - error: \`$error\`

          No exact replacement option-horizon evidence is published from this run.

          **Execution authority:** \`false\`
          **Promotion authority:** \`false\`
          **Changes readiness gates:** \`false\`
          **LIVE TRADING: DISABLED.**
          EOF
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/full-stack-reflow-ledger-status.md)"

      - name: Fail closed on exact reflow ledger drift
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean != 'true'
        shell: bash
        run: |
          echo "Full-stack reflow exact ledger is blocked." >&2
          exit 1

      - name: Publish clean exact reflow ledger status
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
          PREVIOUS_WORKFLOW_RUN_ID: ${{ steps.previous.outputs.previous_workflow_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          ledger = json.loads(
              Path(
                  "prospective-full-stack-reflow-exact-ledger.json"
              ).read_text(encoding="utf-8")
          )
          summary = ledger["summary"]

          from cocomelon.research.full_stack_reflow_capacity_review import (
              review_full_stack_reflow_capacity,
          )

          exclusive = review_full_stack_reflow_capacity(ledger)
          Path("prospective-full-stack-exclusive-capacity-review.json").write_text(
              json.dumps(
                  exclusive,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n",
              encoding="utf-8",
          )

          def stamp(value):
              return datetime.fromtimestamp(
                  int(value) / 1000,
                  tz=UTC,
              ).isoformat()

          previous = os.environ["PREVIOUS_WORKFLOW_RUN_ID"] or "none"
          lines = [
              "## Full-stack reflow exact realized-PnL ledger",
              "",
              "**Status:** append-only clean",
              "",
              f"- common stack start: `{stamp(ledger['overlap_started_at_ms'])}`",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source resolution: `{os.environ['RESOLUTION_MODE']}`",
              f"- previous ledger workflow run: `{previous}`",
              f"- exact rows / previous / newly appended: `{ledger['row_count']} / {ledger['previous_row_count']} / {ledger['new_row_count']}`",
              f"- pending option-horizons: `{ledger['pending_option_horizons']}`",
              f"- rows SHA-256: `{ledger['rows_sha256']}`",
              f"- ledger SHA-256: `{ledger['ledger_sha256']}`",
              "",
              "### Fixed exit horizons",
              "",
              "| Horizon | Exact | LONG | SHORT | Markets | Exact PnL | Exact return | LOO option PnL/return | LOO market PnL/return | Ready? |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- | --- |",
          ]
          for horizon_ms in ledger["horizons_ms"]:
              item = summary["by_horizon"][str(horizon_ms)]
              readiness = item["review_readiness"]
              lines.append(
                  "| {minutes}m | {exact} | {long} | {short} | {markets} | "
                  "{pnl} | {ret} | {loo_option_pnl}/{loo_option_ret} | "
                  "{loo_market_pnl}/{loo_market_ret} | {ready} |".format(
                      minutes=horizon_ms // 60000,
                      exact=item["exact_option_horizons"],
                      long=item["long_exact_options"],
                      short=item["short_exact_options"],
                      markets=item["market_count"],
                      pnl=item["total_exact_realized_pnl"],
                      ret=item["total_exact_realized_return"],
                      loo_option_pnl=item["leave_one_option_out_min_pnl"],
                      loo_option_ret=item["leave_one_option_out_min_return"],
                      loo_market_pnl=item["leave_one_market_out_min_pnl"],
                      loo_market_ret=item["leave_one_market_out_min_return"],
                      ready=readiness["ready_for_evidence_review"],
                  )
              )

          lines.extend([
              "",
              "### One-slot capacity-exclusivity screen (descriptive only)",
              "",
              "| Horizon | Raw exact | Exclusive fills | Overlap skipped | Ambiguous opps | Net selected PnL | Long positive? | Short positive? | Stable blocks? | Screen passes? |",
              "| --- | ---: | ---: | ---: | ---: | ---: | --- | --- | --- | --- |",
          ])
          for horizon_ms in ledger["horizons_ms"]:
              view = exclusive["by_horizon"][str(horizon_ms)]
              side = view["by_direction"]
              lines.append(
                  "| {minutes}m | {raw} | {selected} | {overlap} | {ambiguous} | "
                  "{pnl} | {long} | {short} | {stable} | {passes} |".format(
                      minutes=horizon_ms // 60000,
                      raw=view["source_exact_options"],
                      selected=view["selected_exact_options"],
                      overlap=view["skipped_for_one_position_capacity"],
                      ambiguous=view["ambiguous_opportunity_count"],
                      pnl=view["one_slot_selected_economics"]["net_pnl"],
                      long=side["long"]["positive"],
                      short=side["short"]["positive"],
                      stable=view["chronologically_profitable"],
                      passes=view["economic_screen_passes"],
                  )
              )
          lines.extend(
              [
                  "",
                  "Exclusive selection sorts by entry time, never by returns. Duplicate opportunity alternatives have zero selection credit; overlapping windows share only one provisional capital slot.",
                  "A capacity screen PASS is not portfolio profitability, and it does not choose a best exit horizon or authorize a trading-policy change.",
                  "",
                  "Precommitted review bar per horizon: >=20 exact option-horizons, >=5 LONG, >=5 SHORT, >=4 markets, positive realized PnL and return, plus positive leave-one-option and leave-one-market robustness in both units.",
                  "Only fully closed exits with complete crossed funding-boundary evidence become immutable rows. Incomplete horizons remain pending and may mature later.",
                  "Economics remain separate by fixed horizon; no best-horizon selection or cross-horizon aggregation is allowed.",
                  "Every previously published exact row must remain byte-for-byte equivalent after canonicalization.",
                  "",
                  "**Execution authority:** `false`",
                  "**Promotion authority:** `false`",
                  "**Changes readiness gates:** `false`",
                  "**LIVE TRADING: DISABLED.**",
              ]
          )
          Path("/tmp/full-stack-reflow-ledger-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/full-stack-reflow-ledger-status.md)"

      - name: Upload exact reflow ledger
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prospective-full-stack-reflow-exact-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-full-stack-reflow-exact-ledger.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload separate exclusive-capacity economics review
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prospective-full-stack-exclusive-capacity-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-full-stack-exclusive-capacity-review.json
          if-no-files-found: error
          retention-days: 90
