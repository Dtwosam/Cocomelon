name: Prospective Capture Transport Canary

on:
  workflow_run:
    workflows:
      - "Research Dashboard Catch-up Dispatcher"
    types:
      - completed
  pull_request:
    paths:
      - ".github/workflows/prospective-capture-transport-canary.yml"
      - "tests/test_prospective_capture_transport_canary_workflow.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-capture-transport-canary.yml"
      - "tests/test_prospective_capture_transport_canary_workflow.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prospective-capture-transport-canary
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify transport canary contract
        run: |
          set -euo pipefail
          python -m pytest             tests/test_prospective_capture_transport_canary_workflow.py             -q

  observe:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RECEIPT_ROOT: artifacts/prospective-capture-transport-canary
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event || '' }}
      UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
      UPSTREAM_CREATED_AT: ${{ github.event.workflow_run.created_at || '' }}
      UPSTREAM_UPDATED_AT: ${{ github.event.workflow_run.updated_at || '' }}
      UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build transport canary receipt
        id: receipt
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_ROOT"
          python - <<'PY' > "$RECEIPT_ROOT/receipt.json"
          import hashlib
          import json
          import os
          import time
          from datetime import datetime

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          def timestamp_ms(value):
              if not value:
                  return None
              return int(
                  datetime.fromisoformat(value.replace("Z", "+00:00")).timestamp()
                  * 1_000
              )

          observed_at_ms = time.time_ns() // 1_000_000
          event_name = os.environ["GITHUB_EVENT_NAME"]

          if event_name == "workflow_run":
              if os.environ["UPSTREAM_REPOSITORY"] != os.environ["GITHUB_REPOSITORY"]:
                  raise SystemExit("UPSTREAM_REPOSITORY_MISMATCH")
              if os.environ["UPSTREAM_HEAD_BRANCH"] != "main":
                  raise SystemExit("UPSTREAM_BRANCH_MISMATCH")
              if os.environ["UPSTREAM_EVENT"] != "schedule":
                  raise SystemExit("UPSTREAM_EVENT_NOT_SCHEDULED")
              if os.environ["UPSTREAM_CONCLUSION"] != "success":
                  raise SystemExit("UPSTREAM_RUN_NOT_SUCCESSFUL")
              upstream_created_ms = timestamp_ms(os.environ["UPSTREAM_CREATED_AT"])
              upstream_updated_ms = timestamp_ms(os.environ["UPSTREAM_UPDATED_AT"])
              if upstream_created_ms is None or upstream_updated_ms is None:
                  raise SystemExit("UPSTREAM_TIMESTAMPS_MISSING")
              trigger_latency_ms = max(0, observed_at_ms - upstream_updated_ms)
              upstream_runtime_ms = max(0, upstream_updated_ms - upstream_created_ms)
              upstream_run_id = os.environ["UPSTREAM_RUN_ID"]
          else:
              upstream_created_ms = None
              upstream_updated_ms = None
              trigger_latency_ms = None
              upstream_runtime_ms = None
              upstream_run_id = None

          payload = {
              "kind": "prospective-capture-transport-canary",
              "event_name": event_name,
              "observed_at_ms": observed_at_ms,
              "upstream_workflow_name": (
                  "Research Dashboard Catch-up Dispatcher"
                  if event_name == "workflow_run"
                  else None
              ),
              "upstream_run_id": upstream_run_id,
              "upstream_created_at_ms": upstream_created_ms,
              "upstream_updated_at_ms": upstream_updated_ms,
              "upstream_runtime_ms": upstream_runtime_ms,
              "workflow_run_trigger_latency_ms": trigger_latency_ms,
              "head_branch": os.environ["GITHUB_REF_NAME"],
              "economic_evidence": False,
              "promotion_eligible": False,
              "schema_version": 1,
          }
          payload["receipt_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          print(canonical(payload))
          PY

      - name: Verify non-economic canary receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "artifacts/prospective-capture-transport-canary/receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert payload["kind"] == "prospective-capture-transport-canary"
          assert payload["economic_evidence"] is False
          assert payload["promotion_eligible"] is False
          assert len(payload["receipt_id"]) == 64
          if payload["event_name"] == "workflow_run":
              assert payload["upstream_workflow_name"] == (
                  "Research Dashboard Catch-up Dispatcher"
              )
              assert payload["upstream_run_id"]
              assert payload["workflow_run_trigger_latency_ms"] >= 0
          PY

      - name: Upload transport canary receipt
        uses: actions/upload-artifact@v7
        with:
          name: prospective-capture-transport-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-capture-transport-canary/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
