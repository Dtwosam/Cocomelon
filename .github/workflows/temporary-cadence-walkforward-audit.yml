name: Temporary cadence walk-forward audit 36699032726

on:
  push:
    branches:
      - audit/cadence-walkforward-36699032726

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11091497758"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/continuous-paper-state.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/continuous-paper-state.zip -d /tmp/artifact
          test -s /tmp/artifact/continuous-paper-state.tar
      - name: Extract cadence shadow state only
        run: |
          set -euo pipefail
          mkdir -p /tmp/state
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json
          test -s /tmp/state/cadence-shadow-state.json
      - name: Run disjoint purged walk-forward audit
        run: |
          set -euo pipefail
          python scripts/analyze_cadence_opportunity_walkforward.py \
            /tmp/state/cadence-shadow-state.json \
            --json-out cadence-opportunity-walkforward.json \
            > /tmp/cadence-opportunity-walkforward.stdout.json
          cmp cadence-opportunity-walkforward.json \
            /tmp/cadence-opportunity-walkforward.stdout.json
      - name: Summarize walk-forward persistence
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("cadence-opportunity-walkforward.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## 15m -> 1h disjoint purged walk-forward")
          for field in (
              "status",
              "settled_rows",
              "fold_count",
              "validation_rows_per_fold",
              "candidate_net_return_sum",
              "actual_net_return_sum",
              "delta_net_return_sum",
              "positive_candidate_folds",
              "negative_candidate_folds",
              "flat_candidate_folds",
              "admitted_rows",
              "long_admitted_rows",
              "short_admitted_rows",
          ):
              print(f"- {field}: {report.get(field)}")
          print("### Folds")
          for fold in report.get("folds", []):
              print(
                  "- fold "
                  f"{fold['fold_index']}: "
                  f"train={fold['training_rows']} "
                  f"purged={fold['purged_overlap_rows']} "
                  f"admit={fold.get('admitted_rows', 0)} "
                  f"candidate={fold.get('candidate_net_return_sum')} "
                  f"actual={fold.get('actual_net_return_sum')} "
                  f"positive={fold.get('candidate_sum_positive')}"
              )
              for cohort in fold.get("admitted_cohorts", []):
                  print(
                      "    - "
                      f"{cohort['direction']} / "
                      f"{cohort['lead_strategy']} / "
                      f"{cohort['score_band']}: "
                      f"n={cohort['rows']} "
                      f"sum={cohort['net_return_sum']} "
                      f"mean={cohort['mean_net_return']}"
                  )
          print("### Cohort persistence")
          for cohort in report.get("cohort_persistence", []):
              print(
                  "- "
                  f"{cohort['direction']} / "
                  f"{cohort['lead_strategy']} / "
                  f"{cohort['score_band']}: "
                  f"folds={cohort['folds_present']} "
                  f"positive_folds={cohort['positive_folds']} "
                  f"n={cohort['rows']} "
                  f"sum={cohort['net_return_sum']} "
                  f"mean={cohort['mean_net_return']}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-opportunity-walkforward-36699032726
          path: cadence-opportunity-walkforward.json
          if-no-files-found: error
          retention-days: 30
