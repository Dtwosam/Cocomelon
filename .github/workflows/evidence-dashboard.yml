name: Cocomelon Evidence Dashboard Refresh

on:
  workflow_run:
    workflows:
      - "Verified V2 Mainnet Evidence Corpus Curator"
      - "Verified V3 Mainnet Evidence Corpus Curator"
      - "Verified V4 Mainnet Evidence Corpus Curator"
      - "Phase 9 V3 One-Shot Evaluation"
      - "Phase 9 V4 One-Shot Evaluation"
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-dashboard.yml"
      - ".github/workflows/phase9-v4-one-shot.yml"
      - "scripts/build_evidence_dashboard.py"
      - "scripts/apply_phase9_v4_final_verdict.py"
      - "scripts/apply_v4_intake_diagnostics.py"
      - "scripts/apply_v4_scheduler_health.py"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: cocomelon-evidence-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DASHBOARD_ISSUE: "82"
      EVENT_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout dashboard builder
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build trusted evidence dashboard payload
        run: |
          python scripts/build_evidence_dashboard.py \
            --output dashboard/issue-patch.json

      - name: Apply durable V4 final verdict
        run: |
          python scripts/apply_phase9_v4_final_verdict.py \
            --patch dashboard/issue-patch.json

      - name: Add safe V4 intake diagnostics
        run: |
          python scripts/apply_v4_intake_diagnostics.py \
            --patch dashboard/issue-patch.json

      - name: Add V4 scheduler health
        run: |
          python scripts/apply_v4_scheduler_health.py \
            --patch dashboard/issue-patch.json

      - name: Update Cocomelon Evidence Dashboard
        run: |
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/issues/$DASHBOARD_ISSUE" \
            --input dashboard/issue-patch.json
