name: Cocomelon Evidence Dashboard Refresh

on:
  workflow_run:
    workflows: ["Verified V2 Mainnet Evidence Corpus Curator"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: cocomelon-evidence-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DASHBOARD_ISSUE: "82"
      EVENT_CURATOR_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Resolve trusted curator run
        id: curator
        run: |
          set -euo pipefail
          mkdir -p dashboard corpus

          CURATOR_RUN_ID="${EVENT_CURATOR_RUN_ID:-}"
          if [ -z "$CURATOR_RUN_ID" ] || [ "$CURATOR_RUN_ID" = "null" ]; then
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              > dashboard/recent-runs.json
            CURATOR_RUN_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dashboard/recent-runs.json").read_text())
          matches = [
              item
              for item in payload.get("workflow_runs", [])
              if item.get("name") == "Verified V2 Mainnet Evidence Corpus Curator"
              and item.get("path") == ".github/workflows/evidence-corpus-curator.yml"
              and item.get("status") == "completed"
          ]
          if matches:
              latest = max(matches, key=lambda item: item.get("created_at", ""))
              print(latest["id"])
          PY
            )
          fi

          if [ -z "$CURATOR_RUN_ID" ]; then
            echo "No completed curator run is available" >&2
            exit 1
          fi

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CURATOR_RUN_ID" \
            > dashboard/curator-run.json
          python3 - "$CURATOR_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          run = json.loads(Path("dashboard/curator-run.json").read_text())
          expected_id = int(sys.argv[1])
          if run.get("id") != expected_id:
              raise SystemExit("curator run id mismatch")
          if run.get("name") != "Verified V2 Mainnet Evidence Corpus Curator":
              raise SystemExit("unexpected curator workflow name")
          if run.get("path") != ".github/workflows/evidence-corpus-curator.yml":
              raise SystemExit("unexpected curator workflow path")
          if run.get("status") != "completed":
              raise SystemExit("curator workflow is not complete")
          PY

          echo "run_id=$CURATOR_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve latest trusted corpus artifact
        id: corpus
        env:
          CURATOR_RUN_ID: ${{ steps.curator.outputs.run_id }}
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CURATOR_RUN_ID/artifacts?per_page=100" \
            > dashboard/curator-artifacts.json
          CORPUS_SELECTION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dashboard/curator-artifacts.json").read_text())
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == "v2-mainnet-corpus"
              and not item.get("expired", False)
          ]
          if matches:
              latest = max(matches, key=lambda item: item.get("created_at", ""))
              print(f"{latest['id']}\t{latest['workflow_run']['id']}")
          PY
          )

          if [ -z "$CORPUS_SELECTION" ]; then
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-mainnet-corpus&per_page=100" \
              > dashboard/corpus-candidates.json
            mapfile -t CANDIDATES < <(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dashboard/corpus-candidates.json").read_text())
          candidates = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == "v2-mainnet-corpus"
              and not item.get("expired", False)
          ]
          for item in sorted(
              candidates,
              key=lambda candidate: candidate.get("created_at", ""),
              reverse=True,
          ):
              print(f"{item['id']}\t{item['workflow_run']['id']}")
          PY
            )

            for CANDIDATE in "${CANDIDATES[@]}"; do
              ARTIFACT_ID=${CANDIDATE%%$'\t'*}
              PRODUCER_RUN_ID=${CANDIDATE#*$'\t'}
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" \
                > dashboard/corpus-producer-run.json
              if python3 - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("dashboard/corpus-producer-run.json").read_text())
          trusted = (
              run.get("name") == "Verified V2 Mainnet Evidence Corpus Curator"
              and run.get("path") == ".github/workflows/evidence-corpus-curator.yml"
              and run.get("status") == "completed"
          )
          raise SystemExit(0 if trusted else 1)
          PY
              then
                CORPUS_SELECTION="$CANDIDATE"
                break
              fi
            done
          fi

          if [ -z "$CORPUS_SELECTION" ]; then
            echo "No trusted v2-mainnet-corpus artifact is available" >&2
            exit 1
          fi

          CORPUS_ARTIFACT_ID=${CORPUS_SELECTION%%$'\t'*}
          CORPUS_PRODUCER_RUN_ID=${CORPUS_SELECTION#*$'\t'}
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CORPUS_ARTIFACT_ID/zip" \
            > dashboard/corpus.zip
          unzip -q dashboard/corpus.zip -d corpus

          mapfile -t PROGRESS_FILES < <(find corpus -type f -name progress.json -print)
          mapfile -t INDEX_FILES < <(find corpus -type f -name corpus-index.json -print)
          if [ "${#PROGRESS_FILES[@]}" -ne 1 ] || [ "${#INDEX_FILES[@]}" -ne 1 ]; then
            echo "Trusted corpus artifact must contain one progress and one index file" >&2
            exit 1
          fi
          cp "${PROGRESS_FILES[0]}" dashboard/progress.json
          cp "${INDEX_FILES[0]}" dashboard/corpus-index.json

          printf '%s\n' "$CORPUS_ARTIFACT_ID" > dashboard/corpus-artifact-id.txt
          printf '%s\n' "$CORPUS_PRODUCER_RUN_ID" > dashboard/corpus-producer-run-id.txt
          echo "artifact_id=$CORPUS_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "producer_run_id=$CORPUS_PRODUCER_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve latest Campaign V2 run
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            > dashboard/recent-runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dashboard/recent-runs.json").read_text())
          matches = [
              item
              for item in payload.get("workflow_runs", [])
              if item.get("name") == "Scheduled Genuine Mainnet Evidence Campaign V2"
              and item.get("path") == ".github/workflows/evidence-campaign-scheduled.yml"
          ]
          if not matches:
              raise SystemExit("No Campaign V2 run is available")
          latest = max(matches, key=lambda item: item.get("created_at", ""))
          Path("dashboard/latest-campaign.json").write_text(
              json.dumps(latest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Render dashboard issue body
        env:
          CURATOR_RUN_ID: ${{ steps.curator.outputs.run_id }}
          CORPUS_ARTIFACT_ID: ${{ steps.corpus.outputs.artifact_id }}
          CORPUS_PRODUCER_RUN_ID: ${{ steps.corpus.outputs.producer_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          progress = json.loads(Path("dashboard/progress.json").read_text())
          index = json.loads(Path("dashboard/corpus-index.json").read_text())
          curator = json.loads(Path("dashboard/curator-run.json").read_text())
          campaign = json.loads(Path("dashboard/latest-campaign.json").read_text())

          trades = int(progress.get("closed_trade_count", 0))
          trade_days = int(progress.get("closed_trade_days", 0))
          min_trades = int(progress.get("minimum_oos_trade_requirement", 100))
          min_days = int(progress.get("minimum_oos_day_requirement", 30))
          cohorts = int(progress.get("attested_run_count", 0))
          decisions = int(index.get("latest_aggregate", {}).get("decision_fact_count", 0))
          raw_ready = progress.get("raw_corpus_can_satisfy_oos_minimums") is True
          live_orders = progress.get("live_orders") is True
          economic_claim = str(progress.get("economic_claim", "none"))
          attestation = str(progress.get("mainnet_attestation_id", ""))

          curator_conclusion = curator.get("conclusion") or "unknown"
          campaign_status = str(campaign.get("status", "unknown"))
          campaign_conclusion = campaign.get("conclusion")
          campaign_state = (
              campaign_status
              if campaign_status != "completed"
              else str(campaign_conclusion or "completed")
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          curator_run_id = os.environ["CURATOR_RUN_ID"]
          corpus_producer_run_id = os.environ["CORPUS_PRODUCER_RUN_ID"]
          corpus_artifact_id = os.environ["CORPUS_ARTIFACT_ID"]
          campaign_run_id = str(campaign["id"])
          updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          readiness = "YES" if raw_ready else "NO"
          orders = "ENABLED" if live_orders else "DISABLED"
          edge = (
              economic_claim
              if economic_claim != "none"
              else "Not measured yet"
          )

          body = f"""# Cocomelon Evidence Dashboard

> Auto-refreshed from trusted GitHub evidence artifacts. Last updated **{updated}**.

## Phase 9 progress

| Metric | Current | Target |
| --- | ---: | ---: |
| Accepted genuine-mainnet cohorts | **{cohorts}** | — |
| Closed paper trades | **{trades}** | **{min_trades}** |
| Closed-trade days | **{trade_days}** | **{min_days}** |
| Strategy decisions in corpus | **{decisions}** | — |

**Raw Phase 9 minimums met:** {readiness}  
**Economic edge:** {edge}  
**Live orders:** {orders}

## Pipeline health

- Latest Campaign V2: **{campaign_state}** — [run {campaign_run_id}](https://github.com/{repo}/actions/runs/{campaign_run_id})
- Triggering curator: **{curator_conclusion}** — [run {curator_run_id}](https://github.com/{repo}/actions/runs/{curator_run_id})
- Corpus producer: [run {corpus_producer_run_id}](https://github.com/{repo}/actions/runs/{corpus_producer_run_id})
- Corpus artifact ID: `{corpus_artifact_id}`
- Mainnet attestation: `{attestation[:16]}…`

A curator can finish red **after** safely writing a verified corpus artifact; the dashboard therefore shows curator outcome separately from accepted-corpus counts. Failed or unverified campaign evidence is never counted just because a job ran.

## Direct tracking links

- [Campaign V2 runs](https://github.com/{repo}/actions/workflows/evidence-campaign-scheduled.yml)
- [Evidence corpus curator](https://github.com/{repo}/actions/workflows/evidence-corpus-curator.yml)
- [Repository status](https://github.com/{repo}/blob/main/docs/STATUS.md)

This page is informational only. It does not enable real-money trading or change strategy/risk rules.
"""
          Path("dashboard/body.md").write_text(body, encoding="utf-8")
          Path("dashboard/issue-patch.json").write_text(
              json.dumps({"body": body}),
              encoding="utf-8",
          )
          PY

      - name: Update Cocomelon Evidence Dashboard
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/issues/$DASHBOARD_ISSUE" \
            --input dashboard/issue-patch.json
