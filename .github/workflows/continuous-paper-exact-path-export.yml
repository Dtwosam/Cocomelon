name: Continuous Paper Exact Path Export

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/continuous-paper-exact-path-export.yml"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run to export
        required: false
        type: string
      source_run_attempt:
        description: Exact run attempt when source_run_id is supplied
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: continuous-paper-exact-path-export
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve exact source paper run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id || '' }}
          DISPATCH_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
        run: |
          set -euo pipefail
          source_run_id=""
          source_attempt=""

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source_run_id="$EVENT_RUN_ID"
            source_attempt="$EVENT_RUN_ATTEMPT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_RUN_ID" ]; then
            source_run_id="$DISPATCH_RUN_ID"
            source_attempt="$DISPATCH_RUN_ATTEMPT"
          else
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=50"
            )"
            read -r source_run_id source_attempt <<< "$(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"])
                  break
          '
            )"
          fi

          if [[ ! "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "source run id is missing or invalid" >&2
            exit 1
          fi
          if [ -z "$source_attempt" ]; then
            source_attempt="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" --jq '.run_attempt'
            )"
          fi
          if [[ ! "$source_attempt" =~ ^[0-9]+$ ]]; then
            echo "source run attempt is missing or invalid" >&2
            exit 1
          fi

          run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id"
          )"
          source_head_sha="$(
            printf '%s' "$run_json" | SOURCE_ATTEMPT="$source_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ["SOURCE_ATTEMPT"]
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("source run must be completed successfully")
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"

          artifact_name="continuous-paper-state-$source_run_id-$source_attempt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100"             > /tmp/source-artifacts.json
          artifact_id="$(
            python - "$artifact_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          name = sys.argv[1]
          payload = json.loads(
              Path("/tmp/source-artifacts.json").read_text(encoding="utf-8")
          )
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == name
              and item.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one non-expired source artifact named {name}"
              )
          print(matches[0]["id"])
          PY
          )"

          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "source_attempt=$source_attempt" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Stream exact trade-path evidence
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf exact-path-export
          mkdir -p exact-path-export

          gh api             "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             | python scripts/stream_zip_member.py continuous-paper-state.tar             | tar -xf - -C exact-path-export                 ./trade-paths/records                 ./session-summary.json

          test -f exact-path-export/session-summary.json
          test -d exact-path-export/trade-paths/records
          test -n "$(
            find exact-path-export/trade-paths/records               -maxdepth 1 -type f -name '*.json' -print -quit
          )"

      - name: Attest exact-path export
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("exact-path-export")
          records = sorted((root / "trade-paths" / "records").glob("*.json"))
          if not records:
              raise SystemExit("no trade-path records found")

          digest = hashlib.sha256()
          logical_bytes = 0
          for path in records:
              data = path.read_bytes()
              logical_bytes += len(data)
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              digest.update(hashlib.sha256(data).digest())

          session = json.loads(
              (root / "session-summary.json").read_text(encoding="utf-8")
          )
          manifest = {
              "schema_version": 1,
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "trade_path_records": len(records),
              "trade_path_logical_bytes": logical_bytes,
              "trade_path_tree_sha256": digest.hexdigest(),
              "session_trade_path_count": session.get("trade_path_count"),
              "session_closed_trades": session.get("closed_trades"),
              "research_only": True,
              "execution_authority": False,
              "promotion_authority": False,
          }
          if manifest["session_trade_path_count"] != len(records):
              raise SystemExit(
                  "session trade-path count does not match exported records"
              )
          (root / "exact-path-export-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Upload exact trade-path evidence
        uses: actions/upload-artifact@v7
        with:
          name: continuous-paper-exact-paths-${{ steps.source.outputs.source_run_id }}-${{ steps.source.outputs.source_attempt }}
          path: exact-path-export
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
