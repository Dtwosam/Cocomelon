name: Continuous Paper Exact Path Export

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/continuous-paper-exact-path-export.yml"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run to export
        required: false
        type: string
      source_run_attempt:
        description: Exact run attempt when source_run_id is supplied
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: continuous-paper-exact-path-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve exact source paper run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id || '' }}
          DISPATCH_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
        run: |
          set -euo pipefail

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local expected_name="continuous-paper-state-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$expected_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if not matches:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected at most one non-expired source artifact named {name}"
              )
          print(matches[0]["id"])
          '
          }

          paper_run_is_evidence_eligible() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local run_path="/tmp/exact-path-run-$candidate_run_id.json"
            local jobs_path="/tmp/exact-path-jobs-$candidate_run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" > "$run_path"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100" > "$jobs_path"
            python - "$run_path" "$jobs_path" "$candidate_attempt" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_attempt, expected_repo = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit(1)
          if run.get("head_branch") != "main":
              raise SystemExit(1)
          if run.get("status") != "completed":
              raise SystemExit(1)
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit(1)
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              raise SystemExit(1)
          conclusion = run.get("conclusion")
          if conclusion not in {"success", "failure"}:
              raise SystemExit(1)
          if conclusion == "success":
              raise SystemExit(0)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs_payload = json.load(handle)
          paper_jobs = [
              job for job in jobs_payload.get("jobs", [])
              if job.get("name") == "paper"
          ]
          if len(paper_jobs) != 1 or paper_jobs[0].get("conclusion") != "failure":
              raise SystemExit(1)
          steps = {
              step.get("name"): step.get("conclusion")
              for step in paper_jobs[0].get("steps", [])
              if isinstance(step.get("name"), str)
          }
          required = (
              "Run continuous paper trader",
              "Measure durable continuous paper state",
              "Upload durable continuous paper state",
          )
          if any(steps.get(name) != "success" for name in required):
              raise SystemExit(1)
          failed_steps = {
              name for name, conclusion in steps.items()
              if conclusion == "failure"
          }
          allowed = {
              frozenset({"Fail closed on upgrade handoff source"}),
              frozenset(
                  {
                      "Queue fallback exact successor continuous paper worker",
                      "Fail closed on upgrade handoff source",
                  }
              ),
          }
          if frozenset(failed_steps) not in allowed:
              raise SystemExit(1)
          if (
              "Queue fallback exact successor continuous paper worker"
              in failed_steps
              and steps.get("Queue exact successor from fast resume")
              != "success"
          ):
              raise SystemExit(1)
          PY
          }

          source_run_id=""
          source_attempt=""
          artifact_id=""
          resolution_mode=""
          strict_manual=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_RUN_ID" ]; then
            strict_manual=true
            source_run_id="$DISPATCH_RUN_ID"
            source_attempt="$DISPATCH_RUN_ATTEMPT"
            if [[ ! "$source_run_id" =~ ^[0-9]+$ ]]; then
              echo "source run id is missing or invalid" >&2
              exit 1
            fi
            if [ -z "$source_attempt" ]; then
              source_attempt="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" --jq '.run_attempt'
              )"
            fi
            if [[ ! "$source_attempt" =~ ^[0-9]+$ ]]; then
              echo "source run attempt is missing or invalid" >&2
              exit 1
            fi
            if ! paper_run_is_evidence_eligible "$source_run_id" "$source_attempt"; then
              echo "manual source paper run is not evidence-eligible" >&2
              exit 1
            fi
            artifact_id="$(artifact_for_run "$source_run_id" "$source_attempt")"
            resolution_mode="manual_exact"
          elif [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ && "$EVENT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            if paper_run_is_evidence_eligible "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"; then
              artifact_id="$(artifact_for_run "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT")"
              if [ -n "$artifact_id" ]; then
                source_run_id="$EVENT_RUN_ID"
                source_attempt="$EVENT_RUN_ATTEMPT"
                if [ "$EVENT_CONCLUSION" = "success" ]; then
                  resolution_mode="successful_event"
                else
                  resolution_mode="durable_handoff_event"
                fi
              fi
            fi
          fi

          if [ -z "$artifact_id" ] && [ "$strict_manual" != "true" ]; then
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=100"
            )"
            mapfile -t candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if ! paper_run_is_evidence_eligible "$candidate_run_id" "$candidate_attempt"; then
                continue
              fi
              candidate_artifact_id="$(
                artifact_for_run "$candidate_run_id" "$candidate_attempt"
              )"
              if [ -n "$candidate_artifact_id" ]; then
                source_run_id="$candidate_run_id"
                source_attempt="$candidate_attempt"
                artifact_id="$candidate_artifact_id"
                resolution_mode="latest_evidence_eligible_with_state_artifact"
                break
              fi
            done
          fi

          if [ -z "$artifact_id" ]; then
            echo "selected source has no authenticated paper-state artifact" >&2
            exit 1
          fi
          if ! paper_run_is_evidence_eligible "$source_run_id" "$source_attempt"; then
            echo "selected source paper run is not evidence-eligible" >&2
            exit 1
          fi

          run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id"
          )"
          source_head_sha="$(
            printf '%s' "$run_json" | SOURCE_ATTEMPT="$source_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ["SOURCE_ATTEMPT"]
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed":
              raise SystemExit("source run must be completed")
          if run.get("conclusion") not in {"success", "failure"}:
              raise SystemExit("source run conclusion is not evidence-eligible")
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "source_attempt=$source_attempt" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Stream exact trade-path evidence
        if: ${{ steps.source.outputs.eligible == 'true' }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf exact-path-export
          mkdir -p exact-path-export

          gh api             "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             | python scripts/stream_zip_member.py continuous-paper-state.tar             | tar -xf - -C exact-path-export                 ./trade-paths/records                 ./session-summary.json

          test -f exact-path-export/session-summary.json
          test -d exact-path-export/trade-paths/records
          test -n "$(
            find exact-path-export/trade-paths/records               -maxdepth 1 -type f -name '*.json' -print -quit
          )"

      - name: Attest exact-path export
        if: ${{ steps.source.outputs.eligible == 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("exact-path-export")
          records = sorted((root / "trade-paths" / "records").glob("*.json"))
          if not records:
              raise SystemExit("no trade-path records found")

          digest = hashlib.sha256()
          logical_bytes = 0
          for path in records:
              data = path.read_bytes()
              logical_bytes += len(data)
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              digest.update(hashlib.sha256(data).digest())

          session = json.loads(
              (root / "session-summary.json").read_text(encoding="utf-8")
          )
          manifest = {
              "schema_version": 1,
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "trade_path_records": len(records),
              "trade_path_logical_bytes": logical_bytes,
              "trade_path_tree_sha256": digest.hexdigest(),
              "session_trade_path_count": session.get("trade_path_count"),
              "session_closed_trades": session.get("closed_trades"),
              "research_only": True,
              "execution_authority": False,
              "promotion_authority": False,
          }
          if manifest["session_trade_path_count"] != len(records):
              raise SystemExit(
                  "session trade-path count does not match exported records"
              )
          (root / "exact-path-export-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Upload exact trade-path evidence
        if: ${{ steps.source.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: continuous-paper-exact-paths-${{ steps.source.outputs.source_run_id }}-${{ steps.source.outputs.source_attempt }}
          path: exact-path-export
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
