name: Verified V2 Mainnet Evidence Corpus Curator

on:
  workflow_run:
    workflows: ["Scheduled Genuine Mainnet Evidence Campaign V2"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: genuine-mainnet-evidence-v2-corpus
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Checkout current evaluation tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download and independently verify source intake
        id: intake
        run: |
          set -euo pipefail
          mkdir -p intake source
          git rev-parse HEAD > intake/curator-head.txt
          printf '%s\n' "$SOURCE_RUN_ID" > intake/source-run-id.txt
          printf '%s\n' "$SOURCE_CONCLUSION" > intake/source-conclusion.txt

          SOURCE_ARTIFACT_ID=""
          SOURCE_ARTIFACT_NAME=""
          for POLL in 1 2 3 4 5 6; do
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              > intake/source-artifacts.json
            SOURCE_SELECTION=$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("intake/source-artifacts.json").read_text())
          matches = [
              item
              for item in payload.get("artifacts", [])
              if not item.get("expired", False)
              and str(item.get("name", "")).startswith(
                  "scheduled-genuine-mainnet-evidence-v2-"
              )
          ]
          if matches:
              item = max(matches, key=lambda candidate: candidate.get("created_at", ""))
              print(f"{item['id']}\t{item['name']}")
          PY
            )
            if [ -n "$SOURCE_SELECTION" ]; then
              SOURCE_ARTIFACT_ID=${SOURCE_SELECTION%%$'\t'*}
              SOURCE_ARTIFACT_NAME=${SOURCE_SELECTION#*$'\t'}
              break
            fi
            sleep 5
          done

          printf '%s\n' "$SOURCE_ARTIFACT_ID" > intake/source-artifact-id.txt
          printf '%s\n' "$SOURCE_ARTIFACT_NAME" > intake/source-artifact-name.txt

          if [ -z "$SOURCE_ARTIFACT_ID" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_conclusion": os.environ["SOURCE_CONCLUSION"],
              "source_artifact_found": False,
              "source_verified": False,
              "source_verify_status": None,
              "corpus_mutated": False,
              "economic_claim": "none",
          }
          Path("intake/intake-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY
            echo "source_artifact_found=false" >> "$GITHUB_OUTPUT"
            echo "source_verified=false" >> "$GITHUB_OUTPUT"
            echo "source_root=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > intake/source-artifact.zip
          unzip -q intake/source-artifact.zip -d source

          mapfile -t SUMMARIES < <(find source -type f -name cohort-summary.json -path '*/output/*' -print)
          if [ "${#SUMMARIES[@]}" -ne 1 ]; then
            SOURCE_ROOT=""
            SOURCE_VERIFY_STATUS=90
          else
            SOURCE_ROOT=$(dirname "${SUMMARIES[0]}")
            set +e
            cocomelon-mainnet-evidence verify \
              --source-root "$SOURCE_ROOT" \
              > intake/source-verify.json \
              2> intake/source-verify.stderr
            SOURCE_VERIFY_STATUS=$?
            set -e
          fi
          printf '%s\n' "$SOURCE_VERIFY_STATUS" > intake/source-verify-status.txt

          SOURCE_VERIFIED=false
          if [ "$SOURCE_CONCLUSION" = "success" ] \
            && [ "$SOURCE_VERIFY_STATUS" -eq 0 ]; then
            SOURCE_VERIFIED=true
          fi

          SOURCE_ARTIFACT_ID="$SOURCE_ARTIFACT_ID" \
          SOURCE_ARTIFACT_NAME="$SOURCE_ARTIFACT_NAME" \
          SOURCE_VERIFY_STATUS="$SOURCE_VERIFY_STATUS" \
          SOURCE_VERIFIED="$SOURCE_VERIFIED" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_conclusion": os.environ["SOURCE_CONCLUSION"],
              "source_artifact_found": True,
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "source_artifact_name": os.environ["SOURCE_ARTIFACT_NAME"],
              "source_verified": os.environ["SOURCE_VERIFIED"] == "true",
              "source_verify_status": int(os.environ["SOURCE_VERIFY_STATUS"]),
              "corpus_mutated": False,
              "economic_claim": "none",
          }
          Path("intake/intake-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

          echo "source_artifact_found=true" >> "$GITHUB_OUTPUT"
          echo "source_verified=$SOURCE_VERIFIED" >> "$GITHUB_OUTPUT"
          echo "source_root=$SOURCE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Roll verified source into latest attested corpus
        id: aggregate
        if: ${{ always() && steps.intake.outputs.source_verified == 'true' }}
        env:
          SOURCE_ROOT: ${{ steps.intake.outputs.source_root }}
        run: |
          set -euo pipefail
          mkdir -p corpus prior

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-mainnet-corpus&per_page=100" \
            > intake/prior-artifacts.json
          PRIOR_ARTIFACT_ID=$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("intake/prior-artifacts.json").read_text())
          candidates = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == "v2-mainnet-corpus"
              and not item.get("expired", False)
          ]
          if candidates:
              latest = max(candidates, key=lambda item: item.get("created_at", ""))
              print(latest["id"])
          PY
          )
          printf '%s\n' "$PRIOR_ARTIFACT_ID" > intake/prior-corpus-artifact-id.txt

          if [ -n "$PRIOR_ARTIFACT_ID" ]; then
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_ARTIFACT_ID/zip" \
              > intake/prior-corpus.zip
            unzip -q intake/prior-corpus.zip -d prior
            mapfile -t ATTESTATIONS < <(find prior -type f -name mainnet-attestation.json -print)
            if [ "${#ATTESTATIONS[@]}" -ne 1 ]; then
              echo "Prior corpus artifact does not contain exactly one attestation" >&2
              exit 31
            fi
            PRIOR_ROOT=$(dirname "${ATTESTATIONS[0]}")
            cp -a "$PRIOR_ROOT/." corpus/
          fi

          cocomelon-mainnet-evidence aggregate \
            --journal corpus/journal.sqlite3 \
            --facts corpus/facts.sqlite3 \
            --source-root "$SOURCE_ROOT" \
            > corpus/aggregate-latest.json
          cocomelon-mainnet-evidence progress \
            --journal corpus/journal.sqlite3 \
            --facts corpus/facts.sqlite3 \
            > corpus/progress.json

          PRIOR_ARTIFACT_ID="$PRIOR_ARTIFACT_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          verify = json.loads(Path("intake/source-verify.json").read_text())
          aggregate = json.loads(Path("corpus/aggregate-latest.json").read_text())
          progress = json.loads(Path("corpus/progress.json").read_text())
          curator_head = Path("intake/curator-head.txt").read_text().strip()
          source_artifact_id = int(Path("intake/source-artifact-id.txt").read_text())
          prior_raw = os.environ.get("PRIOR_ARTIFACT_ID", "")
          index = {
              "schema_version": 1,
              "economic_claim": "none",
              "corpus_mutated": True,
              "curator_code_revision": curator_head,
              "campaign_code_revision": verify["code_revision"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_id": source_artifact_id,
              "previous_corpus_artifact_id": int(prior_raw) if prior_raw else None,
              "mainnet_attestation_id": progress["mainnet_attestation_id"],
              "attested_run_count": progress["attested_run_count"],
              "closed_trade_count": progress["closed_trade_count"],
              "closed_trade_days": progress["closed_trade_days"],
              "raw_corpus_can_satisfy_oos_minimums": progress[
                  "raw_corpus_can_satisfy_oos_minimums"
              ],
              "latest_aggregate": aggregate,
          }
          Path("corpus/corpus-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n"
          )

          intake = json.loads(Path("intake/intake-report.json").read_text())
          intake.update(
              {
                  "corpus_mutated": True,
                  "mainnet_attestation_id": progress["mainnet_attestation_id"],
                  "attested_run_count": progress["attested_run_count"],
                  "closed_trade_count": progress["closed_trade_count"],
                  "closed_trade_days": progress["closed_trade_days"],
              }
          )
          Path("intake/intake-report.json").write_text(
              json.dumps(intake, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Inspect existing one-shot Phase 9 artifacts
        id: phase9_artifacts
        if: ${{ steps.intake.outputs.source_verified == 'true' && success() }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-phase9-evaluation&per_page=100" \
            > intake/phase9-evaluation-artifacts.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-phase9-frozen-snapshot&per_page=100" \
            > intake/phase9-snapshot-artifacts.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-phase9-terminal-insufficient&per_page=100" \
            > intake/phase9-terminal-artifacts.json

          PHASE9_EVALUATION_ID=$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("intake/phase9-evaluation-artifacts.json").read_text())
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "v2-phase9-evaluation"
              and not item.get("expired", False)
          ]
          if matches:
              print(max(matches, key=lambda item: item.get("created_at", ""))["id"])
          PY
          )
          PHASE9_SNAPSHOT_ID=$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("intake/phase9-snapshot-artifacts.json").read_text())
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "v2-phase9-frozen-snapshot"
              and not item.get("expired", False)
          ]
          if matches:
              print(max(matches, key=lambda item: item.get("created_at", ""))["id"])
          PY
          )
          PHASE9_TERMINAL_ID=$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("intake/phase9-terminal-artifacts.json").read_text())
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "v2-phase9-terminal-insufficient"
              and not item.get("expired", False)
          ]
          if matches:
              print(max(matches, key=lambda item: item.get("created_at", ""))["id"])
          PY
          )

          PHASE9_EVALUATION_EXISTS=false
          PHASE9_SNAPSHOT_EXISTS=false
          PHASE9_TERMINAL_EXISTS=false
          if [ -n "$PHASE9_EVALUATION_ID" ]; then
            PHASE9_EVALUATION_EXISTS=true
          fi
          if [ -n "$PHASE9_SNAPSHOT_ID" ]; then
            PHASE9_SNAPSHOT_EXISTS=true
          fi
          if [ -n "$PHASE9_TERMINAL_ID" ]; then
            PHASE9_TERMINAL_EXISTS=true
          fi

          printf '%s\n' "$PHASE9_EVALUATION_ID" > intake/phase9-evaluation-artifact-id.txt
          printf '%s\n' "$PHASE9_SNAPSHOT_ID" > intake/phase9-snapshot-artifact-id.txt
          printf '%s\n' "$PHASE9_TERMINAL_ID" > intake/phase9-terminal-artifact-id.txt
          printf '%s\n' "$PHASE9_EVALUATION_EXISTS" > intake/phase9-evaluation-exists.txt
          printf '%s\n' "$PHASE9_SNAPSHOT_EXISTS" > intake/phase9-snapshot-exists.txt
          printf '%s\n' "$PHASE9_TERMINAL_EXISTS" > intake/phase9-terminal-exists.txt

          echo "evaluation_exists=$PHASE9_EVALUATION_EXISTS" >> "$GITHUB_OUTPUT"
          echo "evaluation_id=$PHASE9_EVALUATION_ID" >> "$GITHUB_OUTPUT"
          echo "snapshot_exists=$PHASE9_SNAPSHOT_EXISTS" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$PHASE9_SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          echo "terminal_exists=$PHASE9_TERMINAL_EXISTS" >> "$GITHUB_OUTPUT"
          echo "terminal_id=$PHASE9_TERMINAL_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout frozen Phase 9 evaluator
        if: ${{ steps.phase9_artifacts.outputs.evaluation_exists != 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && steps.intake.outputs.source_verified == 'true' && success() }}
        uses: actions/checkout@v4
        with:
          ref: 629db6294822c97690c006591802f8a47e08652e
          path: phase9-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Phase 9 evaluator
        if: ${{ steps.phase9_artifacts.outputs.evaluation_exists != 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && steps.intake.outputs.source_verified == 'true' && success() }}
        run: |
          set -euo pipefail
          EXPECTED_PHASE9_REVISION=629db6294822c97690c006591802f8a47e08652e
          ACTUAL_PHASE9_REVISION=$(git -C phase9-tooling rev-parse HEAD)
          printf '%s\n' "$ACTUAL_PHASE9_REVISION" > intake/phase9-tooling-revision.txt
          if [ "$ACTUAL_PHASE9_REVISION" != "$EXPECTED_PHASE9_REVISION" ]; then
            echo "Frozen Phase 9 evaluator revision mismatch" >&2
            exit 43
          fi
          python -m pip install -e ./phase9-tooling

      - name: Download existing frozen Phase 9 snapshot
        id: phase9_existing
        if: ${{ steps.phase9_artifacts.outputs.snapshot_exists == 'true' && steps.phase9_artifacts.outputs.evaluation_exists != 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && success() }}
        env:
          SNAPSHOT_ARTIFACT_ID: ${{ steps.phase9_artifacts.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          mkdir -p phase9-existing
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SNAPSHOT_ARTIFACT_ID/zip" \
            > intake/phase9-existing-snapshot.zip
          unzip -q intake/phase9-existing-snapshot.zip -d phase9-existing
          mapfile -t SNAPSHOTS < <(find phase9-existing -type f -name snapshot.json -print)
          if [ "${#SNAPSHOTS[@]}" -ne 1 ]; then
            echo "Frozen Phase 9 artifact must contain exactly one snapshot.json" >&2
            exit 41
          fi
          SNAPSHOT_ROOT=$(dirname "${SNAPSHOTS[0]}")
          echo "snapshot_root=$SNAPSHOT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare one-shot Phase 9 V2 snapshot candidate
        id: phase9_prepare
        if: ${{ steps.phase9_artifacts.outputs.snapshot_exists != 'true' && steps.phase9_artifacts.outputs.evaluation_exists != 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && steps.intake.outputs.source_verified == 'true' && success() }}
        run: |
          set -euo pipefail
          rm -rf phase9-candidate
          cocomelon-mainnet-evidence prepare-phase9-v2 \
            --corpus-root corpus \
            --out-root phase9-candidate \
            > intake/phase9-prepare.json
          cp phase9-candidate/phase9-readiness.json intake/phase9-readiness.json
          PHASE9_STATE=$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("phase9-candidate/phase9-readiness.json").read_text())
          if payload.get("one_shot_oos") is not True:
              raise SystemExit("Phase 9 readiness is not one_shot_oos")
          ready = payload.get("ready_for_untouched_evaluation") is True
          test_window_complete = payload.get("test_window_complete") is True
          terminal_insufficient = test_window_complete and not ready
          print(f"{str(ready).lower()}\t{str(terminal_insufficient).lower()}")
          PY
          )
          READY=${PHASE9_STATE%%$'\t'*}
          TERMINAL_INSUFFICIENT=${PHASE9_STATE#*$'\t'}
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "terminal_insufficient=$TERMINAL_INSUFFICIENT" >> "$GITHUB_OUTPUT"
          echo "snapshot_root=phase9-candidate" >> "$GITHUB_OUTPUT"

      - name: Prepare terminal insufficient-evidence artifact
        if: ${{ steps.phase9_prepare.outputs.terminal_insufficient == 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && steps.phase9_artifacts.outputs.evaluation_exists != 'true' && success() }}
        run: |
          set -euo pipefail
          rm -rf phase9-terminal
          mkdir -p phase9-terminal
          cp phase9-candidate/phase9-readiness.json phase9-terminal/phase9-readiness.json
          cp phase9-candidate/snapshot.json phase9-terminal/snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(Path("phase9-candidate/phase9-readiness.json").read_text())
          snapshot = json.loads(Path("phase9-candidate/snapshot.json").read_text())
          if readiness.get("test_window_complete") is not True:
              raise SystemExit("terminal Phase 9 state requires a complete test window")
          if readiness.get("ready_for_untouched_evaluation") is True:
              raise SystemExit("ready Phase 9 state must not be marked insufficient")
          terminal = {
              "schema_version": 1,
              "edge_status": "insufficient_evidence",
              "economic_claim": "phase9_readiness_only",
              "one_shot_oos": True,
              "ready_for_untouched_evaluation": False,
              "test_window_complete": True,
              "snapshot_id": snapshot["snapshot_id"],
              "dataset_manifest_id": readiness["dataset_manifest_id"],
              "test_trade_count": readiness["test_trade_count"],
              "test_covered_days": readiness["test_covered_days"],
              "eligible_walkforward_windows": readiness["eligible_walkforward_windows"],
              "reason_codes": readiness["reason_codes"],
              "network_access": False,
              "live_orders": False,
          }
          Path("phase9-terminal/terminal-status.json").write_text(
              json.dumps(terminal, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload terminal insufficient-evidence result
        if: ${{ steps.phase9_prepare.outputs.terminal_insufficient == 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && steps.phase9_artifacts.outputs.evaluation_exists != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase9-terminal-insufficient
          path: phase9-terminal/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload frozen one-shot Phase 9 snapshot
        if: ${{ steps.phase9_prepare.outputs.ready == 'true' && steps.phase9_artifacts.outputs.snapshot_exists != 'true' && steps.phase9_artifacts.outputs.evaluation_exists != 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase9-frozen-snapshot
          path: phase9-candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Evaluate frozen one-shot Phase 9 snapshot
        id: phase9_evaluate
        if: ${{ steps.phase9_artifacts.outputs.evaluation_exists != 'true' && steps.phase9_artifacts.outputs.terminal_exists != 'true' && steps.phase9_prepare.outputs.terminal_insufficient != 'true' && (steps.phase9_artifacts.outputs.snapshot_exists == 'true' || steps.phase9_prepare.outputs.ready == 'true') && success() }}
        env:
          EXISTING_SNAPSHOT_ROOT: ${{ steps.phase9_existing.outputs.snapshot_root }}
          NEW_SNAPSHOT_ROOT: ${{ steps.phase9_prepare.outputs.snapshot_root }}
        run: |
          set -euo pipefail
          SNAPSHOT_ROOT="$EXISTING_SNAPSHOT_ROOT"
          if [ -z "$SNAPSHOT_ROOT" ]; then
            SNAPSHOT_ROOT="$NEW_SNAPSHOT_ROOT"
          fi
          if [ -z "$SNAPSHOT_ROOT" ]; then
            echo "No frozen Phase 9 snapshot root is available" >&2
            exit 42
          fi
          cocomelon-mainnet-evidence evaluate-phase9-v2 \
            --snapshot-root "$SNAPSHOT_ROOT" \
            > intake/phase9-evaluate.json
          mkdir -p phase9-evaluation
          cp "$SNAPSHOT_ROOT/evaluation.json" phase9-evaluation/evaluation.json
          cp "$SNAPSHOT_ROOT/snapshot.json" phase9-evaluation/snapshot.json
          cp "$SNAPSHOT_ROOT/phase9-readiness.json" phase9-evaluation/phase9-readiness.json
          cp intake/phase9-evaluate.json phase9-evaluation/evaluation-command.json
          printf '%s\n' "$SNAPSHOT_ROOT" > phase9-evaluation/snapshot-root.txt

      - name: Upload one-shot Phase 9 evaluation
        if: ${{ steps.phase9_evaluate.outcome == 'success' && steps.phase9_artifacts.outputs.evaluation_exists != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase9-evaluation
          path: phase9-evaluation/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload intake audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-mainnet-intake-${{ github.event.workflow_run.id }}-${{ github.run_id }}
          path: intake/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload rolled attested corpus
        if: ${{ always() && steps.intake.outputs.source_verified == 'true' && steps.aggregate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-mainnet-corpus
          path: corpus/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce successful source verification
        if: always()
        env:
          SOURCE_VERIFIED: ${{ steps.intake.outputs.source_verified }}
          SOURCE_ARTIFACT_FOUND: ${{ steps.intake.outputs.source_artifact_found }}
        run: |
          if [ "$SOURCE_CONCLUSION" = "success" ] \
            && { [ "$SOURCE_ARTIFACT_FOUND" != "true" ] \
              || [ "$SOURCE_VERIFIED" != "true" ]; }; then
            echo "Successful V2 campaign did not produce independently verified evidence" >&2
            exit 1
          fi