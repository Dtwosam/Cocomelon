name: Prospective LONG+Trend Carveout Fast-Markout Ledger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-long-trend-carveout-fast-markout-ledger.yml"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-long-trend-carveout-fast-markout-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEDGER_ISSUE: "802"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact source paper run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail
          echo "source_eligible=true" >> "$GITHUB_OUTPUT"

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local expected_name="continuous-paper-learning-source-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$expected_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if not matches:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected at most one non-expired source artifact named {name}"
              )
          item = matches[0]
          digest = item.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("source artifact digest is missing or invalid")
          print(item["id"], item["name"], digest, sep="\t")
          '
          }

          paper_run_is_evidence_eligible() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local run_path="/tmp/paper-source-run-$candidate_run_id.json"
            local jobs_path="/tmp/paper-source-jobs-$candidate_run_id.json"

            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" > "$run_path"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100" > "$jobs_path"

            python - "$run_path" "$jobs_path" "$candidate_attempt" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_attempt, expected_repo = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit(1)
          if run.get("head_branch") != "main":
              raise SystemExit(1)
          if run.get("status") != "completed":
              raise SystemExit(1)
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit(1)
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              raise SystemExit(1)
          conclusion = run.get("conclusion")
          if conclusion not in {"success", "failure"}:
              raise SystemExit(1)
          if conclusion == "success":
              raise SystemExit(0)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs_payload = json.load(handle)
          paper_jobs = [
              job
              for job in jobs_payload.get("jobs", [])
              if job.get("name") == "paper"
          ]
          if len(paper_jobs) != 1:
              raise SystemExit(1)
          paper_job = paper_jobs[0]
          if paper_job.get("conclusion") != "failure":
              raise SystemExit(1)
          steps = {
              step.get("name"): step.get("conclusion")
              for step in paper_job.get("steps", [])
              if isinstance(step.get("name"), str)
          }
          required_successes = (
              "Run continuous paper trader",
              "Measure durable continuous paper state",
              "Upload durable continuous paper state",
              "Upload compact continuous learning source",
          )
          if any(steps.get(name) != "success" for name in required_successes):
              raise SystemExit(1)
          failed_steps = {
              name
              for name, step_conclusion in steps.items()
              if step_conclusion == "failure"
          }
          allowed_failed_steps = {
              frozenset({"Fail closed on upgrade handoff source"}),
              frozenset(
                  {
                      "Queue fallback exact successor continuous paper worker",
                      "Fail closed on upgrade handoff source",
                  }
              ),
          }
          if frozenset(failed_steps) not in allowed_failed_steps:
              raise SystemExit(1)
          if (
              "Queue fallback exact successor continuous paper worker"
              in failed_steps
              and steps.get("Queue exact successor from fast resume")
              != "success"
          ):
              raise SystemExit(1)
          PY
          }

          run_id=""
          run_attempt=""
          artifact_line=""
          resolution_mode=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
              echo "manual source paper run identity is invalid" >&2
              exit 1
            fi
            if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
              echo "manual source paper run is not evidence-eligible" >&2
              exit 1
            fi
            artifact_line="$(artifact_for_run "$run_id" "$run_attempt")"
            resolution_mode="manual_exact"
          elif [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ && "$EVENT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            if paper_run_is_evidence_eligible "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"; then
              candidate_artifact_line="$(
                artifact_for_run "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$EVENT_RUN_ID"
                run_attempt="$EVENT_RUN_ATTEMPT"
                artifact_line="$candidate_artifact_line"
                if [ "$EVENT_CONCLUSION" = "success" ]; then
                  resolution_mode="successful_event"
                else
                  resolution_mode="durable_handoff_event"
                fi
              fi
            fi
          fi

          if [ -z "$artifact_line" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=100"
            )"
            mapfile -t artifact_candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${artifact_candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if ! paper_run_is_evidence_eligible "$candidate_run_id" "$candidate_attempt"; then
                continue
              fi
              candidate_artifact_line="$(
                artifact_for_run "$candidate_run_id" "$candidate_attempt"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$candidate_run_id"
                run_attempt="$candidate_attempt"
                artifact_line="$candidate_artifact_line"
                resolution_mode="latest_evidence_eligible_with_compact_artifact"
                break
              fi
            done
          fi

          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "source paper run identity is invalid" >&2
            exit 1
          fi
          if [ -z "$artifact_line" ]; then
            echo "selected source has no authenticated compact artifact" >&2
            exit 1
          fi
          if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
            echo "selected source paper run is not evidence-eligible" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed":
              raise SystemExit("source run must be completed")
          if run.get("conclusion") not in {"success", "failure"}:
              raise SystemExit("source run conclusion is not evidence-eligible")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download compact paper source
        id: compact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/long-trend-carveout-source
          mkdir -p /tmp/long-trend-carveout-source
          gh api             "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/long-trend-carveout-source.zip
          unzip -q /tmp/long-trend-carveout-source.zip -d /tmp/long-trend-carveout-source

          summary_path="$(
            find /tmp/long-trend-carveout-source               -type f               -name prospective-full-stack-forward-markout-summary.json               -print -quit
          )"
          if [ -z "$summary_path" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=compact source predates full-stack forward-markout export" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$summary_path"
          format_check="$(
            SUMMARY_PATH="$summary_path" python -c '
          import json, os
          from pathlib import Path
          candidate_id = "prospective-top10-two-strike-momentum-no-long-trend-v1"
          payload = json.loads(Path(os.environ["SUMMARY_PATH"]).read_text(encoding="utf-8"))
          candidate = payload.get("risk_rejected_long_trend_carveout") if isinstance(payload, dict) else None
          rows = payload.get("risk_rejected_rows") if isinstance(payload, dict) else None
          stop_overlay = (
              candidate.get("stop_path_overlay")
              if isinstance(candidate, dict)
              else None
          )
          current = (
              isinstance(candidate, dict)
              and candidate.get("candidate_id") == candidate_id
              and candidate.get("research_only") is True
              and candidate.get("execution_authority") is False
              and candidate.get("promotion_authority") is False
              and candidate.get("changes_readiness_gate") is False
              and candidate.get("changes_closed_trade_readiness_gate") is False
              and isinstance(stop_overlay, dict)
              and stop_overlay.get("enabled") is True
              and stop_overlay.get("claim_scope") == "observed_mark_stop_crossing_only"
              and stop_overlay.get("changes_execution") is False
              and stop_overlay.get("changes_risk_limits") is False
              and stop_overlay.get("changes_candidate_readiness") is False
              and isinstance(rows, list)
              and all(
                  isinstance(row, dict)
                  and row.get("long_trend_carveout_candidate_id") == candidate_id
                  and isinstance(
                      row.get("long_trend_carveout_stop_path"),
                      dict,
                  )
                  for row in rows
              )
          )
          print("current" if current else "legacy")
          '
          )"
          if [ "$format_check" != "current" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=compact source predates long-trend stop-path lineage" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=current long-trend carveout source format" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"

      - name: Publish waiting-for-source status
        if: ${{ steps.compact.outputs.eligible != 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
          WAIT_REASON: ${{ steps.compact.outputs.reason }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "## LONG+trend carveout fast-markout ledger",
              "",
              "**Status:** waiting for new-format compact source",
              "",
              (
                  "- source paper run / attempt: "
                  f"`{os.environ['SOURCE_RUN_ID']} / "
                  f"{os.environ['SOURCE_RUN_ATTEMPT']}`"
              ),
              (
                  "- source resolution: "
                  f"`{os.environ['RESOLUTION_MODE']}`"
              ),
              f"- reason: {os.environ.get('WAIT_REASON') or 'compact source is not yet eligible'}",
              "",
              "No long-trend carveout row is credited from this run.",
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes candidate readiness:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/long-trend-carveout-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/long-trend-carveout-status.md)"

      - name: Restore previous fast-markout ledger
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        id: previous
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous_path=""
          previous_workflow_run_id=""
          runs_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prospective-long-trend-carveout-fast-markout-ledger.yml/runs?status=success&per_page=100"
          )"
          mapfile -t prior_runs < <(
            jq -r               --arg current "$CURRENT_RUN_ID"               '.workflow_runs
               | map(select((.id | tostring) != $current))
               | sort_by(.updated_at)
               | reverse
               | .[].id'               <<<"$runs_json"
          )
          for run_id in "${prior_runs[@]}"; do
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"
            )"
            artifact_line="$(
              jq -r '
                .artifacts
                | map(
                    select(
                      (.expired | not)
                      and (
                        .name
                        | startswith("prospective-long-trend-carveout-fast-markout-ledger-")
                      )
                    )
                  )
                | if length > 0
                  then [.[0].id, .[0].name] | @tsv
                  else ""
                  end
              ' <<<"$artifacts_json"
            )"
            if [ -z "$artifact_line" ]; then
              continue
            fi
            IFS=$'\t' read -r artifact_id artifact_name <<<"$artifact_line"
            rm -rf /tmp/previous-long-trend-carveout-ledger
            mkdir -p /tmp/previous-long-trend-carveout-ledger
            gh api               "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/previous-long-trend-carveout-ledger.zip
            unzip -q               /tmp/previous-long-trend-carveout-ledger.zip               -d /tmp/previous-long-trend-carveout-ledger
            candidate="$(
              find /tmp/previous-long-trend-carveout-ledger                 -type f                 -name prospective-long-trend-carveout-fast-markout-ledger.json                 -print -quit
            )"
            if [ -n "$candidate" ] && [ -s "$candidate" ]; then
              previous_path="$candidate"
              previous_workflow_run_id="$run_id"
              break
            fi
          done
          echo "previous_path=$previous_path" >> "$GITHUB_OUTPUT"
          echo "previous_workflow_run_id=$previous_workflow_run_id" >> "$GITHUB_OUTPUT"

      - name: Extend append-only fast-markout ledger
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        id: ledger
        continue-on-error: true
        shell: bash
        env:
          SUMMARY_PATH: ${{ steps.compact.outputs.summary_path }}
          PREVIOUS_LEDGER_PATH: ${{ steps.previous.outputs.previous_path }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set +e
          args=(
            "$SUMMARY_PATH"
            --source-paper-run-id "$SOURCE_RUN_ID"
            --source-paper-run-attempt "$SOURCE_RUN_ATTEMPT"
            --source-artifact-name "$SOURCE_ARTIFACT_NAME"
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"
            --json-out prospective-long-trend-carveout-fast-markout-ledger.json
          )
          if [ -n "$PREVIOUS_LEDGER_PATH" ]; then
            args+=(--previous "$PREVIOUS_LEDGER_PATH")
          fi
          python scripts/update_prospective_long_trend_carveout_fast_markout_ledger.py             "${args[@]}"             > /tmp/long-trend-carveout-ledger.stdout.json             2> /tmp/long-trend-carveout-ledger.error
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test -s prospective-long-trend-carveout-fast-markout-ledger.json
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo "error<<EOF"
              cat /tmp/long-trend-carveout-ledger.error
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish blocked ledger status
        if: ${{ steps.compact.outputs.eligible == 'true' && steps.ledger.outputs.clean != 'true' }}
        shell: bash
        env:
          ERROR_TEXT: ${{ steps.ledger.outputs.error }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          PREVIOUS_WORKFLOW_RUN_ID: ${{ steps.previous.outputs.previous_workflow_run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          error = os.environ.get("ERROR_TEXT") or "unknown error"
          lines = [
              "## LONG+trend carveout fast-markout ledger",
              "",
              "**Status:** BLOCKED — append-only invariant failure",
              "",
              (
                  "- source paper run / attempt: "
                  f"`{os.environ['SOURCE_RUN_ID']} / "
                  f"{os.environ['SOURCE_RUN_ATTEMPT']}`"
              ),
              f"- previous accepted ledger workflow run: `{os.environ.get('PREVIOUS_WORKFLOW_RUN_ID') or 'none'}`",
              f"- source artifact SHA-256: `{os.environ['SOURCE_ARTIFACT_DIGEST']}`",
              f"- error: `{error}`",
              "",
              "No long-trend carveout evidence is published from this run.",
              "Changed terminal decision evidence remains rejected.",
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes candidate readiness:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/long-trend-carveout-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          cat /tmp/long-trend-carveout-status.md >> "$GITHUB_STEP_SUMMARY"
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/long-trend-carveout-status.md)"

      - name: Fail closed on ledger drift
        if: ${{ steps.compact.outputs.eligible == 'true' && steps.ledger.outputs.clean != 'true' }}
        shell: bash
        run: |
          echo "LONG+trend carveout append-only ledger is blocked." >&2
          exit 1

      - name: Publish clean ledger status
        if: ${{ steps.compact.outputs.eligible == 'true' && steps.ledger.outputs.clean == 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
          PREVIOUS_WORKFLOW_RUN_ID: ${{ steps.previous.outputs.previous_workflow_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          ledger = json.loads(
              Path("prospective-long-trend-carveout-fast-markout-ledger.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = ledger["summary"]
          post_integrity = summary.get("post_integrity_miss", {})
          if not isinstance(post_integrity, dict):
              post_integrity = {}

          def stamp(value):
              return datetime.fromtimestamp(
                  int(value) / 1000,
                  tz=UTC,
              ).isoformat()

          previous = os.environ["PREVIOUS_WORKFLOW_RUN_ID"] or "none"
          lines = [
              "## LONG+trend carveout fast-markout ledger",
              "",
              "**Status:** append-only clean",
              "",
              f"- candidate: `{ledger['candidate_id']}`",
              f"- common stack start: `{stamp(ledger['overlap_started_at_ms'])}`",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source resolution: `{os.environ['RESOLUTION_MODE']}`",
              f"- previous ledger workflow run: `{previous}`",
              f"- terminal / previous / new / pending / unevaluable: `{ledger['row_count']} / {ledger['previous_row_count']} / {ledger['new_row_count']} / {ledger['pending_opportunity_count']} / {ledger['unevaluable_opportunity_count']}`",
              f"- cumulative source integrity clean: `{summary['integrity_clean']}`",
              f"- post-integrity boundary known: `{post_integrity.get('boundary_known', False)}`",
              f"- post-integrity last miss / start: `{post_integrity.get('last_miss_at_ms')} / {post_integrity.get('started_at_ms')}`",
              f"- post-integrity terminal opportunities: `{post_integrity.get('terminal_opportunity_count', 0)}`",
              f"- post-integrity all horizons ready: `{post_integrity.get('all_horizons_ready_for_execution_shadow_investigation', False)}`",
              f"- effective integrity scope: `{summary.get('effective_integrity_scope', 'none')}`",
              f"- effective all horizons ready for execution-shadow investigation: `{summary.get('effective_all_horizons_ready_for_execution_shadow_investigation', summary['all_horizons_ready_for_execution_shadow_investigation'])}`",
              f"- challenger admitted / blocked terminal: `{summary['carveout_admitted_terminal']} / {summary['carveout_blocked_terminal']}`",
              f"- changed decision-or-layer terminal: `{summary['changed_decision_or_layer_terminal']}`",
              f"- reopened pure LONG+trend terminal: `{summary['reopened_long_trend_terminal']}`",
              f"- block layer counts: `{summary['carveout_block_layer_counts']}`",
              f"- all horizons ready for execution-shadow investigation: `{summary['all_horizons_ready_for_execution_shadow_investigation']}`",
              f"- rows SHA-256: `{ledger['rows_sha256']}`",
              f"- ledger SHA-256: `{ledger['ledger_sha256']}`",
              "",
              "### Fixed forward horizons",
              "",
              "| Horizon | Settled | Admit | Block | LONG | SHORT | Markets | Admit mean | Block mean | Spread | LOO spread opp | LOO spread market | Reopened LONG+trend | Reopened markets | Reopened mean | Reopened LOO opp | Reopened LOO market | Stop eval | Stop crossed | Stop survived | Cross frac | Median TTS | Stop complete? | Survivor majority? | Ready? |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- | --- |",
          ]
          for horizon_ms in ledger["forward_horizons_ms"]:
              item = summary["horizons"][str(horizon_ms)]
              spread = item["spread_robustness"]
              reopened = item["reopened_long_trend"]
              stop_path = item["reopened_long_trend_stop_path"]
              ready = item["investigation_readiness"]
              lines.append(
                  "| {minutes}m | {settled} | {admit} | {block} | {long} | {short} | "
                  "{markets} | {admit_mean} | {block_mean} | {spread} | {loo_opp} | "
                  "{loo_market} | {reopened_n} | {reopened_markets} | {reopened_mean} | "
                  "{reopened_loo_opp} | {reopened_loo_market} | {stop_eval} | "
                  "{stop_crossed} | {stop_survived} | {cross_frac} | {median_tts} | "
                  "{stop_complete} | {survivor_majority} | {ready} |".format(
                      minutes=horizon_ms // 60000,
                      settled=item["settled_opportunities"],
                      admit=item["admit_settled"],
                      block=item["block_settled"],
                      long=item["long_settled"],
                      short=item["short_settled"],
                      markets=item["market_count"],
                      admit_mean=item["admit_mean_directional_return"],
                      block_mean=item["block_mean_directional_return"],
                      spread=spread["admit_minus_block_mean_return"],
                      loo_opp=spread["leave_one_opportunity_min_spread"],
                      loo_market=spread["leave_one_market_min_spread"],
                      reopened_n=item["reopened_long_trend_settled"],
                      reopened_markets=item["reopened_long_trend_market_count"],
                      reopened_mean=reopened["mean_directional_return"],
                      reopened_loo_opp=reopened["leave_one_opportunity_min_mean"],
                      reopened_loo_market=reopened["leave_one_market_min_mean"],
                      stop_eval=stop_path["evaluable"],
                      stop_crossed=stop_path["crossings"],
                      stop_survived=stop_path["survivors"],
                      cross_frac=stop_path["crossing_fraction"],
                      median_tts=stop_path["median_time_to_stop_ms"],
                      stop_complete=ready[
                          "stop_path_complete_for_reopened_sample"
                      ],
                      survivor_majority=ready[
                          "stop_survivor_majority"
                      ],
                      ready=ready["ready_for_execution_shadow_investigation"],
                  )
              )
          timing = summary.get("reopened_long_trend_exit_timing", {})
          if not isinstance(timing, dict):
              timing = {}
          lines.extend(
              [
                  "",
                  "### Reopened LONG+trend exit timing",
                  "",
                  (
                      "- evaluable / markets: "
                      f"`{timing.get('evaluable_opportunities', 0)} / "
                      f"{timing.get('market_count', 0)}`"
                  ),
                  (
                      "- best fixed horizon counts / ties: "
                      f"`{timing.get('best_horizon_counts', {})} / "
                      f"{timing.get('best_horizon_ties', 0)}`"
                  ),
                  (
                      "- early exit preferred / 60m preferred / tied: "
                      f"`{timing.get('early_exit_preferred_count', 0)} / "
                      f"{timing.get('sixty_min_preferred_count', 0)} / "
                      f"{timing.get('early_vs_sixty_tie_count', 0)}`"
                  ),
              ]
          )
          for label, key in (
              ("5m - 60m", "five_min_minus_sixty_min"),
              ("15m - 60m", "fifteen_min_minus_sixty_min"),
              ("5m - 15m", "five_min_minus_fifteen_min"),
          ):
              values = timing.get(key, {})
              if not isinstance(values, dict):
                  values = {}
              lines.append(
                  "- {label}: mean={mean}, LOO-opp={loo_opp}, "
                  "LOO-market={loo_market}".format(
                      label=label,
                      mean=values.get("mean_directional_return"),
                      loo_opp=values.get(
                          "leave_one_opportunity_min_mean"
                      ),
                      loo_market=values.get(
                          "leave_one_market_min_mean"
                      ),
                  )
              )

          lines.extend(
              [
                  "",
                  "Investigation gate only: cumulative evidence may pass only when cumulative integrity is clean. If historical integrity is dirty, only a candidate-specific post-integrity suffix with a known last-miss boundary may re-earn the gate, and that suffix must satisfy every threshold from scratch: >=20 settled opportunities, >=5 ADMIT, >=5 BLOCK, >=5 LONG, >=5 SHORT, >=4 markets, positive admitted mean, negative blocked mean, positive and leave-one robust separation, plus >=10 reopened pure LONG+trend opportunities across >=4 markets with positive leave-one-opportunity and leave-one-market robustness. The reopened sample must also have complete observed stop-path coverage and strictly more survivors than observed stop crossings.",
                  "Passing this gate can authorize only a deeper paper execution-shadow investigation. It cannot change the live/frozen entry stack, any risk limit, sizing, candidate readiness, promotion state, or live-order authority.",
                  "Stop-path evidence reports only observed causal marks against the original decision-time stop; it does not model unseen intramillisecond prices, stop fills, slippage, or a complete counterfactual trade lifecycle.",
                  "Only rows with every fixed horizon terminal become immutable. Pending or missing-path rows remain unfrozen.",
                  "Every previously published terminal row must remain byte-for-byte equivalent after canonicalization.",
                  "",
                  "**Execution authority:** `false`",
                  "**Promotion authority:** `false`",
                  "**Changes risk limits:** `false`",
                  "**Changes candidate readiness:** `false`",
                  "**LIVE TRADING: DISABLED.**",
              ]
          )
          Path("/tmp/long-trend-carveout-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/long-trend-carveout-status.md)"

      - name: Upload fast-markout ledger
        if: ${{ steps.compact.outputs.eligible == 'true' && steps.ledger.outputs.clean == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: prospective-long-trend-carveout-fast-markout-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-long-trend-carveout-fast-markout-ledger.json
          if-no-files-found: error
          retention-days: 90
