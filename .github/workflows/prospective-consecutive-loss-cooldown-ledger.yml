name: Prospective Consecutive-Loss Cooldown Ledger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-consecutive-loss-cooldown-ledger.yml"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-consecutive-loss-cooldown-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEDGER_ISSUE: "733"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact source paper run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail
          echo "source_eligible=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$EVENT_CONCLUSION" = "success" ]; then
            run_id="$EVENT_RUN_ID"
            run_attempt="$EVENT_RUN_ATTEMPT"
            resolution_mode="successful_event"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            resolution_mode="manual_exact"
          else
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=50"
            )"
            read -r run_id run_attempt <<< "$(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"])
                  break
          '
            )"
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              resolution_mode="latest_successful_after_non_success_wake"
            else
              resolution_mode="latest_successful_push"
            fi
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "source paper run identity is invalid" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("source run must be completed successfully")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"

          artifact_name="continuous-paper-learning-source-$run_id-$run_attempt"
          artifacts_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"
          )"
          artifact_line="$(
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$artifact_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == name
              and item.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one non-expired source artifact named {name}"
              )
          item = matches[0]
          digest = item.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("source artifact digest is missing or invalid")
          print(item["id"], item["name"], digest, sep="\t")
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download compact paper source
        if: ${{ steps.source.outputs.source_eligible == 'true' }}
        id: compact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cooldown-source
          mkdir -p /tmp/cooldown-source
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/cooldown-source.zip
          unzip -q /tmp/cooldown-source.zip -d /tmp/cooldown-source

          summary_path="$(
            find /tmp/cooldown-source \
              -type f \
              -name prospective-consecutive-loss-cooldown-shadow-summary.json \
              -print -quit
          )"
          state_path="$(
            find /tmp/cooldown-source \
              -type f \
              -name prospective-consecutive-loss-cooldown-shadow-state.json \
              -print -quit
          )"
          if [ -z "$summary_path" ] || [ -z "$state_path" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
            echo "state_path=$state_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$summary_path"
          test -s "$state_path"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
          echo "state_path=$state_path" >> "$GITHUB_OUTPUT"

      - name: Publish waiting-for-state status
        if: ${{ steps.source.outputs.source_eligible == 'true' && steps.compact.outputs.eligible != 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
        run: |
          cat > /tmp/cooldown-ledger-status.md <<EOF
          ## Prospective consecutive-loss cooldown ledger

          **Status:** waiting for new-format compact source

          - source paper run: \`$SOURCE_RUN_ID\`
          - source paper attempt: \`$SOURCE_RUN_ATTEMPT\`
          - source resolution: \`$RESOLUTION_MODE\`
          - reason: compact source predates export of the frozen cooldown state/summary

          No clean option row is credited from this run.

          **Execution authority:** \`false\`
          **Promotion authority:** \`false\`
          **Changes risk limits:** \`false\`
          **LIVE TRADING: DISABLED.**
          EOF
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE" \
            -f body="$(cat /tmp/cooldown-ledger-status.md)"

      - name: Restore previous cooldown ledger
        if: ${{ steps.source.outputs.source_eligible == 'true' && steps.compact.outputs.eligible == 'true' }}
        id: previous
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous_path=""
          previous_workflow_run_id=""
          runs_json="$(
            gh api               "repos/$GITHUB_REPOSITORY/actions/workflows/prospective-consecutive-loss-cooldown-ledger.yml/runs?status=success&per_page=100"
          )"
          mapfile -t prior_runs < <(
            jq -r               --arg current "$CURRENT_RUN_ID"               '.workflow_runs
               | map(select((.id | tostring) != $current))
               | sort_by(.updated_at)
               | reverse
               | .[].id'               <<<"$runs_json"
          )
          for run_id in "${prior_runs[@]}"; do
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"
            )"
            artifact_line="$(
              jq -r '
                .artifacts
                | map(
                    select(
                      (.expired | not)
                      and (
                        .name
                        | startswith("prospective-consecutive-loss-cooldown-ledger-")
                      )
                    )
                  )
                | if length > 0
                  then [.[0].id, .[0].name] | @tsv
                  else ""
                  end
              ' <<<"$artifacts_json"
            )"
            if [ -z "$artifact_line" ]; then
              continue
            fi
            IFS=$'\t' read -r artifact_id artifact_name <<<"$artifact_line"
            rm -rf /tmp/previous-cooldown-ledger
            mkdir -p /tmp/previous-cooldown-ledger
            gh api               "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/previous-cooldown-ledger.zip
            unzip -q               /tmp/previous-cooldown-ledger.zip               -d /tmp/previous-cooldown-ledger
            candidate="$(
              find /tmp/previous-cooldown-ledger                 -type f                 -name prospective-consecutive-loss-cooldown-ledger.json                 -print -quit
            )"
            if [ -n "$candidate" ] && [ -s "$candidate" ]; then
              previous_path="$candidate"
              previous_workflow_run_id="$run_id"
              break
            fi
          done
          echo "previous_path=$previous_path" >> "$GITHUB_OUTPUT"
          echo "previous_workflow_run_id=$previous_workflow_run_id" >> "$GITHUB_OUTPUT"

      - name: Extend append-only cooldown ledger
        if: ${{ steps.source.outputs.source_eligible == 'true' && steps.compact.outputs.eligible == 'true' }}
        id: ledger
        continue-on-error: true
        shell: bash
        env:
          SUMMARY_PATH: ${{ steps.compact.outputs.summary_path }}
          STATE_PATH: ${{ steps.compact.outputs.state_path }}
          PREVIOUS_LEDGER_PATH: ${{ steps.previous.outputs.previous_path }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set +e
          args=(
            "$SUMMARY_PATH"
            "$STATE_PATH"
            --source-paper-run-id "$SOURCE_RUN_ID"
            --source-paper-run-attempt "$SOURCE_RUN_ATTEMPT"
            --source-artifact-name "$SOURCE_ARTIFACT_NAME"
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"
            --json-out prospective-consecutive-loss-cooldown-ledger.json
          )
          if [ -n "$PREVIOUS_LEDGER_PATH" ]; then
            args+=(--previous "$PREVIOUS_LEDGER_PATH")
          fi
          python scripts/update_prospective_consecutive_loss_cooldown_ledger.py \
            "${args[@]}" \
            > /tmp/cooldown-ledger.stdout.json \
            2> /tmp/cooldown-ledger.error
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test -s prospective-consecutive-loss-cooldown-ledger.json
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo "error<<EOF"
              cat /tmp/cooldown-ledger.error
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish blocked ledger status
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean != 'true'
        shell: bash
        env:
          ERROR_TEXT: ${{ steps.ledger.outputs.error }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          error="${ERROR_TEXT:-unknown error}"
          cat > /tmp/cooldown-ledger-status.md <<EOF
          ## Prospective consecutive-loss cooldown ledger

          **Status:** BLOCKED — append-only invariant failure

          - source paper run: \`$SOURCE_RUN_ID\`
          - source paper attempt: \`$SOURCE_RUN_ATTEMPT\`
          - error: \`$error\`

          No cooldown evidence is published from this run.

          **Execution authority:** \`false\`
          **Promotion authority:** \`false\`
          **Changes risk limits:** \`false\`
          **LIVE TRADING: DISABLED.**
          EOF
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE" \
            -f body="$(cat /tmp/cooldown-ledger-status.md)"

      - name: Fail closed on cooldown ledger drift
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean != 'true'
        shell: bash
        run: |
          echo "Cooldown append-only ledger is blocked." >&2
          exit 1

      - name: Publish clean ledger status
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
          PREVIOUS_WORKFLOW_RUN_ID: ${{ steps.previous.outputs.previous_workflow_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          ledger = json.loads(
              Path(
                  "prospective-consecutive-loss-cooldown-ledger.json"
              ).read_text(encoding="utf-8")
          )
          summary = ledger["summary"]

          def stamp(value):
              return datetime.fromtimestamp(
                  int(value) / 1000,
                  tz=UTC,
              ).isoformat()

          previous = os.environ["PREVIOUS_WORKFLOW_RUN_ID"] or "none"
          lines = [
              "## Prospective consecutive-loss cooldown ledger",
              "",
              "**Status:** append-only clean",
              "",
              f"- candidate: `{ledger['candidate_id']}`",
              f"- frozen at: `{stamp(ledger['frozen_at_ms'])}`",
              f"- clean scoring start: `{stamp(ledger['started_at_ms'])}`",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source resolution: `{os.environ['RESOLUTION_MODE']}`",
              f"- previous ledger workflow run: `{previous}`",
              f"- terminal rows / previous / newly appended: `{ledger['row_count']} / {ledger['previous_row_count']} / {ledger['new_row_count']}`",
              f"- still-pending options: `{ledger['pending_option_count']}`",
              f"- rows SHA-256: `{ledger['rows_sha256']}`",
              f"- ledger SHA-256: `{ledger['ledger_sha256']}`",
              "",
              "### Fixed cooldown windows",
              "",
              "| Relaxed cooldown | Terminal options | Filled | Settled 1h | 1h PnL | LOO option min | LOO market min |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for window_ms in ledger["relaxed_cooldown_windows_ms"]:
              item = summary["relaxation_windows"][str(window_ms)]
              robust = item["robustness"]
              lines.append(
                  "| {minutes}m | {terminal} | {filled} | {settled} | "
                  "{pnl} | {loo_option} | {loo_market} |".format(
                      minutes=window_ms // 60000,
                      terminal=item["terminal_options"],
                      filled=item["filled_options"],
                      settled=robust["settled_options"],
                      pnl=robust["total_entry_fee_adjusted_1h_pnl"],
                      loo_option=robust["leave_one_option_out_min_pnl"],
                      loo_market=robust["leave_one_market_out_min_pnl"],
                  )
              )
          lines.extend(
              [
                  "",
                  "Only terminal option rows are immutable. Filled rows remain pending while any 5m/15m/1h mark is pending or missing.",
                  "Every previously published terminal row must remain byte-for-byte equivalent after canonicalization.",
                  "",
                  "**Execution authority:** `false`",
                  "**Promotion authority:** `false`",
                  "**Changes risk limits:** `false`",
                  "**LIVE TRADING: DISABLED.**",
              ]
          )
          Path("/tmp/cooldown-ledger-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE" \
            -f body="$(cat /tmp/cooldown-ledger-status.md)"

      - name: Upload cooldown ledger
        if: >-
          steps.source.outputs.source_eligible == 'true' &&
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prospective-consecutive-loss-cooldown-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-consecutive-loss-cooldown-ledger.json
          if-no-files-found: error
          retention-days: 90
