name: Branch Patch Research Fanout

on:
  push:
    branches:
      - fix/research-fanout-replay-revision-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/research-fanout-replay-revision-20260914
          fetch-depth: 0
      - name: Apply exact provenance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cocomelon/research/cohort.py")
          source = path.read_text(encoding="utf-8")
          old = """        code_revision=candidate.code_revision,\n"""
          new = """        code_revision=_require_sha(\n            _require_string(capture.get(\"code_revision\"), \"capture source code_revision\"),\n            \"capture source code_revision\",\n        ),\n"""
          count = source.count(old)
          if count == 0:
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f"expected one target, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          if git diff --quiet -- src/cocomelon/research/cohort.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cocomelon/research/cohort.py
          git commit -m "fix: bind research replay to capture revision"
          git push origin HEAD:fix/research-fanout-replay-revision-20260914