name: Prospective Reopened LONG Trend 15m Exact Evidence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-long-trend-15m-exact.yml"
      - "src/cocomelon/research/prospective_long_trend_15m_exit.py"
      - "src/cocomelon/research/prospective_long_trend_15m_exit_source.py"
      - "scripts/evaluate_prospective_long_trend_15m_exit.py"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-reopened-long-trend-15m-exact
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_ISSUE: "894"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact artifact-bearing paper state
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local compact_name="continuous-paper-long-trend-exact-source-$candidate_run_id-$candidate_attempt"
            local durable_name="continuous-paper-state-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_COMPACT_NAME="$compact_name" ARTIFACT_DURABLE_NAME="$durable_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          artifact_list = payload.get("artifacts", [])
          selected = None
          for name in (
              os.environ["ARTIFACT_COMPACT_NAME"],
              os.environ["ARTIFACT_DURABLE_NAME"],
          ):
              matches = [
                  item for item in artifact_list
                  if item.get("name") == name and item.get("expired") is False
              ]
              if len(matches) > 1:
                  raise SystemExit(
                      f"ambiguous exact paper research artifact named {name}"
                  )
              if matches and selected is None:
                  selected = matches[0]
          if selected is None:
              raise SystemExit(0)
          size = selected.get("size_in_bytes")
          if type(size) is not int or size <= 0:
              raise SystemExit("exact artifact size is absent or invalid")
          if (
              selected.get("name") == os.environ["ARTIFACT_DURABLE_NAME"]
              and size > 512 * 1024 * 1024
          ):
              # An oversized legacy download must not exhaust research
              # runner capacity. Wait for a genuine compact source; do
              # not repackage or invent missing market-data records.
              raise SystemExit(0)
          digest = selected.get("digest")
          if (
              not isinstance(digest, str)
              or len(digest) != 71
              or not digest.startswith("sha256:")
              or any(c not in "0123456789abcdef" for c in digest[7:].lower())
          ):
              raise SystemExit("state artifact digest is missing or invalid")
          print(selected["id"], selected["name"], digest, sep="\t")
          '
          }

          paper_run_is_evidence_eligible() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local run_path="/tmp/exact-state-run-$candidate_run_id.json"
            local jobs_path="/tmp/exact-state-jobs-$candidate_run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" > "$run_path"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100" > "$jobs_path"
            python - "$run_path" "$jobs_path" "$candidate_attempt" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_attempt, expected_repo = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit(1)
          if run.get("head_branch") != "main":
              raise SystemExit(1)
          status = run.get("status")
          if status not in {"completed", "in_progress"}:
              raise SystemExit(1)
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit(1)
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              raise SystemExit(1)
          conclusion = run.get("conclusion")
          if status == "completed" and conclusion not in {"success", "failure"}:
              raise SystemExit(1)
          if status == "completed" and conclusion == "success":
              raise SystemExit(0)
          if status == "in_progress" and conclusion is not None:
              raise SystemExit(1)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs_payload = json.load(handle)
          paper_jobs = [
              job for job in jobs_payload.get("jobs", [])
              if job.get("name") == "paper"
          ]
          if len(paper_jobs) != 1:
              raise SystemExit(1)
          job = paper_jobs[0]
          if status == "in_progress":
              if job.get("status") != "in_progress" or job.get("conclusion") is not None:
                  raise SystemExit(1)
          elif job.get("conclusion") != "failure":
              raise SystemExit(1)
          steps = {
              step.get("name"): step.get("conclusion")
              for step in job.get("steps", [])
              if isinstance(step.get("name"), str)
          }
          required = (
              "Run continuous paper trader",
              "Measure durable continuous paper state",
              "Upload durable continuous paper state",
          )
          if any(steps.get(name) != "success" for name in required):
              raise SystemExit(1)
          if status == "in_progress":
              # Post-handoff research may still occupy this runner. Do not
              # treat its currently open trading job as evidence until the
              # exact successor and authenticated compact source are done.
              successor_done = (
                  steps.get("Queue exact successor from fast resume") == "success"
                  or steps.get("Queue fallback exact successor continuous paper worker")
                  == "success"
              )
              if (
                  not successor_done
                  or steps.get("Upload compact exact LONG trend research source")
                  != "success"
              ):
                  raise SystemExit(1)
              raise SystemExit(0)
          failed_steps = {
              name for name, step_conclusion in steps.items()
              if step_conclusion == "failure"
          }
          allowed = {
              frozenset({"Fail closed on upgrade handoff source"}),
              frozenset(
                  {
                      "Queue fallback exact successor continuous paper worker",
                      "Fail closed on upgrade handoff source",
                  }
              ),
          }
          if frozenset(failed_steps) not in allowed:
              raise SystemExit(1)
          if (
              "Queue fallback exact successor continuous paper worker"
              in failed_steps
              and steps.get("Queue exact successor from fast resume")
              != "success"
          ):
              raise SystemExit(1)
          PY
          }

          run_id=""
          run_attempt=""
          artifact_line=""
          resolution_mode=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
              echo "manual source paper run identity is invalid" >&2
              exit 1
            fi
            if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
              echo "manual source paper run is not evidence-eligible" >&2
              exit 1
            fi
            artifact_line="$(artifact_for_run "$run_id" "$run_attempt")"
            resolution_mode="manual_exact"
          elif [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ && "$EVENT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            if paper_run_is_evidence_eligible "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"; then
              artifact_line="$(artifact_for_run "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT")"
              if [ -n "$artifact_line" ]; then
                run_id="$EVENT_RUN_ID"
                run_attempt="$EVENT_RUN_ATTEMPT"
                if [ "$EVENT_CONCLUSION" = "success" ]; then
                  resolution_mode="successful_event"
                else
                  resolution_mode="durable_handoff_event"
                fi
              fi
            fi
          fi

          if [ -z "$artifact_line" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&per_page=100"
            )"
            mapfile -t candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") in {"completed", "in_progress"}
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if ! paper_run_is_evidence_eligible "$candidate_run_id" "$candidate_attempt"; then
                continue
              fi
              candidate_artifact_line="$(artifact_for_run "$candidate_run_id" "$candidate_attempt")"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$candidate_run_id"
                run_attempt="$candidate_attempt"
                artifact_line="$candidate_artifact_line"
                resolution_mode="latest_evidence_eligible_with_state_artifact"
                break
              fi
            done
          fi

          if [ -z "$artifact_line" ]; then
            echo "no authenticated LONG-trend source within 512 MiB legacy download budget; require exact compact artifact" >&2
            exit 1
          fi
          if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
            echo "selected source paper run is not evidence-eligible" >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") not in {"completed", "in_progress"}:
              raise SystemExit("source run status is not evidence-eligible")
          if run.get("status") == "completed":
              if run.get("conclusion") not in {"success", "failure"}:
                  raise SystemExit("source run conclusion is not evidence-eligible")
          elif run.get("conclusion") is not None:
              raise SystemExit("unfinished source has an unexpected conclusion")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download authenticated durable state
        id: state
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          rm -rf /tmp/long-trend-15m-artifact /tmp/long-trend-15m-state
          mkdir -p /tmp/long-trend-15m-artifact /tmp/long-trend-15m-state
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/long-trend-15m-state.zip
          actual_digest="sha256:$(sha256sum /tmp/long-trend-15m-state.zip | cut -d' ' -f1)"
          if [ "$actual_digest" != "$ARTIFACT_DIGEST" ]; then
            echo "state artifact digest mismatch" >&2
            exit 1
          fi
          unzip -q /tmp/long-trend-15m-state.zip             -d /tmp/long-trend-15m-artifact
          if [[ "$ARTIFACT_NAME" == continuous-paper-long-trend-exact-source-* ]]; then
            # A single authenticated TAR retains required source
            # directories even if a cohort has zero records.
            compact_tar="$(
              find /tmp/long-trend-15m-artifact -type f -name continuous-paper-long-trend-exact-source.tar -print -quit
            )"
            if [ -z "$compact_tar" ]; then
              echo "authenticated compact paper research tar is missing" >&2
              exit 1
            fi
            tar -tf "$compact_tar" >/dev/null
            tar -xf "$compact_tar" -C /tmp/long-trend-15m-state
          else
            # Read old fully authenticated durable archives as a
            # backward-compatible fallback. Never confuse them with a
            # newer compact source or bypass the exact SHA-256 check.
            tar_path="$(
              find /tmp/long-trend-15m-artifact -type f -name continuous-paper-state.tar -print -quit
            )"
            if [ -z "$tar_path" ]; then
              echo "durable paper state tar is missing" >&2
              exit 1
            fi
            tar -xf "$tar_path" -C /tmp/long-trend-15m-state
          fi

          for required in             prospective-full-stack-forward-markout-summary.json             prospective-long-trend-execution-shadow-source.json
          do
            test -s "/tmp/long-trend-15m-state/$required"
          done
          test -d /tmp/long-trend-15m-state/opening-opportunities/records
          test -d /tmp/long-trend-15m-state/opening-opportunity-exit-books/records
          test -d /tmp/long-trend-15m-state/replacement-funding-boundaries/records
          echo "root=/tmp/long-trend-15m-state" >> "$GITHUB_OUTPUT"

      - name: Evaluate exact LONG trend 15m candidate
        id: evaluate
        shell: bash
        env:
          STATE_ROOT: ${{ steps.state.outputs.root }}
        run: |
          set -euo pipefail
          python scripts/evaluate_prospective_long_trend_15m_exit.py             "$STATE_ROOT"             --source-out prospective-long-trend-15m-exit-source.json             --json-out prospective-long-trend-15m-exit-summary.json

      - name: Publish exact LONG trend 15m evidence
        shell: bash
        env:
          ISSUE_NUMBER: ${{ env.EVIDENCE_ISSUE }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_RESOLUTION: ${{ steps.source.outputs.resolution_mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path(
                  "prospective-long-trend-15m-exit-summary.json"
              ).read_text(encoding="utf-8")
          )
          robustness = summary["robustness"]
          ready = summary["candidate_investigation_ready"] is True
          status = (
              "INVESTIGATION GATE PASSED"
              if ready
              else "COLLECTING / GATE NOT MET"
          )
          lines = [
              "## Reopened LONG+trend exact 15m evidence",
              "",
              f"**Status:** {status}",
              "",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source head SHA: `{os.environ['SOURCE_HEAD_SHA']}`",
              f"- source resolution: `{os.environ['SOURCE_RESOLUTION']}`",
              f"- source artifact: `{os.environ['SOURCE_ARTIFACT_NAME']}`",
              f"- source artifact digest: `{os.environ['SOURCE_ARTIFACT_DIGEST']}`",
              f"- candidate: `{summary['candidate_id']}`",
              f"- frozen validation start ms: `{summary['started_at_ms']}`",
              "",
              "### Exact 15m economics",
              "",
              f"- source opportunities: `{summary['source_opportunities']}`",
              f"- counterfactual risk approvals: `{summary['counterfactual_risk_approvals']}`",
              f"- counterfactual risk rejections: `{summary['counterfactual_risk_rejections']}`",
              f"- entry fills: `{summary['entry_fills']}`",
              f"- observed stop survivors / crossings / incomplete: `{summary['observed_stop_survivor_options']} / {summary['observed_stop_crossing_options']} / {summary['observed_stop_path_incomplete_options']}`",
              f"- complete 15m exits: `{summary['complete_fifteen_minute_exits']}`",
              f"- exact realized-PnL options: `{summary['exact_realized_pnl_options']}`",
              f"- wins / losses / breakeven: `{summary['wins']} / {summary['losses']} / {summary['breakeven']}`",
              f"- total gross realized PnL: `{summary['total_gross_realized_pnl']}`",
              f"- total entry / exit fee drag: `{summary['total_entry_fees']} / {summary['total_exit_fees']}`",
              f"- gross return / fee drag / net return on entry notional: `{summary['gross_return_on_entry_notional']} / {summary['fee_drag_fraction_of_entry_notional']} / {summary['net_return_on_entry_notional']}`",
              f"- total exact realized PnL: `{summary['total_exact_realized_pnl']}`",
              f"- mean exact realized PnL: `{summary['mean_exact_realized_pnl']}`",
              f"- profit factor: `{summary['profit_factor']}`",
              "",
              "### Robustness gate",
              "",
              f"- exact options / required: `{robustness['exact_option_count']} / {robustness['minimum_exact_options']}`",
              f"- markets / required: `{robustness['market_count']} / {robustness['minimum_markets']}`",
              f"- minimum sample met: `{robustness['minimum_sample_met']}`",
              f"- leave-one-trade min PnL / positive: `{robustness['leave_one_option_out_min_pnl']} / {robustness['positive_after_removing_any_one_option']}`",
              f"- leave-one-market min PnL / positive: `{robustness['leave_one_market_out_min_pnl']} / {robustness['positive_after_removing_any_one_market']}`",
              f"- chronological half PnL: `{robustness['chronological_first_half_pnl']} / {robustness['chronological_second_half_pnl']}`",
              f"- chronological halves positive: `{robustness['chronological_halves_positive']}`",
              f"- investigation gate passed: `{ready}`",
              "",
              (
                  "This is a post-freeze exact-execution validation of the "
                  "reopened pure LONG+trend segment. Passing permits only "
                  "deeper research; it does not relax the weekly drawdown "
                  "lockout or authorize promotion/live execution."
              ),
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes risk limits:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/long-trend-15m-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"             -f body="$(cat /tmp/long-trend-15m-status.md)"

      - uses: actions/upload-artifact@v7
        with:
          name: prospective-long-trend-15m-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prospective-long-trend-15m-exit-source.json
            prospective-long-trend-15m-exit-summary.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
