name: Phase 4 Public Scan Smoke

on:
  push:
    branches:
      - phase-4-feature-scanner
  pull_request:
    branches:
      - main

jobs:
  scan-once:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      COCOMELON_EXECUTION_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: cocomelon scan-once --limit 20
