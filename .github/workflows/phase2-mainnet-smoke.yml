name: Phase 2 Mainnet Smoke

on:
  push:
    branches:
      - phase-2-mainnet-rest
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Read-only mainnet market discovery
        run: python -m cocomelon markets
      - name: Capture public mainnet fixtures
        run: python scripts/capture_phase2_fixtures.py --output-dir phase2-fixtures --sample-size 3
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-public-mainnet-fixtures
          path: phase2-fixtures/
          if-no-files-found: error
