      - name: Fail closed on finalization conflict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          finalization = json.loads(
              Path("/tmp/prospective-hype-finalization-status.json").read_text(
                  encoding="utf-8"
              )
          )
          if finalization["status"] == "conflict":
              reasons = ", ".join(finalization["conflict_reasons"])
              raise SystemExit(
                  "PROSPECTIVE_FINALIZATION_CONFLICT: " + reasons
              )
          PY

