name: Prospective HYPE V3 Clean Observer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-v3-clean.yml"
  pull_request:
    paths:
      - ".github/workflows/prospective-hype-v3-clean.yml"
      - "tests/test_prospective_hype_v3_workflow.py"
  workflow_dispatch:
    inputs:
      target_capture_ms:
        description: Exact protected UTC :03 capture target in epoch milliseconds
        required: true
        type: string
      queue_parent_run_id:
        description: Run that replenished this queue target, or manual
        required: true
        default: "manual"
        type: string

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Prospective HYPE V3 capture {0}', inputs.target_capture_ms)
      || 'Prospective HYPE V3 bootstrap' }}

permissions:
  contents: read
  actions: write

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify frozen V3 workflow contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_prospective_hype_v3_workflow.py -q

  prepare:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      OBSERVER_SOURCE_REVISION: 298723c52d6a3b09839d05451d3d7db9753815bf
      WORKFLOW_FILE: prospective-hype-v3-clean.yml
      RUN_TITLE_PREFIX: Prospective HYPE V3 capture
      QUEUE_DEPTH: "4"
      HANDOFF_LEAD_MS: "600000"
      INPUT_TARGET_CAPTURE_MS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_capture_ms || 'bootstrap' }}
      INPUT_QUEUE_PARENT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.queue_parent_run_id || 'none' }}
    outputs:
      proceed: ${{ steps.transport.outputs.proceed }}
      target_capture_ms: ${{ steps.transport.outputs.target_capture_ms }}
      queue_base_target_ms: ${{ steps.transport.outputs.queue_base_target_ms }}

    steps:
      - name: Checkout frozen V3 source
        uses: actions/checkout@v7
        with:
          ref: 298723c52d6a3b09839d05451d3d7db9753815bf
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen V3 source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OBSERVER_SOURCE_REVISION"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve deterministic transport leader
        id: transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            sleep 2
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=100" \
              > /tmp/v3-dispatch-runs.json
          else
            printf '%s\\n' '{"workflow_runs":[]}' > /tmp/v3-dispatch-runs.json
          fi

          PYTHONPATH=src python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from cocomelon.research.prospective_dispatch_queue import (
              HOUR_MS,
              dispatch_run_title,
              elect_dispatch_leader,
              next_protected_capture_ms,
              normalize_dispatch_runs,
              validate_protected_capture_target,
          )

          event = os.environ["GITHUB_EVENT_NAME"]
          output = Path(os.environ["GITHUB_OUTPUT"])
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("V3_TRANSPORT_MAIN_REF_REQUIRED")

          if event == "push":
              next_target = next_protected_capture_ms(time.time_ns() // 1_000_000)
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("proceed=true\n")
                  handle.write("target_capture_ms=bootstrap\n")
                  handle.write(f"queue_base_target_ms={next_target - HOUR_MS}\n")
              raise SystemExit(0)

          if event != "workflow_dispatch":
              raise SystemExit("V3_TRANSPORT_EVENT_INVALID")

          try:
              target = int(os.environ["INPUT_TARGET_CAPTURE_MS"])
          except ValueError as exc:
              raise SystemExit("V3_TARGET_CAPTURE_INVALID") from exc
          validate_protected_capture_target(target)

          parent = os.environ["INPUT_QUEUE_PARENT_RUN_ID"]
          if parent != "manual" and not parent.isdigit():
              raise SystemExit("V3_QUEUE_PARENT_INVALID")

          raw = json.loads(
              Path("/tmp/v3-dispatch-runs.json").read_text(encoding="utf-8")
          )
          if not isinstance(raw, dict) or not isinstance(raw.get("workflow_runs"), list):
              raise SystemExit("V3_DISPATCH_RUN_PAYLOAD_INVALID")
          runs = normalize_dispatch_runs(raw["workflow_runs"])
          title = dispatch_run_title(os.environ["RUN_TITLE_PREFIX"], target)
          is_leader = elect_dispatch_leader(
              runs,
              title=title,
              current_run_id=int(os.environ["GITHUB_RUN_ID"]),
          )
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"proceed={'true' if is_leader else 'false'}\n")
              handle.write(f"target_capture_ms={target}\n")
              handle.write(f"queue_base_target_ms={target}\n")
          PY

      - name: Hold leader until transport handoff
        if: ${{ steps.transport.outputs.proceed == 'true' && github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import os
          import time

          target_ms = int(os.environ["INPUT_TARGET_CAPTURE_MS"])
          handoff_lead_ms = int(os.environ["HANDOFF_LEAD_MS"])
          handoff_ms = target_ms - handoff_lead_ms
          now_ms = time.time_ns() // 1_000_000
          if now_ms < handoff_ms:
              delay = (handoff_ms - now_ms) / 1_000
              if delay > (4 * 60 * 60 + 60):
                  raise SystemExit("V3_HANDOFF_DELAY_OUT_OF_BOUNDS")
              print(f"handoff_delay_seconds={delay:.3f}")
              time.sleep(delay)
          PY

      - name: Refill rolling dispatch queue
        if: ${{ steps.transport.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_TARGET_MS: ${{ steps.transport.outputs.queue_base_target_ms }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > /tmp/v3-dispatch-runs.json

          PYTHONPATH=src python - <<'PY' > /tmp/v3-missing-targets.txt
          import json
          import os
          from pathlib import Path

          from cocomelon.research.prospective_dispatch_queue import (
              missing_future_targets,
              normalize_dispatch_runs,
          )

          raw = json.loads(
              Path("/tmp/v3-dispatch-runs.json").read_text(encoding="utf-8")
          )
          if not isinstance(raw, dict) or not isinstance(raw.get("workflow_runs"), list):
              raise SystemExit("V3_DISPATCH_RUN_PAYLOAD_INVALID")
          runs = normalize_dispatch_runs(raw["workflow_runs"])
          missing = missing_future_targets(
              runs,
              prefix=os.environ["RUN_TITLE_PREFIX"],
              target_capture_ms=int(os.environ["QUEUE_BASE_TARGET_MS"]),
              depth=int(os.environ["QUEUE_DEPTH"]),
          )
          for target in missing:
              print(target)
          PY

          while read -r target; do
            [[ -n "$target" ]] || continue
            attempt=1
            while true; do
              set +e
              output="$(
                gh workflow run "$WORKFLOW_FILE" \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f "target_capture_ms=$target" \
                  -f "queue_parent_run_id=$GITHUB_RUN_ID" 2>&1
              )"
              rc=$?
              set -e
              if [[ "$rc" -eq 0 ]]; then
                break
              fi
              if [[ "$attempt" -ge 5 ]] || ! grep -Eq 'HTTP (500|502|503|504)' <<<"$output"; then
                printf '%s\n' "$output" >&2
                exit "$rc"
              fi
              sleep "$((attempt * 2))"
              attempt="$((attempt + 1))"
            done
            sleep 1
          done < /tmp/v3-missing-targets.txt

          verified=false
          for attempt in {1..10}; do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=100" \
              > /tmp/v3-dispatch-runs-verify.json
            if PYTHONPATH=src python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cocomelon.research.prospective_dispatch_queue import (
              missing_future_targets,
              normalize_dispatch_runs,
          )

          raw = json.loads(
              Path("/tmp/v3-dispatch-runs-verify.json").read_text(encoding="utf-8")
          )
          runs = normalize_dispatch_runs(raw.get("workflow_runs", []))
          missing = missing_future_targets(
              runs,
              prefix=os.environ["RUN_TITLE_PREFIX"],
              target_capture_ms=int(os.environ["QUEUE_BASE_TARGET_MS"]),
              depth=int(os.environ["QUEUE_DEPTH"]),
          )
          raise SystemExit(0 if not missing else 1)
          PY
            then
              verified=true
              break
            fi
            sleep 2
          done
          if [[ "$verified" != "true" ]]; then
            echo "V3_QUEUE_REFILL_UNVERIFIED" >&2
            exit 1
          fi

      - name: Build transport receipt
        if: ${{ steps.transport.outputs.proceed == 'true' }}
        env:
          TARGET_CAPTURE_MS: ${{ steps.transport.outputs.target_capture_ms }}
          QUEUE_BASE_TARGET_MS: ${{ steps.transport.outputs.queue_base_target_ms }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/prospective-hype-v3-transport
          PYTHONPATH=src python - <<'PY' > artifacts/prospective-hype-v3-transport/receipt.json
          import hashlib
          import json
          import os
          import time

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          payload = {
              "kind": "prospective-hype-v3-transport",
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "target_capture_ms": (
                  None
                  if os.environ["TARGET_CAPTURE_MS"] == "bootstrap"
                  else int(os.environ["TARGET_CAPTURE_MS"])
              ),
              "queue_base_target_ms": int(os.environ["QUEUE_BASE_TARGET_MS"]),
              "queue_parent_run_id": (
                  None
                  if os.environ["INPUT_QUEUE_PARENT_RUN_ID"] == "none"
                  else os.environ["INPUT_QUEUE_PARENT_RUN_ID"]
              ),
              "queue_depth": int(os.environ["QUEUE_DEPTH"]),
              "handoff_lead_ms": int(os.environ["HANDOFF_LEAD_MS"]),
              "source_revision": os.environ["OBSERVER_SOURCE_REVISION"],
              "economic_evidence": False,
              "promotion_eligible": False,
              "observed_at_ms": time.time_ns() // 1_000_000,
              "schema_version": 1,
          }
          payload["receipt_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          print(canonical(payload))
          PY

      - name: Upload transport receipt
        if: ${{ steps.transport.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-v3-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-v3-transport/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  observe:
    needs: prepare
    if: ${{ needs.prepare.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      EVIDENCE_ROOT: artifacts/prospective-hype-v3-clean
      STATE_ARTIFACT_NAME: prospective-hype-v3-clean-state
      OBSERVER_SOURCE_REVISION: 298723c52d6a3b09839d05451d3d7db9753815bf
      TARGET_CAPTURE_MS: ${{ needs.prepare.outputs.target_capture_ms }}

    steps:
      - name: Checkout observer revision
        uses: actions/checkout@v7
        with:
          ref: 298723c52d6a3b09839d05451d3d7db9753815bf
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen observer source revision
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$OBSERVER_SOURCE_REVISION"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install observer runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Enforce protected capture freshness
        if: ${{ env.TARGET_CAPTURE_MS != 'bootstrap' }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import os
          import time

          from cocomelon.research.prospective_dispatch_queue import (
              ProspectiveCaptureWindow,
              capture_window,
          )

          target_ms = int(os.environ["TARGET_CAPTURE_MS"])
          now_ms = time.time_ns() // 1_000_000
          if now_ms < target_ms:
              time.sleep((target_ms - now_ms) / 1_000)
              now_ms = time.time_ns() // 1_000_000

          window = capture_window(
              target_capture_ms=target_ms,
              now_ms=now_ms,
          )
          if window is not ProspectiveCaptureWindow.READY:
              raise SystemExit(f"V3_CAPTURE_WINDOW_{window.value.upper()}")
          print(f"capture_target_ms={target_ms}")
          print(f"capture_started_ms={now_ms}")
          PY

      - name: Restore latest clean evidence state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          artifact_id="$(
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT_NAME&per_page=100"               --jq '[.artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == "main")]
                | sort_by(.created_at)
                | last
                | .id // empty'
          )"
          if [ -n "$artifact_id" ]; then
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/prospective-hype-state.zip
            unzip -q /tmp/prospective-hype-state.zip -d "$EVIDENCE_ROOT"
            echo "restored_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          else
            echo "restored_artifact_id=none" >> "$GITHUB_OUTPUT"
          fi
        id: restore

      - name: Verify cumulative state continuity
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prospective-hype-continuity.json
          import json
          import os

          from cocomelon.research.historical_discovery_freeze import (
              HYPE_DOWN_BEARISH_NEAR_BASKET_LONG_4H_V3,
          )
          from cocomelon.research.prospective_state_continuity import (
              verify_prospective_state_continuity,
          )
          from cocomelon.util.time import utc_now_ms

          result = verify_prospective_state_continuity(
              os.environ["EVIDENCE_ROOT"],
              restored_artifact_id=os.environ["RESTORED_ARTIFACT_ID"],
              as_of_ms=utc_now_ms(),
              spec=HYPE_DOWN_BEARISH_NEAR_BASKET_LONG_4H_V3,
          )
          print(
              json.dumps(
                  result.to_dict(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Verify prospective runtime attestation
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$OBSERVER_SOURCE_REVISION"
          python - "$OBSERVER_SOURCE_REVISION" \
            > /tmp/prospective-hype-runtime.json <<'PY'
          import json
          import os
          import sys

          from cocomelon.research.historical_discovery_freeze import (
              HYPE_DOWN_BEARISH_NEAR_BASKET_LONG_4H_V3,
          )
          from cocomelon.research.prospective_context_report import (
              HYPE_PROSPECTIVE_VALIDATION_V3,
          )
          from cocomelon.research.prospective_runtime_attestation import (
              ensure_prospective_runtime_attestation,
          )
          from cocomelon.util.time import utc_now_ms

          attestation = ensure_prospective_runtime_attestation(
              os.environ["EVIDENCE_ROOT"],
              observer_source_revision=sys.argv[1],
              as_of_ms=utc_now_ms(),
              spec=HYPE_DOWN_BEARISH_NEAR_BASKET_LONG_4H_V3,
              plan=HYPE_PROSPECTIVE_VALIDATION_V3,
          )
          print(
              json.dumps(
                  attestation.to_dict(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Verify prospective control-plane attestation
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prospective-hype-control-plane.json
          import hashlib
          import json
          import os
          from pathlib import Path

          from cocomelon.research.prospective_context_evidence import (
              MAX_ENTRY_CANDLE_AGE_MS,
          )
          from cocomelon.research.prospective_context_report import (
              HYPE_PROSPECTIVE_VALIDATION_V3,
          )
          from cocomelon.util.time import utc_now_ms

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(encoding="utf-8")
          )
          expected = {
              "kind": "prospective-hype-v3-clean-control-plane",
              "candidate_spec_id": runtime["candidate_spec_id"],
              "validation_plan_id": runtime["validation_plan_id"],
              "observer_source_revision": runtime["observer_source_revision"],
              "protected_capture_minute_utc": 3,
              "capture_transport": "rolling_workflow_dispatch_queue_v3",
              "queue_depth": 4,
              "queue_horizon_ms": 14_400_000,
              "prepare_handoff_lead_ms": 600_000,
              "duplicate_policy": "lowest_covering_run_id",
              "bootstrap_event": "push",
              "capture_event": "workflow_dispatch",
              "concurrency_mode": "target_leader_election",
              "max_entry_candle_age_ms": MAX_ENTRY_CANDLE_AGE_MS,
              "state_artifact_name": os.environ["STATE_ARTIFACT_NAME"],
              "evidence_root": os.environ["EVIDENCE_ROOT"],
              "prepare_job_timeout_minutes": 270,
              "observe_job_timeout_minutes": 30,
              "execution_mode": os.environ["COCOMELON_EXECUTION_MODE"],
              "api_url": os.environ["COCOMELON_API_URL"],
              "ws_url": os.environ["COCOMELON_WS_URL"],
              "contents_permission": "read",
              "actions_permission": "write",
              "artifact_retention_days": 90,
              "schema_version": 3,
          }
          expected["control_plane_id"] = hashlib.sha256(
              canonical(expected).encode("utf-8")
          ).hexdigest()

          root = Path(os.environ["EVIDENCE_ROOT"])
          path = root / "control-plane.json"
          encoded = canonical(expected) + "\n"
          if path.exists():
              existing = json.loads(path.read_text(encoding="utf-8"))
              if existing != expected:
                  raise SystemExit("CONFLICTING_PROSPECTIVE_CONTROL_PLANE_ATTESTATION")
              if path.read_text(encoding="utf-8") != encoded:
                  raise SystemExit("NON_CANONICAL_PROSPECTIVE_CONTROL_PLANE_ATTESTATION")
          else:
              if utc_now_ms() >= HYPE_PROSPECTIVE_VALIDATION_V3.validation_start_ms:
                  raise SystemExit(
                      "POST_CUTOVER_CONTROL_PLANE_ATTESTATION_REQUIRED"
                  )
              temporary = path.with_name("control-plane.json.tmp")
              with temporary.open("x", encoding="utf-8") as handle:
                  handle.write(encoded)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temporary, path)

          print(canonical(expected))
          PY

      - name: Run prospective clean observer
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-observer --campaign v3 --root "$EVIDENCE_ROOT"             | tee /tmp/prospective-hype-cycle.json

      - name: Build current frozen validation report
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-report --campaign v3 --root "$EVIDENCE_ROOT" \
            | tee /tmp/prospective-hype-report.json

      - name: Build workflow-only campaign recoverability health
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prospective-hype-health.json
          import hashlib
          import json
          from decimal import Decimal, ROUND_CEILING
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          def remaining_block_anchors(*, as_of_ms, first_ms, last_ms, interval_ms):
              if as_of_ms < first_ms:
                  return ((last_ms - first_ms) // interval_ms) + 1
              if as_of_ms >= last_ms:
                  return 0
              first_remaining = (
                  first_ms
                  + (((as_of_ms - first_ms) // interval_ms) + 1) * interval_ms
              )
              if first_remaining > last_ms:
                  return 0
              return ((last_ms - first_remaining) // interval_ms) + 1

          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          plan = report["plan"]
          expected = int(report["expected_anchor_count"])
          expected_to_date = int(report["expected_anchor_count_to_date"])
          observed_to_date = int(report["observation_count_to_date"])
          missed_to_date = int(report["missed_anchor_count_to_date"])
          remaining_expected = expected - expected_to_date
          required_observations = int(
              (
                  Decimal(plan["min_capture_coverage"]) * Decimal(expected)
              ).to_integral_value(rounding=ROUND_CEILING)
          )
          missed_budget = expected - required_observations
          maximum_final_observations = observed_to_date + remaining_expected
          maximum_final_capture = (
              Decimal(maximum_final_observations) / Decimal(expected)
          )
          maximum_possible_settled = (
              int(report["effective_trade_count"]) + remaining_expected
          )

          block_health = []
          reasons = []
          for block in report["blocks"]:
              remaining = remaining_block_anchors(
                  as_of_ms=int(report["as_of_ms"]),
                  first_ms=int(block["first_anchor_ms"]),
                  last_ms=int(block["last_anchor_ms"]),
                  interval_ms=int(plan["anchor_interval_ms"]),
              )
              maximum = int(block["effective_trade_count"]) + remaining
              required = int(plan["min_block_trades"])
              recoverable = maximum >= required
              block_health.append(
                  {
                      "block_index": int(block["block_index"]),
                      "settled_trade_count": int(block["settled_trade_count"]),
                      "effective_trade_count": int(block["effective_trade_count"]),
                      "remaining_expected_anchors": remaining,
                      "maximum_possible_settled_trades": maximum,
                      "required_settled_trades": required,
                      "recoverable": recoverable,
                  }
              )
              if not recoverable:
                  reasons.append(
                      f"block_{block['block_index']}_minimum_trade_count_unreachable"
                  )

          if maximum_final_observations < required_observations:
              reasons.insert(0, "capture_floor_unreachable")
          if maximum_possible_settled < int(plan["min_settled_trades"]):
              reasons.append("minimum_settled_trade_count_unreachable")

          first_expected_anchor = int(report["blocks"][0]["first_anchor_ms"])
          if reasons:
              status = "irrecoverable"
          elif int(report["as_of_ms"]) < first_expected_anchor:
              status = "pre_validation"
          elif missed_to_date > 0 or int(report["overdue_unsettled_count"]) > 0:
              status = "degraded"
          else:
              status = "healthy"

          payload = {
              "validation_report_id": report["report_id"],
              "plan_id": report["plan_id"],
              "as_of_ms": int(report["as_of_ms"]),
              "status": status,
              "expected_anchor_count": expected,
              "expected_anchor_count_to_date": expected_to_date,
              "observation_count_to_date": observed_to_date,
              "remaining_expected_anchors": remaining_expected,
              "required_final_observation_count": required_observations,
              "missed_anchor_budget": missed_budget,
              "missed_anchor_count_to_date": missed_to_date,
              "remaining_missed_anchor_budget": missed_budget - missed_to_date,
              "maximum_final_observation_count": maximum_final_observations,
              "maximum_final_capture_coverage": str(maximum_final_capture),
              "effective_trade_count": int(report["effective_trade_count"]),
              "settled_trade_count": int(report["settled_trade_count"]),
              "remaining_trade_opportunities_upper_bound": remaining_expected,
              "maximum_possible_settled_trades": maximum_possible_settled,
              "required_settled_trades": int(plan["min_settled_trades"]),
              "overdue_unsettled_count": int(report["overdue_unsettled_count"]),
              "block_recoverability": block_health,
              "irrecoverable_reasons": reasons,
              "schema_version": 2,
          }
          payload["health_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          print(canonical(payload))
          PY

      - name: Build or verify canonical campaign finalization
        id: finalization
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          root = Path(os.environ["EVIDENCE_ROOT"])
          final_path = root / "finalization.json"
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          cycle = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(encoding="utf-8")
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(encoding="utf-8")
          )
          control_plane = json.loads(
              Path("/tmp/prospective-hype-control-plane.json").read_text(
                  encoding="utf-8"
              )
          )
          plan = report["plan"]
          boundary = int(plan["finalization_not_before_ms"])
          as_of_ms = int(report["as_of_ms"])

          economic_payload = {
              "evidence_digest": report["evidence_digest"],
              "validation_status": report["status"],
              "capture_coverage": report["capture_coverage"],
              "observation_count": int(report["observation_count"]),
              "raw_match_count": int(report["raw_match_count"]),
              "effective_trade_count": int(report["effective_trade_count"]),
              "occupancy_blocked_count": int(report["occupancy_blocked_count"]),
              "settled_trade_count": int(report["settled_trade_count"]),
              "overdue_unsettled_count": int(report["overdue_unsettled_count"]),
              "total_net_return": report["total_net_return"],
              "mean_net_return": report["mean_net_return"],
              "positive_net_count": int(report["positive_net_count"]),
              "non_positive_net_count": int(report["non_positive_net_count"]),
              "blocks": report["blocks"],
          }

          expected_static = {
              "kind": "prospective-hype-v3-clean-finalization",
              "candidate_spec_id": cycle["candidate_spec_id"],
              "plan_id": report["plan_id"],
              "campaign_id": cycle["campaign_id"],
              "runtime_attestation_id": runtime["attestation_id"],
              "observer_source_revision": runtime["observer_source_revision"],
              "control_plane_attestation_id": control_plane["control_plane_id"],
              "finalization_not_before_ms": boundary,
              "promotion_eligible": False,
              "schema_version": 2,
          }

          status_payload = {
              "status": "pending",
              "finalization_not_before_ms": boundary,
              "as_of_ms": as_of_ms,
              "finalization_id": None,
              "conflict_reasons": [],
          }

          if final_path.exists():
              conflicts = []
              try:
                  existing = json.loads(final_path.read_text(encoding="utf-8"))
                  if not isinstance(existing, dict):
                      raise ValueError("finalization receipt must be an object")
                  identity = {
                      key: existing[key]
                      for key in (
                          "kind",
                          "candidate_spec_id",
                          "plan_id",
                          "campaign_id",
                          "runtime_attestation_id",
                          "observer_source_revision",
                          "finalization_not_before_ms",
                          "finalized_at_ms",
                          "state_digest",
                          "economic_payload",
                          "promotion_eligible",
                          "schema_version",
                      )
                  }
                  calculated_id = hashlib.sha256(
                      canonical(identity).encode("utf-8")
                  ).hexdigest()
              except (KeyError, OSError, ValueError, json.JSONDecodeError):
                  existing = {}
                  calculated_id = None
                  conflicts.append("invalid_finalization_receipt")

              if calculated_id is not None:
                  if existing.get("finalization_id") != calculated_id:
                      conflicts.append("finalization_identity_mismatch")
                  for key, value in expected_static.items():
                      if existing.get(key) != value:
                          conflicts.append(f"{key}_mismatch")
                  if existing.get("state_digest") != cycle["state_digest"]:
                      conflicts.append("state_digest_changed_after_finalization")
                  if existing.get("economic_payload") != economic_payload:
                      conflicts.append("economic_payload_changed_after_finalization")
              if conflicts:
                  status_payload = {
                      "status": "conflict",
                      "finalization_not_before_ms": boundary,
                      "as_of_ms": as_of_ms,
                      "finalization_id": existing.get("finalization_id"),
                      "conflict_reasons": conflicts,
                  }
              else:
                  status_payload = {
                      "status": "finalized",
                      "finalization_not_before_ms": boundary,
                      "as_of_ms": as_of_ms,
                      "finalization_id": calculated_id,
                      "conflict_reasons": [],
                  }
          elif as_of_ms < boundary:
              pass
          elif int(report["overdue_unsettled_count"]) > 0:
              status_payload["status"] = "waiting_for_exact_settlements"
          elif report["status"] == "collecting":
              status_payload = {
                  "status": "conflict",
                  "finalization_not_before_ms": boundary,
                  "as_of_ms": as_of_ms,
                  "finalization_id": None,
                  "conflict_reasons": ["report_still_collecting_after_finalization_boundary"],
              }
          else:
              receipt = {
                  **expected_static,
                  "finalized_at_ms": as_of_ms,
                  "state_digest": cycle["state_digest"],
                  "economic_payload": economic_payload,
              }
              receipt["finalization_id"] = hashlib.sha256(
                  canonical(receipt).encode("utf-8")
              ).hexdigest()
              encoded = canonical(receipt) + "\n"
              temp = final_path.with_name("finalization.json.tmp")
              with temp.open("x", encoding="utf-8") as handle:
                  handle.write(encoded)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp, final_path)
              status_payload = {
                  "status": "finalized",
                  "finalization_not_before_ms": boundary,
                  "as_of_ms": as_of_ms,
                  "finalization_id": receipt["finalization_id"],
                  "conflict_reasons": [],
              }

          Path("/tmp/prospective-hype-finalization-status.json").write_text(
              canonical(status_payload) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"status={status_payload['status']}\n")
              output.write(
                  "finalized="
                  + ("true" if status_payload["status"] == "finalized" else "false")
                  + "\n"
              )
              output.write(
                  f"finalization_id={status_payload['finalization_id'] or ''}\n"
              )
          PY

