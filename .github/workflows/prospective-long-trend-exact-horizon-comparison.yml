name: Prospective Reopened LONG Trend Exact 5m vs 15m

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-long-trend-exact-horizon-comparison.yml"
      - "src/cocomelon/research/prospective_long_trend_exact_horizon_comparison.py"
      - "src/cocomelon/research/prospective_long_trend_5m_exit.py"
      - "src/cocomelon/research/prospective_long_trend_5m_exit_source.py"
      - "src/cocomelon/research/prospective_long_trend_15m_exit.py"
      - "src/cocomelon/research/prospective_long_trend_15m_exit_source.py"
      - "scripts/evaluate_prospective_long_trend_exact_horizon_comparison.py"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-reopened-long-trend-exact-horizon-comparison
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_ISSUE: "896"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact artifact-bearing paper state
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail

          run_id=""
          run_attempt=""
          resolution_mode=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            resolution_mode="manual_exact"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$EVENT_CONCLUSION" = "success" ]; then
            run_id="$EVENT_RUN_ID"
            run_attempt="$EVENT_RUN_ATTEMPT"
            resolution_mode="successful_event"
          fi

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local expected_name="continuous-paper-state-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$expected_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if not matches:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected at most one non-expired state artifact named {name}"
              )
          item = matches[0]
          digest = item.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("state artifact digest is missing or invalid")
          print(item["id"], item["name"], digest, sep="\t")
          '
          }

          artifact_line=""
          if [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]; then
            artifact_line="$(artifact_for_run "$run_id" "$run_attempt")"
          fi

          if [ -z "$artifact_line" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "manual source has no authenticated durable state artifact" >&2
              exit 1
            fi

            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=50"
            )"
            mapfile -t artifact_candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${artifact_candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              candidate_artifact_line="$(
                artifact_for_run "$candidate_run_id" "$candidate_attempt"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$candidate_run_id"
                run_attempt="$candidate_attempt"
                artifact_line="$candidate_artifact_line"
                resolution_mode="latest_successful_with_state_artifact"
                break
              fi
            done
          fi

          if [ -z "$artifact_line" ]; then
            echo "no authenticated durable paper state is available" >&2
            exit 1
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "source paper run identity is invalid" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("source run must be completed successfully")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download authenticated durable state
        id: state
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          rm -rf /tmp/long-trend-horizon-pair-artifact /tmp/long-trend-horizon-pair-state
          mkdir -p /tmp/long-trend-horizon-pair-artifact /tmp/long-trend-horizon-pair-state
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/long-trend-horizon-pair-state.zip
          actual_digest="sha256:$(sha256sum /tmp/long-trend-horizon-pair-state.zip | cut -d' ' -f1)"
          if [ "$actual_digest" != "$ARTIFACT_DIGEST" ]; then
            echo "state artifact digest mismatch" >&2
            exit 1
          fi
          unzip -q /tmp/long-trend-horizon-pair-state.zip             -d /tmp/long-trend-horizon-pair-artifact
          tar_path="$(
            find /tmp/long-trend-horizon-pair-artifact               -type f               -name continuous-paper-state.tar               -print -quit
          )"
          if [ -z "$tar_path" ]; then
            echo "durable paper state tar is missing" >&2
            exit 1
          fi
          tar -xf "$tar_path" -C /tmp/long-trend-horizon-pair-state

          for required in             prospective-full-stack-forward-markout-summary.json             prospective-long-trend-execution-shadow-source.json
          do
            test -s "/tmp/long-trend-horizon-pair-state/$required"
          done
          test -d /tmp/long-trend-horizon-pair-state/opening-opportunities/records
          test -d /tmp/long-trend-horizon-pair-state/opening-opportunity-exit-books/records
          test -d /tmp/long-trend-horizon-pair-state/replacement-funding-boundaries/records
          echo "root=/tmp/long-trend-horizon-pair-state" >> "$GITHUB_OUTPUT"

      - name: Evaluate paired exact LONG trend horizons
        id: evaluate
        shell: bash
        env:
          STATE_ROOT: ${{ steps.state.outputs.root }}
        run: |
          set -euo pipefail
          python scripts/evaluate_prospective_long_trend_exact_horizon_comparison.py \
            "$STATE_ROOT" \
            --json-out prospective-long-trend-exact-horizon-comparison.json \
            --five-minute-out prospective-long-trend-common-freeze-5m-summary.json \
            --fifteen-minute-out prospective-long-trend-common-freeze-15m-summary.json

      - name: Publish paired exact LONG trend horizons
        shell: bash
        env:
          ISSUE_NUMBER: ${{ env.EVIDENCE_ISSUE }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_RESOLUTION: ${{ steps.source.outputs.resolution_mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          comparison = json.loads(
              Path(
                  "prospective-long-trend-exact-horizon-comparison.json"
              ).read_text(encoding="utf-8")
          )
          preferred = comparison["preferred_horizon"]
          status = (
              "ROBUST 5M PREFERENCE"
              if preferred == "5m"
              else "ROBUST 15M PREFERENCE"
              if preferred == "15m"
              else "COLLECTING / NO ROBUST PREFERENCE"
          )
          lines = [
              "## Reopened LONG+trend exact 5m vs 15m comparison",
              "",
              f"**Status:** {status}",
              "",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source head SHA: `{os.environ['SOURCE_HEAD_SHA']}`",
              f"- source resolution: `{os.environ['SOURCE_RESOLUTION']}`",
              f"- source artifact: `{os.environ['SOURCE_ARTIFACT_NAME']}`",
              f"- source artifact digest: `{os.environ['SOURCE_ARTIFACT_DIGEST']}`",
              f"- common frozen validation start ms: `{comparison['common_started_at_ms']}`",
              "",
              "### Paired exact economics",
              "",
              f"- source 5m / source 15m / common source: `{comparison['five_minute_source_options']} / {comparison['fifteen_minute_source_options']} / {comparison['common_source_options']}`",
              f"- source-only 5m / source-only 15m: `{comparison['five_minute_only_source_options']} / {comparison['fifteen_minute_only_source_options']}`",
              f"- 5m incomplete reasons: `{json.dumps(comparison['five_minute_incomplete_reasons'], sort_keys=True)}`",
              f"- 15m incomplete reasons: `{json.dumps(comparison['fifteen_minute_incomplete_reasons'], sort_keys=True)}`",
              f"- exact 5m / exact 15m / paired: `{comparison['five_minute_exact_options']} / {comparison['fifteen_minute_exact_options']} / {comparison['paired_exact_options']}`",
              f"- 5m-only / 15m-only exact: `{comparison['five_minute_only_exact_options']} / {comparison['fifteen_minute_only_exact_options']}`",
              f"- markets / required: `{comparison['market_count']} / {comparison['minimum_markets']}`",
              f"- paired options / required: `{comparison['paired_exact_options']} / {comparison['minimum_paired_options']}`",
              f"- minimum sample met: `{comparison['minimum_sample_met']}`",
              f"- 5m / 15m total PnL on paired rows: `{comparison['five_minute_total_pnl_on_paired']} / {comparison['fifteen_minute_total_pnl_on_paired']}`",
              f"- total / mean delta (5m - 15m): `{comparison['total_pnl_delta_5m_minus_15m']} / {comparison['mean_pnl_delta_5m_minus_15m']}`",
              f"- size-normalized total / mean return delta: `{comparison['total_return_fraction_delta_5m_minus_15m']} / {comparison['mean_return_fraction_delta_5m_minus_15m']}`",
              f"- 5m better / 15m better / ties: `{comparison['five_minute_better_count']} / {comparison['fifteen_minute_better_count']} / {comparison['tie_count']}`",
              "",
              "### Robustness",
              "",
              f"- leave-one-trade min / max delta: `{comparison['leave_one_trade_min_delta']} / {comparison['leave_one_trade_max_delta']}`",
              f"- leave-one-market min / max delta: `{comparison['leave_one_market_min_delta']} / {comparison['leave_one_market_max_delta']}`",
              f"- chronological first / second half delta: `{comparison['chronological_first_half_delta']} / {comparison['chronological_second_half_delta']}`",
              f"- size-normalized leave-one-trade min / max: `{comparison['size_normalized_leave_one_trade_min_delta']} / {comparison['size_normalized_leave_one_trade_max_delta']}`",
              f"- size-normalized leave-one-market min / max: `{comparison['size_normalized_leave_one_market_min_delta']} / {comparison['size_normalized_leave_one_market_max_delta']}`",
              f"- size-normalized chronological first / second half: `{comparison['size_normalized_chronological_first_half_delta']} / {comparison['size_normalized_chronological_second_half_delta']}`",
              f"- 5m robustly better: `{comparison['five_minute_robustly_better']}`",
              f"- 15m robustly better: `{comparison['fifteen_minute_robustly_better']}`",
              f"- preferred horizon: `{comparison['preferred_horizon']}`",
              f"- 5m size-normalized robustly better: `{comparison['five_minute_size_normalized_robustly_better']}`",
              f"- 15m size-normalized robustly better: `{comparison['fifteen_minute_size_normalized_robustly_better']}`",
              f"- size-normalized preferred horizon: `{comparison['size_normalized_preferred_horizon']}`",
              "",
              (
                  "Only opportunities with exact execution PnL on both fixed "
                  "horizons receive paired credit. This comparison cannot "
                  "change paper behavior or authorize promotion/live execution."
              ),
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes risk limits:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/long-trend-horizon-pair-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f body="$(cat /tmp/long-trend-horizon-pair-status.md)"

      - uses: actions/upload-artifact@v7
        with:
          name: prospective-long-trend-exact-horizon-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prospective-long-trend-exact-horizon-comparison.json
            prospective-long-trend-common-freeze-5m-summary.json
            prospective-long-trend-common-freeze-15m-summary.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
