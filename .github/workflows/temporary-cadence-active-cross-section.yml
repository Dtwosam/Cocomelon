name: Temporary cadence active cross-section coverage 36694359628

on:
  push:
    branches:
      - audit/cadence-active-cross-section-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
      - name: Measure active cross-section coverage
        run: |
          python - <<'PY' | tee cadence-active-cross-section.json
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          from cocomelon.research.cadence_opportunity_audit import (
              load_cadence_outcomes,
          )
          from cocomelon.research.cadence_shadow import (
              FIFTEEN_MINUTES_MS,
              ONE_HOUR_MS,
          )
          from cocomelon.research.learning_feature_snapshots import (
              LearningFeatureSnapshotStore,
          )

          outcomes = load_cadence_outcomes(
              Path("/tmp/state/cadence-shadow-state.json")
          )
          surface = tuple(
              sorted(
                  (
                      row
                      for row in outcomes
                      if row.sample.cadence_ms == FIFTEEN_MINUTES_MS
                      and row.sample.horizon_ms == ONE_HOUR_MS
                  ),
                  key=lambda row: (
                      row.sample.boundary_ms,
                      row.sample.market.canonical,
                      row.sample.decision_id,
                  ),
              )
          )
          validation = surface[-100:]
          start = validation[0].sample.boundary_ms
          training = tuple(
              row
              for row in surface[:-100]
              if row.sample.target_end_ms < start
          )

          store = LearningFeatureSnapshotStore(
              Path("/tmp/state/learning-features")
          )
          by_asof = defaultdict(dict)
          for item in store.iter_verified():
              snapshot = item.snapshot
              by_asof[snapshot.as_of_ms][snapshot.market.canonical] = snapshot

          def summarize(rows):
              group_sizes = Counter()
              return_sizes = Counter()
              eligible_5 = 0
              eligible_10 = 0
              target_present = 0
              examples = []
              composition = Counter()
              for outcome in rows:
                  target = store.load(outcome.sample.feature_snapshot_id)
                  if target is None:
                      continue
                  feature = target.snapshot
                  group = by_asof.get(feature.as_of_ms, {})
                  size = len(group)
                  with_1h = sum(
                      item.return_1h is not None
                      for item in group.values()
                  )
                  group_sizes[size] += 1
                  return_sizes[with_1h] += 1
                  if feature.market.canonical in group:
                      target_present += 1
                  if with_1h >= 5:
                      eligible_5 += 1
                  if with_1h >= 10:
                      eligible_10 += 1
                  composition[tuple(sorted(group))] += 1
                  if len(examples) < 8:
                      examples.append(
                          {
                              "as_of_ms": feature.as_of_ms,
                              "target": feature.market.canonical,
                              "group_size": size,
                              "return_1h_count": with_1h,
                              "markets": tuple(sorted(group)),
                          }
                      )
              top_compositions = [
                  {"markets": markets, "rows": count}
                  for markets, count in composition.most_common(10)
              ]
              return {
                  "rows": len(rows),
                  "target_present_rows": target_present,
                  "group_size_counts": dict(sorted(group_sizes.items())),
                  "return_1h_count_counts": dict(
                      sorted(return_sizes.items())
                  ),
                  "at_least_5_return_rows": eligible_5,
                  "at_least_10_return_rows": eligible_10,
                  "top_compositions": top_compositions,
                  "examples": examples,
              }

          print(
              json.dumps(
                  {
                      "training": summarize(training),
                      "validation": summarize(validation),
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-active-cross-section-36694359628
          path: cadence-active-cross-section.json
          if-no-files-found: error
          retention-days: 30
