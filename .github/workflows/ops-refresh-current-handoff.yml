name: Ops Refresh Current V4 Research Handoff

on:
  push:
    branches:
      - docs/current-v4-research-handoff-20260903
    paths:
      - ".github/workflows/ops-refresh-current-handoff.yml"

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/current-v4-research-handoff-20260903
          fetch-depth: 1

      - name: Refresh authoritative status and portable handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          status_path = Path("docs/STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          status, count = re.subn(
              r"\*\*Last updated:\*\* [^\n]+",
              "**Last updated:** 2026-09-03  ",
              status,
              count=1,
          )
          if count != 1:
              raise RuntimeError("STATUS last-updated marker not found exactly once")

          progress_pattern = re.compile(
              r"The trusted dashboard state as of [^\n]+ is:\n\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*no V4 economic edge claim\*\*;\n"
              r"- \*\*live orders disabled\*\*\."
          )
          progress_replacement = """The trusted dashboard state as of 2026-09-03 00:13 UTC is:

- **9 accepted V4 cohorts**;
- **17 / 100 closed paper trades**;
- **3 / 30 closed-trade days**;
- **945 strategy decisions** in the accepted V4 corpus;
- **no V4 economic edge claim**;
- **live orders disabled**."""
          status, count = progress_pattern.subn(progress_replacement, status, count=1)
          if count != 1:
              raise RuntimeError("STATUS V4 progress block not found exactly once")

          reliability = """## Research operations reliability — 2026-09-03

The D-023 research control plane is now operational while remaining strictly **TOUCHED / NON-PROMOTIONAL**:

- the authoritative V4 interval/completeness synchronizer publishes `research-authoritative-registry` from actual trusted V4 acquisition evidence only; it now handles both current split-job acquisition artifacts and trusted legacy V4 acquisition artifacts without importing V4 economics;
- research workflows use the canonical bootstrap candidate `scheduled-research-root` when no repository override is configured;
- authority inventory parsing preserves empty GitHub run conclusions without shifting attempt metadata fields;
- `.github/workflows/research-daily-gap-dispatcher.yml` catches a missed daily research cohort after scheduled V4 completion, but refuses dispatch while any protected V4 run or research campaign is active and caps successful research acquisition to one cohort per UTC day;
- `.github/workflows/research-dashboard-catchup.yml` checks every five minutes for stale research status using Actions metadata only, dispatches the existing dashboard when trusted research state is newer, and caps catch-up to one prompt dashboard attempt per newer trusted source; the normal hourly dashboard remains the retry fallback;
- live validation on 2026-09-03 confirmed the gap dispatcher saw V4 run `33687935497` in progress and skipped research cleanly; the most recent research run `33688074006` had already failed fast at the same active-V4 guard before candidate build/capture and still finalized its audit trail;
- issue #124 currently reports `scheduled-research-root` in `draft` with zero authenticated checkpoints, so no research economic conclusion exists yet.

These reliability paths are research-side and non-economic. They do not change V4 strategy, risk, execution, curation, schedule, corpus economics, or one-shot policy.

"""
          anchor = "## Evidence dashboard\n"
          if "## Research operations reliability — 2026-09-03" not in status:
              if anchor not in status:
                  raise RuntimeError("STATUS evidence-dashboard anchor missing")
              status = status.replace(anchor, reliability + anchor, 1)

          next_anchor = (
              "8. Advance toward Phase 10 only if an authoritative untouched one-shot result "
              "reaches `CANDIDATE_EDGE` and every locked promotion criterion passes."
          )
          next_extra = """8. Advance toward Phase 10 only if an authoritative untouched one-shot result reaches `CANDIDATE_EDGE` and every locked promotion criterion passes.
9. Let `research-daily-gap-dispatcher.yml` launch at most one safe daily research cohort only when no protected V4 acquisition/research run is active; never bypass that guard to accelerate evidence.
10. Keep issue #124 and all research checkpoint outputs permanently labeled **TOUCHED / NON-PROMOTIONAL**; a promising research state may only justify a future frozen clean-validation challenger, never direct promotion."""
          if next_anchor in status and "9. Let `research-daily-gap-dispatcher.yml`" not in status:
              status = status.replace(next_anchor, next_extra, 1)
          elif "9. Let `research-daily-gap-dispatcher.yml`" not in status:
              raise RuntimeError("STATUS exact-next-action anchor missing")

          status_path.write_text(status, encoding="utf-8")

          portable = """# COCOMELON — CHATGPT PROJECT SOURCE

**Purpose:** Portable bootstrap context for continuing Cocomelon across ChatGPT chats. The live GitHub repository and authoritative repo docs always outrank this summary.

**Snapshot updated:** 2026-09-03  
**Repository:** `Dtwosam/Cocomelon`  
**Current verified `main` at snapshot:** `a2aa9456c119b1b59f3cfb5cf2a96b027e0ee2ef`  
**Venue:** Hyperliquid perpetual futures  
**Observation:** genuine public Hyperliquid mainnet  
**Execution:** paper/shadow only  
**Hyperliquid testnet:** forbidden  
**Live trading:** **DISABLED**  
**Real V4 economic edge:** **UNMEASURED**  
**Phase 10:** **BLOCKED**

---

## 1. Authority and continuation rule

For every continuation, use this order:

1. current explicit user instruction;
2. `AGENTS.md`;
3. `docs/MASTER_SPEC.md`;
4. `docs/DECISIONS.md`;
5. `docs/BUILD_ORDER.md`;
6. active plan/spec under `docs/superpowers/`;
7. `docs/STATUS.md`;
8. this portable bootstrap.

Always inspect live `main`, recent Actions runs, open PRs/review threads, and current dashboard issues before acting. Do not rebuild work already merged. Use RED -> GREEN TDD for behavior changes and verify exact-head CI before guarded merges.

The user expects autonomous engineering. Real-money activation remains a permanent exception: no live exchange order placement until objective promotion gates pass and the user explicitly authorizes live mode/capital.

---

## 2. Locked safety and economic boundaries

- Hyperliquid testnet is forbidden.
- Runtime market observations are public Hyperliquid mainnet only.
- Current/default execution is paper/shadow.
- No wallet/private-key signing, transfer, withdrawal, or private-account execution path belongs in V4/research evidence workflows.
- Strategy cannot bypass independent risk.
- No averaging down, martingale/loss-recovery sizing, or stopless positions.
- `NO_TRADE` is first-class.
- Historical L2/order flow may not be fabricated from candles.
- V4 interim economics remain hidden until the immutable one-shot protocol permits an authoritative result.
- Never manually dispatch, retry, extend, or performance-condition V4 economic acquisition.
- Research is permanently **TOUCHED / NON-PROMOTIONAL** and cannot directly produce `CANDIDATE_EDGE`, mutate `v4-mainnet-corpus`, advance Phase 10, or enable live orders.

---

## 3. Frozen V4 Phase 9 lane

Active protocol: `v4-thesis-expiry-mainnet`.

Frozen acquisition/evaluation identity:

- execution runtime `0c14c9cfa37c80babc65d050fed6d4465dcb9032`;
- replay engine `phase8-v3-thesis-expiry`;
- replay config `phase9-baseline-replay-v3-thesis-expiry`;
- execution config `phase7-v2-4h-thesis-expiry`;
- frozen evaluator `efd33f8f89bc11e51c0e4f94591b9d8d1ce5b5ff`.

Frozen acquisition contract:

