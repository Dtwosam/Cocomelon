name: Ops Refresh Current V4 Research Handoff

on:
  push:
    branches:
      - docs/current-v4-research-handoff-20260903
    paths:
      - ".github/workflows/ops-refresh-current-handoff.yml"

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/current-v4-research-handoff-20260903
          fetch-depth: 1

      - name: Refresh authoritative status and portable handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          import re

          status_path = Path("docs/STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          status, count = re.subn(
              r"\*\*Last updated:\*\* [^\n]+",
              "**Last updated:** 2026-09-03  ",
              status,
              count=1,
          )
          if count != 1:
              raise RuntimeError("STATUS last-updated marker not found exactly once")

          progress_pattern = re.compile(
              r"The trusted dashboard state as of [^\n]+ is:\n\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*[^\n]+\n"
              r"- \*\*no V4 economic edge claim\*\*;\n"
              r"- \*\*live orders disabled\*\*\."
          )
          progress_replacement = (
              "The trusted dashboard state as of 2026-09-03 00:13 UTC is:\n\n"
              "- **9 accepted V4 cohorts**;\n"
              "- **17 / 100 closed paper trades**;\n"
              "- **3 / 30 closed-trade days**;\n"
              "- **945 strategy decisions** in the accepted V4 corpus;\n"
              "- **no V4 economic edge claim**;\n"
              "- **live orders disabled**."
          )
          status, count = progress_pattern.subn(progress_replacement, status, count=1)
          if count != 1:
              raise RuntimeError("STATUS V4 progress block not found exactly once")

          reliability = (
              "## Research operations reliability — 2026-09-03\n\n"
              "The D-023 research control plane is now operational while remaining strictly **TOUCHED / NON-PROMOTIONAL**:\n\n"
              "- the authoritative V4 interval/completeness synchronizer publishes `research-authoritative-registry` from actual trusted V4 acquisition evidence only; it handles both current split-job acquisition artifacts and trusted legacy V4 acquisition artifacts without importing V4 economics;\n"
              "- research workflows use the canonical bootstrap candidate `scheduled-research-root` when no repository override is configured;\n"
              "- authority inventory parsing preserves empty GitHub run conclusions without shifting attempt metadata fields;\n"
              "- `.github/workflows/research-daily-gap-dispatcher.yml` catches a missed daily research cohort after scheduled V4 completion, refuses dispatch while any protected V4 run or research campaign is active, and caps successful research acquisition to one cohort per UTC day;\n"
              "- `.github/workflows/research-dashboard-catchup.yml` checks every five minutes for stale research status using Actions metadata only, dispatches the existing dashboard when trusted research state is newer, and caps catch-up to one prompt dashboard attempt per newer trusted source; the normal hourly dashboard remains the retry fallback;\n"
              "- live validation on 2026-09-03 confirmed the gap dispatcher saw V4 run `33687935497` in progress and skipped research cleanly; the most recent research run `33688074006` had already failed fast at the same active-V4 guard before candidate build/capture and still finalized its audit trail;\n"
              "- issue #124 currently reports `scheduled-research-root` in `draft` with zero authenticated checkpoints, so no research economic conclusion exists yet.\n\n"
              "These reliability paths are research-side and non-economic. They do not change V4 strategy, risk, execution, curation, schedule, corpus economics, or one-shot policy.\n\n"
          )
          anchor = "## Evidence dashboard\n"
          if "## Research operations reliability — 2026-09-03" not in status:
              if anchor not in status:
                  raise RuntimeError("STATUS evidence-dashboard anchor missing")
              status = status.replace(anchor, reliability + anchor, 1)

          next_anchor = (
              "8. Advance toward Phase 10 only if an authoritative untouched one-shot result "
              "reaches `CANDIDATE_EDGE` and every locked promotion criterion passes."
          )
          next_extra = (
              next_anchor
              + "\n9. Let `research-daily-gap-dispatcher.yml` launch at most one safe daily research cohort only when no protected V4 acquisition/research run is active; never bypass that guard to accelerate evidence."
              + "\n10. Keep issue #124 and all research checkpoint outputs permanently labeled **TOUCHED / NON-PROMOTIONAL**; a promising research state may only justify a future frozen clean-validation challenger, never direct promotion."
          )
          if next_anchor in status and "9. Let `research-daily-gap-dispatcher.yml`" not in status:
              status = status.replace(next_anchor, next_extra, 1)
          elif "9. Let `research-daily-gap-dispatcher.yml`" not in status:
              raise RuntimeError("STATUS exact-next-action anchor missing")
          status_path.write_text(status, encoding="utf-8")

          portable_b64 = ""
          Path("docs/CHATGPT_PROJECT_SOURCE.md").write_bytes(base64.b64decode(portable_b64))
          PY

      - name: Commit refreshed handoff docs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STATUS.md docs/CHATGPT_PROJECT_SOURCE.md
          git commit -m "docs: refresh current V4 research handoff"
          git push origin HEAD:docs/current-v4-research-handoff-20260903
