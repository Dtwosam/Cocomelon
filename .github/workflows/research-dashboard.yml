name: Cocomelon Research Dashboard Refresh

on:
  workflow_run:
    workflows:
      - "Scheduled Research Mainnet Replay Campaign"
      - "Research V4 Acquisition Authority Sync"
      - "Research Learning Evidence Sync"
      - "Continuous Paper Learning Evidence Sync"
      - "Research Autonomous Learning Cycle"
      - "Research Learning Clean State Bootstrap"
      - "Research Learning Clean State Campaign Follower"
      - "Research Learning Clean State Continuity"
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-dashboard.yml"
      - "src/cocomelon/research/dashboard.py"
      - "src/cocomelon/research_dashboard_cli.py"
      - "src/cocomelon/research/learning_dashboard.py"
      - "src/cocomelon/learning_dashboard_cli.py"
      - "src/cocomelon/research/learning_clean_review_queue.py"
      - "src/cocomelon/learning_clean_review_queue_cli.py"
      - "pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: cocomelon-research-dashboard
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  DASHBOARD_TITLE: "Cocomelon Research Dashboard"
  EVENT_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
  EVENT_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted dashboard renderer
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install research status renderer
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore latest trusted research registry
        run: |
          set -euo pipefail
          mkdir -p dashboard/registry
          printf 'false\n' > dashboard/registry-available.txt
          ARTIFACT_ROWS="$(
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-authoritative-registry&per_page=100" \
              --jq '.artifacts
                | map(select(.expired == false and .workflow_run != null))
                | sort_by(.created_at)
                | reverse
                | .[]
                | [.id, .workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha]
                | @tsv'
          )"
          ARTIFACT_ID=""
          while IFS=$'\t' read -r CANDIDATE_ARTIFACT_ID RUN_ID ARTIFACT_BRANCH ARTIFACT_HEAD_SHA; do
            if [ -z "$CANDIDATE_ARTIFACT_ID" ] || [ -z "$RUN_ID" ]; then
              continue
            fi
            if [ "$ARTIFACT_BRANCH" != "main" ]; then
              continue
            fi
            RUN_IS_TRUSTED="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '(.head_branch == "main")
                  and (.status == "completed")
                  and (
                    ((.path == ".github/workflows/research-campaign-scheduled.yml")
                      and (.conclusion == "success" or .conclusion == "failure"))
                    or ((.path == ".github/workflows/research-v4-registry-sync.yml")
                      and (.conclusion == "success"))
                    or ((.path == ".github/workflows/research-candidate-register.yml")
                      and (.conclusion == "success") and (.event == "workflow_dispatch"))
                  )
                  and (.event == "schedule" or .event == "workflow_dispatch")'
            )"
            RUN_HEAD_SHA="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '.head_sha // empty'
            )"
            if [ "$RUN_IS_TRUSTED" != "true" ] || [ "$RUN_HEAD_SHA" != "$ARTIFACT_HEAD_SHA" ]; then
              continue
            fi
            ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID"
            break
          done <<< "$ARTIFACT_ROWS"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "trusted research-authoritative-registry not published yet; publishing bootstrap dashboard without economics"
            exit 0
          fi
          /usr/bin/gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > dashboard/registry.zip
          unzip -q dashboard/registry.zip -d dashboard/registry
          REGISTRY_PATH="$(
            find dashboard/registry -type f -name research.sqlite3 -print -quit
          )"
          if [ -z "$REGISTRY_PATH" ]; then
            echo "trusted registry artifact did not contain research.sqlite3" >&2
            exit 66
          fi
          cp "$REGISTRY_PATH" dashboard/research.sqlite3
          printf 'true\n' > dashboard/registry-available.txt

      - name: Restore latest trusted continuous-learning state
        run: |
          set -euo pipefail
          mkdir -p dashboard/learning dashboard/cycle
          printf 'false\n' > dashboard/learning-available.txt
          printf 'false\n' > dashboard/cycle-available.txt

          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-learning-state&per_page=100"             > dashboard/learning-artifacts.json
          STATE_ROW="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("dashboard/learning-artifacts.json").read_text(encoding="utf-8")
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              fetched = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(fetched.stdout)
              path = run.get("path")
              trusted_events = {
                  ".github/workflows/research-learning-evidence.yml": {
                      "workflow_run",
                      "workflow_dispatch",
                  },
                  ".github/workflows/continuous-paper-learning-evidence.yml": {
                      "workflow_run",
                      "workflow_dispatch",
                  },
                  ".github/workflows/research-learning-state-continuity.yml": {
                      "schedule",
                      "workflow_dispatch",
                  },
              }.get(path)
              if (
                  trusted_events is not None
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and run.get("event") in trusted_events
                  and run.get("head_sha") == artifact["workflow_run"].get("head_sha")
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(
                      str(artifact["id"])
                      + "\t"
                      + str(run_id)
                      + "\t"
                      + str(run["run_attempt"])
                  )
                  break
          PY
          )"

          if [ -z "$STATE_ROW" ]; then
            echo "no trusted continuous-learning state published yet"
            exit 0
          fi

          IFS=$'\t' read -r STATE_ARTIFACT_ID SYNC_RUN_ID SYNC_RUN_ATTEMPT <<< "$STATE_ROW"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ARTIFACT_ID/zip"             > dashboard/learning.zip
          unzip -q dashboard/learning.zip -d dashboard/learning-unpacked

          LAST_SYNC_PATH="$(find dashboard/learning-unpacked -type f -name last-sync.json -print -quit)"
          READINESS_PATH="$(find dashboard/learning-unpacked -type f -name readiness.json -print -quit)"
          if [ -z "$LAST_SYNC_PATH" ] || [ -z "$READINESS_PATH" ]; then
            echo "trusted learning state artifact is incomplete" >&2
            exit 68
          fi
          cp "$LAST_SYNC_PATH" dashboard/learning/last-sync.json
          cp "$READINESS_PATH" dashboard/learning/readiness.json
          printf '%s\n' "$SYNC_RUN_ID" > dashboard/learning-sync-run-id.txt
          printf '%s\n' "$SYNC_RUN_ATTEMPT" > dashboard/learning-sync-run-attempt.txt
          printf 'true\n' > dashboard/learning-available.txt

          CYCLE_ARTIFACT_NAME="research-learning-cycle-${SYNC_RUN_ID}-${SYNC_RUN_ATTEMPT}"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$CYCLE_ARTIFACT_NAME&per_page=100"             > dashboard/cycle-artifacts.json
          CYCLE_ARTIFACT_ID="$(
            python - "$CYCLE_ARTIFACT_NAME" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          payload = json.loads(
              Path("dashboard/cycle-artifacts.json").read_text(encoding="utf-8")
          )
          for artifact in payload.get("artifacts", []):
              if artifact.get("name") != expected or artifact.get("expired") is not False:
                  continue
              workflow_run = artifact.get("workflow_run")
              if not isinstance(workflow_run, dict):
                  continue
              run_id = workflow_run.get("id")
              if not isinstance(run_id, int):
                  continue
              fetched = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(fetched.stdout)
              if (
                  run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and run.get("path")
                  == ".github/workflows/research-learning-cycle.yml"
              ):
                  print(artifact["id"])
                  break
          PY
          )"
          if [ -n "$CYCLE_ARTIFACT_ID" ]; then
            /usr/bin/gh api               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CYCLE_ARTIFACT_ID/zip"               > dashboard/cycle.zip
            unzip -q dashboard/cycle.zip -d dashboard/cycle-unpacked
            CYCLE_PATH="$(find dashboard/cycle-unpacked -type f -name cycle.json -print -quit)"
            if [ -z "$CYCLE_PATH" ]; then
              echo "trusted learning cycle artifact is incomplete" >&2
              exit 69
            fi
            CYCLE_ROOT="$(dirname "$CYCLE_PATH")"
            cp -a "$CYCLE_ROOT"/. dashboard/cycle/
            printf 'true\n' > dashboard/cycle-available.txt
          fi

      - name: Restore latest trusted learned clean-state lineages
        run: |
          set -euo pipefail
          mkdir -p dashboard/clean-lineages
          printf 'false\n' > dashboard/clean-available.txt
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          fetched = subprocess.run(
              [
                  "/usr/bin/gh",
                  "api",
                  "--paginate",
                  "--slurp",
                  f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?per_page=100",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          pages = json.loads(fetched.stdout)
          artifacts = []
          for page in pages:
              artifacts.extend(page.get("artifacts", []))

          pattern = re.compile(
              r"^research-learning-clean-state-[1-9][0-9]*-[1-9][0-9]*$"
          )
          trusted = {
              ".github/workflows/research-learning-clean-state-bootstrap.yml": {
                  "name": "Research Learning Clean State Bootstrap",
                  "events": {"workflow_run", "workflow_dispatch"},
              },
              ".github/workflows/research-learning-clean-state-sync.yml": {
                  "name": "Research Learning Clean State Campaign Follower",
                  "events": {"workflow_run", "workflow_dispatch"},
              },
              ".github/workflows/research-learning-clean-state-continuity.yml": {
                  "name": "Research Learning Clean State Continuity",
                  "events": {"schedule", "workflow_dispatch"},
              },
          }
          candidates = sorted(
              (
                  item
                  for item in artifacts
                  if item.get("expired") is False
                  and isinstance(item.get("name"), str)
                  and pattern.fullmatch(item["name"])
                  and isinstance(item.get("workflow_run"), dict)
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          selected = {}
          for artifact in candidates:
              name = artifact["name"]
              if name in selected:
                  continue
              workflow_run = artifact["workflow_run"]
              run_id = workflow_run.get("id")
              if not isinstance(run_id, int):
                  continue
              run_result = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(run_result.stdout)
              contract = trusted.get(run.get("path"))
              if contract is None:
                  continue
              if (
                  run.get("name") != contract["name"]
                  or run.get("event") not in contract["events"]
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
                  or run.get("head_branch") != "main"
                  or run.get("head_sha") != workflow_run.get("head_sha")
                  or (run.get("head_repository") or {}).get("full_name")
                  != os.environ["GITHUB_REPOSITORY"]
              ):
                  continue
              digest = artifact.get("digest")
              if not isinstance(digest, str) or not digest.startswith("sha256:"):
                  raise SystemExit("trusted clean-state artifact digest is missing")
              selected[name] = artifact

          root = Path("dashboard/clean-lineages")
          for name, artifact in sorted(selected.items()):
              zip_path = Path("/tmp") / f"{name}.zip"
              with zip_path.open("wb") as handle:
                  subprocess.run(
                      [
                          "/usr/bin/gh",
                          "api",
                          f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact['id']}/zip",
                      ],
                      check=True,
                      stdout=handle,
                  )
              destination = root / name
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(zip_path) as archive:
                  archive.extractall(destination)

          if selected:
              Path("dashboard/clean-available.txt").write_text(
                  "true\n",
                  encoding="utf-8",
              )
          PY

      - name: Render learned clean candidate review queue
        run: |
          set -euo pipefail
          if [ "$(cat dashboard/clean-available.txt)" = "true" ]; then
            ARGS=()
            while IFS= read -r ROOT; do
              ARGS+=(--state-root "$ROOT")
            done < <(
              find dashboard/clean-lineages -mindepth 1 -maxdepth 1 \
                -type d -print | sort
            )
            cocomelon-learning-clean-review-queue \
              "${ARGS[@]}" \
              --format markdown \
              > dashboard/clean-review.md
          else
            cat > dashboard/clean-review.md <<'EOF'
          ## Learned Clean Candidate Review Queue

          **RESEARCH ONLY / HUMAN REVIEW REQUIRED / NO EXECUTION**

          No authenticated learned clean-validation lineage has been published yet.

          Terminal review eligibility will appear here only after a frozen candidate completes its precommitted clean paper-validation sample.
          EOF
          fi

      - name: Render continuous learning operations status
        run: |
          set -euo pipefail
          if [ "$(cat dashboard/learning-available.txt)" = "true" ]; then
            ARGS=(
              --state-root dashboard/learning
              --format markdown
            )
            if [ "$(cat dashboard/cycle-available.txt)" = "true" ]; then
              ARGS+=(--cycle-root dashboard/cycle)
            fi
            cocomelon-learning-ops-status "${ARGS[@]}"               > dashboard/learning-status.md
          else
            cat > dashboard/learning-status.md <<'EOF'
          ## Continuous Learning Operations

          **RESEARCH ONLY / NO EXECUTION**

          No authenticated post-activation continuous-learning state has been published yet.

          The system is waiting for a successful research campaign produced with authenticated decision-time feature capture. Pre-activation evidence is not backfilled.
          EOF
          fi

      - name: Render authenticated research status
        run: |
          set -euo pipefail
          if [ "$(cat dashboard/registry-available.txt)" = "true" ]; then
            cocomelon-research-status \
              --registry dashboard/research.sqlite3 \
              --format markdown \
              > dashboard/status.md
            grep -Fq "TOUCHED / NON-PROMOTIONAL" dashboard/status.md
          else
            cat > dashboard/status.md <<'EOF'
          # Research Status

          **TOUCHED / NON-PROMOTIONAL**

          No trusted research registry has been published yet.

          Research economics are unavailable until the first provenance-validated authority sync or research campaign publishes `research-authoritative-registry`.
          EOF
          fi

      - name: Build dashboard issue body
        run: |
          set -euo pipefail
          UPDATED_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            printf '# Cocomelon Research Dashboard\n\n'
            printf '> Auto-refreshed from the latest provenance-validated research state. Last updated **%s**.\n\n' "$UPDATED_AT"
            cat dashboard/status.md
            printf '\n\n'
            cat dashboard/learning-status.md
            printf '\n\n'
            cat dashboard/clean-review.md
            printf '\n---\n\n'
            printf 'This dashboard is **TOUCHED / NON-PROMOTIONAL** research evidence only. '
            printf 'It cannot establish verified edge, advance Phase 10, mutate the frozen V4 corpus, or enable live orders.\n'
          } > dashboard/body.md

      - name: Create or update one research dashboard issue
        run: |
          set -euo pipefail
          ISSUE_NUMBERS_TEXT="$(
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
              --paginate \
              --jq ".[] | select((has(\"pull_request\") | not) and .title == \"$DASHBOARD_TITLE\") | .number"
          )"
          ISSUE_NUMBERS=()
          if [ -n "$ISSUE_NUMBERS_TEXT" ]; then
            while IFS= read -r ISSUE_NUMBER; do
              if [ -n "$ISSUE_NUMBER" ]; then
                ISSUE_NUMBERS+=("$ISSUE_NUMBER")
              fi
            done <<< "$ISSUE_NUMBERS_TEXT"
          fi
          if [ "${#ISSUE_NUMBERS[@]}" -gt 1 ]; then
            echo "multiple matching research dashboard issues found" >&2
            exit 67
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = Path("dashboard/body.md").read_text(encoding="utf-8")
          title = os.environ["DASHBOARD_TITLE"]
          Path("dashboard/create-issue.json").write_text(
              json.dumps({"title": title, "body": body}),
              encoding="utf-8",
          )
          Path("dashboard/update-issue.json").write_text(
              json.dumps({"title": title, "body": body, "state": "open"}),
              encoding="utf-8",
          )
          PY
          if [ "${#ISSUE_NUMBERS[@]}" -eq 0 ]; then
            /usr/bin/gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues" \
              --input dashboard/create-issue.json \
              > dashboard/issue-result.json
          else
            /usr/bin/gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/${ISSUE_NUMBERS[0]}" \
              --input dashboard/update-issue.json \
              > dashboard/issue-result.json
          fi
