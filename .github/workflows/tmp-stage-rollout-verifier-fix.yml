name: Temporary Stage Rollout Verifier Fix

on:
  push:
    branches:
      - fix/research-rollout-verifier-before-publish-20260914
    paths:
      - .github/workflows/tmp-stage-rollout-verifier-fix.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build staged workflow
        run: python scripts/tmp_stage_rollout_verifier_fix.py
      - name: Commit staged workflow bytes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/research-campaign-scheduled.yml
          git commit -m "chore: stage rollout verifier workflow bytes"
          git push
