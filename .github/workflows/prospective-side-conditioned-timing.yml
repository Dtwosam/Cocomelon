name: Prospective Side-Conditioned Timing Audit

on:
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types:
      - completed
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed continuous-paper run ID
        required: true
        type: string
      source_run_attempt:
        description: Completed continuous-paper run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-side-conditioned-timing
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIMING_SHA: 31c73c809b2c6cce2d189c87715d4f9d7c18c290
      TIMING_ISSUE: "682"
    steps:
      - name: Resolve source paper run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          source_run_id=""
          source_run_attempt=""
          resolution_mode=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            source_run_id="$INPUT_SOURCE_RUN_ID"
            source_run_attempt="$INPUT_SOURCE_RUN_ATTEMPT"
            resolution_mode="manual_exact"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$EVENT_SOURCE_CONCLUSION" == "success" ]]; then
            source_run_id="$EVENT_SOURCE_RUN_ID"
            source_run_attempt="$EVENT_SOURCE_RUN_ATTEMPT"
            resolution_mode="successful_event"
          else
            latest_success="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GITHUB_REPOSITORY/actions/runs?status=success&per_page=100" |
              jq -r '
                .workflow_runs
                | map(
                    select(
                      .path == ".github/workflows/continuous-paper.yml"
                      and .conclusion == "success"
                    )
                  )
                | sort_by(.updated_at)
                | reverse
                | .[0]
                | if . == null then "" else "\(.id) \(.run_attempt)" end
              '
            )"
            if [[ -n "$latest_success" ]]; then
              read -r source_run_id source_run_attempt <<<"$latest_success"
            fi
            resolution_mode="latest_success_catchup"
          fi

          if [[ -z "$source_run_id" || -z "$source_run_attempt" ]]; then
            echo "No successful continuous-paper source run is available." >&2
            exit 1
          fi

          echo "SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ATTEMPT=$source_run_attempt" >> "$GITHUB_ENV"
          echo "SOURCE_RESOLUTION_MODE=$resolution_mode" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TIMING_SHA }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Resolve compact timing artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100"
          )"
          artifact_name="continuous-paper-side-conditioned-timing-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          artifact_id="$(
            jq -r \
              --arg name "$artifact_name" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' \
              <<<"$artifacts_json" |
            head -n 1
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Publish blocked timing status
        if: ${{ steps.artifact.outputs.ready != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/timing-status.md
          import os

          print("## Frozen prospective side-conditioned entry-timing challenger")
          print()
          print("**Status:** blocked — compact timing artifact unavailable")
          print()
          print(f"- source paper run: `{os.environ['SOURCE_RUN_ID']}`")
          print(
              f"- source run attempt: "
              f"`{os.environ['SOURCE_RUN_ATTEMPT']}`"
          )
          print(
              f"- source resolution: "
              f"`{os.environ['SOURCE_RESOLUTION_MODE']}`"
          )
          print(f"- frozen evaluator SHA: `{os.environ['TIMING_SHA']}`")
          print("- candidate: `long-120s-short-60s-v1`")
          print("- execution authority: `false`")
          print("- promotion authority: `false`")
          print()
          print(
              "No prospective timing claim is made until the compact "
              "journal / 60s / 120s / candidate-state artifact is available."
          )
          print()
          print("**LIVE TRADING: DISABLED.**")
          PY
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$TIMING_ISSUE" \
            -f body="$(cat /tmp/timing-status.md)"

      - name: Download compact timing state
        if: ${{ steps.artifact.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/timing-artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/timing.zip
          unzip -q /tmp/timing.zip -d /tmp/timing-artifact

          candidate_path="$(
            find /tmp/timing-artifact \
              -type f \
              -name prospective-side-conditioned-delay-state.json \
              -print -quit
          )"
          test -n "$candidate_path"
          state_root="$(dirname "$candidate_path")"
          test -s "$state_root/journal.sqlite3"
          test -s "$state_root/delayed-entry-execution-shadow-state.json"
          test -s "$state_root/delayed-entry-120s-execution-shadow-state.json"
          echo "TIMING_STATE_ROOT=$state_root" >> "$GITHUB_ENV"

      - name: Evaluate frozen timing challenger
        if: ${{ steps.artifact.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_prospective_side_conditioned_delay.py \
            "$TIMING_STATE_ROOT" \
            --json-out prospective-side-conditioned-timing.json \
            > /tmp/prospective-side-conditioned-timing.stdout.json
          cmp \
            prospective-side-conditioned-timing.json \
            /tmp/prospective-side-conditioned-timing.stdout.json

      - name: Publish prospective timing evidence
        if: ${{ steps.artifact.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/timing-status.md
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          r = json.loads(
              Path("prospective-side-conditioned-timing.json").read_text(
                  encoding="utf-8"
              )
          )
          ready = bool(r["readiness"]["ready_for_review"])
          status = "ready for research review" if ready else "collecting"
          start = datetime.fromtimestamp(
              int(r["started_at_ms"]) / 1000,
              tz=UTC,
          ).isoformat()
          overall = r["overall"]
          long_row = r["by_side"]["long"]
          short_row = r["by_side"]["short"]
          readiness = r["readiness"]
          temporal = r["robustness"]["temporal"]
          market = r["robustness"]["market"]

          print("## Frozen prospective side-conditioned entry-timing challenger")
          print()
          print(f"**Status:** {status}")
          print()
          print(f"- source paper run: `{os.environ['SOURCE_RUN_ID']}`")
          print(f"- source run attempt: `{os.environ['SOURCE_RUN_ATTEMPT']}`")
          print(f"- source resolution: `{os.environ['SOURCE_RESOLUTION_MODE']}`")
          print(f"- frozen evaluator SHA: `{os.environ['TIMING_SHA']}`")
          print(f"- candidate: `{r['candidate_id']}`")
          print(f"- prospective start: `{start}`")
          print(
              f"- prospective closed trades: "
              f"`{r['prospective_closed_trades']} / "
              f"{readiness['min_prospective_closed_trades']}`"
          )
          print(
              f"- paired evaluable trades: "
              f"`{r['paired_evaluable_trades']} / "
              f"{readiness['min_paired_evaluable_trades']}`"
          )
          print(
              f"- selected net PnL / delta vs actual / delta vs always-60s: "
              f"`{overall['selected_net_pnl']} / "
              f"{overall['selected_minus_actual_pnl']} / "
              f"{overall['selected_minus_60s_pnl']}`"
          )
          print(
              f"- mean selected PnL / fill fraction: "
              f"`{overall['mean_selected_pnl']} / "
              f"{overall['mean_selected_fill_fraction']}`"
          )
          print(
              f"- integrity clean / ready for review: "
              f"`{str(readiness['integrity_clean']).lower()} / "
              f"{str(ready).lower()}`"
          )
          print()
          print("### Direction")
          print()
          print(
              f"- LONG: trades=`{long_row['trades']}` "
              f"selected=`{long_row['selected_net_pnl']}` "
              f"vs_actual=`{long_row['selected_minus_actual_pnl']}` "
              f"vs_60s=`{long_row['selected_minus_60s_pnl']}`"
          )
          print(
              f"- SHORT: trades=`{short_row['trades']}` "
              f"selected=`{short_row['selected_net_pnl']}` "
              f"vs_actual=`{short_row['selected_minus_actual_pnl']}` "
              f"vs_60s=`{short_row['selected_minus_60s_pnl']}`"
          )
          print()
          print("### Integrity")
          print()
          print(
              f"- missing 60s / 120s outcomes: "
              f"`{r['missing_60s_outcomes']} / "
              f"{r['missing_120s_outcomes']}`"
          )
          print(
              f"- non-evaluable 60s / 120s: "
              f"`{r['non_evaluable_60s']} / "
              f"{r['non_evaluable_120s']}`"
          )
          print(
              f"- lineage mismatches: `{r['lineage_mismatches']}`"
          )
          print()
          print("### Descriptive robustness")
          print()
          print(
              f"- full chronological blocks: "
              f"`{temporal['full_blocks']} / "
              f"{temporal['configured_blocks']}`"
          )
          print(
              f"- positive full blocks vs actual / always-60s: "
              f"`{temporal['positive_full_blocks_vs_actual']} / "
              f"{temporal['positive_full_blocks_vs_60s']}`"
          )
          print(
              f"- positive vs always-60s after removing any one market: "
              f"`{str(market['positive_vs_60s_after_any_single_market_removed']).lower()}`"
          )
          print()
          print(
              "Robustness is descriptive only and cannot bypass the frozen "
              "prospective evidence gate."
          )
          print()
          print("**No paper orders are changed by this audit.**")
          print()
          print("**LIVE TRADING: DISABLED.**")
          PY

          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$TIMING_ISSUE" \
            -f body="$(cat /tmp/timing-status.md)"

      - name: Summarize timing evidence
        if: ${{ steps.artifact.outputs.ready == 'true' }}
        shell: bash
        run: |
          cat /tmp/timing-status.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.artifact.outputs.ready == 'true' }}
        with:
          name: prospective-side-conditioned-timing-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: prospective-side-conditioned-timing.json
          if-no-files-found: error
          retention-days: 90
