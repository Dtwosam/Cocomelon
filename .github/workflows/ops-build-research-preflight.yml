name: One-shot Research Preflight Blob Builder

on:
  push:
    branches:
      - ops/build-research-preflight-20260902
    paths:
      - .github/workflows/ops-build-research-preflight.yml

permissions:
  contents: write

jobs:
  build-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/research-preflight-v4-active-20260902
      TARGET_FILE: .github/workflows/research-campaign-scheduled.yml
    steps:
      - name: Build exact research workflow blob with V4 preflight
        run: |
          set -euo pipefail
          META="$(
            /usr/bin/gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/contents/$TARGET_FILE" \
              -f ref="$TARGET_BRANCH"
          )"
          jq -r '.content' <<< "$META" | tr -d '\n' | base64 -d > /tmp/workflow.yml

          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/workflow.yml")
          source = path.read_text(encoding="utf-8")
          anchor = "      - name: Upload prepared research control state\n"
          if source.count(anchor) != 1:
              raise RuntimeError("prepared-state upload anchor must occur exactly once")

          token_expression = "$" + "{{ github.token }}"
          lines = [
              "      - name: Refuse research capture while V4 acquisition is active",
              "        env:",
              f"          GH_TOKEN: {token_expression}",
              "        run: |",
              "          set -euo pipefail",
              "          ACTIVE_ROWS=\"$(",
              "            /usr/bin/gh api --paginate \\",
              "              \"/repos/$GITHUB_REPOSITORY/actions/workflows/evidence-campaign-v4-scheduled.yml/runs?per_page=100\" \\",
              "              --jq '.workflow_runs[]",
              "                | select(.head_branch == \"main\")",
              "                | select(.event == \"schedule\" or .event == \"workflow_dispatch\")",
              "                | select(.status != \"completed\")",
              "                | [.id, .status, .event]",
              "                | @tsv'",
              "          )\"",
              "          if [ -n \"$ACTIVE_ROWS\" ]; then",
              "            printf '%s\\n' \"$ACTIVE_ROWS\" \\",
              "              > research-campaign/diagnostics/v4-active-run.txt",
              "            echo \"protected V4 acquisition is active; refusing research capture\" >&2",
              "            while IFS=$'\\t' read -r RUN_ID RUN_STATUS RUN_EVENT; do",
              "              printf 'V4 run %s is %s (%s)\\n' \"$RUN_ID\" \"$RUN_STATUS\" \"$RUN_EVENT\" >&2",
              "            done <<< \"$ACTIVE_ROWS\"",
              "            exit 76",
              "          fi",
              "          printf '%s\\n' 'none' \\",
              "            > research-campaign/diagnostics/v4-active-run.txt",
          ]
          preflight = "\n".join(lines) + "\n\n"
          path.write_text(source.replace(anchor, preflight + anchor, 1), encoding="utf-8")
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          with Path("/tmp/blob.json").open("w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "content": Path("/tmp/workflow.yml").read_text(encoding="utf-8"),
                      "encoding": "utf-8",
                  },
                  handle,
              )
          PY
          BLOB_SHA="$(
            /usr/bin/gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/git/blobs" \
              --input /tmp/blob.json \
              --jq '.sha'
          )"
          printf 'TARGET_BLOB_SHA=%s\n' "$BLOB_SHA"
