name: One-shot Research Preflight Test Blob Builder

on:
  push:
    branches:
      - ops/build-research-preflight-20260902
    paths:
      - .github/workflows/ops-build-research-preflight.yml

permissions:
  contents: write

jobs:
  build-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/research-preflight-v4-active-20260902
      TARGET_FILE: tests/test_research_runner_workflow.py
    steps:
      - name: Build exact hardening-test blob for trusted preflight token
        run: |
          set -euo pipefail
          META="$(
            /usr/bin/gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/contents/$TARGET_FILE" \
              -f ref="$TARGET_BRANCH"
          )"
          jq -r '.content' <<< "$META" | tr -d '\n' | base64 -d > /tmp/target.py

          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/target.py")
          source = path.read_text(encoding="utf-8")
          old = '    assert source.count("GH_TOKEN: ${{ github.token }}") == 5\n'
          new = (
              '    assert source.count("GH_TOKEN: ${{ github.token }}") == 6\n'
              '    assert prepare.count("GH_TOKEN: ${{ github.token }}") == 2\n'
          )
          if source.count(old) != 1:
              raise RuntimeError("trusted-token count assertion must occur exactly once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          with Path("/tmp/blob.json").open("w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "content": Path("/tmp/target.py").read_text(encoding="utf-8"),
                      "encoding": "utf-8",
                  },
                  handle,
              )
          PY
          BLOB_SHA="$(
            /usr/bin/gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/git/blobs" \
              --input /tmp/blob.json \
              --jq '.sha'
          )"
          printf 'TARGET_BLOB_SHA=%s\n' "$BLOB_SHA"
