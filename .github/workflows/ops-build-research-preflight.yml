name: One-shot Research Separation Test Blob Builder

on:
  push:
    branches:
      - ops/build-research-preflight-20260902
    paths:
      - .github/workflows/ops-build-research-preflight.yml

permissions:
  contents: write

jobs:
  build-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/research-preflight-v4-active-20260902
      TARGET_FILE: tests/test_research_runner_workflow.py
    steps:
      - name: Scope the one allowed V4 workflow reference to preflight
        run: |
          set -euo pipefail
          META="$(
            /usr/bin/gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/contents/$TARGET_FILE" \
              -f ref="$TARGET_BRANCH"
          )"
          jq -r '.content' <<< "$META" | tr -d '\n' | base64 -d > /tmp/target.py

          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/target.py")
          source = path.read_text(encoding="utf-8")
          old = '''    for forbidden in (
        "evidence-campaign-v4-scheduled",
        "v4-mainnet-corpus",
'''
          new = '''    for forbidden in (
        "v4-mainnet-corpus",
'''
          if source.count(old) != 1:
              raise RuntimeError("V4 separation forbidden tuple must occur exactly once")
          source = source.replace(old, new, 1)

          anchor = '''    for forbidden in (
        "v4-mainnet-corpus",
        "evidence_corpus_curator",
        "phase9_v4_one_shot",
        "candidate_edge",
        "private_key",
        "wallet",
        "withdraw",
        "transfer",
        "send_order",
        "live_order",
    ):
        assert forbidden not in lowered
'''
          addition = '''    assert lowered.count("evidence-campaign-v4-scheduled") == 1
    preflight = source.split(
        "- name: Refuse research capture while V4 acquisition is active",
        1,
    )[1].split("- name: Upload prepared research control state", 1)[0]
    assert "evidence-campaign-v4-scheduled.yml/runs?per_page=100" in preflight
'''
          if source.count(anchor) != 1:
              raise RuntimeError("V4 separation assertion block must occur exactly once")
          source = source.replace(anchor, anchor + addition, 1)
          path.write_text(source, encoding="utf-8")
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          with Path("/tmp/blob.json").open("w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "content": Path("/tmp/target.py").read_text(encoding="utf-8"),
                      "encoding": "utf-8",
                  },
                  handle,
              )
          PY
          BLOB_SHA="$(
            /usr/bin/gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/git/blobs" \
              --input /tmp/blob.json \
              --jq '.sha'
          )"
          printf 'TARGET_BLOB_SHA=%s\n' "$BLOB_SHA"
