name: Independent Fresh v2 Trend Paired Source Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-fresh-trend-v2-source-audit.yml"
      # Auditor/verifier repairs must refresh a previously unverified exact
      # source immediately instead of waiting for the 3-hour schedule.
      - "scripts/audit_both_side_trend_paired_handoff.py"
      - "scripts/audit_fresh_trend_v2_selected_anchor.py"
      - "scripts/audit_fresh_trend_v2_forward_outcome.py"
  schedule:
    - cron: "27 */3 * * *"
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact original paper worker with v2 artifact
        required: true
        type: string
      source_attempt:
        description: Exact source attempt
        default: "1"
        required: true
        type: string
      anchor_run_id:
        description: Optional manually pinned original v2 comparison anchor worker
        required: false
        type: string
      anchor_attempt:
        description: Optional manually pinned v2 anchor attempt
        default: "1"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: independent-v2-source-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      SOURCE_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_attempt || github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install independent verifier
        run: python -m pip install -e .

      # A scheduled search checks a completed original paper worker. It
      # cannot certify all previous workers, and never elects a new genesis.
      - name: Find latest completed source with exact new v2 artifact
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          mkdir -p /tmp/fresh-trend-v2-audit
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?status=completed&branch=main&per_page=100" > /tmp/fresh-trend-v2-audit/completed.json
          chosen=""
          attempt=""
          while read -r run_id run_attempt; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/fresh-trend-v2-audit/latest-artifacts.json
            name="continuous-paper-both-side-trend-paired-shadow-v2-$run_id-$run_attempt"
            if jq -e --arg name "$name" '
              [.artifacts[] | select(.name == $name and .expired == false)]
              | length == 1
            ' /tmp/fresh-trend-v2-audit/latest-artifacts.json > /dev/null; then
              chosen="$run_id"
              attempt="$run_attempt"
              break
            fi
          done < <(
            jq -r '
              .workflow_runs[]
              | select(.status == "completed" and .head_branch == "main"
                and .event == "workflow_dispatch"
                and .path == ".github/workflows/continuous-paper.yml"
                and .run_started_at >= "2026-10-14T00:00:00Z")
              | "\(.id) \(.run_attempt)"
            ' /tmp/fresh-trend-v2-audit/completed.json
          )
          if [ -z "$chosen" ]; then
            echo "SOURCE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "No completed paper worker with exact frozen v2 ZIP. V2 review NOT VERIFIED." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'SOURCE_RUN_ID=%s\nSOURCE_ATTEMPT=%s\n' "$chosen" "$attempt" >> "$GITHUB_ENV"

      - name: Fetch same-attempt original GitHub evidence
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          mkdir -p /tmp/fresh-trend-v2-audit
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/fresh-trend-v2-audit/run.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > /tmp/fresh-trend-v2-audit/jobs.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/fresh-trend-v2-audit/artifacts.json

      - name: Download exact independently published v2 ZIP
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          name="continuous-paper-both-side-trend-paired-shadow-v2-$SOURCE_RUN_ID-$SOURCE_ATTEMPT"
          artifact_id="$(jq -r --arg name "$name" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].id else empty end
          ' /tmp/fresh-trend-v2-audit/artifacts.json)"
          if [ -z "$artifact_id" ]; then
            echo "::warning::Exact v2 archive missing; receipt must fail closed"
            exit 0
          fi
          if ! curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-max-time 240 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output /tmp/fresh-trend-v2-audit/source.zip; then
            rm -f /tmp/fresh-trend-v2-audit/source.zip
            echo "::warning::Independent source ZIP unavailable; do not award evidence"
          fi

      - name: Independently authenticate frozen v2 source and reconcile accounts
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_both_side_trend_paired_handoff \
            --campaign v2 \
            --run-json /tmp/fresh-trend-v2-audit/run.json \
            --jobs-json /tmp/fresh-trend-v2-audit/jobs.json \
            --artifacts-json /tmp/fresh-trend-v2-audit/artifacts.json \
            --artifact-zip /tmp/fresh-trend-v2-audit/source.zip \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-attempt "$SOURCE_ATTEMPT" \
            --output fresh-trend-v2-source-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("fresh-trend-v2-source-audit.json").read_text())
          print("## Independent v2 paired research source (NOT a profit certificate)")
          print("- source class:", r.get("source_class"))
          print("- source status:", r.get("status"))
          print("- failures:", r.get("reasons"))
          print("- outer SHA256:", r.get("archive_sha256"))
          print("- frozen candidate identity:", r.get("expected_candidate_id"))
          print("- v2 terminal parity receipt:", r.get("source_v2_terminal_receipt_verified"))
          print("- immutable v2 original paper-account genesis:", r.get("v2_write_once_genesis_verified"))
          print("- originating GitHub run:", r.get("v2_genesis_source_run_id"))
          print("- this source is the originating GitHub worker:", r.get("v2_genesis_original_worker_authenticated"))
          print("- independent paper fills/fees/funding:", r.get("archived_execution_economics_reconciled"))
          print("- matched terminal mark arithmetic:", r.get("archived_terminal_mark_arithmetic_reconciled"))
          print("- source gaps:", r.get("source_scoped_open_gap_diagnostics"))
          print("- independent venue feed authentication: FALSE")
          print("- cross-worker v2 anchor / 72h after-cost edge: UNVERIFIED / UNVERIFIED")
          print("- promotion / live orders: FALSE / FALSE")
          PY

      # Select an observed source from bounded history; this is NEVER
      # certified as the first v2 worker. Later pinning the actual initial
      # source requires separately authenticated origin metadata.
      - name: Select independently checkable v2 source anchor
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        env:
          PINNED_ANCHOR_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.anchor_run_id || '' }}
          PINNED_ANCHOR_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.anchor_attempt || '1' }}
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          mkdir -p /tmp/fresh-trend-v2-audit
          selected="${PINNED_ANCHOR_RUN:-}"
          selected_attempt="${PINNED_ANCHOR_ATTEMPT:-1}"
          if [ -z "$selected" ]; then
            gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?status=completed&branch=main&per_page=100" > /tmp/fresh-trend-v2-audit/anchor-candidates.json
            while read -r possible attempt; do
              [[ "$possible" =~ ^[1-9][0-9]*$ && "$attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
              gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$possible/artifacts?per_page=100" > /tmp/fresh-trend-v2-audit/prospective-anchor-artifacts.json
              name="continuous-paper-both-side-trend-paired-shadow-v2-$possible-$attempt"
              if jq -e --arg name "$name" '
                [.artifacts[] | select(.name == $name and .expired == false)]
                | length == 1
              ' /tmp/fresh-trend-v2-audit/prospective-anchor-artifacts.json > /dev/null; then
                selected="$possible"
                selected_attempt="$attempt"
                break
              fi
            done < <(
              jq -r '
                [.workflow_runs[]
                | select(.status == "completed" and .head_branch == "main"
                  and .event == "workflow_dispatch"
                  and .path == ".github/workflows/continuous-paper.yml"
                  and .run_started_at >= "2026-10-14T00:00:00Z")]
                | sort_by(.id) | .[:32][]
                | "\(.id) \(.run_attempt)"
              ' /tmp/fresh-trend-v2-audit/anchor-candidates.json
            )
          fi
          if [ -z "$selected" ]; then
            echo "ANCHOR_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "No selected v2 anchor in bounded source history. Cross-worker evidence UNVERIFIED." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$selected" =~ ^[1-9][0-9]*$ && "$selected_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          if [ "$selected" -gt "$SOURCE_RUN_ID" ]; then
            echo "ANCHOR_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Selected anchor after current worker. No lineage credit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'ANCHOR_RUN_ID=%s\nANCHOR_ATTEMPT=%s\n' "$selected" "$selected_attempt" >> "$GITHUB_ENV"

      - name: Download independently bound selected v2 anchor
        if: ${{ env.SOURCE_AVAILABLE != 'false' && env.ANCHOR_AVAILABLE != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$ANCHOR_RUN_ID" > /tmp/fresh-trend-v2-audit/anchor-run.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$ANCHOR_RUN_ID/jobs?per_page=100" > /tmp/fresh-trend-v2-audit/anchor-jobs.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$ANCHOR_RUN_ID/artifacts?per_page=100" > /tmp/fresh-trend-v2-audit/anchor-artifacts.json
          name="continuous-paper-both-side-trend-paired-shadow-v2-$ANCHOR_RUN_ID-$ANCHOR_ATTEMPT"
          artifact_id="$(jq -r --arg name "$name" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].id else empty end
          ' /tmp/fresh-trend-v2-audit/anchor-artifacts.json)"
          if [ -z "$artifact_id" ]; then
            echo "::warning::No original selected anchor ZIP; continuity must fail closed"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/fresh-trend-v2-audit/anchor.zip

      - name: Verify independently matched v2 cross-worker ledger and gap history
        if: ${{ env.SOURCE_AVAILABLE != 'false' && env.ANCHOR_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_fresh_trend_v2_selected_anchor \
            --repository "$GITHUB_REPOSITORY" \
            --anchor-run-id "$ANCHOR_RUN_ID" \
            --anchor-attempt "$ANCHOR_ATTEMPT" \
            --anchor-run-json /tmp/fresh-trend-v2-audit/anchor-run.json \
            --anchor-jobs-json /tmp/fresh-trend-v2-audit/anchor-jobs.json \
            --anchor-artifacts-json /tmp/fresh-trend-v2-audit/anchor-artifacts.json \
            --anchor-artifact-zip /tmp/fresh-trend-v2-audit/anchor.zip \
            --current-run-id "$SOURCE_RUN_ID" \
            --current-attempt "$SOURCE_ATTEMPT" \
            --current-run-json /tmp/fresh-trend-v2-audit/run.json \
            --current-jobs-json /tmp/fresh-trend-v2-audit/jobs.json \
            --current-artifacts-json /tmp/fresh-trend-v2-audit/artifacts.json \
            --current-artifact-zip /tmp/fresh-trend-v2-audit/source.zip \
            --output fresh-trend-v2-ledger-lineage.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("fresh-trend-v2-ledger-lineage.json").read_text())
          print("## Independent selected-anchor v2 signed ledger continuation")
          print("- status:", r["status"])
          print("- reasons:", r["reasons"])
          print("- both source accounts authenticated:", r.get("v2_source_archive_authenticated"), r.get("v2_selected_anchor_archive_authenticated"))
          print("- selected historic prefix preserved:", r.get("signed_selected_anchor_prefix_preserved"))
          print("- genuinely appended signed checkpoint:", r.get("new_signed_checkpoint_append_verified"))
          print("- observed source gap state history:", r.get("source_gap_lifecycle_state_only"))
          print("- original v2 genesis worker ZIP authenticated:", r.get("first_archived_v2_worker_proven", False))
          print("- identical write-once genesis preserved:", r.get("identical_write_once_genesis_across_workers", False))
          print("- exact actor-received DATA_GAP witness prefix preserved:", r.get("v2_actor_gap_witness_prefix_verified", False))
          print("- original/successor received gap witness counts:", r.get("v2_actor_gap_witness_continuity"))
          print("- original exchange market feed provenance independently authenticated: FALSE")
          print("- actual original v2 genesis proven: FALSE")
          print("- verified full mainnet source, 72h positive expectancy: FALSE / FALSE")
          print("- execution / promotion authority: FALSE / FALSE")
          PY

      - name: Upload independent selected-anchor v2 continuity
        if: ${{ always() && hashFiles('fresh-trend-v2-ledger-lineage.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: independent-fresh-trend-v2-lineage-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_ATTEMPT }}
          path: fresh-trend-v2-ledger-lineage.json
          if-no-files-found: error
          retention-days: 90

      # Screen a predeclared 72h signed forward cohort only after BOTH
      # original worker receipts are present. The source account is NOT an
      # independently authenticated original venue market-data stream.
      - name: Compute independent v2 after-cost forward outcome diagnostic
        if: ${{ always() && hashFiles('fresh-trend-v2-source-audit.json') != '' && hashFiles('fresh-trend-v2-ledger-lineage.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_fresh_trend_v2_forward_outcome \
            --source-receipt fresh-trend-v2-source-audit.json \
            --lineage-receipt fresh-trend-v2-ledger-lineage.json \
            --source-artifact-zip /tmp/fresh-trend-v2-audit/source.zip \
            --output fresh-trend-v2-forward-economics.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("fresh-trend-v2-forward-economics.json").read_text())
          print("## Frozen v2 independent AFTER-COST signed-account diagnostic")
          print("- status:", r["status"])
          print("- reasons:", r["reasons"])
          print("- signed 72h forward window exists:", r.get("signed_72h_window_complete", False))
          print("- precommitted economic review passes:", r.get("review_gate_passed", False))
          print("- after-cost baseline/candidate marked account PnL:", r.get("baseline_after_cost_marked_pnl"), r.get("candidate_after_cost_marked_pnl"))
          print("- primary candidate minus baseline after-cost account delta:", r.get("primary_candidate_minus_baseline_after_cost_marked_pnl"))
          print("- candidate fill-replayed trade cohort net expectancy/PF:", r.get("candidate_fill_matched_trades"))
          print("- strict original named market-feed gap history:", r.get("named_market_source_gap_history"))
          print("- signed source positive screen (NOT a profitable edge certificate):", r.get("positive_signed_source_account_screen", False))
          print("- original venue stream independently authenticated: FALSE")
          print("- verified 72h after-cost PROFITABLE edge: FALSE")
          print("- broker authority / promotion: FALSE / FALSE")
          PY

      - name: Upload read-only v2 forward economics diagnostic
        if: ${{ always() && hashFiles('fresh-trend-v2-forward-economics.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: independent-fresh-trend-v2-forward-economics-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_ATTEMPT }}
          path: fresh-trend-v2-forward-economics.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload independent v2 source receipt
        if: ${{ always() && env.SOURCE_AVAILABLE != 'false' && hashFiles('fresh-trend-v2-source-audit.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: independent-fresh-trend-v2-source-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_ATTEMPT }}
          path: fresh-trend-v2-source-audit.json
          if-no-files-found: error
          retention-days: 90
