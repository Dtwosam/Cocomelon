name: Independent Fresh v2 Trend Paired Source Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-fresh-trend-v2-source-audit.yml"
  schedule:
    - cron: "27 */3 * * *"
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact original paper worker with v2 artifact
        required: true
        type: string
      source_attempt:
        description: Exact source attempt
        default: "1"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: independent-v2-source-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      SOURCE_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_attempt || github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install independent verifier
        run: python -m pip install -e .

      # A scheduled search checks a completed original paper worker. It
      # cannot certify all previous workers, and never elects a new genesis.
      - name: Find latest completed source with exact new v2 artifact
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          mkdir -p /tmp/fresh-trend-v2-audit
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?status=completed&branch=main&per_page=100" > /tmp/fresh-trend-v2-audit/completed.json
          chosen=""
          attempt=""
          while read -r run_id run_attempt; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/fresh-trend-v2-audit/latest-artifacts.json
            name="continuous-paper-both-side-trend-paired-shadow-v2-$run_id-$run_attempt"
            if jq -e --arg name "$name" '
              [.artifacts[] | select(.name == $name and .expired == false)]
              | length == 1
            ' /tmp/fresh-trend-v2-audit/latest-artifacts.json > /dev/null; then
              chosen="$run_id"
              attempt="$run_attempt"
              break
            fi
          done < <(
            jq -r '
              .workflow_runs[]
              | select(.status == "completed" and .head_branch == "main"
                and .event == "workflow_dispatch"
                and .path == ".github/workflows/continuous-paper.yml"
                and .run_started_at >= "2026-10-14T00:00:00Z")
              | "\(.id) \(.run_attempt)"
            ' /tmp/fresh-trend-v2-audit/completed.json
          )
          if [ -z "$chosen" ]; then
            echo "SOURCE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "No completed paper worker with exact frozen v2 ZIP. V2 review NOT VERIFIED." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'SOURCE_RUN_ID=%s\nSOURCE_ATTEMPT=%s\n' "$chosen" "$attempt" >> "$GITHUB_ENV"

      - name: Fetch same-attempt original GitHub evidence
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          mkdir -p /tmp/fresh-trend-v2-audit
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/fresh-trend-v2-audit/run.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > /tmp/fresh-trend-v2-audit/jobs.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/fresh-trend-v2-audit/artifacts.json

      - name: Download exact independently published v2 ZIP
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          name="continuous-paper-both-side-trend-paired-shadow-v2-$SOURCE_RUN_ID-$SOURCE_ATTEMPT"
          artifact_id="$(jq -r --arg name "$name" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].id else empty end
          ' /tmp/fresh-trend-v2-audit/artifacts.json)"
          if [ -z "$artifact_id" ]; then
            echo "::warning::Exact v2 archive missing; receipt must fail closed"
            exit 0
          fi
          if ! curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-max-time 240 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output /tmp/fresh-trend-v2-audit/source.zip; then
            rm -f /tmp/fresh-trend-v2-audit/source.zip
            echo "::warning::Independent source ZIP unavailable; do not award evidence"
          fi

      - name: Independently authenticate frozen v2 source and reconcile accounts
        if: ${{ env.SOURCE_AVAILABLE != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_both_side_trend_paired_handoff \
            --campaign v2 \
            --run-json /tmp/fresh-trend-v2-audit/run.json \
            --jobs-json /tmp/fresh-trend-v2-audit/jobs.json \
            --artifacts-json /tmp/fresh-trend-v2-audit/artifacts.json \
            --artifact-zip /tmp/fresh-trend-v2-audit/source.zip \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-attempt "$SOURCE_ATTEMPT" \
            --output fresh-trend-v2-source-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("fresh-trend-v2-source-audit.json").read_text())
          print("## Independent v2 paired research source (NOT a profit certificate)")
          print("- source class:", r.get("source_class"))
          print("- source status:", r.get("status"))
          print("- failures:", r.get("reasons"))
          print("- outer SHA256:", r.get("archive_sha256"))
          print("- frozen candidate identity:", r.get("expected_candidate_id"))
          print("- v2 terminal parity receipt:", r.get("source_v2_terminal_receipt_verified"))
          print("- independent paper fills/fees/funding:", r.get("archived_execution_economics_reconciled"))
          print("- matched terminal mark arithmetic:", r.get("archived_terminal_mark_arithmetic_reconciled"))
          print("- source gaps:", r.get("source_scoped_open_gap_diagnostics"))
          print("- independent venue feed authentication: FALSE")
          print("- cross-worker v2 anchor / 72h after-cost edge: UNVERIFIED / UNVERIFIED")
          print("- promotion / live orders: FALSE / FALSE")
          PY

      - name: Upload independent v2 source receipt
        if: ${{ always() && env.SOURCE_AVAILABLE != 'false' && hashFiles('fresh-trend-v2-source-audit.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: independent-fresh-trend-v2-source-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_ATTEMPT }}
          path: fresh-trend-v2-source-audit.json
          if-no-files-found: error
          retention-days: 90
