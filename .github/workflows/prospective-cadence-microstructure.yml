name: Prospective Cadence Microstructure Audit

on:
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types:
      - completed
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed continuous-paper run ID
        required: true
        type: string
      source_run_attempt:
        description: Completed continuous-paper run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-cadence-microstructure
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FROZEN_CANDIDATE_SHA: efde8803da35d16529157729c2080a1cd99f9a4a
      PROSPECTIVE_STATUS_ISSUE: "674"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: efde8803da35d16529157729c2080a1cd99f9a4a

      - name: Resolve source paper run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          required_artifacts_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            gh api               -H "Accept: application/vnd.github+json"               "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100" |
            CANDIDATE_RUN_ID="$candidate_run_id"             CANDIDATE_ATTEMPT="$candidate_attempt" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          run_id = os.environ["CANDIDATE_RUN_ID"]
          attempt = os.environ["CANDIDATE_ATTEMPT"]
          names = (
              f"continuous-paper-cadence-shadow-{run_id}-{attempt}",
              f"continuous-paper-learning-features-{run_id}-{attempt}",
          )
          artifacts = payload.get("artifacts", [])
          for name in names:
              matches = [
                  item for item in artifacts
                  if item.get("name") == name and item.get("expired") is False
              ]
              if len(matches) > 1:
                  raise SystemExit(
                      f"multiple non-expired source artifacts named {name}"
                  )
              if not matches:
                  raise SystemExit(1)
          '
          }

          paper_run_is_evidence_eligible() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local run_path="/tmp/cadence-source-run-$candidate_run_id.json"
            local jobs_path="/tmp/cadence-source-jobs-$candidate_run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" > "$run_path"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100" > "$jobs_path"
            python - "$run_path" "$jobs_path" "$candidate_attempt" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_attempt, expected_repo = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit(1)
          if run.get("head_branch") != "main":
              raise SystemExit(1)
          if run.get("status") != "completed":
              raise SystemExit(1)
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit(1)
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              raise SystemExit(1)
          conclusion = run.get("conclusion")
          if conclusion not in {"success", "failure"}:
              raise SystemExit(1)
          if conclusion == "success":
              raise SystemExit(0)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs_payload = json.load(handle)
          paper_jobs = [
              job for job in jobs_payload.get("jobs", [])
              if job.get("name") == "paper"
          ]
          if len(paper_jobs) != 1 or paper_jobs[0].get("conclusion") != "failure":
              raise SystemExit(1)
          steps = {
              step.get("name"): step.get("conclusion")
              for step in paper_jobs[0].get("steps", [])
              if isinstance(step.get("name"), str)
          }
          required = (
              "Run continuous paper trader",
              "Measure durable continuous paper state",
              "Upload durable continuous paper state",
              "Upload cadence shadow research state",
              "Upload learning feature research state",
          )
          if any(steps.get(name) != "success" for name in required):
              raise SystemExit(1)
          failed_steps = {
              name for name, conclusion in steps.items()
              if conclusion == "failure"
          }
          allowed = {
              frozenset({"Fail closed on upgrade handoff source"}),
              frozenset(
                  {
                      "Queue fallback exact successor continuous paper worker",
                      "Fail closed on upgrade handoff source",
                  }
              ),
          }
          if frozenset(failed_steps) not in allowed:
              raise SystemExit(1)
          if (
              "Queue fallback exact successor continuous paper worker"
              in failed_steps
              and steps.get("Queue exact successor from fast resume")
              != "success"
          ):
              raise SystemExit(1)
          PY
          }

          source_run_id=""
          source_run_attempt=""
          resolution_mode=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            source_run_id="$INPUT_SOURCE_RUN_ID"
            source_run_attempt="$INPUT_SOURCE_RUN_ATTEMPT"
            if ! paper_run_is_evidence_eligible "$source_run_id" "$source_run_attempt"; then
              echo "Manual source run is not evidence-eligible." >&2
              exit 1
            fi
            if ! required_artifacts_for_run "$source_run_id" "$source_run_attempt"; then
              echo "Manual source run is missing required compact cadence artifacts." >&2
              exit 1
            fi
            resolution_mode="manual_exact"
          elif [[ "$EVENT_SOURCE_RUN_ID" =~ ^[0-9]+$ && "$EVENT_SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            if paper_run_is_evidence_eligible "$EVENT_SOURCE_RUN_ID" "$EVENT_SOURCE_RUN_ATTEMPT"               && required_artifacts_for_run "$EVENT_SOURCE_RUN_ID" "$EVENT_SOURCE_RUN_ATTEMPT"; then
              source_run_id="$EVENT_SOURCE_RUN_ID"
              source_run_attempt="$EVENT_SOURCE_RUN_ATTEMPT"
              if [ "$EVENT_SOURCE_CONCLUSION" = "success" ]; then
                resolution_mode="successful_event"
              else
                resolution_mode="durable_handoff_event"
              fi
            fi
          fi

          if [ -z "$source_run_id" ] && [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            runs_json="$(
              gh api                 -H "Accept: application/vnd.github+json"                 "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=100"
            )"
            mapfile -t candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if ! paper_run_is_evidence_eligible "$candidate_run_id" "$candidate_attempt"; then
                continue
              fi
              if required_artifacts_for_run "$candidate_run_id" "$candidate_attempt"; then
                source_run_id="$candidate_run_id"
                source_run_attempt="$candidate_attempt"
                resolution_mode="latest_evidence_eligible_with_cadence_artifacts"
                break
              fi
            done
          fi

          if [[ ! "$source_run_id" =~ ^[0-9]+$ || ! "$source_run_attempt" =~ ^[0-9]+$ ]]; then
            echo "No evidence-eligible continuous-paper run has the required compact cadence artifacts." >&2
            exit 1
          fi
          echo "SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ATTEMPT=$source_run_attempt" >> "$GITHUB_ENV"
          echo "SOURCE_RESOLUTION_MODE=$resolution_mode" >> "$GITHUB_ENV"
          echo "Resolved source run $source_run_id attempt $source_run_attempt via $resolution_mode."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev,research]"

      - name: Resolve compact research artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts_json="$(
            gh api               -H "Accept: application/vnd.github+json"               "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100"
          )"
          cadence_name="continuous-paper-cadence-shadow-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          features_name="continuous-paper-learning-features-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          cadence_id="$(
            jq -r               --arg name "$cadence_name"               '.artifacts[] | select(.name == $name and .expired == false) | .id'               <<<"$artifacts_json" |
            head -n 1
          )"
          features_id="$(
            jq -r               --arg name "$features_name"               '.artifacts[] | select(.name == $name and .expired == false) | .id'               <<<"$artifacts_json" |
            head -n 1
          )"
          if [[ -z "$cadence_id" || -z "$features_id" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "cadence_id=$cadence_id" >> "$GITHUB_OUTPUT"
            echo "features_id=$features_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "cadence_id=$cadence_id" >> "$GITHUB_OUTPUT"
          echo "features_id=$features_id" >> "$GITHUB_OUTPUT"

      - name: Record unavailable compact research state
        if: ${{ steps.artifacts.outputs.ready != 'true' }}
        run: |
          echo "## Frozen prospective cadence microstructure challenger" >> "$GITHUB_STEP_SUMMARY"
          echo "- source paper run: $SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- source resolution: $SOURCE_RESOLUTION_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: compact research artifacts unavailable; evaluation skipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish unavailable prospective status
        if: ${{ steps.artifacts.outputs.ready != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prospective-status.md <<EOF
          ## Frozen prospective cadence microstructure challenger

          **Status:** blocked — compact research artifacts unavailable

          - source paper run: `$SOURCE_RUN_ID`
          - source run attempt: `$SOURCE_RUN_ATTEMPT`
          - source resolution: `$SOURCE_RESOLUTION_MODE`
          - audit workflow run: `${{ github.run_id }}`
          - frozen evaluator SHA: `$FROZEN_CANDIDATE_SHA`
          - prospective boundary: `2026-09-30T14:00:00Z`
          - execution authority: `false`
          - promotion authority: `false`
          - live trading: `disabled`

          The source paper run completed, but the compact cadence/feature artifacts required for future-only scoring were not both available. No prospective qualification claim is made.

          **No paper orders are changed by this audit.**
          EOF
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PROSPECTIVE_STATUS_ISSUE" \
            -f body="$(cat /tmp/prospective-status.md)"

      - name: Download compact research state
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CADENCE_ID: ${{ steps.artifacts.outputs.cadence_id }}
          FEATURES_ID: ${{ steps.artifacts.outputs.features_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cadence-artifact /tmp/features-artifact
          gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/actions/artifacts/$CADENCE_ID/zip"             > /tmp/cadence.zip
          gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/actions/artifacts/$FEATURES_ID/zip"             > /tmp/features.zip
          unzip -q /tmp/cadence.zip -d /tmp/cadence-artifact
          unzip -q /tmp/features.zip -d /tmp/features-artifact

          cadence_path="$(
            find /tmp/cadence-artifact               -type f               -name cadence-shadow-state.json               -print -quit
          )"
          records_dir="$(
            find /tmp/features-artifact               -type d               -name records               -print -quit
          )"
          test -n "$cadence_path"
          test -n "$records_dir"
          feature_root="$(dirname "$records_dir")"
          echo "CADENCE_PATH=$cadence_path" >> "$GITHUB_ENV"
          echo "FEATURE_ROOT=$feature_root" >> "$GITHUB_ENV"

      - name: Evaluate frozen prospective challenger
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_microstructure_prospective.py             "$CADENCE_PATH"             "$FEATURE_ROOT"             --json-out cadence-microstructure-prospective.json             > /tmp/cadence-microstructure-prospective.stdout.json
          cmp             cadence-microstructure-prospective.json             /tmp/cadence-microstructure-prospective.stdout.json

      - name: Summarize prospective evidence
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(
                  "cadence-microstructure-prospective.json"
              ).read_text(encoding="utf-8")
          )
          print("## Frozen prospective cadence microstructure challenger")
          print(f"- source paper run: {os.environ['SOURCE_RUN_ID']}")
          print(
              "- frozen candidate SHA: "
              f"{os.environ['FROZEN_CANDIDATE_SHA']}"
          )
          for field in (
              "status",
              "prospective_start_ms",
              "frozen_training_rows",
              "frozen_training_rows_sha256",
              "frozen_training_source",
              "prospective_rows",
              "required_prospective_rows",
              "admitted_rows",
              "skipped_rows",
              "candidate_net_return_sum",
              "candidate_mean_net_return",
              "development_qualified",
          ):
              print(f"- {field}: {report.get(field)}")
          print("### Direction")
          for direction, item in report.get("by_direction", {}).items():
              print(
                  f"- {direction}: "
                  f"rows={item.get('prospective_rows')} "
                  f"admitted={item.get('admitted_rows')} "
                  f"sum={item.get('candidate_net_return_sum')} "
                  f"mean={item.get('candidate_mean_net_return')}"
              )
          print("### Chronological blocks")
          for block in report.get("stability_blocks", []):
              print(
                  f"- block {block['block_index']}: "
                  f"rows={block['prospective_rows']} "
                  f"admitted={block['admitted_rows']} "
                  f"sum={block['candidate_net_return_sum']} "
                  f"passes={block['passes']}"
              )
          PY


      - name: Publish canonical prospective status
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(
                  "cadence-microstructure-prospective.json"
              ).read_text(encoding="utf-8")
          )
          lines = [
              "## Frozen prospective cadence microstructure challenger",
              "",
              f"**Status:** {report.get('status', 'unknown')}",
              "",
              f"- source paper run: `{os.environ['SOURCE_RUN_ID']}`",
              f"- source run attempt: `{os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source resolution: `{os.environ['SOURCE_RESOLUTION_MODE']}`",
              f"- audit workflow run: `${{ github.run_id }}`",
              f"- frozen evaluator SHA: `{os.environ['FROZEN_CANDIDATE_SHA']}`",
              (
                  "- frozen training digest: `"
                  f"{report.get('frozen_training_rows_sha256', 'unknown')}`"
              ),
              (
                  "- prospective boundary ms: `"
                  f"{report.get('prospective_start_ms')}`"
              ),
              f"- frozen training rows: `{report.get('frozen_training_rows', 0)}`",
              (
                  "- prospective settled rows: `"
                  f"{report.get('prospective_rows', 0)} / "
                  f"{report.get('required_prospective_rows', 0)}`"
              ),
              (
                  "- admitted / skipped: `"
                  f"{report.get('admitted_rows', 0)} / "
                  f"{report.get('skipped_rows', 0)}`"
              ),
              (
                  "- candidate net-return sum / mean: `"
                  f"{report.get('candidate_net_return_sum')} / "
                  f"{report.get('candidate_mean_net_return')}`"
              ),
              (
                  "- development qualified: `"
                  f"{str(bool(report.get('development_qualified'))).lower()}`"
              ),
              "",
              "### Direction",
              "",
          ]
          for direction in ("long", "short"):
              item = report.get("by_direction", {}).get(direction, {})
              lines.append(
                  "- "
                  f"{direction.upper()}: rows=`{item.get('prospective_rows', 0)}` "
                  f"admitted=`{item.get('admitted_rows', 0)}` "
                  f"sum=`{item.get('candidate_net_return_sum')}` "
                  f"mean=`{item.get('candidate_mean_net_return')}`"
              )
          lines.extend(["", "### Chronological stability", ""])
          blocks = report.get("stability_blocks", [])
          if blocks:
              for block in blocks:
                  lines.append(
                      "- block "
                      f"{block.get('block_index')}: "
                      f"rows=`{block.get('prospective_rows', 0)}` "
                      f"admitted=`{block.get('admitted_rows', 0)}` "
                      f"sum=`{block.get('candidate_net_return_sum')}` "
                      f"passes=`{str(bool(block.get('passes'))).lower()}`"
                  )
          else:
              lines.append(
                  "_Not enough future-only settled rows for stability blocks yet._"
              )
          lines.extend(
              [
                  "",
                  (
                      "Historical/touched outcomes do not count toward this "
                      "status. The evaluator is pinned to immutable code and "
                      "a committed pre-freeze training fingerprint."
                  ),
                  "",
                  "**No paper orders are changed by this audit.**",
              ]
          )
          Path("/tmp/prospective-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PROSPECTIVE_STATUS_ISSUE" \
            -f body="$(cat /tmp/prospective-status.md)"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        with:
          name: cadence-microstructure-prospective-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: cadence-microstructure-prospective.json
          if-no-files-found: error
          retention-days: 90
