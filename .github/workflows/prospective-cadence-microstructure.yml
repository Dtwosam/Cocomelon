name: Prospective Cadence Microstructure Audit

on:
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed continuous-paper run ID
        required: true
        type: string
      source_run_attempt:
        description: Completed continuous-paper run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-cadence-microstructure
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
      FROZEN_CANDIDATE_SHA: efde8803da35d16529157729c2080a1cd99f9a4a
      PROSPECTIVE_STATUS_ISSUE: "674"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: efde8803da35d16529157729c2080a1cd99f9a4a

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev,research]"

      - name: Resolve compact research artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts_json="$(
            gh api               -H "Accept: application/vnd.github+json"               "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100"
          )"
          cadence_name="continuous-paper-cadence-shadow-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          features_name="continuous-paper-learning-features-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          cadence_id="$(
            jq -r               --arg name "$cadence_name"               '.artifacts[] | select(.name == $name and .expired == false) | .id'               <<<"$artifacts_json" |
            head -n 1
          )"
          features_id="$(
            jq -r               --arg name "$features_name"               '.artifacts[] | select(.name == $name and .expired == false) | .id'               <<<"$artifacts_json" |
            head -n 1
          )"
          if [[ -z "$cadence_id" || -z "$features_id" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "cadence_id=$cadence_id" >> "$GITHUB_OUTPUT"
            echo "features_id=$features_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "cadence_id=$cadence_id" >> "$GITHUB_OUTPUT"
          echo "features_id=$features_id" >> "$GITHUB_OUTPUT"

      - name: Record unavailable compact research state
        if: ${{ steps.artifacts.outputs.ready != 'true' }}
        run: |
          echo "## Frozen prospective cadence microstructure challenger" >> "$GITHUB_STEP_SUMMARY"
          echo "- source paper run: $SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: compact research artifacts unavailable; evaluation skipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish unavailable prospective status
        if: ${{ steps.artifacts.outputs.ready != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prospective-status.md <<EOF
          ## Frozen prospective cadence microstructure challenger

          **Status:** blocked — compact research artifacts unavailable

          - source paper run: `$SOURCE_RUN_ID`
          - source run attempt: `$SOURCE_RUN_ATTEMPT`
          - audit workflow run: `${{ github.run_id }}`
          - frozen evaluator SHA: `$FROZEN_CANDIDATE_SHA`
          - prospective boundary: `2026-09-30T14:00:00Z`
          - execution authority: `false`
          - promotion authority: `false`
          - live trading: `disabled`

          The source paper run completed, but the compact cadence/feature artifacts required for future-only scoring were not both available. No prospective qualification claim is made.

          **No paper orders are changed by this audit.**
          EOF
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PROSPECTIVE_STATUS_ISSUE" \
            -f body="$(cat /tmp/prospective-status.md)"

      - name: Download compact research state
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CADENCE_ID: ${{ steps.artifacts.outputs.cadence_id }}
          FEATURES_ID: ${{ steps.artifacts.outputs.features_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cadence-artifact /tmp/features-artifact
          gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/actions/artifacts/$CADENCE_ID/zip"             > /tmp/cadence.zip
          gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/actions/artifacts/$FEATURES_ID/zip"             > /tmp/features.zip
          unzip -q /tmp/cadence.zip -d /tmp/cadence-artifact
          unzip -q /tmp/features.zip -d /tmp/features-artifact

          cadence_path="$(
            find /tmp/cadence-artifact               -type f               -name cadence-shadow-state.json               -print -quit
          )"
          records_dir="$(
            find /tmp/features-artifact               -type d               -name records               -print -quit
          )"
          test -n "$cadence_path"
          test -n "$records_dir"
          feature_root="$(dirname "$records_dir")"
          echo "CADENCE_PATH=$cadence_path" >> "$GITHUB_ENV"
          echo "FEATURE_ROOT=$feature_root" >> "$GITHUB_ENV"

      - name: Evaluate frozen prospective challenger
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_microstructure_prospective.py             "$CADENCE_PATH"             "$FEATURE_ROOT"             --json-out cadence-microstructure-prospective.json             > /tmp/cadence-microstructure-prospective.stdout.json
          cmp             cadence-microstructure-prospective.json             /tmp/cadence-microstructure-prospective.stdout.json

      - name: Summarize prospective evidence
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(
                  "cadence-microstructure-prospective.json"
              ).read_text(encoding="utf-8")
          )
          print("## Frozen prospective cadence microstructure challenger")
          print(f"- source paper run: {os.environ['SOURCE_RUN_ID']}")
          print(
              "- frozen candidate SHA: "
              f"{os.environ['FROZEN_CANDIDATE_SHA']}"
          )
          for field in (
              "status",
              "prospective_start_ms",
              "frozen_training_rows",
              "frozen_training_rows_sha256",
              "frozen_training_source",
              "prospective_rows",
              "required_prospective_rows",
              "admitted_rows",
              "skipped_rows",
              "candidate_net_return_sum",
              "candidate_mean_net_return",
              "development_qualified",
          ):
              print(f"- {field}: {report.get(field)}")
          print("### Direction")
          for direction, item in report.get("by_direction", {}).items():
              print(
                  f"- {direction}: "
                  f"rows={item.get('prospective_rows')} "
                  f"admitted={item.get('admitted_rows')} "
                  f"sum={item.get('candidate_net_return_sum')} "
                  f"mean={item.get('candidate_mean_net_return')}"
              )
          print("### Chronological blocks")
          for block in report.get("stability_blocks", []):
              print(
                  f"- block {block['block_index']}: "
                  f"rows={block['prospective_rows']} "
                  f"admitted={block['admitted_rows']} "
                  f"sum={block['candidate_net_return_sum']} "
                  f"passes={block['passes']}"
              )
          PY


      - name: Publish canonical prospective status
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(
                  "cadence-microstructure-prospective.json"
              ).read_text(encoding="utf-8")
          )
          lines = [
              "## Frozen prospective cadence microstructure challenger",
              "",
              f"**Status:** {report.get('status', 'unknown')}",
              "",
              f"- source paper run: `{os.environ['SOURCE_RUN_ID']}`",
              f"- source run attempt: `{os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- audit workflow run: `${{ github.run_id }}`",
              f"- frozen evaluator SHA: `{os.environ['FROZEN_CANDIDATE_SHA']}`",
              (
                  "- frozen training digest: `"
                  f"{report.get('frozen_training_rows_sha256', 'unknown')}`"
              ),
              (
                  "- prospective boundary ms: `"
                  f"{report.get('prospective_start_ms')}`"
              ),
              f"- frozen training rows: `{report.get('frozen_training_rows', 0)}`",
              (
                  "- prospective settled rows: `"
                  f"{report.get('prospective_rows', 0)} / "
                  f"{report.get('required_prospective_rows', 0)}`"
              ),
              (
                  "- admitted / skipped: `"
                  f"{report.get('admitted_rows', 0)} / "
                  f"{report.get('skipped_rows', 0)}`"
              ),
              (
                  "- candidate net-return sum / mean: `"
                  f"{report.get('candidate_net_return_sum')} / "
                  f"{report.get('candidate_mean_net_return')}`"
              ),
              (
                  "- development qualified: `"
                  f"{str(bool(report.get('development_qualified'))).lower()}`"
              ),
              "",
              "### Direction",
              "",
          ]
          for direction in ("long", "short"):
              item = report.get("by_direction", {}).get(direction, {})
              lines.append(
                  "- "
                  f"{direction.upper()}: rows=`{item.get('prospective_rows', 0)}` "
                  f"admitted=`{item.get('admitted_rows', 0)}` "
                  f"sum=`{item.get('candidate_net_return_sum')}` "
                  f"mean=`{item.get('candidate_mean_net_return')}`"
              )
          lines.extend(["", "### Chronological stability", ""])
          blocks = report.get("stability_blocks", [])
          if blocks:
              for block in blocks:
                  lines.append(
                      "- block "
                      f"{block.get('block_index')}: "
                      f"rows=`{block.get('prospective_rows', 0)}` "
                      f"admitted=`{block.get('admitted_rows', 0)}` "
                      f"sum=`{block.get('candidate_net_return_sum')}` "
                      f"passes=`{str(bool(block.get('passes'))).lower()}`"
                  )
          else:
              lines.append(
                  "_Not enough future-only settled rows for stability blocks yet._"
              )
          lines.extend(
              [
                  "",
                  (
                      "Historical/touched outcomes do not count toward this "
                      "status. The evaluator is pinned to immutable code and "
                      "a committed pre-freeze training fingerprint."
                  ),
                  "",
                  "**No paper orders are changed by this audit.**",
              ]
          )
          Path("/tmp/prospective-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PROSPECTIVE_STATUS_ISSUE" \
            -f body="$(cat /tmp/prospective-status.md)"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.artifacts.outputs.ready == 'true' }}
        with:
          name: cadence-microstructure-prospective-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: cadence-microstructure-prospective.json
          if-no-files-found: error
          retention-days: 90
