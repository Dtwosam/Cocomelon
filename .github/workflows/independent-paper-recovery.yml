name: Independent Paper Recovery Watchdog
run-name: Independent Paper Rescue · ${{ github.run_id }}

on:
  # Every code merge can stop the old PAPER worker. Independently check
  # custody of the latest exact resume archive and recover if needed;
  # skipped push guards do not prove trading continuity.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: independent-paper-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      COCOMELON_EXECUTION_MODE: paper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate exact paper continuity and dispatch if needed
        run: python scripts/rescue_continuous_paper.py
