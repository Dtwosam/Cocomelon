name: Research Learning Catch-up

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows:
      - "Scheduled Research Mainnet Replay Campaign"
      - "Research Learning Evidence Sync"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: research-learning-catchup
  cancel-in-progress: false

env:
  LEARNING_PIPELINE_ACTIVATED_AT_UTC: "2026-09-25T15:28:46Z"

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted catch-up control
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Allow normal workflow_run followers to register
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 10

      - name: Find newest successful post-activation research campaign
        id: campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/workflows/research-campaign-scheduled.yml/runs?per_page=100"             > /tmp/research-campaign-runs.json
          LATEST_CAMPAIGN_RUN_ID="$(
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          activation = os.environ["LEARNING_PIPELINE_ACTIVATED_AT_UTC"]
          payload = json.loads(
              Path("/tmp/research-campaign-runs.json").read_text(encoding="utf-8")
          )
          # Select only the newest successful post-activation research campaign.
          eligible = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("event") == "workflow_dispatch"
              and run.get("path")
              == ".github/workflows/research-campaign-scheduled.yml"
              and isinstance(run.get("created_at"), str)
              and run["created_at"] >= activation
          ]
          if eligible:
              newest = max(
                  eligible,
                  key=lambda run: (run["created_at"], int(run["id"])),
              )
              print(newest["id"])
          PY
          )"
          echo "run_id=$LATEST_CAMPAIGN_RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST_CAMPAIGN_RUN_ID" ]; then
            echo "no successful post-activation research campaign exists yet"
          else
            echo "newest successful post-activation research campaign: $LATEST_CAMPAIGN_RUN_ID"
          fi

      - name: Restore latest trusted learning state
        if: ${{ steps.campaign.outputs.run_id != '' }}
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/latest-learning-state
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-learning-state&per_page=100"             > /tmp/learning-state-artifacts.json

          STATE_ROW="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/learning-state-artifacts.json").read_text(encoding="utf-8")
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              fetched = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(fetched.stdout)
              path = run.get("path")
              trusted_events = {
                  ".github/workflows/research-learning-evidence.yml": {
                      "workflow_run",
                      "workflow_dispatch",
                  },
                  ".github/workflows/research-learning-state-continuity.yml": {
                      "schedule",
                      "workflow_dispatch",
                  },
              }.get(path)
              if (
                  trusted_events is not None
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and run.get("event") in trusted_events
                  and run.get("head_sha") == artifact["workflow_run"].get("head_sha")
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(
                      str(artifact["id"])
                      + "\t"
                      + str(run_id)
                      + "\t"
                      + str(run["run_attempt"])
                  )
                  break
          PY
          )"

          if [ -z "$STATE_ROW" ]; then
            {
              echo "upstream_run_id="
              echo "created_records="
              echo "sync_run_id="
              echo "sync_run_attempt="
            } >> "$GITHUB_OUTPUT"
            echo "no latest trusted learning state exists yet"
            exit 0
          fi

          IFS=$'\t' read -r STATE_ARTIFACT_ID LATEST_SYNC_RUN_ID LATEST_SYNC_RUN_ATTEMPT <<< "$STATE_ROW"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ARTIFACT_ID/zip"             > /tmp/latest-learning-state.zip
          unzip -q /tmp/latest-learning-state.zip -d /tmp/latest-learning-state

          METADATA="$(
            python - <<'PY'
          import json
          from pathlib import Path

          sync = json.loads(
              Path("/tmp/latest-learning-state/last-sync.json").read_text(
                  encoding="utf-8"
              )
          )
          if sync.get("research_only") is not True:
              raise SystemExit("latest learning state is not research-only")
          if sync.get("promotion_eligible") is not False:
              raise SystemExit("latest learning state unexpectedly authorizes promotion")
          if sync.get("execution_ready") is not False:
              raise SystemExit("latest learning state unexpectedly authorizes execution")
          upstream = sync.get("upstream_run_id")
          created = sync.get("created_records")
          if isinstance(upstream, bool) or not isinstance(upstream, int) or upstream <= 0:
              raise SystemExit("latest learning upstream run id is invalid")
          if isinstance(created, bool) or not isinstance(created, int) or created < 0:
              raise SystemExit("latest learning created record count is invalid")
          print(str(upstream) + "\t" + str(created))
          PY
          )"
          IFS=$'\t' read -r LATEST_STATE_UPSTREAM_RUN_ID LATEST_CREATED_RECORDS <<< "$METADATA"
          {
            echo "upstream_run_id=$LATEST_STATE_UPSTREAM_RUN_ID"
            echo "created_records=$LATEST_CREATED_RECORDS"
            echo "sync_run_id=$LATEST_SYNC_RUN_ID"
            echo "sync_run_attempt=$LATEST_SYNC_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          echo "latest trusted learning state restored from sync run $LATEST_SYNC_RUN_ID"

      - name: Recover missing learning evidence sync
        if: ${{ steps.campaign.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_CAMPAIGN_RUN_ID: ${{ steps.campaign.outputs.run_id }}
          LATEST_STATE_UPSTREAM_RUN_ID: ${{ steps.state.outputs.upstream_run_id }}
        run: |
          set -euo pipefail
          if [ "$LATEST_STATE_UPSTREAM_RUN_ID" = "$LATEST_CAMPAIGN_RUN_ID" ]; then
            echo "newest research campaign is already present in cumulative learning state"
          else
            if [ -n "$LATEST_STATE_UPSTREAM_RUN_ID" ]               && [ "$LATEST_STATE_UPSTREAM_RUN_ID" -gt "$LATEST_CAMPAIGN_RUN_ID" ]; then
              echo "latest trusted learning state is ahead of newest campaign" >&2
              exit 65
            fi
            ACTIVE_SYNC="$(
              /usr/bin/gh api                 "/repos/$GITHUB_REPOSITORY/actions/workflows/research-learning-evidence.yml/runs?per_page=100"                 --jq '.workflow_runs[]
                  | select(.head_branch == "main")
                  | select(.status != "completed")
                  | [.id, .status, .event]
                  | @tsv'
            )"
            if [ -n "$ACTIVE_SYNC" ]; then
              echo "learning evidence sync already active; catch-up skipped"
              printf '%s\n' "$ACTIVE_SYNC"
              exit 0
            fi
            /usr/bin/gh api               --method POST               "/repos/$GITHUB_REPOSITORY/actions/workflows/research-learning-evidence.yml/dispatches"               -f ref=main               -f "inputs[upstream_run_id]=$LATEST_CAMPAIGN_RUN_ID"
            echo "dispatched missing learning evidence sync for $LATEST_CAMPAIGN_RUN_ID"
            exit 0
          fi

      - name: Recover missing autonomous learning cycle
        if: >-
          steps.campaign.outputs.run_id != '' &&
          steps.state.outputs.upstream_run_id == steps.campaign.outputs.run_id
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_SYNC_RUN_ID: ${{ steps.state.outputs.sync_run_id }}
          LATEST_SYNC_RUN_ATTEMPT: ${{ steps.state.outputs.sync_run_attempt }}
          LATEST_CREATED_RECORDS: ${{ steps.state.outputs.created_records }}
        run: |
          set -euo pipefail
          # created_records == 0 means the successful sync intentionally needs no cycle.
          if [ "$LATEST_CREATED_RECORDS" = "0" ]; then
            echo "latest sync created no new records; autonomous cycle is intentionally skipped"
            exit 0
          fi
          if ! [[ "$LATEST_SYNC_RUN_ID" =~ ^[1-9][0-9]*$ ]]             || ! [[ "$LATEST_SYNC_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "latest trusted sync identity is invalid" >&2
            exit 66
          fi

          CYCLE_ARTIFACT_NAME="research-learning-cycle-${LATEST_SYNC_RUN_ID}-${LATEST_SYNC_RUN_ATTEMPT}"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$CYCLE_ARTIFACT_NAME&per_page=100"             > /tmp/cycle-artifacts.json
          CYCLE_COMPLETE="$(
            python - "$CYCLE_ARTIFACT_NAME" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          payload = json.loads(
              Path("/tmp/cycle-artifacts.json").read_text(encoding="utf-8")
          )
          for artifact in payload.get("artifacts", []):
              if artifact.get("name") != expected or artifact.get("expired") is not False:
                  continue
              workflow_run = artifact.get("workflow_run")
              if not isinstance(workflow_run, dict):
                  continue
              run_id = workflow_run.get("id")
              if not isinstance(run_id, int):
                  continue
              fetched = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(fetched.stdout)
              if (
                  run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and run.get("path")
                  == ".github/workflows/research-learning-cycle.yml"
              ):
                  print("true")
                  break
          PY
          )"
          if [ "$CYCLE_COMPLETE" = "true" ]; then
            echo "autonomous learning cycle already completed for latest sync"
            exit 0
          fi

          ACTIVE_CYCLE="$(
            /usr/bin/gh api               "/repos/$GITHUB_REPOSITORY/actions/workflows/research-learning-cycle.yml/runs?per_page=100"               --jq '.workflow_runs[]
                | select(.head_branch == "main")
                | select(.status != "completed")
                | [.id, .status, .event]
                | @tsv'
          )"
          if [ -n "$ACTIVE_CYCLE" ]; then
            echo "autonomous learning cycle already active; catch-up skipped"
            printf '%s\n' "$ACTIVE_CYCLE"
            exit 0
          fi

          /usr/bin/gh api             --method POST             "/repos/$GITHUB_REPOSITORY/actions/workflows/research-learning-cycle.yml/dispatches"             -f ref=main             -f "inputs[upstream_run_id]=$LATEST_SYNC_RUN_ID"
          echo "dispatched missing autonomous learning cycle for sync $LATEST_SYNC_RUN_ID"
