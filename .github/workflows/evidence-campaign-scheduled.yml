name: Scheduled Genuine Mainnet Evidence Campaign V2

on:
  schedule:
    - cron: "37 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genuine-mainnet-evidence-v2-30c0de4b
  cancel-in-progress: false

jobs:
  evidence-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE9_STATE_BRANCH: phase9-v2-protocol-state
      PHASE9_STATE_FILE: phase9-v2-final.json
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      COHORT_CODE_REVISION: 30c0de4bf76a5eda74c9bb71f17db00f1f9ce17e
      COHORT_TRIGGER_SHA: ${{ github.sha }}
    steps:
      - name: Check durable Phase 9 final state
        id: phase9_final
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/branches/$PHASE9_STATE_BRANCH" \
            > /tmp/phase9-state-branch.json
          STATE_ENDPOINT="repos/$GITHUB_REPOSITORY/contents/$PHASE9_STATE_FILE?ref=$PHASE9_STATE_BRANCH"
          set +e
          gh api "$STATE_ENDPOINT" > /tmp/phase9-state-meta.json 2> /tmp/phase9-state.stderr
          STATE_STATUS=$?
          set -e
          if [ "$STATE_STATUS" -eq 0 ]; then
            python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(Path("/tmp/phase9-state-meta.json").read_text())
          payload = json.loads(base64.b64decode(meta["content"]).decode("utf-8"))
          final_id = payload.get("final_id")
          base = {key: value for key, value in payload.items() if key != "final_id"}
          encoded = json.dumps(
              base,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              allow_nan=False,
          ).encode("utf-8")
          expected = hashlib.sha256(encoded).hexdigest()
          if final_id != expected:
              raise SystemExit("durable Phase 9 final_id is invalid")
          if payload.get("protocol_id") != "v2-phase9-one-shot":
              raise SystemExit("durable Phase 9 protocol id is invalid")
          if payload.get("one_shot_oos") is not True:
              raise SystemExit("durable Phase 9 state is not one-shot OOS")
          if payload.get("network_access") is not False or payload.get("live_orders") is not False:
              raise SystemExit("durable Phase 9 state violates offline-only semantics")
          Path("/tmp/phase9-v2-final.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            echo "final_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" /tmp/phase9-state.stderr; then
            STATE_HISTORY_ENDPOINT="repos/$GITHUB_REPOSITORY/commits?sha=$PHASE9_STATE_BRANCH&path=$PHASE9_STATE_FILE&per_page=1"
            gh api "$STATE_HISTORY_ENDPOINT" > /tmp/phase9-state-history.json
            if python3 - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path("/tmp/phase9-state-history.json").read_text())
          raise SystemExit(0 if history else 1)
          PY
            then
              echo "Phase 9 final state was previously recorded but is now missing" >&2
              exit 61
            fi
            echo "final_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/phase9-state.stderr >&2
            exit "$STATE_STATUS"
          fi

      - name: Checkout pinned V2 evidence revision
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: 30c0de4bf76a5eda74c9bb71f17db00f1f9ce17e
          fetch-depth: 1

      - name: Checkout pinned attempt ledger tooling
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: 2a9f01d86218dca98d2d84a4ae0e2e28c69975a7
          path: campaign-tooling
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Record clean genuine public mainnet evidence
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p evidence-cohort/output evidence-cohort/diagnostics
          git rev-parse HEAD > evidence-cohort/output/workflow-head.txt
          printf '%s\n' "$COHORT_TRIGGER_SHA" > evidence-cohort/output/trigger-head.txt

          CLEAN_ATTEMPT=""
          for ATTEMPT in 1 2; do
            ATTEMPT_ROOT="evidence-cohort/attempt-${ATTEMPT}"
            DIAG_ROOT="evidence-cohort/diagnostics/attempt-${ATTEMPT}"
            mkdir -p "$ATTEMPT_ROOT/recording" "$DIAG_ROOT"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$ATTEMPT_ROOT/started-at-utc.txt"

            cocomelon record-mainnet-evidence \
              --root "$ATTEMPT_ROOT/recording" \
              --seconds 2700 \
              --deep-limit 5 \
              > "$ATTEMPT_ROOT/record-transport.json" &
            RECORDER_PID=$!

            python -m cocomelon.ops.gap_watch \
              --root "$ATTEMPT_ROOT/recording" \
              --pid "$RECORDER_PID" \
              --poll-seconds 0.5 \
              > "$ATTEMPT_ROOT/gap-watch.json" &
            GAP_WATCH_PID=$!

            if wait "$RECORDER_PID"; then
              RECORDER_STATUS=0
            else
              RECORDER_STATUS=$?
            fi
            kill "$GAP_WATCH_PID" 2>/dev/null || true
            if wait "$GAP_WATCH_PID"; then
              GAP_WATCH_STATUS=0
            else
              GAP_WATCH_STATUS=$?
            fi

            NORMALIZE_STATUS=1
            if [ "$RECORDER_STATUS" -eq 0 ]; then
              if python - "$ATTEMPT_ROOT/record-transport.json" "$ATTEMPT_ROOT/record.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          from cocomelon.evidence.transport_health import normalize_redundant_record_payload

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          raw = json.loads(source.read_text(encoding="utf-8"))
          normalized = normalize_redundant_record_payload(raw)
          target.write_text(
              json.dumps(normalized, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
              then
                NORMALIZE_STATUS=0
              else
                NORMALIZE_STATUS=$?
              fi
            fi

            date -u +%Y-%m-%dT%H:%M:%SZ > "$ATTEMPT_ROOT/finished-at-utc.txt"
            printf '%s\n' "$RECORDER_STATUS" > "$ATTEMPT_ROOT/recorder-exit-status.txt"
            printf '%s\n' "$GAP_WATCH_STATUS" > "$ATTEMPT_ROOT/gap-watch-exit-status.txt"
            printf '%s\n' "$NORMALIZE_STATUS" > "$ATTEMPT_ROOT/normalize-exit-status.txt"

            cp "$ATTEMPT_ROOT/record-transport.json" "$DIAG_ROOT/record-transport.json" || true
            cp "$ATTEMPT_ROOT/record.json" "$DIAG_ROOT/record.json" || true
            cp "$ATTEMPT_ROOT/gap-watch.json" "$DIAG_ROOT/gap-watch.json" || true
            cp "$ATTEMPT_ROOT/started-at-utc.txt" "$DIAG_ROOT/started-at-utc.txt"
            cp "$ATTEMPT_ROOT/finished-at-utc.txt" "$DIAG_ROOT/finished-at-utc.txt"
            cp "$ATTEMPT_ROOT/recorder-exit-status.txt" "$DIAG_ROOT/recorder-exit-status.txt"
            cp "$ATTEMPT_ROOT/gap-watch-exit-status.txt" "$DIAG_ROOT/gap-watch-exit-status.txt"
            cp "$ATTEMPT_ROOT/normalize-exit-status.txt" "$DIAG_ROOT/normalize-exit-status.txt"
            cp "$ATTEMPT_ROOT/recording/recording-session.json" \
              "$DIAG_ROOT/recording-session.json" || true
            cp "$ATTEMPT_ROOT/recording/manifest.json" "$DIAG_ROOT/manifest.json" || true
            if [ -d "$ATTEMPT_ROOT/recording/gaps" ]; then
              cp -R "$ATTEMPT_ROOT/recording/gaps" "$DIAG_ROOT/gaps"
            fi

            if [ "$RECORDER_STATUS" -ne 0 ] \
              || [ "$GAP_WATCH_STATUS" -eq 20 ] \
              || [ "$NORMALIZE_STATUS" -ne 0 ]; then
              rm -rf "$ATTEMPT_ROOT"
              continue
            fi

            if python - "$ATTEMPT_ROOT/record.json" <<'PY'
          import json
          import sys

          record = json.load(open(sys.argv[1], encoding="utf-8"))
          clean = (
              record["gap_count"] == 0
              and record["duplicate_count"] == 0
              and record["anomaly_count"] == 0
              and record["redundant_ws_lane_count"] == 2
              and record["transport_health_semantics"]
                  == "redundant-mainnet-merged-feed-v1"
              and record["live_orders"] is False
              and record["network_access"] is True
          )
          raise SystemExit(0 if clean else 1)
          PY
            then
              CLEAN_ATTEMPT="$ATTEMPT"
              mv "$ATTEMPT_ROOT/recording" evidence-cohort/recording
              cp "$ATTEMPT_ROOT/record.json" evidence-cohort/output/record.json
              cp "$ATTEMPT_ROOT/record-transport.json" \
                evidence-cohort/output/record-transport.json
              cp "$ATTEMPT_ROOT/gap-watch.json" evidence-cohort/output/gap-watch.json || true
              cp "$ATTEMPT_ROOT/started-at-utc.txt" evidence-cohort/output/started-at-utc.txt
              cp "$ATTEMPT_ROOT/finished-at-utc.txt" evidence-cohort/output/finished-at-utc.txt
              printf '%s\n' "$ATTEMPT" > evidence-cohort/output/acquisition-attempt.txt
              rm -rf "$ATTEMPT_ROOT"
              break
            fi
            rm -rf "$ATTEMPT_ROOT"
          done

          git -C campaign-tooling rev-parse HEAD \
            > evidence-cohort/diagnostics/attempt-ledger-revision.txt
          python campaign-tooling/src/cocomelon/ops/attempt_ledger.py \
            --diagnostics-root evidence-cohort/diagnostics \
            --out evidence-cohort/diagnostics/cohort-attempts.json \
            --admitted-attempt "$CLEAN_ATTEMPT" \
            > evidence-cohort/diagnostics/cohort-attempts-command.json

          if [ -z "$CLEAN_ATTEMPT" ]; then
            echo "No merged-gap-free mainnet capture completed in the bounded retry cohort" >&2
            exit 1
          fi

      - name: Validate and replay recorded evidence offline
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        run: |
          set -euo pipefail
          cocomelon validate-recording \
            --root evidence-cohort/recording \
            > evidence-cohort/output/validate.json
          cocomelon freeze-baseline-replay \
            --root evidence-cohort/recording \
            --out evidence-cohort/output/bundle.json \
            --starting-cash 10000 \
            > evidence-cohort/output/freeze.json
          cocomelon run-baseline-replay \
            --bundle evidence-cohort/output/bundle.json \
            --journal evidence-cohort/output/journal.sqlite3 \
            --execution evidence-cohort/output/execution.sqlite3 \
            --facts evidence-cohort/output/facts.sqlite3 \
            > evidence-cohort/output/replay.json
          RUN_ID=$(python -c 'import json; print(json.load(open("evidence-cohort/output/replay.json"))["run_id"])')
          cocomelon freeze-evaluation-dataset \
            --journal evidence-cohort/output/journal.sqlite3 \
            --facts evidence-cohort/output/facts.sqlite3 \
            --run-id "$RUN_ID" \
            > evidence-cohort/output/dataset.json

      - name: Assert pinned paper-only economic evidence semantics
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("evidence-cohort/output")
          record = json.loads((root / "record.json").read_text())
          transport_record = json.loads((root / "record-transport.json").read_text())
          validate = json.loads((root / "validate.json").read_text())
          replay = json.loads((root / "replay.json").read_text())
          dataset = json.loads((root / "dataset.json").read_text())
          bundle = json.loads((root / "bundle.json").read_text())
          expected_revision = os.environ["COHORT_CODE_REVISION"]
          workflow_head = (root / "workflow-head.txt").read_text().strip()
          trigger_head = (root / "trigger-head.txt").read_text().strip()
          acquisition_attempt = int((root / "acquisition-attempt.txt").read_text().strip())

          assert workflow_head == expected_revision
          assert bundle["manifest"]["code_revision"] == expected_revision
          assert len(trigger_head) == 40
          assert trigger_head != expected_revision
          assert acquisition_attempt in (1, 2)

          assert record["network_access"] is True
          assert record["live_orders"] is False
          assert record["gap_count"] == 0
          assert record["duplicate_count"] == 0
          assert record["anomaly_count"] == 0
          assert record["redundant_ws_lane_count"] == 2
          assert record["transport_health_semantics"] == "redundant-mainnet-merged-feed-v1"
          assert record["gap_count"] == transport_record["gap_count"]
          assert record["reconnect_count"] == transport_record["reconnect_count"]
          assert record["transport_duplicate_count"] == transport_record["duplicate_count"]
          assert record["transport_anomaly_count"] == transport_record["anomaly_count"]
          assert record["transport_reconnect_count"] == transport_record["reconnect_count"]

          assert replay["network_access"] is False
          assert replay["live_orders"] is False
          assert "edge" not in replay
          assert "profitable" not in replay

          economic_ineligibility_reasons = []
          if replay["data_complete"] is not True:
              economic_ineligibility_reasons.append("replay_incomplete")
          if dataset["data_complete"] is not True or dataset["gap_refs"] != []:
              economic_ineligibility_reasons.append("dataset_incomplete")
          flat_replay = replay["opened_positions"] == replay["closed_positions"]
          if not flat_replay:
              economic_ineligibility_reasons.append("open_exposure")
          economic_eligible = not economic_ineligibility_reasons

          summary = {
              "evidence_kind": "genuine_public_hyperliquid_mainnet",
              "economic_claim": "none",
              "economic_eligible": economic_eligible,
              "economic_ineligibility_reasons": economic_ineligibility_reasons,
              "campaign_version": "v2-redundant-mainnet",
              "campaign_trigger": os.environ.get("GITHUB_EVENT_NAME", "unknown"),
              "checked_out_code_revision": workflow_head,
              "trigger_head_sha": trigger_head,
              "acquisition_attempt": acquisition_attempt,
              "recording_session_id": record["session_id"],
              "selected_markets": record["selected_markets"],
              "recorded_event_count": record["event_count"],
              "recorded_gap_count": record["gap_count"],
              "recorded_duplicate_count": record["duplicate_count"],
              "recorded_anomaly_count": record["anomaly_count"],
              "recorded_transport_reconnect_count": record["transport_reconnect_count"],
              "recorded_transport_duplicate_count": record["transport_duplicate_count"],
              "recorded_transport_anomaly_count": record["transport_anomaly_count"],
              "redundant_ws_lane_count": record["redundant_ws_lane_count"],
              "transport_health_semantics": record["transport_health_semantics"],
              "validated_segment_count": validate["segment_count"],
              "replay_run_id": replay["run_id"],
              "replay_result_digest": replay["result_digest"],
              "strategy_decisions": replay["strategy_decisions"],
              "risk_approvals": replay["risk_approvals"],
              "risk_rejections": replay["risk_rejections"],
              "execution_attempts": replay["execution_attempts"],
              "fills": replay["fills"],
              "opened_positions": replay["opened_positions"],
              "closed_positions": replay["closed_positions"],
              "closed_trade_count": len(replay["closed_trade_ids"]),
              "final_equity": replay["final_equity"],
              "data_complete": replay["data_complete"],
              "dataset_manifest_id": dataset["dataset_manifest_id"],
              "dataset_trade_count": dataset["trade_count"],
              "excluded_trade_count": dataset["excluded_trade_count"],
          }
          (root / "cohort-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert replay["data_complete"] is True
          assert dataset["data_complete"] is True
          assert dataset["gap_refs"] == []
          assert replay["opened_positions"] == replay["closed_positions"]
          assert economic_eligible is True
          PY

      - name: Upload genuine evidence artifact
        if: ${{ steps.phase9_final.outputs.final_exists != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-genuine-mainnet-evidence-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence-cohort/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6