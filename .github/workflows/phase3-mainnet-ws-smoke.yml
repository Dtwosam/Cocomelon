name: Phase 3 Mainnet WS Smoke

on:
  pull_request:
    paths:
      - scripts/capture_phase3_ws_fixtures.py
      - .github/workflows/phase3-mainnet-ws-smoke.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-websocket-recorder
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run bounded public mainnet stream smoke
        run: cocomelon stream-smoke --seconds 5 --market BTC
      - name: Capture public mainnet WebSocket fixture shapes
        run: python scripts/capture_phase3_ws_fixtures.py --output-dir artifacts/phase3_ws_capture
      - name: Upload exact public fixtures
        uses: actions/upload-artifact@v4
        with:
          name: phase3-mainnet-ws-fixtures
          path: artifacts/phase3_ws_capture
          if-no-files-found: error
          retention-days: 1
      - name: Freeze exact public response fixtures on feature branch
        run: |
          mkdir -p tests/fixtures/hyperliquid_ws
          cp artifacts/phase3_ws_capture/all_mids_native.json tests/fixtures/hyperliquid_ws/
          cp artifacts/phase3_ws_capture/all_mids_hip3.json tests/fixtures/hyperliquid_ws/
          cp artifacts/phase3_ws_capture/l2_book_btc.json tests/fixtures/hyperliquid_ws/
          cp artifacts/phase3_ws_capture/l2_book_hip3.json tests/fixtures/hyperliquid_ws/
          cp artifacts/phase3_ws_capture/trades_btc.json tests/fixtures/hyperliquid_ws/
          cp artifacts/phase3_ws_capture/candle_btc_1m.json tests/fixtures/hyperliquid_ws/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/hyperliquid_ws
          if git diff --cached --quiet; then
            echo "No fixture changes to commit"
          else
            git commit -m "test: anchor Hyperliquid mainnet websocket fixtures"
            git push origin HEAD:phase-3-websocket-recorder
          fi
