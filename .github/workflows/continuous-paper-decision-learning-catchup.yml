name: Continuous Paper Decision Learning Catch-up

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous-paper-decision-learning-catchup.yml"
      - ".github/workflows/continuous-paper-decision-learning-evidence.yml"
      - "src/cocomelon/research/no_trade_forward_opportunity.py"
      - "src/cocomelon/no_trade_forward_opportunity_cli.py"
      - "src/cocomelon/research/no_trade_context_stability.py"
      - "src/cocomelon/no_trade_context_stability_cli.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
      - "Continuous Paper Decision Learning Evidence"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: continuous-paper-decision-learning-catchup
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted decision-learning catch-up control
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Allow normal decision follower to register
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 10

      - name: Find newest decision-learning-capable paper worker
        id: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=100" \
            > /tmp/continuous-paper-runs.json
          RUN_ID="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/continuous-paper-runs.json").read_text(encoding="utf-8")
          )
          runs = sorted(
              payload.get("workflow_runs", []),
              key=lambda item: (item.get("created_at", ""), int(item.get("id", 0))),
              reverse=True,
          )

          def has_valid_decision_source(run):
              run_id = run.get("id")
              attempt = run.get("run_attempt")
              if (
                  not isinstance(run_id, int)
                  or isinstance(attempt, bool)
                  or not isinstance(attempt, int)
                  or attempt <= 0
              ):
                  return False

              jobs_raw = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/jobs?per_page=100",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              jobs_payload = json.loads(jobs_raw.stdout)
              paper_jobs = [
                  job
                  for job in jobs_payload.get("jobs", [])
                  if job.get("name") == "paper"
              ]
              if len(paper_jobs) != 1:
                  return False
              steps = {
                  step.get("name"): step.get("conclusion")
                  for step in paper_jobs[0].get("steps", [])
                  if isinstance(step.get("name"), str)
              }
              required = (
                  "Run continuous paper trader",
                  "Export compact continuous decision facts",
                  "Upload compact continuous decision learning source",
              )
              if not all(steps.get(name) == "success" for name in required):
                  return False

              expected = (
                  f"continuous-paper-decision-learning-source-{run_id}-{attempt}"
              )
              artifacts_raw = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts?per_page=100",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              artifacts = json.loads(artifacts_raw.stdout).get("artifacts", [])
              matches = [
                  item
                  for item in artifacts
                  if item.get("name") == expected
                  and item.get("expired") is False
              ]
              if len(matches) != 1:
                  return False
              digest = matches[0].get("digest")
              return isinstance(digest, str) and digest.startswith("sha256:")

          for run in runs:
              if (
                  run.get("name") != "Continuous Mainnet Paper Trader"
                  or run.get("path") != ".github/workflows/continuous-paper.yml"
                  or run.get("head_branch") != "main"
                  or run.get("status") != "completed"
                  or run.get("conclusion") not in {"success", "failure"}
                  or run.get("event") not in {"push", "workflow_dispatch", "schedule"}
                  or (run.get("head_repository") or {}).get("full_name")
                  != os.environ["GITHUB_REPOSITORY"]
                  or not has_valid_decision_source(run)
              ):
                  continue
              print(run["id"])
              break
          PY
          )"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$RUN_ID" ]; then
            echo "no decision-learning-capable paper worker exists yet"
          else
            echo "newest decision-learning-capable paper worker: $RUN_ID"
          fi

      - name: Restore latest trusted decision-learning receipt
        id: state
        if: ${{ steps.worker.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FORWARD_OPPORTUNITY_SCHEMA_VERSION: "2"
          EXPECTED_CONTEXT_STABILITY_SCHEMA_VERSION: "2"
        run: |
          set -euo pipefail
          /usr/bin/gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=continuous-paper-decision-learning-evidence&per_page=100" \
            > /tmp/decision-learning-artifacts.json
          UPSTREAM_RUN_ID="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/decision-learning-artifacts.json").read_text(
                  encoding="utf-8"
              )
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )

          for artifact in artifacts:
              workflow_run = artifact["workflow_run"]
              run_id = workflow_run.get("id")
              if not isinstance(run_id, int):
                  continue
              run_raw = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(run_raw.stdout)
              if (
                  run.get("path")
                  != ".github/workflows/continuous-paper-decision-learning-evidence.yml"
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
                  or run.get("head_branch") != "main"
                  or run.get("event") not in {"workflow_run", "workflow_dispatch"}
                  or run.get("head_sha") != workflow_run.get("head_sha")
                  or (run.get("head_repository") or {}).get("full_name")
                  != os.environ["GITHUB_REPOSITORY"]
              ):
                  continue
              digest = artifact.get("digest")
              if not isinstance(digest, str) or not digest.startswith("sha256:"):
                  continue

              with tempfile.NamedTemporaryFile(suffix=".zip") as handle:
                  with open(handle.name, "wb") as output:
                      subprocess.run(
                          [
                              "/usr/bin/gh",
                              "api",
                              f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact['id']}/zip",
                          ],
                          check=True,
                          stdout=output,
                      )
                  with zipfile.ZipFile(handle.name) as archive:
                      receipt_names = [
                          name
                          for name in archive.namelist()
                          if name.endswith("source-receipt.json")
                      ]
                      if len(receipt_names) != 1:
                          continue
                      receipt = json.loads(
                          archive.read(receipt_names[0]).decode("utf-8")
                      )

              if (
                  receipt.get("source_kind")
                  != "continuous_paper_decision_learning"
                  or receipt.get("research_only") is not True
                  or receipt.get("promotion_eligible") is not False
                  or receipt.get("execution_ready") is not False
                  or receipt.get("hypothetical_pnl") is not False
                  or receipt.get("cost_complete") is not False
              ):
                  raise SystemExit("trusted decision-learning receipt is invalid")
              expected_schema = int(
                  os.environ["EXPECTED_CONTEXT_STABILITY_SCHEMA_VERSION"]
              )
              if receipt.get("context_stability_schema_version") != expected_schema:
                  continue
              upstream = receipt.get("upstream_run_id")
              if (
                  isinstance(upstream, bool)
                  or not isinstance(upstream, int)
                  or upstream <= 0
              ):
                  raise SystemExit(
                      "trusted decision-learning upstream run id is invalid"
                  )
              print(upstream)
              break
          PY
          )"
          echo "upstream_run_id=$UPSTREAM_RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$UPSTREAM_RUN_ID" ]; then
            echo "no trusted decision-learning receipt exists yet"
          else
            echo "latest trusted decision-learning receipt upstream: $UPSTREAM_RUN_ID"
          fi

      - name: Recover missing decision-learning evidence
        if: ${{ steps.worker.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_WORKER_RUN_ID: ${{ steps.worker.outputs.run_id }}
          LATEST_STATE_UPSTREAM_RUN_ID: ${{ steps.state.outputs.upstream_run_id }}
        run: |
          set -euo pipefail
          if [ "$LATEST_STATE_UPSTREAM_RUN_ID" = "$LATEST_WORKER_RUN_ID" ]; then
            echo "newest decision-capable paper worker is already in decision-learning evidence"
            exit 0
          fi
          if [ -n "$LATEST_STATE_UPSTREAM_RUN_ID" ]; then
            WORKER_CREATED_AT="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$LATEST_WORKER_RUN_ID" \
                --jq '.created_at'
            )"
            STATE_CREATED_AT="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$LATEST_STATE_UPSTREAM_RUN_ID" \
                --jq '.created_at'
            )"
            if [[ "$STATE_CREATED_AT" > "$WORKER_CREATED_AT" || "$STATE_CREATED_AT" == "$WORKER_CREATED_AT" ]]; then
              echo "trusted decision-learning evidence already covers same or newer paper worker"
              exit 0
            fi
          fi

          ACTIVE_SYNC="$(
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper-decision-learning-evidence.yml/runs?per_page=100" \
              --jq '.workflow_runs[]
                | select(.head_branch == "main")
                | select(.status != "completed")
                | [.id, .status, .event]
                | @tsv'
          )"
          if [ -n "$ACTIVE_SYNC" ]; then
            echo "decision-learning evidence sync already active; catch-up skipped"
            printf '%s\n' "$ACTIVE_SYNC"
            exit 0
          fi

          /usr/bin/gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper-decision-learning-evidence.yml/dispatches" \
            -f ref=main \
            -f "inputs[upstream_run_id]=$LATEST_WORKER_RUN_ID"
          echo "dispatched missing decision-learning evidence for $LATEST_WORKER_RUN_ID"
