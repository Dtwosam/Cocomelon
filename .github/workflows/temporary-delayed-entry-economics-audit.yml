name: Temporary delayed-entry economics audit 36694359628

on:
  push:
    branches:
      - audit/delayed-entry-economics-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./journal.sqlite3 \
            ./delayed-entry-execution-shadow-state.json \
            ./delayed-entry-120s-execution-shadow-state.json
          test -s /tmp/state/journal.sqlite3
          test -s /tmp/state/delayed-entry-execution-shadow-state.json
          test -s /tmp/state/delayed-entry-120s-execution-shadow-state.json
      - name: Evaluate exact delayed-entry economics
        run: |
          python - <<'PY' > delayed-entry-economics.json
          import json
          from pathlib import Path

          from cocomelon.journal.store import JournalStore
          from cocomelon.research.delayed_entry_execution_shadow import (
              DelayedEntryOutcome,
          )
          from cocomelon.research.delayed_entry_fill_weighted import (
              delayed_entry_fill_weighted_contribution,
          )
          from cocomelon.research.delayed_entry_pair_fill_weighted import (
              delayed_entry_pair_fill_weighted_summary,
          )

          root=Path("/tmp/state")
          raw60=json.loads(
              (root/"delayed-entry-execution-shadow-state.json").read_text()
          )
          raw120=json.loads(
              (root/"delayed-entry-120s-execution-shadow-state.json").read_text()
          )
          outcomes60=tuple(
              DelayedEntryOutcome.from_payload(x)
              for x in raw60["outcomes"]
          )
          outcomes120=tuple(
              DelayedEntryOutcome.from_payload(x)
              for x in raw120["outcomes"]
          )
          journal=JournalStore(root/"journal.sqlite3")
          try:
              result={
                  "state": {
                      "60s_started_at_ms": raw60["started_at_ms"],
                      "120s_started_at_ms": raw120["started_at_ms"],
                      "60s_outcomes": len(outcomes60),
                      "120s_outcomes": len(outcomes120),
                  },
                  "delay_60s": delayed_entry_fill_weighted_contribution(
                      journal, outcomes60
                  ),
                  "delay_120s": delayed_entry_fill_weighted_contribution(
                      journal, outcomes120
                  ),
                  "paired": delayed_entry_pair_fill_weighted_summary(
                      journal,
                      outcomes60,
                      outcomes120,
                      started_at_ms=max(
                          int(raw60["started_at_ms"]),
                          int(raw120["started_at_ms"]),
                      ),
                  ),
              }
          finally:
              journal.close()
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Summarize delayed-entry economics
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("delayed-entry-economics.json").read_text())
          print("## Delayed-entry economics")
          print(f"- 60s outcomes: {r['state']['60s_outcomes']}")
          print(f"- 120s outcomes: {r['state']['120s_outcomes']}")
          for key,label in (("delay_60s","60s"),("delay_120s","120s")):
              d=r[key]
              o=d["overall"]
              print(f"### {label}")
              print(f"- evaluated: {d['evaluated_delayed_attempts']}")
              print(
                  f"- actual / candidate / delta PnL: "
                  f"{o['actual_net_pnl']} / "
                  f"{o['candidate_fill_weighted_net_pnl']} / "
                  f"{o['delta_net_pnl_estimate']}"
              )
              print(
                  f"- mean actual R / candidate contribution R / delta R: "
                  f"{o['actual_mean_net_r']} / "
                  f"{o['candidate_mean_r_contribution']} / "
                  f"{o['mean_delta_r_contribution']}"
              )
              print(f"- mean fill fraction: {o['mean_fill_fraction']}")
              for side,item in d["by_side"].items():
                  print(
                      f"- {side}: trades={item['trades']} "
                      f"actual={item['actual_net_pnl']} "
                      f"candidate={item['candidate_fill_weighted_net_pnl']} "
                      f"delta={item['delta_net_pnl_estimate']} "
                      f"fill={item['mean_fill_fraction']}"
                  )
          p=r["paired"]
          o=p["overall"]
          print("### 60s vs 120s paired")
          print(f"- paired evaluable: {p['paired_evaluable_attempts']}")
          print(
              f"- actual / 60s / 120s / 120-60: "
              f"{o['actual_net_pnl']} / "
              f"{o['base_fill_weighted_net_pnl']} / "
              f"{o['challenger_fill_weighted_net_pnl']} / "
              f"{o['challenger_minus_base_pnl']}"
          )
          print(
              f"- 120 better / 60 better / equal: "
              f"{o['challenger_better']} / {o['base_better']} / {o['equal']}"
          )
          for side,item in p["by_side"].items():
              print(
                  f"- {side}: trades={item['trades']} "
                  f"60s={item['base_fill_weighted_net_pnl']} "
                  f"120s={item['challenger_fill_weighted_net_pnl']} "
                  f"delta={item['challenger_minus_base_pnl']}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: delayed-entry-economics-36694359628
          path: delayed-entry-economics.json
          if-no-files-found: error
          retention-days: 30
