name: Continuous Mainnet Paper Trader

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/continuous-paper.yml"
      - "pyproject.toml"
      - "scripts/render_continuous_paper_live_status.py"
      - "src/cocomelon/config.py"
      - "src/cocomelon/continuous_paper.py"
      - "src/cocomelon/continuous_paper_cli.py"
      - "src/cocomelon/domain/**"
      - "src/cocomelon/evaluation/**"
      - "src/cocomelon/evidence/**"
      - "src/cocomelon/execution/**"
      - "src/cocomelon/hyperliquid/**"
      - "src/cocomelon/journal/**"
      - "src/cocomelon/risk/**"
      - "src/cocomelon/research/cadence_shadow.py"
      - "src/cocomelon/research/continuous_paper_trade_paths.py"
      - "src/cocomelon/scanner/**"
      - "src/cocomelon/strategies/**"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact predecessor run that published the state being resumed
        required: false
        type: string
      source_run_attempt:
        description: Exact predecessor run attempt
        required: false
        type: string
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      COCOMELON_EXECUTION_MODE: paper
      STATE_ROOT: continuous-paper-state
      LIVE_STATUS_ISSUE: "469"
      PREDECESSOR_RUN_ID: ${{ inputs.source_run_id || '' }}
    steps:
      - name: Skip bootstrap/watchdog when a continuous paper run is already active
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SOURCE_RUN_ID" ]; then
            exit 0
          fi
          ACTIVE="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?per_page=100" |
            python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current = int(os.environ["GITHUB_RUN_ID"])
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("id") != current
              and run.get("status") in {"queued", "in_progress", "pending"}
              and run.get("head_branch") == "main"
          ]
          print(active[0]["id"] if active else "")
          '
          )"
          if [ -n "$ACTIVE" ]; then
            echo "continuous paper runtime already active in run $ACTIVE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - uses: actions/setup-python@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact predecessor state
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id != '' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          printf '%s' "$RUN_JSON" | python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ.get("SOURCE_RUN_ATTEMPT", "")
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("predecessor workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("predecessor must be a main-branch run")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("predecessor repository mismatch")
          if expected_attempt and str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("predecessor run attempt mismatch")
          if run.get("status") not in {"in_progress", "completed"}:
              raise SystemExit("predecessor run status is not resumable")
          '
          ARTIFACT_NAME="continuous-paper-state-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
          ARTIFACT_ID="$(
            python - "$ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          name = sys.argv[1]
          payload = json.loads(Path("/tmp/source-artifacts.json").read_text(encoding="utf-8"))
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one predecessor state artifact named {name}")
          print(matches[0]["id"])
          PY
          )"
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/state.zip
          unzip -q /tmp/state.zip -d "$STATE_ROOT"

      - name: Restore latest trusted state for watchdog/manual recovery
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id == '' }}
        run: |
          set -euo pipefail
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > /tmp/all-artifacts.json
          ARTIFACT_ID="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path("/tmp/all-artifacts.json").read_text(encoding="utf-8"))
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if isinstance(item.get("name"), str)
                  and item["name"].startswith("continuous-paper-state-")
                  and item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(result.stdout)
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(artifact["id"])
                  break
          PY
          )"
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/state.zip
            unzip -q /tmp/state.zip -d "$STATE_ROOT"
          else
            echo "No prior trusted continuous-paper state; starting a fresh paper account."
          fi

      - name: Run continuous paper trader
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          last_status_publish=0
          cocomelon-continuous-paper \
            --state-root "$STATE_ROOT" \
            --duration-seconds 19800 \
            --deep-limit 20 \
            --context-poll-seconds 60 \
            --selection-refresh-seconds 300 \
            --checkpoint-seconds 30 \
            --stop-file /tmp/continuous-paper-upgrade-requested \
            --worker-run-id "$GITHUB_RUN_ID" \
            --worker-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --worker-head-sha "$GITHUB_SHA" \
            | while IFS= read -r line; do
                printf '%s\n' "$line"
                if [[ "$line" != COCOMELON_PAPER_HEARTBEAT\ * ]]; then
                  continue
                fi
                now="$(date +%s)"
                if (( now - last_status_publish < 60 )); then
                  continue
                fi
                heartbeat="${line#COCOMELON_PAPER_HEARTBEAT }"
                git fetch --quiet --depth=1 origin main
                changed_runtime="$(
                  git diff --name-only "$GITHUB_SHA" FETCH_HEAD --                     .github/workflows/continuous-paper.yml                     pyproject.toml                     scripts/render_continuous_paper_live_status.py                     src/cocomelon/config.py                     src/cocomelon/continuous_paper.py                     src/cocomelon/continuous_paper_cli.py                     src/cocomelon/domain                     src/cocomelon/evaluation                     src/cocomelon/evidence                     src/cocomelon/execution                     src/cocomelon/hyperliquid                     src/cocomelon/journal                     src/cocomelon/risk                     src/cocomelon/research/cadence_shadow.py                     src/cocomelon/research/continuous_paper_trade_paths.py                     src/cocomelon/scanner                     src/cocomelon/strategies
                )"
                if [ -n "$changed_runtime" ]; then
                  echo "::notice::new continuous-paper runtime code detected on main; requesting graceful handoff"
                  printf '%s\n' "$changed_runtime"
                  touch /tmp/continuous-paper-upgrade-requested
                fi
                if HEARTBEAT_JSON="$heartbeat" \
                  python scripts/render_continuous_paper_live_status.py \
                  > /tmp/continuous-paper-live.md; then
                  if gh issue edit "$LIVE_STATUS_ISSUE" \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "Continuous Paper Trader — Live Status" \
                    --body-file /tmp/continuous-paper-live.md >/dev/null; then
                    last_status_publish="$now"
                  else
                    echo "::warning::failed to publish continuous paper live status"
                  fi
                else
                  echo "::warning::failed to render continuous paper live status"
                fi
              done | tee continuous-paper-session.json

      - name: Upload durable continuous paper state
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: continuous-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuous-paper-state/
          if-no-files-found: error
          retention-days: 90

      - name: Render paper runtime summary
        if: ${{ always() && steps.guard.outputs.skip != 'true' && hashFiles('continuous-paper-state/session-summary.json') != '' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          payload = json.loads(
              Path("continuous-paper-state/session-summary.json").read_text(encoding="utf-8")
          )
          print("## Continuous mainnet paper trader")
          print(f"- exit reason: {payload['exit_reason']}")
          print(f"- selected markets: {len(payload['selected_markets'])}")
          print(f"- processed records: {payload['processed_records']}")
          print(f"- cumulative closed paper trades: {payload['closed_trades']}")
          print(
              "- closed paper trades this worker: "
              f"{payload.get('session_closed_trades', 0)}"
          )
          print(f"- feature snapshots: {payload.get('feature_snapshot_count', 0)}")
          print(
              "- feature snapshot state digest: "
              f"{payload.get('feature_snapshot_state_digest', 'missing')}"
          )
          print(f"- opening lineage records: {payload.get('opening_lineage_count', 0)}")
          print(
              "- opening lineage state digest: "
              f"{payload.get('opening_lineage_state_digest', 'missing')}"
          )
          print(f"- closed trade paths: {payload.get('trade_path_count', 0)}")
          print(
              "- staged open trade paths: "
              f"{payload.get('trade_path_open_count', 0)}"
          )
          print(
              "- closed trade path state digest: "
              f"{payload.get('trade_path_state_digest', 'missing')}"
          )
          print(
              "- closed trade path capture error: "
              f"{payload.get('trade_path_capture_error')}"
          )
          print(f"- open paper positions: {payload['open_positions']}")
          print(f"- paper equity: {payload['equity']}")
          print(f"- execution healthy: {str(payload['execution_healthy']).lower()}")
          print("- live orders: false")
          PY

  continue:
    needs: paper
    if: ${{ needs.paper.result == 'success' && needs.paper.outputs.skipped != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch next continuous paper worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run continuous-paper.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_run_id=$GITHUB_RUN_ID" \
            -f "source_run_attempt=$GITHUB_RUN_ATTEMPT"
