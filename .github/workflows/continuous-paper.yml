      - "src/cocomelon/research/prospective_context_evidence.py"
      - "src/cocomelon/research/prospective_context_report.py"
      - "src/cocomelon/research/historical_baselines.py"
      - "src/cocomelon/research/historical_features.py"
      - "src/cocomelon/research/historical_learning.py"
      - "src/cocomelon/scanner/**"
      - "src/cocomelon/strategies/**"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact predecessor run that published the state being resumed
        required: false
        type: string
      source_run_attempt:
        description: Exact predecessor run attempt
        required: false
        type: string
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: continuous-mainnet-paper-trader
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      COCOMELON_EXECUTION_MODE: paper
      STATE_ROOT: continuous-paper-state
      LIVE_STATUS_ISSUE: "469"
      PREDECESSOR_RUN_ID: ${{ inputs.source_run_id || '' }}
    steps:
      - name: Skip bootstrap/watchdog when a continuous paper run is already active
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SOURCE_RUN_ID" ]; then
            exit 0
          fi
          ACTIVE="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?per_page=100" |
            python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current = int(os.environ["GITHUB_RUN_ID"])
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("id") != current
              and run.get("status") == "in_progress"
              and run.get("head_branch") == "main"
          ]
          print(active[0]["id"] if active else "")
          '
          )"
          if [ -n "$ACTIVE" ]; then
            echo "continuous paper runtime already active in run $ACTIVE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - uses: actions/setup-python@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact predecessor state
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id != '' }}
        timeout-minutes: 30
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          SOURCE_HEAD_SHA="$(
            printf '%s' "$RUN_JSON" | python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ.get("SOURCE_RUN_ATTEMPT", "")
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("predecessor workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("predecessor must be a main-branch run")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("predecessor repository mismatch")
          if expected_attempt and str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("predecessor run attempt mismatch")
          if run.get("status") not in {"in_progress", "completed"}:
              raise SystemExit("predecessor run status is not resumable")
          head_sha = run.get("head_sha")
          if not isinstance(head_sha, str) or len(head_sha) != 40:
              raise SystemExit("predecessor head sha is invalid")
          print(head_sha)
          '
          )"
          ARTIFACT_NAME="continuous-paper-state-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
          ARTIFACT_ID="$(
            python - "$ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          name = sys.argv[1]
          payload = json.loads(Path("/tmp/source-artifacts.json").read_text(encoding="utf-8"))
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one predecessor state artifact named {name}")
          print(matches[0]["id"])
          PY
          )"
          bash scripts/restore_continuous_paper_state.sh \
            "$ARTIFACT_ID" \
            "$SOURCE_HEAD_SHA" \
            "$STATE_ROOT"

      - name: Restore latest trusted state for watchdog/manual recovery
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id == '' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > /tmp/all-artifacts.json
          ARTIFACT_SELECTION="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path("/tmp/all-artifacts.json").read_text(encoding="utf-8"))
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if isinstance(item.get("name"), str)
                  and item["name"].startswith("continuous-paper-state-")
                  and item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(result.stdout)
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  head_sha = run.get("head_sha")
                  if not isinstance(head_sha, str) or len(head_sha) != 40:
                      continue
                  print(f"{artifact['id']} {head_sha}")
                  break
          PY
          )"
          if [ -n "$ARTIFACT_SELECTION" ]; then
            read -r ARTIFACT_ID ARTIFACT_HEAD_SHA <<< "$ARTIFACT_SELECTION"
            bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$ARTIFACT_HEAD_SHA" \
              "$STATE_ROOT"
          else
            echo "No prior trusted continuous-paper state; starting a fresh paper account."
          fi

      - name: Run continuous paper trader
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          last_status_publish=0

          watch_for_newer_runtime_run() {
            while true; do
              sleep 60
              if ! runs_json="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&per_page=100"
              )"; then
                echo "::warning::failed to query continuous-paper workflow for upgrade watchdog"
                continue
              fi
              replacement_run="$(
                printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current_id = int(os.environ["GITHUB_RUN_ID"])
          runs = payload.get("workflow_runs", [])
          current = next(
              (run for run in runs if run.get("id") == current_id),
              None,
          )
          if current is None:
              print("")
              raise SystemExit(0)
          current_number = int(current.get("run_number", 0))
          newer = [
              run for run in runs
              if run.get("id") != current_id
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") != os.environ["GITHUB_SHA"]
              and run.get("status") in {"queued", "pending", "in_progress"}
              and int(run.get("run_number", 0)) > current_number
          ]
          newer.sort(
              key=lambda run: int(run.get("run_number", 0)),
              reverse=True,
          )
          print(newer[0]["id"] if newer else "")
          '
              )"
              if [ -n "$replacement_run" ]; then
                echo "::notice::newer continuous-paper push run $replacement_run is waiting; requesting graceful handoff independently of heartbeat"
                touch /tmp/continuous-paper-upgrade-requested
                return 0
              fi
            done
          }

          watch_for_newer_runtime_run &
          upgrade_watch_pid=$!
          trap 'kill "$upgrade_watch_pid" 2>/dev/null || true' EXIT

          cocomelon-continuous-paper \
            --state-root "$STATE_ROOT" \
            --duration-seconds 19800 \
            --deep-limit 20 \
            --context-poll-seconds 60 \
            --selection-refresh-seconds 300 \
            --checkpoint-seconds 30 \
            --stop-file /tmp/continuous-paper-upgrade-requested \
            --worker-run-id "$GITHUB_RUN_ID" \
            --worker-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --worker-head-sha "$GITHUB_SHA" \
            | while IFS= read -r line; do
                printf '%s\n' "$line"
                if [[ "$line" != COCOMELON_PAPER_HEARTBEAT\ * ]]; then
                  continue
                fi
                now="$(date +%s)"
                if (( now - last_status_publish < 60 )); then
                  continue
                fi
                heartbeat="${line#COCOMELON_PAPER_HEARTBEAT }"
                git fetch --quiet --depth=1 origin main
                changed_runtime="$(
                  git diff --name-only "$GITHUB_SHA" FETCH_HEAD --                     .github/workflows/continuous-paper.yml                     pyproject.toml                     scripts/render_continuous_paper_live_status.py                     scripts/summarize_continuous_paper_state.py                     scripts/restore_continuous_paper_state.sh                     scripts/stream_zip_member.py                     src/cocomelon/config.py                     src/cocomelon/continuous_paper.py                     src/cocomelon/continuous_paper_cli.py                     src/cocomelon/domain                     src/cocomelon/evaluation                     src/cocomelon/evidence                     src/cocomelon/execution                     src/cocomelon/hyperliquid                     src/cocomelon/journal                     src/cocomelon/risk                     src/cocomelon/research/account_lifecycle_bridge.py                     src/cocomelon/research/cadence_shadow.py                     src/cocomelon/research/cadence_opportunity_learning.py                     src/cocomelon/research/closed_trade_concentration.py                     src/cocomelon/research/closed_trade_friction.py                     src/cocomelon/research/closed_trade_robustness.py                     src/cocomelon/research/closed_trade_stability.py                    src/cocomelon/research/closed_trade_stop_reentry.py                    src/cocomelon/research/prospective_breakeven_profit_lock.py                    src/cocomelon/research/prospective_momentum_band_entry.py                    src/cocomelon/research/prospective_two_strike_stop_filter.py                     src/cocomelon/research/closed_trade_utc_hour.py                     src/cocomelon/research/continuous_paper_trade_paths.py                     src/cocomelon/research/continuous_paper_opening_rank.py                     src/cocomelon/research/continuous_paper_opening_opportunity.py                     src/cocomelon/research/continuous_paper_opening_opportunity_paths.py                     src/cocomelon/research/continuous_paper_opening_opportunity_exit_books.py                     src/cocomelon/research/continuous_paper_replacement_funding.py                     src/cocomelon/research/continuous_paper_drawdown.py                     src/cocomelon/research/delayed_entry_execution_shadow.py                     src/cocomelon/research/delayed_entry_contribution_decomposition.py                     src/cocomelon/research/delayed_entry_fill_capacity.py                     src/cocomelon/research/delayed_entry_fill_weighted.py                     src/cocomelon/research/delayed_entry_fixed_schedule_portfolio.py                     src/cocomelon/research/delayed_entry_mtm_portfolio.py                     src/cocomelon/research/delayed_entry_portfolio_capacity.py                     src/cocomelon/research/delayed_entry_risk_geometry.py                     src/cocomelon/research/delayed_entry_pair.py                     src/cocomelon/research/delayed_entry_pair_fill_weighted.py                     src/cocomelon/research/adaptive_delay_selector.py                     src/cocomelon/research/fill_aware_delay_selector.py                     src/cocomelon/research/delay_selector_comparison.py                     src/cocomelon/research/delayed_entry_same_exit.py                     src/cocomelon/research/entry_decision_age.py                     src/cocomelon/research/entry_markout.py                     src/cocomelon/research/entry_markout_predictiveness.py                     src/cocomelon/research/entry_markout_readiness.py                     src/cocomelon/research/excursion_timing.py                     src/cocomelon/research/entry_mid_markout_shadow.py                     src/cocomelon/research/entry_mid_markout_readiness.py                     src/cocomelon/research/opening_fill_liquidity.py                     src/cocomelon/research/profit_lock_counterfactual.py                     src/cocomelon/research/profit_lock_execution_ledger.py                     src/cocomelon/research/profit_lock_execution_readiness.py                     src/cocomelon/research/profit_lock_execution_shadow.py                     src/cocomelon/research/profit_lock_readiness.py                     src/cocomelon/research/prospective_delayed_price_confirmation.py                     src/cocomelon/research/prospective_entry_filter.py                     src/cocomelon/research/prospective_top10_rank_filter.py                     src/cocomelon/research/prospective_trade_quality.py                     src/cocomelon/research/prospective_side_conditioned_delay.py                     src/cocomelon/research/continuous_paper_learning.py                    src/cocomelon/research/delayed_entry_contribution_decomposition_funding.py                    src/cocomelon/research/delayed_entry_fill_weighted_funding.py                    src/cocomelon/research/delayed_entry_funding.py                    src/cocomelon/research/delayed_entry_same_exit_stop_validity.py                    src/cocomelon/research/delayed_entry_stop_exit_proxy.py                    src/cocomelon/research/delayed_entry_stop_l2_replay.py                    src/cocomelon/research/delayed_entry_stop_survivability.py                    src/cocomelon/research/exact_decimal_aggregation.py                    src/cocomelon/research/learning_feature_snapshots.py                    src/cocomelon/research/original_stop_book_evidence.py                    src/cocomelon/research/outcome_learning.py                    src/cocomelon/research/prospective_allowed_residual.py                    src/cocomelon/research/prospective_combined_entry_filter.py                    src/cocomelon/research/prospective_full_stack_entry_exit.py                    src/cocomelon/research/prospective_full_stack_capacity_reflow.py                    src/cocomelon/research/prospective_consecutive_loss_cooldown_shadow.py                    src/cocomelon/research/prospective_candidate_stack_overlap.py                    src/cocomelon/research/prospective_residual_profit_lock.py                    src/cocomelon/research/prospective_capacity_reflow_opportunities.py                    src/cocomelon/research/prospective_capacity_reflow_fill_feasibility.py                    src/cocomelon/research/prospective_capacity_reflow_forward_markout.py                    src/cocomelon/research/prospective_capacity_reflow_forward_excursion.py                    src/cocomelon/research/prospective_capacity_reflow_exit_fill.py                    src/cocomelon/research/prospective_capacity_reflow_realized_pnl.py                    src/cocomelon/research/prospective_replacement_exit_policy.py                    src/cocomelon/research/prospective_replacement_exit_robustness.py                    src/cocomelon/research/prospective_replacement_exit_readiness.py                    src/cocomelon/research/prospective_capacity_reflow_release_lineage.py                    src/cocomelon/research/prospective_daily_loss_lockout_reflow.py                    src/cocomelon/research/prospective_filter_fixed_schedule.py                    src/cocomelon/research/prospective_filter_robustness.py                    src/cocomelon/research/historical_discovery_freeze.py                    src/cocomelon/research/prospective_context_evidence.py                    src/cocomelon/research/prospective_context_report.py                    src/cocomelon/research/historical_baselines.py                    src/cocomelon/research/historical_features.py                    src/cocomelon/research/historical_learning.py                    src/cocomelon/scanner                     src/cocomelon/strategies
                )"
                if [ -n "$changed_runtime" ]; then
                  echo "::notice::new continuous-paper runtime code detected on main; requesting graceful handoff"
                  printf '%s\n' "$changed_runtime"
                  touch /tmp/continuous-paper-upgrade-requested
                fi
                if printf '%s\n' "$heartbeat" \
                  | python scripts/render_continuous_paper_live_status.py \
                    > /tmp/continuous-paper-live.md; then
                  if gh issue edit "$LIVE_STATUS_ISSUE" \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "Continuous Paper Trader — Live Status" \
                    --body-file /tmp/continuous-paper-live.md >/dev/null; then
                    last_status_publish="$now"
                  else
                    echo "::warning::failed to publish continuous paper live status"
                  fi
                else
                  echo "::warning::failed to render continuous paper live status"
                fi
              done | tee continuous-paper-session.json

      - name: Measure durable continuous paper state
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$STATE_ROOT"
          python scripts/summarize_continuous_paper_state.py \
            "$STATE_ROOT" \
            --json-out /tmp/continuous-paper-state-size.json \
