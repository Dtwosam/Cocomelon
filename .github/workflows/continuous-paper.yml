      - "src/cocomelon/strategies/**"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact predecessor run that published the state being resumed
        required: false
        type: string
      source_run_attempt:
        description: Exact predecessor run attempt
        required: false
        type: string
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: continuous-mainnet-paper-trader-${{ inputs.source_run_id || 'guarded' }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      COCOMELON_EXECUTION_MODE: paper
      STATE_ROOT: continuous-paper-state
      LIVE_STATUS_ISSUE: "469"
      PREDECESSOR_RUN_ID: ${{ inputs.source_run_id || '' }}
    steps:
      - name: Skip bootstrap/watchdog when a continuous paper run is already active
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SOURCE_RUN_ID" ]; then
            exit 0
          fi
          ACTIVE="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?per_page=100" |
            python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current = int(os.environ["GITHUB_RUN_ID"])
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("id") != current
              and run.get("status") in {"queued", "pending", "in_progress"}
              and run.get("head_branch") == "main"
          ]
          print(active[0]["id"] if active else "")
          '
          )"
          if [ -n "$ACTIVE" ]; then
            echo "continuous paper runtime already active in run $ACTIVE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::notice::holding runtime push rendezvous for active worker handoff"
              sleep 75
            fi
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - uses: actions/setup-python@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact predecessor state
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id != '' }}
        timeout-minutes: 30
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          SOURCE_HEAD_SHA="$(
            printf '%s' "$RUN_JSON" | python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ.get("SOURCE_RUN_ATTEMPT", "")
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("predecessor workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("predecessor must be a main-branch run")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("predecessor repository mismatch")
          if expected_attempt and str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("predecessor run attempt mismatch")
          status = run.get("status")
          if status not in {"in_progress", "completed"}:
              raise SystemExit("predecessor run status is not resumable")
          if (
              status == "completed"
              and run.get("conclusion") not in {"success", "failure"}
          ):
              raise SystemExit(
                  "completed predecessor run must be success or failure"
              )
          head_sha = run.get("head_sha")
          if not isinstance(head_sha, str) or len(head_sha) != 40:
              raise SystemExit("predecessor head sha is invalid")
          print(head_sha)
          '
          )"
          RESUME_ARTIFACT_NAME="continuous-paper-resume-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          STATE_ARTIFACT_NAME="continuous-paper-state-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
          ARTIFACT_SELECTION="$(
            python - "$RESUME_ARTIFACT_NAME" "$STATE_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          resume_name, state_name = sys.argv[1:3]
          payload = json.loads(Path("/tmp/source-artifacts.json").read_text(encoding="utf-8"))
          by_name = {
              item.get("name"): item
              for item in payload.get("artifacts", [])
              if item.get("expired") is False
          }
          resume = by_name.get(resume_name)
          if isinstance(resume, dict):
              print(
                  f"{resume['id']} continuous-paper-resume.tar.zst"
              )
              raise SystemExit(0)
          state = by_name.get(state_name)
          if not isinstance(state, dict):
              raise SystemExit(
                  "expected exact predecessor resume or durable state artifact"
              )
          print(f"{state['id']} -")
          PY
          )"
          read -r ARTIFACT_ID ARTIFACT_MEMBER <<< "$ARTIFACT_SELECTION"
          if [ "$ARTIFACT_MEMBER" = "continuous-paper-resume.tar.zst" ]; then
            if ! bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$SOURCE_HEAD_SHA" \
              "$STATE_ROOT" \
              "$ARTIFACT_MEMBER"; then
              echo "::warning::fast resume restore failed; waiting for exact durable fallback"
              DURABLE_ARTIFACT_ID=""
              for poll in $(seq 1 40); do
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
                DURABLE_ARTIFACT_ID="$(
                  python - "$STATE_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          name = sys.argv[1]
          payload = json.loads(
              Path("/tmp/source-artifacts.json").read_text(encoding="utf-8")
          )
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == name
              and item.get("expired") is False
          ]
          print(matches[0]["id"] if len(matches) == 1 else "")
          PY
                )"
                if [ -n "$DURABLE_ARTIFACT_ID" ]; then
                  break
                fi
                echo "::notice::durable fallback not published yet ($poll/40)"
                sleep 15
              done
              if [ -z "$DURABLE_ARTIFACT_ID" ]; then
                echo "exact predecessor durable fallback did not appear" >&2
                exit 1
              fi
              bash scripts/restore_continuous_paper_state.sh \
                "$DURABLE_ARTIFACT_ID" \
                "$SOURCE_HEAD_SHA" \
                "$STATE_ROOT"
            fi
          else
            bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$SOURCE_HEAD_SHA" \
              "$STATE_ROOT"
          fi

      - name: Restore latest trusted state for watchdog/manual recovery
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id == '' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > /tmp/all-artifacts.json
          ARTIFACT_SELECTION="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path("/tmp/all-artifacts.json").read_text(encoding="utf-8"))
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if isinstance(item.get("name"), str)
                  and item["name"].startswith("continuous-paper-state-")
                  and item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(result.stdout)
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("status") == "completed"
                  and run.get("conclusion") in {"success", "failure"}
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  head_sha = run.get("head_sha")
                  if not isinstance(head_sha, str) or len(head_sha) != 40:
                      continue
                  print(f"{artifact['id']} {head_sha}")
                  break
          PY
          )"
          if [ -n "$ARTIFACT_SELECTION" ]; then
            read -r ARTIFACT_ID ARTIFACT_HEAD_SHA <<< "$ARTIFACT_SELECTION"
            bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$ARTIFACT_HEAD_SHA" \
              "$STATE_ROOT"
          else
            echo "No prior trusted continuous-paper state; starting a fresh paper account."
          fi

      - name: Run continuous paper trader
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          last_status_publish=0

          request_runtime_handoff() {
            local trader_pid="$1"
            local replacement_run="$2"

            echo "::notice::newer continuous-paper push run $replacement_run is waiting; requesting graceful handoff independently of heartbeat"
            touch /tmp/continuous-paper-upgrade-requested

            for _ in $(seq 1 120); do
              if ! kill -0 "$trader_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done

            echo "::warning::continuous-paper runtime did not honor graceful handoff within 120s; interrupting worker"
            kill -INT "$trader_pid" 2>/dev/null || return 0
            for _ in $(seq 1 30); do
              if ! kill -0 "$trader_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done

            echo "::error::continuous-paper runtime remained alive after SIGINT; terminating worker so durable state handoff can proceed"
            kill -TERM "$trader_pid" 2>/dev/null || return 0
            for _ in $(seq 1 10); do
              if ! kill -0 "$trader_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            kill -KILL "$trader_pid" 2>/dev/null || true
          }

          watch_for_newer_runtime_run() {
            local trader_pid="$1"
            while true; do
              sleep 60
              if ! runs_json="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&per_page=100"
              )"; then
                echo "::warning::failed to query continuous-paper workflow for upgrade watchdog"
                continue
              fi
              replacement_run="$(
                printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current_id = int(os.environ["GITHUB_RUN_ID"])
          runs = payload.get("workflow_runs", [])
          current = next(
              (run for run in runs if run.get("id") == current_id),
              None,
          )
          if current is None:
              print("")
              raise SystemExit(0)
          current_number = int(current.get("run_number", 0))
          newer = [
              run for run in runs
              if run.get("id") != current_id
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") != os.environ["GITHUB_SHA"]
              and int(run.get("run_number", 0)) > current_number
          ]
          newer.sort(
              key=lambda run: int(run.get("run_number", 0)),
              reverse=True,
          )
          print(newer[0]["id"] if newer else "")
          '
              )"
              if [ -n "$replacement_run" ]; then
                request_runtime_handoff "$trader_pid" "$replacement_run"
                return 0
              fi
            done
          }

          output_fifo="/tmp/continuous-paper-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -f "$output_fifo"
          mkfifo "$output_fifo"
          trader_pid=""
          upgrade_watch_pid=""

          cleanup_runtime_processes() {
            if [ -n "$upgrade_watch_pid" ]; then
              kill "$upgrade_watch_pid" 2>/dev/null || true
            fi
            if [ -n "$trader_pid" ] && kill -0 "$trader_pid" 2>/dev/null; then
              kill -TERM "$trader_pid" 2>/dev/null || true
            fi
            rm -f "$output_fifo"
          }
          trap cleanup_runtime_processes EXIT

          cocomelon-continuous-paper \
            --state-root "$STATE_ROOT" \
            --duration-seconds 19800 \
            --deep-limit 20 \
            --context-poll-seconds 30 \
            --websocket-server-silence-timeout-ms 15000 \
            --websocket-redundant-lane-reconnect-stagger-ms 5000 \
            --websocket-l2-failover-headroom-ms 1000 \
            --selection-refresh-seconds 300 \
            --checkpoint-seconds 30 \
            --stop-file /tmp/continuous-paper-upgrade-requested \
            --worker-run-id "$GITHUB_RUN_ID" \
            --worker-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --worker-head-sha "$GITHUB_SHA" \
            > "$output_fifo" &
          trader_pid=$!

          watch_for_newer_runtime_run "$trader_pid" &
          upgrade_watch_pid=$!

          set +e
          while IFS= read -r line; do
                printf '%s\n' "$line"
                if [[ "$line" != COCOMELON_PAPER_HEARTBEAT\ * ]]; then
                  continue
                fi
                now="$(date +%s)"
                if (( now - last_status_publish < 60 )); then
                  continue
                fi
                heartbeat="${line#COCOMELON_PAPER_HEARTBEAT }"
                git fetch --quiet --depth=1 origin main
                changed_runtime="$(
