name: Continuous Mainnet Paper Trader

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact predecessor run that published the state being resumed
        required: false
        type: string
      source_run_attempt:
        description: Exact predecessor run attempt
        required: false
        type: string
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      COCOMELON_EXECUTION_MODE: paper
      STATE_ROOT: continuous-paper-state
    steps:
      - name: Skip bootstrap/watchdog when a continuous paper run is already active
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_run_id }}" ]; then
            exit 0
          fi
          ACTIVE="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?per_page=100" |
            python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current = int(os.environ["GITHUB_RUN_ID"])
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("id") != current
              and run.get("status") in {"queued", "in_progress", "pending"}
              and run.get("head_branch") == "main"
          ]
          print(active[0]["id"] if active else "")
          '
          )"
          if [ -n "$ACTIVE" ]; then
            echo "continuous paper runtime already active in run $ACTIVE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - uses: actions/setup-python@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact predecessor state
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id != '' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          printf '%s' "$RUN_JSON" | python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ.get("SOURCE_RUN_ATTEMPT", "")
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("predecessor workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("predecessor must be a main-branch run")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("predecessor repository mismatch")
          if expected_attempt and str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("predecessor run attempt mismatch")
          if run.get("status") not in {"in_progress", "completed"}:
              raise SystemExit("predecessor run status is not resumable")
          '
          ARTIFACT_NAME="continuous-paper-state-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
          ARTIFACT_ID="$(
            python - "$ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          name = sys.argv[1]
          payload = json.loads(Path("/tmp/source-artifacts.json").read_text(encoding="utf-8"))
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one predecessor state artifact named {name}")
          print(matches[0]["id"])
          PY
          )"
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/state.zip
          unzip -q /tmp/state.zip -d "$STATE_ROOT"

      - name: Restore latest trusted state for watchdog/manual recovery
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id == '' }}
        run: |
          set -euo pipefail
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > /tmp/all-artifacts.json
          ARTIFACT_ID="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path("/tmp/all-artifacts.json").read_text(encoding="utf-8"))
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if isinstance(item.get("name"), str)
                  and item["name"].startswith("continuous-paper-state-")
                  and item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(result.stdout)
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(artifact["id"])
                  break
          PY
          )"
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/state.zip
            unzip -q /tmp/state.zip -d "$STATE_ROOT"
          else
            echo "No prior trusted continuous-paper state; starting a fresh paper account."
          fi

      - name: Run continuous paper trader
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          cocomelon-continuous-paper             --state-root "$STATE_ROOT"             --duration-seconds 19800             --deep-limit 20             --context-poll-seconds 60             --selection-refresh-seconds 300             --checkpoint-seconds 30             | tee continuous-paper-session.json

      - name: Upload durable continuous paper state
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: continuous-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuous-paper-state/
          if-no-files-found: error
          retention-days: 90

      - name: Render paper runtime summary
        if: ${{ always() && steps.guard.outputs.skip != 'true' && hashFiles('continuous-paper-state/session-summary.json') != '' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          payload = json.loads(
              Path("continuous-paper-state/session-summary.json").read_text(encoding="utf-8")
          )
          print("## Continuous mainnet paper trader")
          print(f"- selected markets: {len(payload['selected_markets'])}")
          print(f"- processed records: {payload['processed_records']}")
          print(f"- closed paper trades: {payload['closed_trades']}")
          print(f"- open paper positions: {payload['open_positions']}")
          print(f"- paper equity: {payload['equity']}")
          print(f"- execution healthy: {str(payload['execution_healthy']).lower()}")
          print("- live orders: false")
          PY

  continue:
    needs: paper
    if: ${{ needs.paper.result == 'success' && needs.paper.outputs.skipped != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch next continuous paper worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run continuous-paper.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_run_id=$GITHUB_RUN_ID" \
            -f "source_run_attempt=$GITHUB_RUN_ATTEMPT"
