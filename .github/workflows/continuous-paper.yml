          if [ -s "$freeze_path" ]; then
            python - "$freeze_path" <<'PY'
          import sys
          from cocomelon.research.loss_context_candidate import (
              verify_loss_context_candidate_freeze,
          )

          freeze = verify_loss_context_candidate_freeze(sys.argv[1])
          print(f"existing loss-context freeze: {freeze.candidate_id}")
          PY
            echo "restored=local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=continuous-paper-loss-context-candidate&per_page=100"             > /tmp/loss-context-artifacts.json
          artifact_id="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/loss-context-artifacts.json").read_text(
                  encoding="utf-8"
              )
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(result.stdout)
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("status") == "completed"
                  and run.get("conclusion") in {"success", "failure"}
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(artifact["id"])
                  break
          PY
          )"
