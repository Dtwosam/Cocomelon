  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact predecessor run that published the state being resumed
        required: false
        type: string
      source_run_attempt:
        description: Exact predecessor run attempt
        required: false
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: continuous-mainnet-paper-trader-${{ inputs.source_run_id || 'guarded' }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      COCOMELON_EXECUTION_MODE: paper
      STATE_ROOT: continuous-paper-state
      LIVE_STATUS_ISSUE: "469"
      PREDECESSOR_RUN_ID: ${{ inputs.source_run_id || '' }}
    steps:
      - name: Skip bootstrap/watchdog when a continuous paper run is already active
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          guard_runs_loaded=false
          for attempt in $(seq 1 8); do
            if gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?per_page=100" \
              > /tmp/continuous-paper-guard-runs.json; then
              guard_runs_loaded=true
              break
            fi
            echo "::warning::continuous-paper guard API unavailable ($attempt/8)"
            sleep 15
          done
          if [ "$guard_runs_loaded" != "true" ]; then
            echo "::error::continuous-paper guard could not read workflow state"
            exit 1
          fi
          ACTIVE="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/continuous-paper-guard-runs.json").read_text(
                  encoding="utf-8"
              )
          )
          current = int(os.environ["GITHUB_RUN_ID"])
          current_head = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]

          for run in payload.get("workflow_runs", []):
              run_id = run.get("id")
              if (
                  run_id == current
                  or not isinstance(run_id, int)
                  or run.get("head_branch") != "main"
              ):
                  continue
              status = run.get("status")
              if status in {"queued", "pending"}:
                  # A push/scheduled guard-only workflow can remain queued
                  # behind an older paper run's deferred research tail.
                  # It has no trader step and must never veto an exact
                  # predecessor-state handoff. When that speculative run
                  # starts, its own guard will see the real successor.
                  if (
                      os.environ.get("SOURCE_RUN_ID")
                      and run.get("event") in {"push", "schedule"}
                  ):
                      print(
                          "::notice::exact successor ignores queued "
                          f"speculative {run.get('event')} run {run_id}",
                          file=sys.stderr,
                      )
                      continue
                  if (
                      run_id < current
                      and run.get("head_sha") != current_head
                  ):
                      print(
                          "::notice::ignoring stale queued/pending "
                          f"continuous-paper run {run_id} from older head",
                          file=sys.stderr,
                      )
                      continue
                  print(run_id)
                  break
              if status != "in_progress":
                  continue

              jobs_raw = None
              for attempt in range(1, 7):
                  candidate = subprocess.run(
                      [
                          "gh",
                          "api",
                          f"repos/{repository}/actions/runs/{run_id}/jobs?per_page=100",
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  if candidate.returncode == 0:
                      jobs_raw = candidate
                      break
                  print(
                      "::warning::continuous-paper guard job API unavailable "
                      f"for {run_id} ({attempt}/6)",
                      file=sys.stderr,
                  )
                  import time
                  time.sleep(10)
              if jobs_raw is None:
                  raise SystemExit(
                      "continuous-paper guard could not inspect active run jobs"
                  )
              jobs = json.loads(jobs_raw.stdout).get("jobs", [])
              paper_jobs = [
                  job for job in jobs if job.get("name") == "paper"
              ]
              if len(paper_jobs) != 1:
                  # Fail safe while a new run is still materializing.
                  print(run_id)
                  break
              steps = {
                  step.get("name"): step.get("status")
                  for step in paper_jobs[0].get("steps", [])
                  if isinstance(step.get("name"), str)
              }
              trader_status = steps.get("Run continuous paper trader")
              # GitHub skipped steps have status=completed and
              # conclusion=skipped; never compare status to "skipped".
              skipped_checkout = any(
                  step.get("name") == "Run actions/checkout@v7"
                  and step.get("conclusion") == "skipped"
                  for step in paper_jobs[0].get("steps", [])
              )
              # A guarded push may still have an in_progress job after
              # deciding to skip every runtime step. It must not prevent
              # an exact-state successor from starting.
              if skipped_checkout:
                  continue
              if trader_status is None:
                  # Startup before the trader step is visible is still active.
                  print(run_id)
                  break
              if trader_status in {"queued", "pending", "in_progress"}:
                  print(run_id)
                  break
              # The workflow may remain in_progress for deferred research
              # after trading has stopped. That tail must not block recovery.
          PY
          )"
          if [ -n "$ACTIVE" ]; then
            echo "continuous paper runtime already active in run $ACTIVE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Do not keep a skipped push run alive. An exact successor
            # dispatched after its predecessor exits could otherwise see
            # this guard-only job as an active trader and skip itself.
            # The running worker's independent upgrade watchdog detects
            # historical main-branch push run IDs even after they finish.
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - uses: actions/setup-python@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact predecessor state
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id != '' }}
        timeout-minutes: 30
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          SOURCE_HEAD_SHA="$(
            printf '%s' "$RUN_JSON" | python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          expected_attempt = os.environ.get("SOURCE_RUN_ATTEMPT", "")
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("predecessor workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("predecessor must be a main-branch run")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("predecessor repository mismatch")
          if expected_attempt and str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit("predecessor run attempt mismatch")
          status = run.get("status")
          if status not in {"in_progress", "completed"}:
              raise SystemExit("predecessor run status is not resumable")
          if (
              status == "completed"
              and run.get("conclusion") not in {"success", "failure"}
          ):
              raise SystemExit(
                  "completed predecessor run must be success or failure"
              )
          head_sha = run.get("head_sha")
          if not isinstance(head_sha, str) or len(head_sha) != 40:
              raise SystemExit("predecessor head sha is invalid")
          print(head_sha)
          '
          )"
          RESUME_ARTIFACT_NAME="continuous-paper-resume-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          STATE_ARTIFACT_NAME="continuous-paper-state-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
          ARTIFACT_SELECTION="$(
            python - "$RESUME_ARTIFACT_NAME" "$STATE_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          resume_name, state_name = sys.argv[1:3]
          payload = json.loads(Path("/tmp/source-artifacts.json").read_text(encoding="utf-8"))
          by_name = {
              item.get("name"): item
              for item in payload.get("artifacts", [])
              if item.get("expired") is False
          }
          resume = by_name.get(resume_name)
          if isinstance(resume, dict):
              print(
                  f"{resume['id']} continuous-paper-resume.tar.zst"
              )
              raise SystemExit(0)
          state = by_name.get(state_name)
          if not isinstance(state, dict):
              raise SystemExit(
                  "expected exact predecessor resume or durable state artifact"
              )
          print(f"{state['id']} -")
          PY
          )"
          read -r ARTIFACT_ID ARTIFACT_MEMBER <<< "$ARTIFACT_SELECTION"
          if [ "$ARTIFACT_MEMBER" = "continuous-paper-resume.tar.zst" ]; then
            if ! bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$SOURCE_HEAD_SHA" \
              "$STATE_ROOT" \
              "$ARTIFACT_MEMBER"; then
              echo "::warning::fast resume restore failed; waiting for exact durable fallback"
              DURABLE_ARTIFACT_ID=""
              for poll in $(seq 1 40); do
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/source-artifacts.json
                DURABLE_ARTIFACT_ID="$(
                  python - "$STATE_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          name = sys.argv[1]
          payload = json.loads(
              Path("/tmp/source-artifacts.json").read_text(encoding="utf-8")
          )
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == name
              and item.get("expired") is False
          ]
          print(matches[0]["id"] if len(matches) == 1 else "")
          PY
                )"
                if [ -n "$DURABLE_ARTIFACT_ID" ]; then
                  break
                fi
                echo "::notice::durable fallback not published yet ($poll/40)"
                sleep 15
              done
              if [ -z "$DURABLE_ARTIFACT_ID" ]; then
                echo "exact predecessor durable fallback did not appear" >&2
                exit 1
              fi
              bash scripts/restore_continuous_paper_state.sh \
                "$DURABLE_ARTIFACT_ID" \
                "$SOURCE_HEAD_SHA" \
                "$STATE_ROOT"
            fi
          else
            bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$SOURCE_HEAD_SHA" \
              "$STATE_ROOT"
          fi

      - name: Restore latest trusted state for watchdog/manual recovery
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.source_run_id == '' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$STATE_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > /tmp/all-artifacts.json
          ARTIFACT_SELECTION="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path("/tmp/all-artifacts.json").read_text(encoding="utf-8"))
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if isinstance(item.get("name"), str)
                  and item["name"].startswith("continuous-paper-state-")
                  and item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(result.stdout)
              if not (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  continue
              if run.get("status") == "in_progress":
                  # Post-handoff research can keep a workflow in_progress
                  # for hours AFTER the trader and durable state upload
                  # have succeeded. Those artifacts are valid recovery
                  # sources and must beat older completed snapshots.
                  jobs_response = subprocess.run(
                      [
                          "gh", "api",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/jobs?per_page=100",
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  jobs = json.loads(jobs_response.stdout).get("jobs", [])
                  paper_jobs = [
                      job for job in jobs if job.get("name") == "paper"
                  ]
                  if len(paper_jobs) != 1:
                      continue
                  successful_steps = {
                      step.get("name")
                      for step in paper_jobs[0].get("steps", [])
                      if step.get("status") == "completed"
                      and step.get("conclusion") == "success"
                  }
                  if not {
                      "Run continuous paper trader",
                      "Pack durable continuous paper state",
                      "Upload durable continuous paper state",
                  } <= successful_steps:
                      continue
              elif not (
                  run.get("status") == "completed"
                  and run.get("conclusion") in {"success", "failure"}
              ):
                  continue
              head_sha = run.get("head_sha")
              if not isinstance(head_sha, str) or len(head_sha) != 40:
                  continue
              print(f"{artifact['id']} {head_sha}")
              break
          PY
          )"
          if [ -n "$ARTIFACT_SELECTION" ]; then
            read -r ARTIFACT_ID ARTIFACT_HEAD_SHA <<< "$ARTIFACT_SELECTION"
            bash scripts/restore_continuous_paper_state.sh \
              "$ARTIFACT_ID" \
              "$ARTIFACT_HEAD_SHA" \
              "$STATE_ROOT"
          else
            echo "No prior trusted continuous-paper state; starting a fresh paper account."
          fi

      - name: Restore immutable loss-context shadow candidate for runtime
        id: loss_context_shadow_runtime_restore
        if: ${{ steps.guard.outputs.skip != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          freeze_path="$STATE_ROOT/loss-context-portfolio-shadow-freeze.json"
          if [ -s "$freeze_path" ]; then
            python - "$freeze_path" <<'PY'
          import sys
          from cocomelon.research.loss_context_portfolio_shadow_candidate import (
              verify_loss_context_portfolio_shadow_freeze,
          )

          freeze = verify_loss_context_portfolio_shadow_freeze(sys.argv[1])
          print(f"existing runtime portfolio shadow freeze: {freeze.candidate_id}")
          PY
            echo "restored=local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=continuous-paper-loss-context-portfolio-shadow-candidate&per_page=100"             > /tmp/loss-context-runtime-shadow-artifacts.json

          artifact_id="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path(
                  "/tmp/loss-context-runtime-shadow-artifacts.json"
              ).read_text(encoding="utf-8")
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  continue
              run = json.loads(result.stdout)
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("status") == "completed"
                  and run.get("conclusion") in {"success", "failure"}
                  and run.get("head_branch") == "main"
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(artifact["id"])
                  break
          PY
          )"

          if [ -z "$artifact_id" ]; then
            echo "no trusted frozen loss-context portfolio shadow candidate yet"
            echo "restored=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf /tmp/loss-context-runtime-shadow
          mkdir -p /tmp/loss-context-runtime-shadow
          gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > /tmp/loss-context-runtime-shadow.zip
          unzip -q /tmp/loss-context-runtime-shadow.zip             -d /tmp/loss-context-runtime-shadow
          source_freeze="$(
            find /tmp/loss-context-runtime-shadow               -type f               -name loss-context-portfolio-shadow-freeze.json               -print               -quit
          )"
          if [ -z "$source_freeze" ]; then
            echo "trusted shadow candidate artifact is missing freeze" >&2
            exit 1
          fi
          cp "$source_freeze" "$freeze_path"
          python - "$freeze_path" <<'PY'
          import sys
          from cocomelon.research.loss_context_portfolio_shadow_candidate import (
              verify_loss_context_portfolio_shadow_freeze,
          )

          freeze = verify_loss_context_portfolio_shadow_freeze(sys.argv[1])
          print(f"restored runtime portfolio shadow freeze: {freeze.candidate_id}")
          PY
          echo "restored=artifact" >> "$GITHUB_OUTPUT"

      - name: Anchor immutable forward-only loss-context cohort
        id: forward_loss_context_anchor
        if: ${{ steps.guard.outputs.skip != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m cocomelon.research.loss_context_prospective_cohort anchor \
            --state-root "$STATE_ROOT" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-head-sha "$GITHUB_SHA"
          test -s "$STATE_ROOT/loss-context-forward-cohort-anchor.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run continuous paper trader
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          last_status_publish=0

          request_runtime_handoff() {
            local trader_pid="$1"
            local replacement_run="$2"

            echo "::notice::newer continuous-paper push run $replacement_run is waiting; requesting graceful handoff independently of heartbeat"
            touch /tmp/continuous-paper-upgrade-requested

            for _ in $(seq 1 120); do
              if ! kill -0 "$trader_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done

            echo "::warning::continuous-paper runtime did not honor graceful handoff within 120s; interrupting worker"
            kill -INT "$trader_pid" 2>/dev/null || return 0
            for _ in $(seq 1 30); do
              if ! kill -0 "$trader_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done

            echo "::error::continuous-paper runtime remained alive after SIGINT; terminating worker so durable state handoff can proceed"
            kill -TERM "$trader_pid" 2>/dev/null || return 0
            for _ in $(seq 1 10); do
              if ! kill -0 "$trader_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            kill -KILL "$trader_pid" 2>/dev/null || true
          }

          watch_for_newer_runtime_run() {
            local trader_pid="$1"
            while true; do
              sleep 60
              if ! runs_json="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&per_page=100"
              )"; then
                echo "::warning::failed to query continuous-paper workflow for upgrade watchdog"
                continue
              fi
              replacement_run="$(
                printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          current_id = int(os.environ["GITHUB_RUN_ID"])
          runs = payload.get("workflow_runs", [])
          current = next(
              (run for run in runs if run.get("id") == current_id),
              None,
          )
          if current is None:
              print("")
              raise SystemExit(0)
          current_number = int(current.get("run_number", 0))
          newer = [
              run for run in runs
              if run.get("id") != current_id
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") != os.environ["GITHUB_SHA"]
              and int(run.get("run_number", 0)) > current_number
          ]
          newer.sort(
              key=lambda run: int(run.get("run_number", 0)),
              reverse=True,
          )
          print(newer[0]["id"] if newer else "")
          '
              )"
              if [ -n "$replacement_run" ]; then
                request_runtime_handoff "$trader_pid" "$replacement_run"
                return 0
              fi
            done
          }

          output_fifo="/tmp/continuous-paper-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -f "$output_fifo"
          mkfifo "$output_fifo"
          trader_pid=""
          upgrade_watch_pid=""

          cleanup_runtime_processes() {
            if [ -n "$upgrade_watch_pid" ]; then
              kill "$upgrade_watch_pid" 2>/dev/null || true
            fi
            if [ -n "$trader_pid" ] && kill -0 "$trader_pid" 2>/dev/null; then
              kill -TERM "$trader_pid" 2>/dev/null || true
            fi
            rm -f "$output_fifo"
          }
          trap cleanup_runtime_processes EXIT

          cocomelon-continuous-paper \
            --state-root "$STATE_ROOT" \
            --duration-seconds 19800 \
            --deep-limit 20 \
            --context-poll-seconds 30 \
            --websocket-server-silence-timeout-ms 4000 \
            --websocket-redundant-lane-reconnect-stagger-ms 5000 \
            --websocket-l2-failover-headroom-ms 2000 \
            --selection-refresh-seconds 300 \
            --checkpoint-seconds 30 \
            --stop-file /tmp/continuous-paper-upgrade-requested \
            --worker-run-id "$GITHUB_RUN_ID" \
            --worker-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --worker-head-sha "$GITHUB_SHA" \
            > "$output_fifo" &
          trader_pid=$!

          watch_for_newer_runtime_run "$trader_pid" &
          upgrade_watch_pid=$!

          set +e
          while IFS= read -r line; do
                printf '%s\n' "$line"
                if [[ "$line" != COCOMELON_PAPER_HEARTBEAT\ * ]]; then
                  continue
                fi
                now="$(date +%s)"
                if (( now - last_status_publish < 60 )); then
                  continue
                fi
                heartbeat="${line#COCOMELON_PAPER_HEARTBEAT }"
                git fetch --quiet --depth=1 origin main
                changed_runtime="$(
                  git diff --name-only "$GITHUB_SHA" FETCH_HEAD --                     .github/workflows/continuous-paper.yml                     pyproject.toml                     scripts/render_continuous_paper_live_status.py                     scripts/summarize_continuous_paper_state.py                     scripts/restore_continuous_paper_state.sh                     scripts/stream_zip_member.py                     src/cocomelon/config.py                     src/cocomelon/continuous_paper.py                     src/cocomelon/continuous_paper_cli.py                     src/cocomelon/domain                     src/cocomelon/evaluation                     src/cocomelon/evidence                     src/cocomelon/execution                     src/cocomelon/hyperliquid                     src/cocomelon/journal                     src/cocomelon/risk                     src/cocomelon/research/account_lifecycle_bridge.py                     src/cocomelon/research/cadence_shadow.py                     src/cocomelon/research/cadence_opportunity_learning.py                     src/cocomelon/research/closed_trade_concentration.py                     src/cocomelon/research/closed_trade_friction.py                     src/cocomelon/research/closed_trade_lifecycle_economics.py                     src/cocomelon/research/closed_trade_robustness.py                     src/cocomelon/research/closed_trade_stability.py                    src/cocomelon/research/closed_trade_stop_reentry.py                    src/cocomelon/research/post_freshness_paper_cohort.py                    src/cocomelon/research/prospective_breakeven_profit_lock.py                    src/cocomelon/research/prospective_profit_target_one_r_comparison.py                    src/cocomelon/research/prospective_profit_trailing_grid.py                    src/cocomelon/research/prospective_net_reserved_trailing.py                    src/cocomelon/research/prospective_entry_cost_r.py                    src/cocomelon/research/prospective_trend_outside_top10.py                    src/cocomelon/research/prospective_momentum_band_entry.py                    src/cocomelon/research/prospective_momentum_pullback_entry.py                    src/cocomelon/research/prospective_range_compression_entry.py                    src/cocomelon/research/prospective_momentum_band_forward_markout.py                    src/cocomelon/research/prospective_two_strike_stop_filter.py                     src/cocomelon/research/closed_trade_utc_hour.py                     src/cocomelon/research/continuous_paper_trade_paths.py                     src/cocomelon/research/continuous_paper_opening_rank.py                     src/cocomelon/research/loss_context_paired_portfolio_shadow.py                     src/cocomelon/research/loss_context_paired_shadow_runtime.py                     src/cocomelon/research/loss_context_paired_shadow_review.py                     src/cocomelon/research/loss_context_portfolio_shadow_candidate.py                     src/cocomelon/research/loss_context_portfolio_shadow_entry.py                     src/cocomelon/research/continuous_paper_opening_opportunity.py                     src/cocomelon/research/continuous_paper_opening_opportunity_paths.py                     src/cocomelon/research/continuous_paper_opening_opportunity_exit_books.py                     src/cocomelon/research/continuous_paper_replacement_funding.py                     src/cocomelon/research/continuous_paper_drawdown.py                     src/cocomelon/research/delayed_entry_execution_shadow.py                     src/cocomelon/research/delayed_entry_contribution_decomposition.py                     src/cocomelon/research/delayed_entry_fill_capacity.py                     src/cocomelon/research/delayed_entry_fill_weighted.py                     src/cocomelon/research/delayed_entry_fixed_schedule_portfolio.py                     src/cocomelon/research/delayed_entry_mtm_portfolio.py                     src/cocomelon/research/delayed_entry_portfolio_capacity.py                     src/cocomelon/research/delayed_entry_risk_geometry.py                     src/cocomelon/research/delayed_entry_pair.py                     src/cocomelon/research/delayed_entry_pair_fill_weighted.py                     src/cocomelon/research/adaptive_delay_selector.py                     src/cocomelon/research/fill_aware_delay_selector.py                     src/cocomelon/research/delay_selector_comparison.py                     src/cocomelon/research/delayed_entry_same_exit.py                     src/cocomelon/research/entry_decision_age.py                     src/cocomelon/research/entry_markout.py                     src/cocomelon/research/entry_markout_predictiveness.py                     src/cocomelon/research/entry_markout_readiness.py                     src/cocomelon/research/excursion_timing.py                     src/cocomelon/research/entry_mid_markout_shadow.py                     src/cocomelon/research/entry_mid_markout_readiness.py                     src/cocomelon/research/opening_fill_liquidity.py                     src/cocomelon/research/profit_lock_counterfactual.py                     src/cocomelon/research/profit_lock_execution_ledger.py                     src/cocomelon/research/profit_lock_execution_readiness.py                     src/cocomelon/research/profit_lock_execution_shadow.py                     src/cocomelon/research/profit_lock_readiness.py                     src/cocomelon/research/prospective_delayed_price_confirmation.py                     src/cocomelon/research/prospective_entry_filter.py                     src/cocomelon/research/prospective_top10_rank_filter.py                     src/cocomelon/research/prospective_trade_quality.py                     src/cocomelon/research/prospective_side_conditioned_delay.py                     src/cocomelon/research/continuous_paper_decision_export.py                    src/cocomelon/research/continuous_paper_decision_facts.py                    src/cocomelon/research/continuous_paper_learning.py                    src/cocomelon/research/delayed_entry_contribution_decomposition_funding.py                    src/cocomelon/research/delayed_entry_fill_weighted_funding.py                    src/cocomelon/research/delayed_entry_funding.py                    src/cocomelon/research/delayed_entry_same_exit_stop_validity.py                    src/cocomelon/research/delayed_entry_stop_exit_proxy.py                    src/cocomelon/research/delayed_entry_stop_l2_replay.py                    src/cocomelon/research/delayed_entry_stop_survivability.py                    src/cocomelon/research/exact_decimal_aggregation.py                    src/cocomelon/research/learning_feature_snapshots.py                    src/cocomelon/research/original_stop_book_evidence.py                    src/cocomelon/research/outcome_learning.py                    src/cocomelon/research/prospective_allowed_residual.py                    src/cocomelon/research/prospective_combined_entry_filter.py                    src/cocomelon/research/prospective_full_stack_entry_exit.py                    src/cocomelon/research/prospective_full_stack_forward_markout.py                    src/cocomelon/research/deferred_full_stack_forward_markout.py                    scripts/rebuild_deferred_full_stack_forward_markout.py                    src/cocomelon/research/continuous_paper_capacity_release_books.py                    src/cocomelon/research/correlation_holder_release_execution.py                    src/cocomelon/research/deferred_correlation_holder_release_execution.py                    scripts/rebuild_correlation_holder_release_execution.py                     src/cocomelon/research/prospective_correlation_bucket_priority.py                    src/cocomelon/research/deferred_correlation_bucket_priority.py                    scripts/rebuild_deferred_correlation_bucket_priority.py                    src/cocomelon/research/deferred_full_stack_capacity_reflow.py                    scripts/rebuild_deferred_full_stack_capacity_reflow.py                    src/cocomelon/research/deferred_consecutive_loss_cooldown.py                    src/cocomelon/research/loss_streak_context_audit.py                    src/cocomelon/research/deferred_loss_streak_context_audit.py                    scripts/rebuild_deferred_consecutive_loss_cooldown.py                    scripts/rebuild_deferred_loss_streak_context_audit.py                    src/cocomelon/research/prospective_long_trend_carveout_execution_shadow_source.py                    src/cocomelon/research/prospective_weekly_drawdown_5m_exit_source.py                    src/cocomelon/research/prospective_full_stack_capacity_reflow.py                    src/cocomelon/research/prospective_full_stack_exit_capacity_reflow.py                    src/cocomelon/research/prospective_consecutive_loss_cooldown_shadow.py                    src/cocomelon/research/prospective_candidate_stack_overlap.py                    src/cocomelon/research/prospective_residual_profit_lock.py                    src/cocomelon/research/prospective_capacity_reflow_opportunities.py                    src/cocomelon/research/prospective_capacity_reflow_fill_feasibility.py                    src/cocomelon/research/prospective_capacity_reflow_forward_markout.py                    src/cocomelon/research/prospective_capacity_reflow_forward_excursion.py                    src/cocomelon/research/prospective_capacity_reflow_exit_fill.py                    src/cocomelon/research/prospective_capacity_reflow_realized_pnl.py                    src/cocomelon/research/prospective_replacement_exit_policy.py                    src/cocomelon/research/prospective_replacement_exit_robustness.py                    src/cocomelon/research/prospective_replacement_exit_readiness.py                    src/cocomelon/research/prospective_capacity_reflow_release_lineage.py                    src/cocomelon/research/prospective_daily_loss_lockout_reflow.py                    src/cocomelon/research/prospective_filter_economic_readiness.py                    src/cocomelon/research/prospective_filter_fixed_schedule.py                    src/cocomelon/research/prospective_filter_robustness.py                    src/cocomelon/research/historical_discovery_freeze.py                    src/cocomelon/research/prospective_context_evidence.py                    src/cocomelon/research/prospective_context_report.py                    src/cocomelon/research/historical_baselines.py                    src/cocomelon/research/historical_features.py                    src/cocomelon/research/historical_learning.py                    src/cocomelon/scanner                     src/cocomelon/strategies
                )"
                if [ -n "$changed_runtime" ]; then
                  echo "::notice::new continuous-paper runtime code detected on main; requesting graceful handoff"
                  printf '%s\n' "$changed_runtime"
                  touch /tmp/continuous-paper-upgrade-requested
                fi
                if printf '%s\n' "$heartbeat" \
                  | python scripts/render_continuous_paper_live_status.py \
                    > /tmp/continuous-paper-live.md; then
                  if gh issue edit "$LIVE_STATUS_ISSUE" \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "Continuous Paper Trader — Live Status" \
                    --body-file /tmp/continuous-paper-live.md >/dev/null; then
                    last_status_publish="$now"
                  else
                    echo "::warning::failed to publish continuous paper live status"
                  fi
                else
                  echo "::warning::failed to render continuous paper live status"
                fi
              done < "$output_fifo" | tee continuous-paper-session.json
          pipeline_status=("${PIPESTATUS[@]}")
          wait "$trader_pid"
          trader_status=$?
          set -e

          reader_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          if (( trader_status != 0 )); then
            echo "::error::continuous-paper runtime exited with status $trader_status"
            exit "$trader_status"
          fi
          if (( reader_status != 0 )); then
            echo "::error::continuous-paper heartbeat reader exited with status $reader_status"
            exit "$reader_status"
          fi
          if (( tee_status != 0 )); then
            echo "::error::continuous-paper session tee exited with status $tee_status"
            exit "$tee_status"
          fi

      - name: Measure durable continuous paper state
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$STATE_ROOT"
          python scripts/summarize_continuous_paper_state.py \
            "$STATE_ROOT" \
            --json-out /tmp/continuous-paper-state-size.json \
            --markdown-out /tmp/continuous-paper-state-size.md
          cat /tmp/continuous-paper-state-size.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack fast continuous paper resume state
        id: fast_resume_pack
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null
          test -d "$STATE_ROOT"
          rm -f continuous-paper-resume.tar.zst
          tar -cf - -C "$STATE_ROOT" . \
            | zstd -T0 -3 --no-progress -o continuous-paper-resume.tar.zst
          zstd -t --no-progress continuous-paper-resume.tar.zst
          test -s continuous-paper-resume.tar.zst

      - name: Upload fast continuous paper resume state
        id: fast_resume_upload
        if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.fast_resume_pack.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/upload-artifact@v7
        with:
          name: continuous-paper-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuous-paper-resume.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Queue exact successor from fast resume
        id: fast_resume_dispatch
        if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.fast_resume_upload.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_title="Continuous Paper · $GITHUB_RUN_ID"
          find_successor() {
            local payload
            for attempt in $(seq 1 6); do
              if payload="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100"
              )"; then
                printf '%s' "$payload" |
                  EXPECTED_TITLE="$expected_title" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          expected = os.environ["EXPECTED_TITLE"]
          matches = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("path") == ".github/workflows/continuous-paper.yml"
              and run.get("display_title") == expected
              and run.get("head_branch") == "main"
              and (run.get("head_repository") or {}).get("full_name")
              == os.environ["GITHUB_REPOSITORY"]
              and run.get("id") != int(os.environ["GITHUB_RUN_ID"])
          ]
          print(matches[0]["id"] if matches else "")
          '
                return 0
              fi
              echo "::warning::successor receipt API unavailable ($attempt/6)" >&2
              sleep 10
            done
            return 1
          }
          successor_run_id="$(find_successor || true)"
          if [ -z "$successor_run_id" ]; then
            dispatched=false
            for attempt in $(seq 1 8); do
              if gh workflow run continuous-paper.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f "source_run_id=$GITHUB_RUN_ID" \
