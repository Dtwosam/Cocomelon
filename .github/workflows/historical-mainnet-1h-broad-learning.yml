name: Historical Mainnet 1h Broad-Universe Learning Experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/historical-mainnet-1h-broad-learning.yml"
      - "tests/test_historical_mainnet_1h_broad_learning_workflow.py"
      - "src/cocomelon/research/historical_cross_market.py"
      - "src/cocomelon/research/historical_dataset.py"
      - "src/cocomelon/research/historical_features.py"
      - "src/cocomelon/research/historical_model_comparison.py"
      - "src/cocomelon/historical_model_comparison_cli.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-mainnet-1h-broad-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  touched-historical-1h-broad-learning:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      FEATURE_SET: historical-1h-anchor-broad-context-v1
      SOURCE_ROOT: artifacts/historical-mainnet-1h-broad-2026-03-01-to-2026-09-20/sources
      COMPARISON_ROOT: artifacts/historical-mainnet-1h-broad-2026-03-01-to-2026-09-20/model-comparison
      WINDOW_START_ISO: "2026-03-01T00:00:00+00:00"
      WINDOW_END_ISO: "2026-09-20T00:00:00+00:00"

    steps:
      - name: Checkout experiment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install research runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"

      - name: Resolve immutable UTC window
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime

          for env_name, value in (
              ("WINDOW_START_MS", "2026-03-01T00:00:00+00:00"),
              ("WINDOW_END_MS", "2026-09-20T00:00:00+00:00"),
          ):
              resolved = datetime.fromisoformat(value)
              print(f"{env_name}={int(resolved.timestamp() * 1000)}")
          PY

      - name: Acquire authenticated public-mainnet 1h broad history
        run: |
          set -euo pipefail
          cocomelon-historical-backfill \
            --root "$SOURCE_ROOT" \
            --market BTC \
            --market ETH \
            --market SOL \
            --market HYPE \
            --market XRP \
            --market DOGE \
            --market LINK \
            --market AVAX \
            --interval 1h \
            --start-ms "$WINDOW_START_MS" \
            --end-ms "$WINDOW_END_MS" \
            --max-candles 5000 \
            --max-funding-items 500

      - name: Render authenticated source coverage
        run: |
          set -euo pipefail
          jq '.' "$SOURCE_ROOT/coverage.json"

      - name: Require complete six-month 1h broad candle grids
        run: |
          set -euo pipefail
          jq -e '
            ([.sources[] | select(.kind == "candles" and .interval == "1h")] | length) == 8
            and all(
              .sources[]
              | select(.kind == "candles" and .interval == "1h");
              .complete_requested_grid == true and .record_count == 4873
            )
          ' "$SOURCE_ROOT/coverage.json" >/dev/null

      - name: Run touched 1h-anchor broad-universe model comparison
        run: |
          set -euo pipefail
          cocomelon-historical-model-comparison \
            --source-root "$SOURCE_ROOT" \
            --output-root "$COMPARISON_ROOT" \
            --anchor-interval 1h \
            --market BTC \
            --market ETH \
            --market SOL \
            --market HYPE \
            --market XRP \
            --market DOGE \
            --market LINK \
            --market AVAX \
            --horizon-ms 3600000 \
            --horizon-ms 14400000 \
            --round-trip-fee-fraction 0.0007 \
            --round-trip-slippage-fraction 0.0005 \
            --funding-reserve-fraction-per-hour 0.0001 \
            --candidate-threshold 0 \
            --candidate-threshold 0.0005 \
            --candidate-threshold 0.001 \
            --candidate-threshold 0.002 \
            --candidate-threshold 0.004 \
            --candidate-ridge-alpha 0.01 \
            --candidate-ridge-alpha 0.1 \
            --candidate-ridge-alpha 1 \
            --candidate-ridge-alpha 10 \
            --min-train-anchors 1800 \
            --validation-anchors 600 \
            --test-anchors 600 \
            --step-anchors 600 \
            --embargo-anchors 4 \
            --baseline-min-state-samples 50 \
            --baseline-min-coin-samples 100 \
            --ridge-min-market-samples 100 \
            --portfolio-max-concurrent-positions 2 \
            --tree-min-market-samples 100 \
            --tree-max-leaf-nodes 7 \
            --tree-min-samples-leaf 100 \
            --tree-learning-rate 0.05 \
            --tree-max-iter 100 \
            --tree-l2-regularization 1 \
            --min-sample-count 50 \
            --min-validation-trades 20 \
            --min-validation-mean-net-return 0 \
            --stability-blocks 4 \
            --min-validation-block-trades 5

      - name: Render 1h broad-universe model comparison summary
        run: |
          set -euo pipefail
          jq '{
            report_id,
            evidence_class,
            dataset_id,
            dataset_row_count,
            anchor_interval,
            markets,
            horizons_ms,
            config,
            supervised_numeric_feature_registry,
            baseline_folds,
            ridge_folds,
            horizon_ridge_folds,
            stable_horizon_ridge_folds,
            occupancy_stable_ridge_folds,
            portfolio_capacity_stable_ridge_folds,
            stable_tree_folds
          }' "$COMPARISON_ROOT/comparison.json"

      - name: Render 1h broad-universe dataset manifest
        run: |
          set -euo pipefail
          jq '{
            dataset_id,
            anchor_interval,
            converter_version,
            schema_version,
            row_count,
            markets,
            horizons_ms,
            columns
          }' "$COMPARISON_ROOT/dataset/manifest.json"

      - name: Upload authenticated touched 1h broad research bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: historical-mainnet-1h-broad-learning-2026-03-01-to-2026-09-20
          path: artifacts/historical-mainnet-1h-broad-2026-03-01-to-2026-09-20
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
