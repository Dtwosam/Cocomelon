name: Original First-Seen SHORT Rank Artifact Audit

on:
  # One-time read-only first replay of the already exported real three-ZIP
  # original source. Never starts a paper worker or changes trading state.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/original-short-rank-source-audit.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed original paper worker GitHub Actions run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact original paper worker run attempt
        required: true
        default: "1"
        type: string
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: original-short-rank-source-audit-${{ github.event_name == 'push' && '38234626351' || github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}-${{ github.event_name == 'push' && '1' || github.event_name == 'workflow_dispatch' && inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  attest:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # The fixed push target had all three source ZIPs. Its workflow
      # conclusion was failure; verifier must not silently call it success.
      SOURCE_RUN_ID: ${{ github.event_name == 'push' && '38234626351' || github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'push' && '1' || github.event_name == 'workflow_dispatch' && inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install read-only rank verifier
        run: python -m pip install -e .

      - name: Fetch independent original GitHub worker and artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Source worker run and attempt must be positive decimal identifiers" >&2
            exit 1
          fi
          echo "Read-only original source replay: run=$SOURCE_RUN_ID attempt=$SOURCE_RUN_ATTEMPT event=$GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/original-short-rank-api
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > /tmp/original-short-rank-api/run.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
            > /tmp/original-short-rank-api/jobs.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > /tmp/original-short-rank-api/artifacts.json

      - name: Download only the exact original worker artifact if published
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(jq -r '.run_attempt' /tmp/original-short-rank-api/run.json)"
          name="continuous-paper-first-seen-short-rank-$SOURCE_RUN_ID-$attempt"
          artifact_id="$(
            jq -r --arg name "$name" '
              [.artifacts[] | select(.name == $name)]
              | if length == 1 then .[0].id else empty end
            ' /tmp/original-short-rank-api/artifacts.json
          )"
          if [ -z "$artifact_id" ]; then
            echo "::notice::no exact original first-seen rank artifact for this completed worker"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/original-short-rank-api/artifact.zip

      - name: Audit exact worker steps and both rank archive SHA256 layers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/attest_paper_short_rank_artifact.py \
            --run-json /tmp/original-short-rank-api/run.json \
            --jobs-json /tmp/original-short-rank-api/jobs.json \
            --artifacts-json /tmp/original-short-rank-api/artifacts.json \
            --artifact-zip /tmp/original-short-rank-api/artifact.zip \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --output first-seen-short-rank-audit.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          proof = json.loads(
              Path("first-seen-short-rank-audit.json").read_text(encoding="utf-8")
          )
          print("\n## Original first-seen SHORT rank provenance")
          print(f"- status: {proof['first_seen_rank_artifact_status']}")
          print(f"- worker source class: {proof.get('original_worker_run_source_class', 'unverified')}")
          print(f"- successful economic research source: {proof.get('successful_research_run_proven', False)}")
          print(f"- failure reason: {proof['failure_reason_code']}")
          print(f"- source run: {proof['source_worker_run_id_claimed']}")
          print(
              "- archived original source authenticated: "
              f"{proof['github_artifact_digest_and_step_metadata_checked']}"
          )
          print("- rank-to-market observation reconciliation: NOT YET CERTIFIED")
          print("- profitable full-account edge: NOT PROVEN")
          print("- live execution authority: FALSE")
          PY

      - name: Find predecessor from real original GitHub worker title
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          mkdir -p /tmp/original-short-rank-predecessor
          title="$(jq -r '.display_title // ""' /tmp/original-short-rank-api/run.json)"
          # GitHub's REST workflow-run response does not expose workflow
          # dispatch inputs, so the rank seal binds the attempt. This real
          # GitHub-computed title gives the predecessor run ID only.
          if [[ ! "$title" =~ ^Continuous\ Paper\ ·\ ([0-9]+)$ ]]; then
            echo "::notice::no exact predecessor title; conservative unverified receipt"
            exit 0
          fi
          PREDECESSOR_RUN_ID="${BASH_REMATCH[1]}"
          if [[ "$PREDECESSOR_RUN_ID" == "$SOURCE_RUN_ID" ]]; then
            echo "::notice::self predecessor is not a valid original handoff"
            exit 0
          fi
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$PREDECESSOR_RUN_ID" \
            > /tmp/original-short-rank-predecessor/run.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$PREDECESSOR_RUN_ID/jobs?per_page=100" \
            > /tmp/original-short-rank-predecessor/jobs.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$PREDECESSOR_RUN_ID/artifacts?per_page=100" \
            > /tmp/original-short-rank-predecessor/artifacts.json
          PREDECESSOR_RUN_ATTEMPT="$(
            jq -r '.run_attempt' /tmp/original-short-rank-predecessor/run.json
          )"
          artifact_name="continuous-paper-first-seen-short-rank-$PREDECESSOR_RUN_ID-$PREDECESSOR_RUN_ATTEMPT"
          artifact_id="$(
            jq -r --arg name "$artifact_name" '
              [.artifacts[] | select(.name == $name)]
              | if length == 1 then .[0].id else empty end
            ' /tmp/original-short-rank-predecessor/artifacts.json
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "::notice::exact predecessor rank source missing or ambiguous"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/original-short-rank-predecessor/artifact.zip

      - name: Verify two sealed original rank archives across exact handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-short-rank-predecessor
          python -m scripts.audit_paper_short_rank_handoff \
            --source-dir /tmp/original-short-rank-api \
            --predecessor-dir /tmp/original-short-rank-predecessor \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --output first-seen-short-rank-handoff-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          proof = json.loads(
              Path("first-seen-short-rank-handoff-audit.json")
              .read_text(encoding="utf-8")
          )
          print("\n## Original SHORT rank history continuity")
          print(f"- status: {proof['rank_handoff_status']}")
          print(f"- chain contains upgrade-only worker: {proof.get('source_chain_contains_upgrade_only_worker', False)}")
          print(f"- eligible successful research source: {proof.get('chain_is_successful_research_source', False)}")
          print(f"- failure: {proof['failure_reason_code']}")
          print(f"- original source run: {proof['source_worker_run_id_claimed']}")
          print(f"- predecessor: {proof['predecessor_worker_run_id_claimed']}")
          print(
              "- original rank prefix immutable: "
              f"{proof['original_rank_history_exact_prefix_reconciled']}"
          )
          print("- complete mainnet market evidence: NOT YET CERTIFIED")
          print("- after-fee account profitability: NOT PROVEN")
          print("- live order authority: FALSE")
          PY

      - name: Download independently identified original rank feature-input artifact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(jq -r '.run_attempt' /tmp/original-short-rank-api/run.json)"
          name="continuous-paper-first-seen-short-rank-full-inputs-$SOURCE_RUN_ID-$attempt"
          artifact_id="$(
            jq -r --arg name "$name" '
              [.artifacts[] | select(.name == $name)]
              | if length == 1 then .[0].id else empty end
            ' /tmp/original-short-rank-api/artifacts.json
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "::notice::no original full rank feature-input source; arithmetic audit will reject"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/original-short-rank-api/full-input-artifact.zip

      - name: Independently recompute full-input original SHORT coarse scores
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_paper_short_rank_coarse_scores \
            --source-dir /tmp/original-short-rank-api \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --output original-short-rank-score-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          proof = json.loads(
              Path("original-short-rank-score-audit.json")
              .read_text(encoding="utf-8")
          )
          print("\n## Original SHORT coarse score arithmetic")
          print(f"- status: {proof['rank_coarse_score_audit_status']}")
          print(f"- failure: {proof['failure_reason_code']}")
          print(f"- source run: {proof['original_worker_run_id_claimed']}")
          print(
              "- original scores actually recomputed: "
              f"{proof['original_rank_feature_scores_recomputed']}"
          )
          print("- full market eligibility and feed provenance: NOT CERTIFIED")
          print("- risk-matched after-cost account edge: NOT PROVEN")
          print("- live execution authority: FALSE")
          PY

      - name: Download independently identified original rank market-context artifact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(jq -r '.run_attempt' /tmp/original-short-rank-api/run.json)"
          name="continuous-paper-first-seen-short-rank-market-context-$SOURCE_RUN_ID-$attempt"
          artifact_id="$(
            jq -r --arg name "$name" '
              [.artifacts[] | select(.name == $name)]
              | if length == 1 then .[0].id else empty end
            ' /tmp/original-short-rank-api/artifacts.json
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "::notice::original rank market context absent; eligibility audit will refuse"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/original-short-rank-api/market-context-artifact.zip

      - name: Independently replay all original SHORT rank market eligibility inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_paper_short_rank_market_context \
            --source-dir /tmp/original-short-rank-api \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --output original-short-rank-context-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          proof = json.loads(
              Path("original-short-rank-context-audit.json")
              .read_text(encoding="utf-8")
          )
          print("\n## Original SHORT rank market eligibility proof")
          print(f"- status: {proof['rank_market_context_audit_status']}")
          print(f"- failure: {proof['failure_reason_code']}")
          print(
              "- all three original ZIP bytes authenticated: "
              f"{proof['all_three_original_worker_artifact_sha256s_verified']}"
          )
          print(
              "- original rankable set reconstructed from recorded contexts: "
              f"{proof['rankable_market_membership_reconstructed_from_recorded_context']}"
          )
          print("- independent Hyperliquid exchange feed/gaps: NOT PROVEN")
          print("- full account risk-matched after-cost edge: NOT PROVEN")
          print("- live order authority: FALSE")
          PY

      - name: Publish immutable three-source original SHORT market eligibility audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: original-first-seen-short-rank-context-audit-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: original-short-rank-context-audit.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish immutable original SHORT coarse-score source audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: original-first-seen-short-rank-coarse-score-audit-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: original-short-rank-score-audit.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish immutable two-worker rank continuity receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: original-first-seen-short-rank-handoff-audit-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: first-seen-short-rank-handoff-audit.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish immutable rank source audit receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: original-first-seen-short-rank-audit-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: first-seen-short-rank-audit.json
          retention-days: 90
          if-no-files-found: warn
