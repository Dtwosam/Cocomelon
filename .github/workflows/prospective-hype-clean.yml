name: Prospective HYPE Clean Observer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-clean.yml"
  schedule:
    - cron: "3,8,13 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prospective-hype-clean-observer
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      EVIDENCE_ROOT: artifacts/prospective-hype-clean
      STATE_ARTIFACT_NAME: prospective-hype-clean-state
      OBSERVER_SOURCE_REVISION: 0131fccdb09a2b9ba959dd5785ea213a6297f719

    steps:
      - name: Checkout observer revision
        uses: actions/checkout@v7
        with:
          ref: 0131fccdb09a2b9ba959dd5785ea213a6297f719
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen observer source revision
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$OBSERVER_SOURCE_REVISION"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install observer runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore latest clean evidence state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          artifact_id="$(
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT_NAME&per_page=100"               --jq '[.artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == "main")]
                | sort_by(.created_at)
                | last
                | .id // empty'
          )"
          if [ -n "$artifact_id" ]; then
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/prospective-hype-state.zip
            unzip -q /tmp/prospective-hype-state.zip -d "$EVIDENCE_ROOT"
            echo "restored_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          else
            echo "restored_artifact_id=none" >> "$GITHUB_OUTPUT"
          fi
        id: restore

      - name: Verify cumulative state continuity
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prospective-hype-continuity.json
          import json
          import os

          from cocomelon.research.prospective_state_continuity import (
              verify_prospective_state_continuity,
          )
          from cocomelon.util.time import utc_now_ms

          result = verify_prospective_state_continuity(
              os.environ["EVIDENCE_ROOT"],
              restored_artifact_id=os.environ["RESTORED_ARTIFACT_ID"],
              as_of_ms=utc_now_ms(),
          )
          print(
              json.dumps(
                  result.to_dict(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Verify prospective runtime attestation
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$OBSERVER_SOURCE_REVISION"
          python - "$OBSERVER_SOURCE_REVISION" \
            > /tmp/prospective-hype-runtime.json <<'PY'
          import json
          import os
          import sys

          from cocomelon.research.prospective_runtime_attestation import (
              ensure_prospective_runtime_attestation,
          )
          from cocomelon.util.time import utc_now_ms

          attestation = ensure_prospective_runtime_attestation(
              os.environ["EVIDENCE_ROOT"],
              observer_source_revision=sys.argv[1],
              as_of_ms=utc_now_ms(),
          )
          print(
              json.dumps(
                  attestation.to_dict(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Run prospective clean observer
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-observer --root "$EVIDENCE_ROOT"             | tee /tmp/prospective-hype-cycle.json

      - name: Build current frozen validation report
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-report --root "$EVIDENCE_ROOT" \
            | tee /tmp/prospective-hype-report.json

      - name: Verify research-only receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(encoding="utf-8")
          )
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(encoding="utf-8")
          )
          assert payload["execution_mode"] == "paper"
          assert payload["evidence_class"] == "prospective_clean"
          assert payload["promotion_eligible"] is False
          assert len(payload["state_digest"]) == 64
          assert report["evidence_class"] == "prospective_clean"
          assert report["promotion_eligible"] is False
          assert report["campaign_id"] == payload["campaign_id"]
          assert report["state_digest"] == payload["state_digest"]
          assert report["plan_id"] == payload["validation_plan_id"]
          assert runtime["candidate_spec_id"] == payload["candidate_spec_id"]
          assert runtime["validation_plan_id"] == payload["validation_plan_id"]
          assert len(runtime["observer_source_revision"]) == 40
          assert len(runtime["attestation_id"]) == 64
          assert report["expected_anchor_count"] == 1080
          assert report["status"] in {
              "collecting",
              "data_incomplete",
              "not_qualified",
              "eligible_for_candidate_review",
          }
          PY

      - name: Build immutable state-lineage receipt
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          continuity = json.loads(
              Path("/tmp/prospective-hype-continuity.json").read_text(
                  encoding="utf-8"
              )
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(
                  encoding="utf-8"
              )
          )
          cycle = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(
                  encoding="utf-8"
              )
          )
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(
                  encoding="utf-8"
              )
          )
          prior_campaign = continuity["campaign_id"]
          if prior_campaign is not None:
              assert prior_campaign == cycle["campaign_id"]

          payload = {
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "restored_artifact_id": os.environ["RESTORED_ARTIFACT_ID"],
              "continuity_status": continuity["status"],
              "campaign_id": cycle["campaign_id"],
              "prior_state_digest": continuity["prior_state_digest"],
              "current_state_digest": cycle["state_digest"],
              "observation_count": cycle["observation_count"],
              "outcome_count": cycle["outcome_count"],
              "observation": cycle["observation"],
              "settled_outcome_ids": cycle["settled_outcome_ids"],
              "missing_target_observation_ids": (
                  cycle["missing_target_observation_ids"]
              ),
              "evidence_class": cycle["evidence_class"],
              "promotion_eligible": cycle["promotion_eligible"],
              "cycle": cycle,
              "validation_report": report,
              "runtime_attestation": runtime,
          }
          payload["receipt_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          Path("/tmp/prospective-hype-lineage.json").write_text(
              canonical(payload) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish run summary
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(encoding="utf-8")
          )
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          observation = payload["observation"]
          print("## Prospective HYPE clean observer")
          print()
          print(f"- restored artifact: {os.environ['RESTORED_ARTIFACT_ID']}")
          print(f"- campaign: {payload['campaign_id']}")
          continuity = json.loads(
              Path("/tmp/prospective-hype-continuity.json").read_text(
                  encoding="utf-8"
              )
          )
          print(f"- state digest: {payload['state_digest']}")
          print(f"- continuity: {continuity['status']}")
          print(f"- prior state digest: {continuity['prior_state_digest']}")
          print(f"- runtime attestation: {runtime['attestation_id']}")
          print(f"- observer source revision: {runtime['observer_source_revision']}")
          print(f"- status: {observation['status']}")
          print(f"- raw direction: {observation['raw_direction']}")
          print(f"- effective direction: {observation['effective_direction']}")
          print(f"- observations: {payload['observation_count']}")
          print(f"- outcomes: {payload['outcome_count']}")
          print(f"- validation status: {report['status']}")
          print(
              "- anchors captured to date: "
              f"{report['observation_count_to_date']}/"
              f"{report['expected_anchor_count_to_date']}"
          )
          print(
              "- missed anchors to date: "
              f"{report['missed_anchor_count_to_date']}"
          )
          print(
              "- capture coverage to date: "
              f"{report['capture_coverage_to_date']}"
          )
          print(f"- effective trades: {report['effective_trade_count']}")
          print(f"- settled trades: {report['settled_trade_count']}")
          print(f"- overdue unsettled: {report['overdue_unsettled_count']}")
          print(f"- mean modeled net return: {report['mean_net_return']}")
          print(f"- settled this run: {len(payload['settled_outcome_ids'])}")
          print(
              "- missing exact target candles: "
              f"{len(payload['missing_target_observation_ids'])}"
          )
          PY

      - name: Upload cumulative clean evidence state
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-state
          path: artifacts/prospective-hype-clean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload immutable run receipt
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/prospective-hype-lineage.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload immutable validation report
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/prospective-hype-report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
