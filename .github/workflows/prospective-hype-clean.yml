name: Prospective HYPE Clean Observer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-clean.yml"
  schedule:
    - cron: "3,8,13 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prospective-hype-clean-observer
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      EVIDENCE_ROOT: artifacts/prospective-hype-clean
      STATE_ARTIFACT_NAME: prospective-hype-clean-state
      OBSERVER_SOURCE_REVISION: 0131fccdb09a2b9ba959dd5785ea213a6297f719

    steps:
      - name: Checkout observer revision
        uses: actions/checkout@v7
        with:
          ref: 0131fccdb09a2b9ba959dd5785ea213a6297f719
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen observer source revision
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$OBSERVER_SOURCE_REVISION"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install observer runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore latest clean evidence state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          artifact_id="$(
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT_NAME&per_page=100"               --jq '[.artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == "main")]
                | sort_by(.created_at)
                | last
                | .id // empty'
          )"
          if [ -n "$artifact_id" ]; then
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/prospective-hype-state.zip
            unzip -q /tmp/prospective-hype-state.zip -d "$EVIDENCE_ROOT"
            echo "restored_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          else
            echo "restored_artifact_id=none" >> "$GITHUB_OUTPUT"
          fi
        id: restore

      - name: Verify cumulative state continuity
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prospective-hype-continuity.json
          import json
          import os

          from cocomelon.research.prospective_state_continuity import (
              verify_prospective_state_continuity,
          )
          from cocomelon.util.time import utc_now_ms

          result = verify_prospective_state_continuity(
              os.environ["EVIDENCE_ROOT"],
              restored_artifact_id=os.environ["RESTORED_ARTIFACT_ID"],
              as_of_ms=utc_now_ms(),
          )
          print(
              json.dumps(
                  result.to_dict(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Verify prospective runtime attestation
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$OBSERVER_SOURCE_REVISION"
          python - "$OBSERVER_SOURCE_REVISION" \
            > /tmp/prospective-hype-runtime.json <<'PY'
          import json
          import os
          import sys

          from cocomelon.research.prospective_runtime_attestation import (
              ensure_prospective_runtime_attestation,
          )
          from cocomelon.util.time import utc_now_ms

          attestation = ensure_prospective_runtime_attestation(
              os.environ["EVIDENCE_ROOT"],
              observer_source_revision=sys.argv[1],
              as_of_ms=utc_now_ms(),
          )
          print(
              json.dumps(
                  attestation.to_dict(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Run prospective clean observer
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-observer --root "$EVIDENCE_ROOT"             | tee /tmp/prospective-hype-cycle.json

      - name: Build current frozen validation report
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-report --root "$EVIDENCE_ROOT" \
            | tee /tmp/prospective-hype-report.json

      - name: Build workflow-only campaign recoverability health
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/prospective-hype-health.json
          import hashlib
          import json
          from decimal import Decimal, ROUND_CEILING
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          def remaining_block_anchors(*, as_of_ms, first_ms, last_ms, interval_ms):
              if as_of_ms < first_ms:
                  return ((last_ms - first_ms) // interval_ms) + 1
              if as_of_ms >= last_ms:
                  return 0
              first_remaining = (
                  first_ms
                  + (((as_of_ms - first_ms) // interval_ms) + 1) * interval_ms
              )
              if first_remaining > last_ms:
                  return 0
              return ((last_ms - first_remaining) // interval_ms) + 1

          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          plan = report["plan"]
          expected = int(report["expected_anchor_count"])
          expected_to_date = int(report["expected_anchor_count_to_date"])
          observed_to_date = int(report["observation_count_to_date"])
          missed_to_date = int(report["missed_anchor_count_to_date"])
          remaining_expected = expected - expected_to_date
          required_observations = int(
              (
                  Decimal(plan["min_capture_coverage"]) * Decimal(expected)
              ).to_integral_value(rounding=ROUND_CEILING)
          )
          missed_budget = expected - required_observations
          maximum_final_observations = observed_to_date + remaining_expected
          maximum_final_capture = (
              Decimal(maximum_final_observations) / Decimal(expected)
          )
          maximum_possible_settled = (
              int(report["effective_trade_count"]) + remaining_expected
          )

          block_health = []
          reasons = []
          for block in report["blocks"]:
              remaining = remaining_block_anchors(
                  as_of_ms=int(report["as_of_ms"]),
                  first_ms=int(block["first_anchor_ms"]),
                  last_ms=int(block["last_anchor_ms"]),
                  interval_ms=int(plan["anchor_interval_ms"]),
              )
              maximum = int(block["effective_trade_count"]) + remaining
              required = int(plan["min_block_trades"])
              recoverable = maximum >= required
              block_health.append(
                  {
                      "block_index": int(block["block_index"]),
                      "settled_trade_count": int(block["settled_trade_count"]),
                      "effective_trade_count": int(block["effective_trade_count"]),
                      "remaining_expected_anchors": remaining,
                      "maximum_possible_settled_trades": maximum,
                      "required_settled_trades": required,
                      "recoverable": recoverable,
                  }
              )
              if not recoverable:
                  reasons.append(
                      f"block_{block['block_index']}_minimum_trade_count_unreachable"
                  )

          if maximum_final_observations < required_observations:
              reasons.insert(0, "capture_floor_unreachable")
          if maximum_possible_settled < int(plan["min_settled_trades"]):
              reasons.append("minimum_settled_trade_count_unreachable")

          first_expected_anchor = int(report["blocks"][0]["first_anchor_ms"])
          if reasons:
              status = "irrecoverable"
          elif int(report["as_of_ms"]) < first_expected_anchor:
              status = "pre_validation"
          elif missed_to_date > 0 or int(report["overdue_unsettled_count"]) > 0:
              status = "degraded"
          else:
              status = "healthy"

          payload = {
              "validation_report_id": report["report_id"],
              "plan_id": report["plan_id"],
              "as_of_ms": int(report["as_of_ms"]),
              "status": status,
              "expected_anchor_count": expected,
              "expected_anchor_count_to_date": expected_to_date,
              "observation_count_to_date": observed_to_date,
              "remaining_expected_anchors": remaining_expected,
              "required_final_observation_count": required_observations,
              "missed_anchor_budget": missed_budget,
              "missed_anchor_count_to_date": missed_to_date,
              "remaining_missed_anchor_budget": missed_budget - missed_to_date,
              "maximum_final_observation_count": maximum_final_observations,
              "maximum_final_capture_coverage": str(maximum_final_capture),
              "effective_trade_count": int(report["effective_trade_count"]),
              "settled_trade_count": int(report["settled_trade_count"]),
              "remaining_trade_opportunities_upper_bound": remaining_expected,
              "maximum_possible_settled_trades": maximum_possible_settled,
              "required_settled_trades": int(plan["min_settled_trades"]),
              "overdue_unsettled_count": int(report["overdue_unsettled_count"]),
              "block_recoverability": block_health,
              "irrecoverable_reasons": reasons,
              "schema_version": 1,
          }
          payload["health_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          print(canonical(payload))
          PY

      - name: Build or verify canonical campaign finalization
        id: finalization
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          root = Path(os.environ["EVIDENCE_ROOT"])
          final_path = root / "finalization.json"
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          cycle = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(encoding="utf-8")
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(encoding="utf-8")
          )
          plan = report["plan"]
          boundary = int(plan["finalization_not_before_ms"])
          as_of_ms = int(report["as_of_ms"])

          economic_payload = {
              "evidence_digest": report["evidence_digest"],
              "validation_status": report["status"],
              "capture_coverage": report["capture_coverage"],
              "observation_count": int(report["observation_count"]),
              "raw_match_count": int(report["raw_match_count"]),
              "effective_trade_count": int(report["effective_trade_count"]),
              "occupancy_blocked_count": int(report["occupancy_blocked_count"]),
              "settled_trade_count": int(report["settled_trade_count"]),
              "overdue_unsettled_count": int(report["overdue_unsettled_count"]),
              "total_net_return": report["total_net_return"],
              "mean_net_return": report["mean_net_return"],
              "positive_net_count": int(report["positive_net_count"]),
              "non_positive_net_count": int(report["non_positive_net_count"]),
              "blocks": report["blocks"],
          }

          expected_static = {
              "kind": "prospective-hype-clean-finalization",
              "candidate_spec_id": cycle["candidate_spec_id"],
              "plan_id": report["plan_id"],
              "campaign_id": cycle["campaign_id"],
              "runtime_attestation_id": runtime["attestation_id"],
              "observer_source_revision": runtime["observer_source_revision"],
              "finalization_not_before_ms": boundary,
              "promotion_eligible": False,
              "schema_version": 1,
          }

          status_payload = {
              "status": "pending",
              "finalization_not_before_ms": boundary,
              "as_of_ms": as_of_ms,
              "finalization_id": None,
              "conflict_reasons": [],
          }

          if final_path.exists():
              existing = json.loads(final_path.read_text(encoding="utf-8"))
              identity = {
                  key: existing[key]
                  for key in (
                      "kind",
                      "candidate_spec_id",
                      "plan_id",
                      "campaign_id",
                      "runtime_attestation_id",
                      "observer_source_revision",
                      "finalization_not_before_ms",
                      "finalized_at_ms",
                      "state_digest",
                      "economic_payload",
                      "promotion_eligible",
                      "schema_version",
                  )
              }
              calculated_id = hashlib.sha256(
                  canonical(identity).encode("utf-8")
              ).hexdigest()
              conflicts = []
              if existing.get("finalization_id") != calculated_id:
                  conflicts.append("finalization_identity_mismatch")
              for key, value in expected_static.items():
                  if existing.get(key) != value:
                      conflicts.append(f"{key}_mismatch")
              if existing.get("state_digest") != cycle["state_digest"]:
                  conflicts.append("state_digest_changed_after_finalization")
              if existing.get("economic_payload") != economic_payload:
                  conflicts.append("economic_payload_changed_after_finalization")
              if conflicts:
                  status_payload = {
                      "status": "conflict",
                      "finalization_not_before_ms": boundary,
                      "as_of_ms": as_of_ms,
                      "finalization_id": existing.get("finalization_id"),
                      "conflict_reasons": conflicts,
                  }
              else:
                  status_payload = {
                      "status": "finalized",
                      "finalization_not_before_ms": boundary,
                      "as_of_ms": as_of_ms,
                      "finalization_id": calculated_id,
                      "conflict_reasons": [],
                  }
          elif as_of_ms < boundary:
              pass
          elif int(report["overdue_unsettled_count"]) > 0:
              status_payload["status"] = "waiting_for_exact_settlements"
          elif report["status"] == "collecting":
              status_payload = {
                  "status": "conflict",
                  "finalization_not_before_ms": boundary,
                  "as_of_ms": as_of_ms,
                  "finalization_id": None,
                  "conflict_reasons": ["report_still_collecting_after_finalization_boundary"],
              }
          else:
              receipt = {
                  **expected_static,
                  "finalized_at_ms": as_of_ms,
                  "state_digest": cycle["state_digest"],
                  "economic_payload": economic_payload,
              }
              receipt["finalization_id"] = hashlib.sha256(
                  canonical(receipt).encode("utf-8")
              ).hexdigest()
              encoded = canonical(receipt) + "\n"
              temp = final_path.with_name("finalization.json.tmp")
              with temp.open("x", encoding="utf-8") as handle:
                  handle.write(encoded)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp, final_path)
              status_payload = {
                  "status": "finalized",
                  "finalization_not_before_ms": boundary,
                  "as_of_ms": as_of_ms,
                  "finalization_id": receipt["finalization_id"],
                  "conflict_reasons": [],
              }

          Path("/tmp/prospective-hype-finalization-status.json").write_text(
              canonical(status_payload) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"status={status_payload['status']}\n")
              output.write(
                  "finalized="
                  + ("true" if status_payload["status"] == "finalized" else "false")
                  + "\n"
              )
              output.write(
                  f"finalization_id={status_payload['finalization_id'] or ''}\n"
              )
          PY

      - name: Verify research-only receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(encoding="utf-8")
          )
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(encoding="utf-8")
          )
          health = json.loads(
              Path("/tmp/prospective-hype-health.json").read_text(encoding="utf-8")
          )
          finalization = json.loads(
              Path("/tmp/prospective-hype-finalization-status.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["execution_mode"] == "paper"
          assert payload["evidence_class"] == "prospective_clean"
          assert payload["promotion_eligible"] is False
          assert len(payload["state_digest"]) == 64
          assert report["evidence_class"] == "prospective_clean"
          assert report["promotion_eligible"] is False
          assert report["campaign_id"] == payload["campaign_id"]
          assert report["state_digest"] == payload["state_digest"]
          assert report["plan_id"] == payload["validation_plan_id"]
          assert runtime["candidate_spec_id"] == payload["candidate_spec_id"]
          assert runtime["validation_plan_id"] == payload["validation_plan_id"]
          assert len(runtime["observer_source_revision"]) == 40
          assert len(runtime["attestation_id"]) == 64
          assert report["expected_anchor_count"] == 1080
          assert health["validation_report_id"] == report["report_id"]
          assert health["plan_id"] == report["plan_id"]
          assert health["expected_anchor_count"] == 1080
          assert health["required_final_observation_count"] == 972
          assert health["missed_anchor_budget"] == 108
          assert len(health["health_id"]) == 64
          assert health["status"] in {
              "pre_validation",
              "healthy",
              "degraded",
              "irrecoverable",
          }
          assert finalization["status"] in {
              "pending",
              "waiting_for_exact_settlements",
              "finalized",
              "conflict",
          }
          if finalization["status"] == "finalized":
              assert len(finalization["finalization_id"]) == 64
          assert report["status"] in {
              "collecting",
              "data_incomplete",
              "not_qualified",
              "eligible_for_candidate_review",
          }
          PY

      - name: Build immutable state-lineage receipt
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          continuity = json.loads(
              Path("/tmp/prospective-hype-continuity.json").read_text(
                  encoding="utf-8"
              )
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(
                  encoding="utf-8"
              )
          )
          cycle = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(
                  encoding="utf-8"
              )
          )
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(
                  encoding="utf-8"
              )
          )
          health = json.loads(
              Path("/tmp/prospective-hype-health.json").read_text(
                  encoding="utf-8"
              )
          )
          finalization = json.loads(
              Path("/tmp/prospective-hype-finalization-status.json").read_text(
                  encoding="utf-8"
              )
          )
          prior_campaign = continuity["campaign_id"]
          if prior_campaign is not None:
              assert prior_campaign == cycle["campaign_id"]

          payload = {
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "restored_artifact_id": os.environ["RESTORED_ARTIFACT_ID"],
              "continuity_status": continuity["status"],
              "campaign_id": cycle["campaign_id"],
              "prior_state_digest": continuity["prior_state_digest"],
              "current_state_digest": cycle["state_digest"],
              "observation_count": cycle["observation_count"],
              "outcome_count": cycle["outcome_count"],
              "observation": cycle["observation"],
              "settled_outcome_ids": cycle["settled_outcome_ids"],
              "missing_target_observation_ids": (
                  cycle["missing_target_observation_ids"]
              ),
              "evidence_class": cycle["evidence_class"],
              "promotion_eligible": cycle["promotion_eligible"],
              "cycle": cycle,
              "validation_report": report,
              "campaign_health": health,
              "finalization": finalization,
              "runtime_attestation": runtime,
          }
          payload["receipt_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          Path("/tmp/prospective-hype-lineage.json").write_text(
              canonical(payload) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish run summary
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.restore.outputs.restored_artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-hype-cycle.json").read_text(encoding="utf-8")
          )
          report = json.loads(
              Path("/tmp/prospective-hype-report.json").read_text(encoding="utf-8")
          )
          runtime = json.loads(
              Path("/tmp/prospective-hype-runtime.json").read_text(encoding="utf-8")
          )
          health = json.loads(
              Path("/tmp/prospective-hype-health.json").read_text(encoding="utf-8")
          )
          finalization = json.loads(
              Path("/tmp/prospective-hype-finalization-status.json").read_text(
                  encoding="utf-8"
              )
          )
          observation = payload["observation"]
          print("## Prospective HYPE clean observer")
          print()
          print(f"- restored artifact: {os.environ['RESTORED_ARTIFACT_ID']}")
          print(f"- campaign: {payload['campaign_id']}")
          continuity = json.loads(
              Path("/tmp/prospective-hype-continuity.json").read_text(
                  encoding="utf-8"
              )
          )
          print(f"- state digest: {payload['state_digest']}")
          print(f"- continuity: {continuity['status']}")
          print(f"- prior state digest: {continuity['prior_state_digest']}")
          print(f"- runtime attestation: {runtime['attestation_id']}")
          print(f"- observer source revision: {runtime['observer_source_revision']}")
          print(f"- status: {observation['status']}")
          print(f"- raw direction: {observation['raw_direction']}")
          print(f"- effective direction: {observation['effective_direction']}")
          print(f"- observations: {payload['observation_count']}")
          print(f"- outcomes: {payload['outcome_count']}")
          print(f"- validation status: {report['status']}")
          print(f"- campaign health: {health['status']}")
          print(f"- finalization: {finalization['status']}")
          print(f"- finalization id: {finalization['finalization_id']}")
          print(
              "- remaining miss budget: "
              f"{health['remaining_missed_anchor_budget']}"
          )
          print(
              "- maximum final capture coverage: "
              f"{health['maximum_final_capture_coverage']}"
          )
          print(
              "- maximum possible settled trades: "
              f"{health['maximum_possible_settled_trades']}"
          )
          print(
              "- irrecoverable reasons: "
              f"{health['irrecoverable_reasons']}"
          )
          print(
              "- anchors captured to date: "
              f"{report['observation_count_to_date']}/"
              f"{report['expected_anchor_count_to_date']}"
          )
          print(
              "- missed anchors to date: "
              f"{report['missed_anchor_count_to_date']}"
          )
          print(
              "- capture coverage to date: "
              f"{report['capture_coverage_to_date']}"
          )
          print(f"- effective trades: {report['effective_trade_count']}")
          print(f"- settled trades: {report['settled_trade_count']}")
          print(f"- overdue unsettled: {report['overdue_unsettled_count']}")
          print(f"- mean modeled net return: {report['mean_net_return']}")
          print(f"- settled this run: {len(payload['settled_outcome_ids'])}")
          print(
              "- missing exact target candles: "
              f"{len(payload['missing_target_observation_ids'])}"
          )
          PY

      - name: Upload cumulative clean evidence state
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-state
          path: artifacts/prospective-hype-clean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload immutable run receipt
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/prospective-hype-lineage.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload immutable validation report
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/prospective-hype-report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload immutable campaign health
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/prospective-hype-health.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload immutable finalization status
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-finalization-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/prospective-hype-finalization-status.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload canonical finalization receipt
        if: ${{ steps.finalization.outputs.finalized == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-clean-finalization-${{ steps.finalization.outputs.finalization_id }}
          path: artifacts/prospective-hype-clean/finalization.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Fail closed on finalization conflict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          finalization = json.loads(
              Path("/tmp/prospective-hype-finalization-status.json").read_text(
                  encoding="utf-8"
              )
          )
          if finalization["status"] == "conflict":
              reasons = ", ".join(finalization["conflict_reasons"])
              raise SystemExit(
                  "PROSPECTIVE_FINALIZATION_CONFLICT: " + reasons
              )
          PY

      - name: Fail closed if frozen campaign is irrecoverable
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(
              Path("/tmp/prospective-hype-health.json").read_text(encoding="utf-8")
          )
          if health["status"] == "irrecoverable":
              reasons = ", ".join(health["irrecoverable_reasons"])
              raise SystemExit(
                  "PROSPECTIVE_CAMPAIGN_IRRECOVERABLE: " + reasons
              )
          PY
