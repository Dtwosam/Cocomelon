name: Temporary cadence state audit 36694359628

on:
  push:
    branches:
      - audit/cadence-state-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/continuous-paper-state.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/continuous-paper-state.zip -d /tmp/artifact
          test -s /tmp/artifact/continuous-paper-state.tar
      - name: Extract cadence shadow state only
        run: |
          set -euo pipefail
          mkdir -p /tmp/state
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json
          test -s /tmp/state/cadence-shadow-state.json
      - name: Evaluate purged cadence opportunity learner
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_opportunity_learning.py \
            /tmp/state/cadence-shadow-state.json \
            --json-out cadence-opportunity-report.json \
            > /tmp/cadence-opportunity-report.stdout.json
          cmp cadence-opportunity-report.json /tmp/cadence-opportunity-report.stdout.json
      - name: Summarize primary surfaces
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("cadence-opportunity-report.json").read_text(encoding="utf-8")
          )
          print("## Cadence opportunity audit")
          print(f"- settled outcomes: {report['settled_outcomes']}")
          print(
              "- primary ready / development-qualified: "
              f"{report['primary_ready_for_review']} / "
              f"{report['development_qualified']}"
          )
          for key, label in (
              ("900000:900000", "15m -> 15m"),
              ("900000:3600000", "15m -> 1h"),
          ):
              surface = report["surfaces"][key]
              print(f"### {label}")
              for field in (
                  "status",
                  "training_rows",
                  "validation_rows",
                  "purged_overlap_rows",
                  "admitted_rows",
                  "skipped_rows",
                  "actual_net_return_sum",
                  "candidate_net_return_sum",
                  "delta_net_return_sum",
                  "candidate_mean_net_return",
                  "structural_ready",
                  "development_qualified",
              ):
                  print(f"- {field}: {surface.get(field)}")
              directions = surface.get("by_direction", {})
              for direction in ("long", "short"):
                  item = directions.get(direction, {})
                  print(
                      f"- {direction} validation/admitted: "
                      f"{item.get('validation_rows', 0)} / "
                      f"{item.get('admitted_rows', 0)}"
                  )
              print("- admitted cohorts:")
              for cohort in surface.get("admitted_cohorts", [])[:6]:
                  print(
                      "  - "
                      f"{cohort['direction']} / "
                      f"{cohort['lead_strategy']} / "
                      f"{cohort['score_band']}: "
                      f"train={cohort['training_estimate_mean_net_return']} "
                      f"(n={cohort['training_estimate_rows']}, "
                      f"{cohort['training_estimate_specificity']}), "
                      f"val_mean={cohort['validation_mean_net_return']} "
                      f"val_sum={cohort['validation_net_return_sum']} "
                      f"(n={cohort['validation_rows']})"
                  )
              print("- skipped cohorts:")
              for cohort in surface.get("skipped_cohorts", [])[:6]:
                  print(
                      "  - "
                      f"{cohort['direction']} / "
                      f"{cohort['lead_strategy']} / "
                      f"{cohort['score_band']}: "
                      f"train={cohort['training_estimate_mean_net_return']} "
                      f"(n={cohort['training_estimate_rows']}, "
                      f"{cohort['training_estimate_specificity']}), "
                      f"val_mean={cohort['validation_mean_net_return']} "
                      f"val_sum={cohort['validation_net_return_sum']} "
                      f"(n={cohort['validation_rows']})"
                  )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-opportunity-audit-36694359628
          path: cadence-opportunity-report.json
          if-no-files-found: error
          retention-days: 30
