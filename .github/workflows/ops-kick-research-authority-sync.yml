name: One-shot Research Authority Sync Kick

on:
  push:
    branches:
      - ops/kick-research-authority-sync-20260902
    paths:
      - .github/workflows/ops-kick-research-authority-sync.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted main research authority sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-dispatch after trusted retained-artifact compatibility fix.
          /usr/bin/gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/research-v4-registry-sync.yml/dispatches" \
            -f ref=main
