name: One-shot Research Campaign Cancel

on:
  push:
    branches:
      - ops/kick-research-authority-sync-20260902
    paths:
      - .github/workflows/ops-kick-research-authority-sync.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel overlapping paper research campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/runs/33680737242/cancel"
