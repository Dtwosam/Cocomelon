name: One-shot Research Gate Test Updater

on:
  push:
    branches:
      - ops/kick-research-authority-sync-20260902
    paths:
      - .github/workflows/ops-kick-research-authority-sync.yml

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/research-predecision-v4-gate-20260902
    steps:
      - name: Update only superseded workflow-order assertions
        run: |
          set -euo pipefail

          fetch_file() {
            local repo_path="$1"
            local local_path="$2"
            local meta_path="$3"
            /usr/bin/gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/contents/$repo_path" \
              -f ref="$TARGET_BRANCH" > "$meta_path"
            jq -r '.content' "$meta_path" | tr -d '\n' | base64 -d > "$local_path"
          }

          fetch_file tests/test_research_predecision_v4_gate.py \
            /tmp/test_research_predecision_v4_gate.py /tmp/pre-meta.json
          fetch_file tests/test_research_review_hardening.py \
            /tmp/test_research_review_hardening.py /tmp/review-meta.json
          fetch_file tests/test_research_runner_workflow.py \
            /tmp/test_research_runner_workflow.py /tmp/runner-meta.json

          printf '%s' '' | base64 -d | gzip -d | python

          put_file() {
            local repo_path="$1"
            local local_path="$2"
            local meta_path="$3"
            local message="$4"
            local request_path="$5"
            REPO_PATH="$repo_path" LOCAL_PATH="$local_path" META_PATH="$meta_path" MESSAGE="$message" \
              TARGET_BRANCH="$TARGET_BRANCH" REQUEST_PATH="$request_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          content = Path(os.environ['LOCAL_PATH']).read_text(encoding='utf-8')
          meta = json.loads(Path(os.environ['META_PATH']).read_text(encoding='utf-8'))
          payload = {
              'message': os.environ['MESSAGE'],
              'content': __import__('base64').b64encode(content.encode()).decode(),
              'sha': meta['sha'],
              'branch': os.environ['TARGET_BRANCH'],
          }
          Path(os.environ['REQUEST_PATH']).write_text(json.dumps(payload), encoding='utf-8')
          PY
            /usr/bin/gh api --method PUT \
              "/repos/$GITHUB_REPOSITORY/contents/$repo_path" \
              --input "$request_path" > /dev/null
          }

          put_file tests/test_research_predecision_v4_gate.py \
            /tmp/test_research_predecision_v4_gate.py /tmp/pre-meta.json \
            'test: assert research authority through job dependencies' /tmp/pre-put.json
          put_file tests/test_research_review_hardening.py \
            /tmp/test_research_review_hardening.py /tmp/review-meta.json \
            'test: preserve pre-decision V4 trust boundary' /tmp/review-put.json
          put_file tests/test_research_runner_workflow.py \
            /tmp/test_research_runner_workflow.py /tmp/runner-meta.json \
            'test: reflect authority-before-decisions artifact flow' /tmp/runner-put.json
