name: Prospective Weekly Drawdown 5m Exit Evidence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-weekly-drawdown-5m-exit.yml"
      - "src/cocomelon/research/prospective_weekly_drawdown_5m_exit.py"
      - "src/cocomelon/research/prospective_weekly_drawdown_5m_exit_source.py"
      - "scripts/evaluate_prospective_weekly_drawdown_5m_exit.py"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-weekly-drawdown-5m-exit-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_ISSUE: "842"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact artifact-bearing paper source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail
          echo "source_eligible=true" >> "$GITHUB_OUTPUT"

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local expected_name="continuous-paper-learning-source-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$expected_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if not matches:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected at most one non-expired source artifact named {name}"
              )
          item = matches[0]
          digest = item.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("source artifact digest is missing or invalid")
          print(item["id"], item["name"], digest, sep="\t")
          '
          }

          paper_run_is_evidence_eligible() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local run_path="/tmp/paper-source-run-$candidate_run_id.json"
            local jobs_path="/tmp/paper-source-jobs-$candidate_run_id.json"

            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" > "$run_path"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100" > "$jobs_path"

            python - "$run_path" "$jobs_path" "$candidate_attempt" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_attempt, expected_repo = sys.argv[1:]
          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit(1)
          if run.get("head_branch") != "main":
              raise SystemExit(1)
          if run.get("status") != "completed":
              raise SystemExit(1)
          if str(run.get("run_attempt")) != expected_attempt:
              raise SystemExit(1)
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              raise SystemExit(1)
          conclusion = run.get("conclusion")
          if conclusion not in {"success", "failure"}:
              raise SystemExit(1)
          if conclusion == "success":
              raise SystemExit(0)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs_payload = json.load(handle)
          paper_jobs = [
              job
              for job in jobs_payload.get("jobs", [])
              if job.get("name") == "paper"
          ]
          if len(paper_jobs) != 1:
              raise SystemExit(1)
          paper_job = paper_jobs[0]
          if paper_job.get("conclusion") != "failure":
              raise SystemExit(1)
          steps = {
              step.get("name"): step.get("conclusion")
              for step in paper_job.get("steps", [])
              if isinstance(step.get("name"), str)
          }
          required_successes = (
              "Run continuous paper trader",
              "Measure durable continuous paper state",
              "Upload durable continuous paper state",
              "Upload compact continuous learning source",
          )
          if any(steps.get(name) != "success" for name in required_successes):
              raise SystemExit(1)
          failed_steps = {
              name
              for name, step_conclusion in steps.items()
              if step_conclusion == "failure"
          }
          allowed_failed_steps = {
              frozenset({"Fail closed on upgrade handoff source"}),
              frozenset(
                  {
                      "Queue fallback exact successor continuous paper worker",
                      "Fail closed on upgrade handoff source",
                  }
              ),
          }
          if frozenset(failed_steps) not in allowed_failed_steps:
              raise SystemExit(1)
          if (
              "Queue fallback exact successor continuous paper worker"
              in failed_steps
              and steps.get("Queue exact successor from fast resume")
              != "success"
          ):
              raise SystemExit(1)
          PY
          }

          run_id=""
          run_attempt=""
          artifact_line=""
          resolution_mode=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
              echo "manual source paper run identity is invalid" >&2
              exit 1
            fi
            if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
              echo "manual source paper run is not evidence-eligible" >&2
              exit 1
            fi
            artifact_line="$(artifact_for_run "$run_id" "$run_attempt")"
            resolution_mode="manual_exact"
          elif [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ && "$EVENT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            if paper_run_is_evidence_eligible "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"; then
              candidate_artifact_line="$(
                artifact_for_run "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$EVENT_RUN_ID"
                run_attempt="$EVENT_RUN_ATTEMPT"
                artifact_line="$candidate_artifact_line"
                if [ "$EVENT_CONCLUSION" = "success" ]; then
                  resolution_mode="successful_event"
                else
                  resolution_mode="durable_handoff_event"
                fi
              fi
            fi
          fi

          if [ -z "$artifact_line" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=100"
            )"
            mapfile -t artifact_candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${artifact_candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if ! paper_run_is_evidence_eligible "$candidate_run_id" "$candidate_attempt"; then
                continue
              fi
              candidate_artifact_line="$(
                artifact_for_run "$candidate_run_id" "$candidate_attempt"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$candidate_run_id"
                run_attempt="$candidate_attempt"
                artifact_line="$candidate_artifact_line"
                resolution_mode="latest_evidence_eligible_with_compact_artifact"
                break
              fi
            done
          fi

          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "source paper run identity is invalid" >&2
            exit 1
          fi
          if [ -z "$artifact_line" ]; then
            echo "selected source has no authenticated compact artifact" >&2
            exit 1
          fi
          if ! paper_run_is_evidence_eligible "$run_id" "$run_attempt"; then
            echo "selected source paper run is not evidence-eligible" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed":
              raise SystemExit("source run must be completed")
          if run.get("conclusion") not in {"success", "failure"}:
              raise SystemExit("source run conclusion is not evidence-eligible")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download authenticated candidate source
        id: compact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          rm -rf /tmp/weekly-drawdown-5m-source
          mkdir -p /tmp/weekly-drawdown-5m-source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/weekly-drawdown-5m-source.zip
          actual_digest="sha256:$(sha256sum /tmp/weekly-drawdown-5m-source.zip | cut -d' ' -f1)"
          if [ "$actual_digest" != "$ARTIFACT_DIGEST" ]; then
            echo "source artifact digest mismatch" >&2
            exit 1
          fi
          unzip -q /tmp/weekly-drawdown-5m-source.zip             -d /tmp/weekly-drawdown-5m-source

          source_path="$(
            find /tmp/weekly-drawdown-5m-source               -type f               -name prospective-weekly-drawdown-5m-exit-source.json               -print -quit
          )"
          if [ -z "$source_path" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=compact source predates weekly-drawdown 5m export" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$source_path"

          mapfile -t source_check < <(
            SOURCE_PATH="$source_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["SOURCE_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(payload, dict):
              print("waiting")
              print("candidate source is not an object")
              raise SystemExit(0)
          if payload.get("enabled") is False:
              print("waiting")
              print(str(payload.get("error") or "candidate source is disabled"))
              raise SystemExit(0)
          current = (
              payload.get("schema_version") == 1
              and payload.get("kind")
              == "prospective-weekly-drawdown-5m-exit-source-v1"
              and payload.get("candidate_id")
              == "prospective-weekly-drawdown-stack-admit-5m-exit-v1"
              and payload.get("research_only") is True
              and payload.get("execution_authority") is False
              and payload.get("promotion_authority") is False
              and payload.get("changes_execution") is False
              and payload.get("changes_risk_limits") is False
              and payload.get("changes_candidate_readiness") is False
              and payload.get("discovery_cohort_reused_for_validation") is False
              and payload.get("cross_horizon_selection_frozen") is True
              and isinstance(payload.get("source_sha256"), str)
              and isinstance(payload.get("execution_config_sha256"), str)
              and isinstance(payload.get("opportunities"), list)
          )
          print("current" if current else "waiting")
          print(
              "current candidate source format"
              if current
              else "candidate source format or authority boundary is incompatible"
          )
          PY
          )
          if [ "${source_check[0]}" != "current" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=${source_check[1]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=current candidate source format" >> "$GITHUB_OUTPUT"
          echo "source_path=$source_path" >> "$GITHUB_OUTPUT"

      - name: Publish waiting status
        if: ${{ steps.compact.outputs.eligible != 'true' }}
        shell: bash
        env:
          ISSUE_NUMBER: ${{ env.EVIDENCE_ISSUE }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_RESOLUTION: ${{ steps.source.outputs.resolution_mode }}
          WAIT_REASON: ${{ steps.compact.outputs.reason }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "## Weekly-drawdown ADMIT 5m exact-exit evidence",
              "",
              "**Status:** collecting / waiting for compatible candidate source",
              "",
              (
                  "- source paper run / attempt: "
                  f"`{os.environ['SOURCE_RUN_ID']} / "
                  f"{os.environ['SOURCE_RUN_ATTEMPT']}`"
              ),
              f"- source resolution: `{os.environ['SOURCE_RESOLUTION']}`",
              f"- reason: {os.environ.get('WAIT_REASON') or 'source is not yet eligible'}",
              "",
              "No 5m realized-PnL evidence is credited from this run.",
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes risk limits:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/weekly-drawdown-5m-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"             -f body="$(cat /tmp/weekly-drawdown-5m-status.md)"

      - name: Evaluate exact 5m candidate
        id: evaluate
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        shell: bash
        env:
          SOURCE_PATH: ${{ steps.compact.outputs.source_path }}
        run: |
          set -euo pipefail
          python scripts/evaluate_prospective_weekly_drawdown_5m_exit.py             "$SOURCE_PATH"             --json-out prospective-weekly-drawdown-5m-exit-summary.json

      - name: Publish exact 5m evidence
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        shell: bash
        env:
          ISSUE_NUMBER: ${{ env.EVIDENCE_ISSUE }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_RESOLUTION: ${{ steps.source.outputs.resolution_mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path(
                  "prospective-weekly-drawdown-5m-exit-summary.json"
              ).read_text(encoding="utf-8")
          )
          robustness = summary["robustness"]
          ready = summary["candidate_investigation_ready"] is True
          status = (
              "INVESTIGATION GATE PASSED"
              if ready
              else "COLLECTING / GATE NOT MET"
          )
          lines = [
              "## Weekly-drawdown ADMIT 5m exact-exit evidence",
              "",
              f"**Status:** {status}",
              "",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source head SHA: `{os.environ['SOURCE_HEAD_SHA']}`",
              f"- source resolution: `{os.environ['SOURCE_RESOLUTION']}`",
              f"- source artifact: `{os.environ['SOURCE_ARTIFACT_NAME']}`",
              f"- source artifact digest: `{os.environ['SOURCE_ARTIFACT_DIGEST']}`",
              f"- candidate: `{summary['candidate_id']}`",
              f"- frozen start ms: `{summary['started_at_ms']}`",
              "",
              "### Exact 5m economics",
              "",
              f"- source opportunities: `{summary['source_opportunities']}`",
              f"- counterfactual risk approvals: `{summary['counterfactual_risk_approvals']}`",
              f"- counterfactual risk rejections: `{summary['counterfactual_risk_rejections']}`",
              f"- entry fills: `{summary['entry_fills']}`",
              f"- observed stop survivors / crossings / incomplete: `{summary['observed_stop_survivor_options']} / {summary['observed_stop_crossing_options']} / {summary['observed_stop_path_incomplete_options']}`",
              f"- complete 5m exits: `{summary['complete_five_minute_exits']}`",
              f"- exact realized-PnL options: `{summary['exact_realized_pnl_options']}`",
              f"- wins / losses / breakeven: `{summary['wins']} / {summary['losses']} / {summary['breakeven']}`",
              f"- total exact realized PnL: `{summary['total_exact_realized_pnl']}`",
              f"- mean exact realized PnL: `{summary['mean_exact_realized_pnl']}`",
              f"- profit factor: `{summary['profit_factor']}`",
              "",
              "### Robustness gate",
              "",
              f"- exact options / required: `{robustness['exact_option_count']} / {robustness['minimum_exact_options']}`",
              f"- markets / required: `{robustness['market_count']} / {robustness['minimum_markets']}`",
              f"- minimum sample met: `{robustness['minimum_sample_met']}`",
              f"- leave-one-trade min PnL / positive: `{robustness['leave_one_option_out_min_pnl']} / {robustness['positive_after_removing_any_one_option']}`",
              f"- leave-one-market min PnL / positive: `{robustness['leave_one_market_out_min_pnl']} / {robustness['positive_after_removing_any_one_market']}`",
              f"- chronological half PnL: `{robustness['chronological_first_half_pnl']} / {robustness['chronological_second_half_pnl']}`",
              f"- chronological halves positive: `{robustness['chronological_halves_positive']}`",
              f"- investigation gate passed: `{ready}`",
              "",
              (
                  "This gate only permits deeper research investigation. "
                  "It does not authorize promotion, a weekly-drawdown override, "
                  "or live execution."
              ),
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes risk limits:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/weekly-drawdown-5m-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"             -f body="$(cat /tmp/weekly-drawdown-5m-status.md)"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        with:
          name: prospective-weekly-drawdown-5m-exit-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-weekly-drawdown-5m-exit-summary.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
