name: Research Learning Clean State Bootstrap

on:
  workflow_run:
    workflows: ["Research Learning Clean Admission"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Exact successful clean-admission workflow run ID to recover
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-learning-clean-state-bootstrap
  cancel-in-progress: false

env:
  COCOMELON_EXECUTION_MODE: paper

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current trusted clean-state implementation
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"

      - name: Authenticate exact clean-admission artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.upstream_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$DISPATCH_RUN_ID"
          fi
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "clean admission run id is invalid" >&2
            exit 64
          fi

          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"             > /tmp/clean-admission-run.json
          RUN_ID="$RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              Path("/tmp/clean-admission-run.json").read_text(encoding="utf-8")
          )
          if run.get("id") != int(os.environ["RUN_ID"]):
              raise SystemExit("clean admission run id changed")
          if run.get("head_branch") != "main":
              raise SystemExit("clean admission run is not from main")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("clean admission run did not complete successfully")
          if run.get("event") not in {"workflow_run", "workflow_dispatch"}:
              raise SystemExit("clean admission run event is invalid")
          if run.get("path") != ".github/workflows/research-learning-clean-admission.yml":
              raise SystemExit("clean admission workflow path is invalid")
          if run.get("name") != "Research Learning Clean Admission":
              raise SystemExit("clean admission workflow name is invalid")
          head_sha = run.get("head_sha")
          if (
              not isinstance(head_sha, str)
              or len(head_sha) != 40
              or any(char not in "0123456789abcdef" for char in head_sha)
          ):
              raise SystemExit("clean admission head sha is invalid")
          attempt = run.get("run_attempt")
          if isinstance(attempt, bool) or not isinstance(attempt, int) or attempt <= 0:
              raise SystemExit("clean admission run attempt is invalid")
          repository = run.get("head_repository") or {}
          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("clean admission run is from another repository")
          PY

          RUN_ATTEMPT="$(jq -r '.run_attempt' /tmp/clean-admission-run.json)"
          HEAD_SHA="$(jq -r '.head_sha' /tmp/clean-admission-run.json)"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"             > /tmp/clean-admission-artifacts.json

          ARTIFACT_ROW="$(
            python - <<'PY'
          import json
          import re
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/clean-admission-artifacts.json").read_text(encoding="utf-8")
          )
          pattern = re.compile(
              r"^research-learning-clean-admission-[1-9][0-9]*-[1-9][0-9]*$"
          )
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("expired") is False
              and isinstance(item.get("name"), str)
              and pattern.fullmatch(item["name"])
          ]
          if len(matches) > 1:
              raise SystemExit("multiple clean admission artifacts found")
          if not matches:
              print("")
          else:
              artifact = matches[0]
              digest = artifact.get("digest")
              if not isinstance(digest, str) or not digest.startswith("sha256:"):
                  raise SystemExit("clean admission artifact digest is missing")
              print(
                  str(artifact["id"])
                  + "\t"
                  + artifact["name"]
                  + "\t"
                  + digest
              )
          PY
          )"

          if [ -z "$ARTIFACT_ROW" ]; then
            {
              echo "artifact_exists=false"
              echo "run_id=$RUN_ID"
              echo "run_attempt=$RUN_ATTEMPT"
              echo "head_sha=$HEAD_SHA"
              echo "artifact_id="
              echo "artifact_name="
              echo "artifact_digest="
            } >> "$GITHUB_OUTPUT"
            echo "successful clean admission run published no admission artifact"
            exit 0
          fi

          IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME ARTIFACT_DIGEST <<< "$ARTIFACT_ROW"
          mkdir -p admission
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/clean-admission.zip
          unzip -q /tmp/clean-admission.zip -d admission

          {
            echo "artifact_exists=true"
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "head_sha=$HEAD_SHA"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_digest=$ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap verified clean candidate states
        id: state
        if: ${{ steps.source.outputs.artifact_exists == 'true' }}
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -f admission/admission.json
          mkdir -p clean-state/candidates
          cp admission/admission.json clean-state/source-admission.json
          AS_OF_MS="$(date +%s%3N)"
          ADMISSION_COUNT="$(jq -r '.candidate_count' admission/admission.json)"
          if ! [[ "$ADMISSION_COUNT" =~ ^[0-9]+$ ]]; then
            echo "admission candidate count is invalid" >&2
            exit 65
          fi

          BOOTSTRAPPED_COUNT=0
          for LABEL in baseline tree; do
            SOURCE_ROOT="admission/candidates/$LABEL"
            if [ ! -d "$SOURCE_ROOT" ]; then
              continue
            fi

            DEST_ROOT="clean-state/candidates/$LABEL"
            mkdir -p "$DEST_ROOT"
            cp -a "$SOURCE_ROOT/package" "$DEST_ROOT/package"
            cp "$SOURCE_ROOT/candidate-validation-spec.json"               "$DEST_ROOT/candidate-validation-spec.json"
            mkdir -p "$DEST_ROOT/evidence"

            cocomelon-learning-clean-state               --package-root "$DEST_ROOT/package"               --validation-spec "$DEST_ROOT/candidate-validation-spec.json"               --evidence-root "$DEST_ROOT/evidence"               --output-root "$DEST_ROOT"               --as-of-ms "$AS_OF_MS"               > "$DEST_ROOT/state-command.json"

            jq -e               '.prediction_count == 0
               and .settled_outcome_count == 0
               and .unsettled_trade_prediction_count == 0
               and (.status == "waiting_for_validation_start"
                    or .status == "collecting")
               and .paper_only == true
               and .prospective_only == true
               and .research_only == true
               and .promotion_eligible == false
               and .execution_ready == false'               "$DEST_ROOT/state.json" > /dev/null
            BOOTSTRAPPED_COUNT=$((BOOTSTRAPPED_COUNT + 1))
          done

          if [ "$BOOTSTRAPPED_COUNT" -ne "$ADMISSION_COUNT" ]; then
            echo "bootstrapped candidate count does not match admission" >&2
            exit 66
          fi

          AS_OF_MS="$AS_OF_MS" BOOTSTRAPPED_COUNT="$BOOTSTRAPPED_COUNT" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value: object) -> str:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          source_admission = json.loads(
              Path("clean-state/source-admission.json").read_text(encoding="utf-8")
          )
          states = []
          root = Path("clean-state/candidates")
          for label_dir in sorted(path for path in root.iterdir() if path.is_dir()):
              state = json.loads(
                  (label_dir / "state.json").read_text(encoding="utf-8")
              )
              states.append(
                  {
                      "label": label_dir.name,
                      "candidate_id": state["candidate_id"],
                      "candidate_package_id": state["candidate_package_id"],
                      "validation_spec_id": state["validation_spec_id"],
                      "validation_start_ms": state["validation_start_ms"],
                      "state_id": state["state_id"],
                      "status": state["status"],
                  }
              )

          expected_count = int(os.environ["BOOTSTRAPPED_COUNT"])
          if len(states) != expected_count:
              raise SystemExit("clean state count does not reconcile")
          if source_admission.get("candidate_count") != expected_count:
              raise SystemExit("source admission candidate count changed")

          payload = {
              "schema_version": 1,
              "source_admission_id": source_admission["admission_id"],
              "source_admission_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_admission_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "source_admission_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "source_admission_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "source_admission_artifact_name": os.environ["SOURCE_ARTIFACT_NAME"],
              "source_admission_artifact_digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
              "as_of_ms": int(os.environ["AS_OF_MS"]),
              "candidate_count": len(states),
              "candidates": states,
              "paper_only": True,
              "prospective_only": True,
              "research_only": True,
              "promotion_eligible": False,
              "execution_ready": False,
          }
          bootstrap_id = hashlib.sha256(canonical(payload).encode("utf-8")).hexdigest()
          Path("clean-state/bootstrap.json").write_text(
              canonical({**payload, "bootstrap_id": bootstrap_id}) + "\n",
              encoding="utf-8",
          )
          PY

          echo "candidate_count=$BOOTSTRAPPED_COUNT" >> "$GITHUB_OUTPUT"

      - name: Render clean state bootstrap summary
        if: ${{ steps.source.outputs.artifact_exists == 'true' }}
        run: |
          {
            echo "## Learning clean-state bootstrap"
            echo "- clean candidates: ${{ steps.state.outputs.candidate_count }}"
            echo "- source admission run: ${{ steps.source.outputs.run_id }}"
            echo "- paper-only: true"
            echo "- research-only: true"
            echo "- promotion authorized: false"
            echo "- execution enabled: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish cumulative clean state artifact
        if: ${{ steps.source.outputs.artifact_exists == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: >-
            research-learning-clean-state-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: clean-state/
          if-no-files-found: error
          retention-days: 90
