name: Prospective Trade Quality Readiness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-trade-quality-readiness.yml"
      - "scripts/evaluate_prospective_trade_quality_readiness.py"
      - "src/cocomelon/research/prospective_trade_quality_readiness.py"
  workflow_run:
    workflows:
      - Prospective Cadence Prediction Ledger
      - Prospective Cadence A/B Ledger
      - Prospective Side-Conditioned Timing Ledger
    types:
      - completed
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-trade-quality-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READINESS_ISSUE: "695"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve latest coherent immutable ledgers
        id: ledgers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          def gh_json(endpoint: str) -> dict[str, object]:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      endpoint,
                  ]
              )
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise SystemExit(f"GitHub API payload is not an object: {endpoint}")
              return payload

          def gh_bytes(endpoint: str) -> bytes:
              return subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      endpoint,
                  ]
              )

          def completed_runs(workflow_file: str) -> list[dict[str, object]]:
              payload = gh_json(
                  f"repos/{repo}/actions/workflows/{workflow_file}/runs"
                  "?branch=main&per_page=100"
              )
              runs = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if isinstance(run, dict)
                  and run.get("status") == "completed"
              ]
              runs.sort(
                  key=lambda item: str(item.get("updated_at") or ""),
                  reverse=True,
              )
              if not runs:
                  raise SystemExit(
                      f"No completed {workflow_file} workflow run exists."
                  )
              latest = runs[0]
              if latest.get("conclusion") != "success":
                  raise SystemExit(
                      "Latest completed "
                      f"{workflow_file} run {latest.get('id')} concluded "
                      f"{latest.get('conclusion')}."
                  )
              return runs

          def artifact_for_run(
              run: dict[str, object],
              *,
              prefix: str,
              required: bool,
          ) -> dict[str, object] | None:
              run_id = run.get("id")
              if not isinstance(run_id, int):
                  raise SystemExit("workflow run ID is invalid")
              payload = gh_json(
                  f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              )
              matches = [
                  item
                  for item in payload.get("artifacts", [])
                  if isinstance(item, dict)
                  and item.get("expired") is False
                  and isinstance(item.get("name"), str)
                  and item["name"].startswith(prefix)
              ]
              if len(matches) > 1:
                  raise SystemExit(
                      f"Multiple current artifacts with prefix {prefix} "
                      f"exist for run {run_id}."
                  )
              if not matches:
                  if required:
                      raise SystemExit(
                          f"Expected exactly one current artifact with prefix "
                          f"{prefix} for latest run {run_id}."
                      )
                  return None
              artifact = matches[0]
              digest = artifact.get("digest")
              if not isinstance(digest, str) or not digest.startswith("sha256:"):
                  raise SystemExit(
                      f"Artifact digest is missing or invalid for run {run_id}."
                  )
              return artifact

          def load_artifact_json(
              run: dict[str, object],
              artifact: dict[str, object],
              *,
              expected_file: str,
          ) -> tuple[dict[str, object], bytes]:
              artifact_id = artifact.get("id")
              if not isinstance(artifact_id, int):
                  raise SystemExit("artifact ID is invalid")
              blob = gh_bytes(
                  f"repos/{repo}/actions/artifacts/{artifact_id}/zip"
              )
              expected_digest = artifact["digest"]
              actual_digest = "sha256:" + hashlib.sha256(blob).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(
                      f"Artifact digest mismatch for {artifact.get('name')}."
                  )
              with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                  matches = [
                      name
                      for name in archive.namelist()
                      if Path(name).name == expected_file
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"Expected exactly one {expected_file} in "
                          f"{artifact.get('name')}."
                      )
                  data = archive.read(matches[0])
              payload = json.loads(data)
              if not isinstance(payload, dict):
                  raise SystemExit(f"{expected_file} must contain an object")
              return payload, data

          def candidate_ledgers(
              workflow_file: str,
              *,
              artifact_prefix: str,
              expected_file: str,
          ) -> list[dict[str, object]]:
              runs = completed_runs(workflow_file)
              latest_artifact = artifact_for_run(
                  runs[0],
                  prefix=artifact_prefix,
                  required=True,
              )
              assert latest_artifact is not None
              candidates: list[dict[str, object]] = []
              for run in runs:
                  if run.get("conclusion") != "success":
                      continue
                  artifact = artifact_for_run(
                      run,
                      prefix=artifact_prefix,
                      required=False,
                  )
                  if artifact is None:
                      continue
                  payload, data = load_artifact_json(
                      run,
                      artifact,
                      expected_file=expected_file,
                  )
                  candidates.append(
                      {
                          "run": run,
                          "artifact": artifact,
                          "payload": payload,
                          "data": data,
                      }
                  )
                  if len(candidates) >= 40:
                      break
              if not candidates:
                  raise SystemExit(
                      f"No authenticated {artifact_prefix} artifact is available."
                  )
              return candidates

          prediction_candidates = candidate_ledgers(
              "prospective-cadence-prediction-ledger.yml",
              artifact_prefix="cadence-microstructure-prediction-ledger-",
              expected_file="cadence-microstructure-prediction-ledger.json",
          )
          comparison_candidates = candidate_ledgers(
              "prospective-cadence-comparison-ledger.yml",
              artifact_prefix="cadence-model-comparison-ledger-",
              expected_file="cadence-model-comparison-ledger.json",
          )

          def cadence_signature(
              item: dict[str, object],
              *,
              comparison: bool,
          ) -> tuple[int, int, str]:
              payload = item["payload"]
              assert isinstance(payload, dict)
              row_count = payload.get("row_count")
              start = payload.get("prospective_start_ms")
              digest = payload.get("frozen_training_rows_sha256")
              if (
                  isinstance(row_count, bool)
                  or not isinstance(row_count, int)
                  or isinstance(start, bool)
                  or not isinstance(start, int)
                  or not isinstance(digest, str)
                  or not digest
              ):
                  raise SystemExit("cadence ledger cohort metadata is invalid")
              if comparison and payload.get("prospective_rows") != row_count:
                  raise SystemExit(
                      "comparison prospective_rows does not match row_count"
                  )
              return row_count, start, digest

          comparison_by_signature: dict[
              tuple[int, int, str],
              dict[str, object],
          ] = {}
          for item in comparison_candidates:
              signature = cadence_signature(item, comparison=True)
              comparison_by_signature.setdefault(signature, item)

          coherent: list[
              tuple[
                  tuple[int, int, str],
                  dict[str, object],
                  dict[str, object],
              ]
          ] = []
          for prediction in prediction_candidates:
              signature = cadence_signature(
                  prediction,
                  comparison=False,
              )
              comparison = comparison_by_signature.get(signature)
              if comparison is not None:
                  coherent.append((signature, prediction, comparison))

          if not coherent:
              raise SystemExit(
                  "No authenticated prediction/comparison ledger pair shares "
                  "the same immutable cadence horizon."
              )

          coherent.sort(
              key=lambda item: (
                  item[0][0],
                  str(
                      (
                          item[1]["run"]
                          if isinstance(item[1]["run"], dict)
                          else {}
                      ).get("updated_at")
                      or ""
                  ),
                  str(
                      (
                          item[2]["run"]
                          if isinstance(item[2]["run"], dict)
                          else {}
                      ).get("updated_at")
                      or ""
                  ),
              ),
              reverse=True,
          )
          signature, prediction, comparison = coherent[0]

          timing_runs = completed_runs(
              "prospective-side-conditioned-timing-ledger.yml"
          )
          timing_artifact = artifact_for_run(
              timing_runs[0],
              prefix="prospective-side-conditioned-timing-ledger-",
              required=True,
          )
          assert timing_artifact is not None
          timing_payload, timing_data = load_artifact_json(
              timing_runs[0],
              timing_artifact,
              expected_file="prospective-side-conditioned-timing-ledger.json",
          )
          del timing_payload

          selections = (
              (
                  "prediction",
                  prediction,
                  "cadence-microstructure-prediction-ledger.json",
              ),
              (
                  "comparison",
                  comparison,
                  "cadence-model-comparison-ledger.json",
              ),
          )
          output_lines: list[str] = []
          for key, item, filename in selections:
              run = item["run"]
              artifact = item["artifact"]
              data = item["data"]
              assert isinstance(run, dict)
              assert isinstance(artifact, dict)
              assert isinstance(data, bytes)
              run_id = run.get("id")
              run_attempt = run.get("run_attempt")
              if not isinstance(run_id, int) or not isinstance(run_attempt, int):
                  raise SystemExit(f"{key} workflow run identity is invalid")
              out_dir = Path(f"/tmp/readiness-{key}")
              out_dir.mkdir(parents=True, exist_ok=True)
              ledger_path = out_dir / filename
              ledger_path.write_bytes(data)
              output_lines.extend(
                  [
                      f"{key}_path={ledger_path}",
                      f"{key}_run_id={run_id}",
                      f"{key}_run_attempt={run_attempt}",
                      f"{key}_artifact_name={artifact['name']}",
                      f"{key}_artifact_digest={artifact['digest']}",
                  ]
              )

          timing_run = timing_runs[0]
          timing_run_id = timing_run.get("id")
          timing_run_attempt = timing_run.get("run_attempt")
          if (
              not isinstance(timing_run_id, int)
              or not isinstance(timing_run_attempt, int)
          ):
              raise SystemExit("timing workflow run identity is invalid")
          timing_dir = Path("/tmp/readiness-timing")
          timing_dir.mkdir(parents=True, exist_ok=True)
          timing_path = (
              timing_dir
              / "prospective-side-conditioned-timing-ledger.json"
          )
          timing_path.write_bytes(timing_data)
          output_lines.extend(
              [
                  f"timing_path={timing_path}",
                  f"timing_run_id={timing_run_id}",
                  f"timing_run_attempt={timing_run_attempt}",
                  f"timing_artifact_name={timing_artifact['name']}",
                  f"timing_artifact_digest={timing_artifact['digest']}",
                  f"cadence_cohort_row_count={signature[0]}",
                  f"cadence_cohort_start_ms={signature[1]}",
                  f"cadence_cohort_training_digest={signature[2]}",
              ]
          )
          output_path.write_text(
              "\n".join(output_lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build fail-closed readiness manifest
        id: evaluate
        if: ${{ steps.ledgers.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_prospective_trade_quality_readiness.py             "${{ steps.ledgers.outputs.prediction_path }}"             "${{ steps.ledgers.outputs.comparison_path }}"             "${{ steps.ledgers.outputs.timing_path }}"             --json-out prospective-trade-quality-readiness.json             > /tmp/readiness.stdout.json
          cmp             prospective-trade-quality-readiness.json             /tmp/readiness.stdout.json

      - name: Publish blocked readiness status
        if: >-
          steps.ledgers.outcome != 'success' ||
          steps.evaluate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.READINESS_ISSUE }}
          LEDGER_OUTCOME: ${{ steps.ledgers.outcome }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "## Prospective trade-quality readiness",
              "",
              "**Status:** BLOCKED",
              "",
              f"- ledger resolution: `{os.environ['LEDGER_OUTCOME']}`",
              f"- readiness evaluation: `{os.environ['EVALUATE_OUTCOME']}`",
              "",
              (
                  "The aggregate gate refuses to reuse stale successful evidence "
                  "when the newest completed ledger run is failed, missing, "
                  "expired, or cross-ledger inconsistent."
              ),
              "",
              (
                  "No candidate is marked ready from this run. Prior immutable "
                  "ledger artifacts remain evidence only."
              ),
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/readiness-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"             -f body="$(cat /tmp/readiness-status.md)"

      - name: Fail closed on readiness integrity
        if: >-
          steps.ledgers.outcome != 'success' ||
          steps.evaluate.outcome != 'success'
        shell: bash
        run: |
          echo "Prospective readiness is blocked." >&2
          exit 1

      - name: Publish readiness status
        if: >-
          steps.ledgers.outcome == 'success' &&
          steps.evaluate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.READINESS_ISSUE }}
          PREDICTION_RUN_ID: ${{ steps.ledgers.outputs.prediction_run_id }}
          COMPARISON_RUN_ID: ${{ steps.ledgers.outputs.comparison_run_id }}
          TIMING_RUN_ID: ${{ steps.ledgers.outputs.timing_run_id }}
          CADENCE_COHORT_ROWS: ${{ steps.ledgers.outputs.cadence_cohort_row_count }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          report = json.loads(
              Path(
                  "prospective-trade-quality-readiness.json"
              ).read_text(encoding="utf-8")
          )
          cadence = report["cadence"]
          comparison = report["comparison"]
          timing = report["timing"]

          def iso_ms(value):
              return datetime.fromtimestamp(
                  int(value) / 1000,
                  tz=UTC,
              ).isoformat()

          status = {
              "review_ready": "READY FOR REVIEW",
              "collecting": "collecting",
              "all_candidates_failed": "ALL CANDIDATES FAILED",
          }[report["status"]]
          lines = [
              "## Prospective trade-quality readiness",
              "",
              f"**Status:** {status}",
              "",
              "### Immutable sources",
              "",
              (
                  "- cadence prediction ledger workflow run: "
                  f"`{os.environ['PREDICTION_RUN_ID']}`"
              ),
              (
                  "- cadence A/B ledger workflow run: "
                  f"`{os.environ['COMPARISON_RUN_ID']}`"
              ),
              (
                  "- timing ledger workflow run: "
                  f"`{os.environ['TIMING_RUN_ID']}`"
              ),
              (
                  "- cadence training digest: "
                  f"`{cadence['frozen_training_rows_sha256']}`"
              ),
              (
                  "- cadence prospective start: "
                  f"`{iso_ms(cadence['prospective_start_ms'])}`"
              ),
              (
                  "- timing prospective start: "
                  f"`{iso_ms(timing['started_at_ms'])}`"
              ),
              (
                  "- coherent cadence cohort rows: "
                  f"`{os.environ['CADENCE_COHORT_ROWS']}`"
              ),
              "- cross-ledger cadence alignment: `clean`",
              "",
              "### Cadence microstructure challenger",
              "",
              (
                  "- lifecycle state: "
                  f"`{cadence['lifecycle_state']}`"
              ),
              (
                  "- irrecoverable failure components: "
                  f"`{', '.join(cadence['irrecoverable_failure_components']) or 'none'}`"
              ),
              (
                  "- ready for review: "
                  f"`{str(cadence['ready_for_review']).lower()}`"
              ),
              (
                  "- standalone quality gate: "
                  f"`{str(cadence['standalone_ready_for_review']).lower()}`"
              ),
              (
                  "- complexity justified vs baseline: "
                  f"`{str(cadence['complexity_justified']).lower()}`"
              ),
              (
                  "- current gate path open / closed blocks failed: "
                  f"`{str(cadence['gate_path_open']).lower()} / "
                  f"{cadence['failed_closed_stability_blocks']}`"
              ),
              (
                  "- prospective rows / required: "
                  f"`{cadence['prospective_rows']} / "
                  f"{cadence['required_prospective_rows']}`"
              ),
              (
                  "- admitted rows / required: "
                  f"`{cadence['admitted_rows']} / "
                  f"{cadence['required_admitted_rows']}`"
              ),
              (
                  "- LONG rows / admitted: "
                  f"`{cadence['long_rows']} / "
                  f"{cadence['long_admitted_rows']}`"
              ),
              (
                  "- SHORT rows / admitted: "
                  f"`{cadence['short_rows']} / "
                  f"{cadence['short_admitted_rows']}`"
              ),
              (
                  "- candidate sum / mean: "
                  f"`{cadence['candidate_net_return_sum']} / "
                  f"{cadence['candidate_mean_net_return']}`"
              ),
              (
                  "- missing rows / admitted / LONG admitted / "
                  "SHORT admitted: "
                  f"`{cadence['missing']['prospective_rows']} / "
                  f"{cadence['missing']['admitted_rows']} / "
                  f"{cadence['missing']['long_admitted_rows']} / "
                  f"{cadence['missing']['short_admitted_rows']}`"
              ),
              "",
              "#### Chronological stability",
              "",
          ]
          for block in cadence["stability_blocks"]:
              lines.append(
                  "- block {block} rows {start}-{end}: rows=`{rows}/{required}` "
                  "closed=`{closed}` admitted=`{admitted}` "
                  "sum=`{total}` passes=`{passes}`".format(
                      block=block["block_index"],
                      start=block["start_row"],
                      end=block["end_row"],
                      rows=block["prospective_rows"],
                      required=block["required_rows"],
                      closed=str(block["closed"]).lower(),
                      admitted=block["admitted_rows"],
                      total=block["candidate_net_return_sum"],
                      passes=str(block["passes"]).lower(),
                  )
              )
          lines.extend(
              [
                  "",
                  "### Frozen model A/B",
                  "",
                  (
                      "- paired future rows / required: "
                      f"`{comparison['paired_rows']} / "
                      f"{comparison['required_paired_rows']}`"
                  ),
                  (
                      "- microstructure minus baseline contribution: "
                      f"`{comparison['microstructure_minus_baseline_sum']}`"
                  ),
                  (
                      "- complexity justified / positive incremental blocks: "
                      f"`{str(comparison['complexity_justified']).lower()} / "
                      f"{comparison['positive_incremental_blocks']} / "
                      f"{comparison['required_positive_incremental_blocks']}`"
                  ),
                  (
                      "- incremental gate path open / closed blocks failed / allowed: "
                      f"`{str(comparison['incremental_gate_path_open']).lower()} / "
                      f"{comparison['failed_closed_incremental_blocks']} / "
                      f"{comparison['maximum_allowed_failed_incremental_blocks']}`"
                  ),
                  (
                      "- both / micro-only / baseline-only / neither: "
                      f"`{comparison['both_admit']} / "
                      f"{comparison['microstructure_only']} / "
                      f"{comparison['baseline_only']} / "
                      f"{comparison['neither']}`"
                  ),
                  "",
                  "#### Incremental chronological stability",
                  "",
              ]
          )
          for block in comparison["incremental_stability_blocks"]:
              lines.append(
                  "- block {block} rows {start}-{end}: rows=`{rows}/{required}` "
                  "closed=`{closed}` micro-only=`{micro}` "
                  "baseline-only=`{baseline}` delta=`{delta}` "
                  "passes=`{passes}`".format(
                      block=block["block_index"],
                      start=block["start_row"],
                      end=block["end_row"],
                      rows=block["paired_rows"],
                      required=block["required_rows"],
                      closed=str(block["closed"]).lower(),
                      micro=block["microstructure_only_rows"],
                      baseline=block["baseline_only_rows"],
                      delta=block["microstructure_minus_baseline_sum"],
                      passes=str(block["passes"]).lower(),
                  )
              )
          lines.extend(
              [
                  "",
                  "### Side-conditioned timing challenger",
                  "",
                  (
                      "- lifecycle state: "
                      f"`{timing['lifecycle_state']}`"
                  ),
                  (
                      "- irrecoverable failure components: "
                      f"`{', '.join(timing['irrecoverable_failure_components']) or 'none'}`"
                  ),
                  (
                      "- ready for review: "
                      f"`{str(timing['ready_for_review']).lower()}`"
                  ),
                  (
                      "- sample complete / economics pass: "
                      f"`{str(timing['sample_complete']).lower()} / "
                      f"{str(timing['economics_pass']).lower()}`"
                  ),
                  (
                      "- current gate path open / closed blocks failed: "
                      f"`{str(timing['gate_path_open']).lower()} / "
                      f"{timing['failed_closed_temporal_blocks']}`"
                  ),
                  (
                      "- integrity clean: "
                      f"`{str(timing['integrity_clean']).lower()}`"
                  ),
                  (
                      "- prospective closed / required: "
                      f"`{timing['prospective_closed_trades']} / "
                      f"{timing['required']['prospective_closed_trades']}`"
                  ),
                  (
                      "- paired evaluable / required: "
                      f"`{timing['paired_evaluable_trades']} / "
                      f"{timing['required']['paired_evaluable_trades']}`"
                  ),
                  (
                      "- LONG / SHORT rows: "
                      f"`{timing['long_rows']} / {timing['short_rows']}`"
                  ),
                  (
                      "- selected net / delta vs actual / delta vs 60s: "
                      f"`{timing['selected_net_pnl']} / "
                      f"{timing['selected_minus_actual_pnl']} / "
                      f"{timing['selected_minus_60s_pnl']}`"
                  ),
                  (
                      "- LONG selected / vs actual: "
                      f"`{timing['by_direction']['long']['selected_net_pnl']} / "
                      f"{timing['by_direction']['long']['selected_minus_actual_pnl']}`"
                  ),
                  (
                      "- SHORT selected / vs actual: "
                      f"`{timing['by_direction']['short']['selected_net_pnl']} / "
                      f"{timing['by_direction']['short']['selected_minus_actual_pnl']}`"
                  ),
                  (
                      "- positive vs 60s after removing any one market: "
                      f"`{str(timing['market_robustness']['positive_vs_60s_after_any_single_market_removed']).lower()}`"
                  ),
                  (
                      "- missing closed / paired / LONG / SHORT: "
                      f"`{timing['missing']['prospective_closed_trades']} / "
                      f"{timing['missing']['paired_evaluable_trades']} / "
                      f"{timing['missing']['long_rows']} / "
                      f"{timing['missing']['short_rows']}`"
                  ),
              ]
          )
          lines.extend(
              [
                  "",
                  "#### Timing chronological robustness",
                  "",
              ]
          )
          for block in timing["temporal_blocks"]:
              lines.append(
                  "- block {block} rows {start}-{end}: rows=`{rows}/{required}` "
                  "closed=`{closed}` selected=`{selected}` "
                  "vs_actual=`{actual}` vs_60s=`{base}` passes=`{passes}`".format(
                      block=block["block_index"],
                      start=block["start_row"],
                      end=block["end_row"],
                      rows=block["rows"],
                      required=block["required_rows"],
                      closed=str(block["closed"]).lower(),
                      selected=block["selected_net_pnl"],
                      actual=block["selected_minus_actual_pnl"],
                      base=block["selected_minus_60s_pnl"],
                      passes=str(block["passes"]).lower(),
                  )
              )
          lines.extend(
              [
                  "",
                  "### Authority",
                  "",
                  (
                      "A `ready_for_review` result is evidence only. "
                      "This aggregate gate has no authority to change paper "
                      "entries, timing, sizing, stops, risk, promotion state, "
                      "or live execution."
                  ),
                  "",
                  "**Execution authority:** `false`  ",
                  "**Promotion authority:** `false`  ",
                  "**LIVE TRADING: DISABLED.**",
              ]
          )
          Path("/tmp/readiness-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"             -f body="$(cat /tmp/readiness-status.md)"

      - uses: actions/upload-artifact@v7
        if: >-
          steps.ledgers.outcome == 'success' &&
          steps.evaluate.outcome == 'success'
        with:
          name: prospective-trade-quality-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-trade-quality-readiness.json
          if-no-files-found: error
          retention-days: 90
