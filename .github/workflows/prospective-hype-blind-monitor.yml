name: Prospective HYPE Blind Monitor

on:
  schedule:
    - cron: "25 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-blind-monitor.yml"
      - "src/cocomelon/research/prospective_blind_monitor.py"
      - "src/cocomelon/research/prospective_artifact_selection.py"
      - "src/cocomelon/prospective_hype_blind_monitor_cli.py"
      - "src/cocomelon/research/prospective_blind_monitor_failure.py"
      - "src/cocomelon/prospective_hype_blind_monitor_failure_cli.py"
      - "tests/test_prospective_blind_monitor.py"
      - "tests/test_prospective_artifact_selection.py"
      - "tests/test_prospective_blind_monitor_failure.py"
      - "tests/test_prospective_blind_monitor_failure_cli.py"
      - "tests/test_prospective_hype_blind_monitor_workflow.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-blind-monitor.yml"
      - "src/cocomelon/research/prospective_blind_monitor.py"
      - "src/cocomelon/prospective_hype_blind_monitor_cli.py"
      - "src/cocomelon/research/prospective_blind_monitor_failure.py"
      - "src/cocomelon/prospective_hype_blind_monitor_failure_cli.py"
      - "tests/test_prospective_blind_monitor.py"
      - "tests/test_prospective_blind_monitor_failure.py"
      - "tests/test_prospective_blind_monitor_failure_cli.py"
      - "tests/test_prospective_hype_blind_monitor_workflow.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prospective-hype-blind-monitor
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate freshness and workflow contracts
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_prospective_blind_monitor.py \
            tests/test_prospective_artifact_selection.py \
            tests/test_prospective_blind_monitor_failure.py \
            tests/test_prospective_blind_monitor_failure_cli.py \
            tests/test_prospective_cutover_acceptance.py \
            tests/test_prospective_hype_blind_monitor_workflow.py \
            -q

  monitor:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MONITOR_ROOT: artifacts/prospective-hype-blind-monitor

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install monitor runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Capture monitor audit clock
        id: clock
        run: |
          set -euo pipefail
          audit_ms="$(python - <<'PY'
          import time
          print(time.time_ns() // 1_000_000)
          PY
          )"
          echo "audited_at_ms=$audit_ms" >> "$GITHUB_OUTPUT"

      - name: Discover matching health state and lineage artifacts
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "status=failure"
            echo "reason_code=ARTIFACT_DISCOVERY_UNEXPECTED_FAILURE"
            echo "health_id=none"
            echo "lineage_id=none"
            echo "state_id=none"
          } >> "$GITHUB_OUTPUT"

          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            > /tmp/prospective-artifacts.json
          then
            {
              echo "status=failure"
              echo "reason_code=ARTIFACT_DISCOVERY_REQUEST_FAILED"
              echo "health_id=none"
              echo "lineage_id=none"
              echo "state_id=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cocomelon.research.prospective_artifact_selection import (
              ProspectiveArtifactSelectionError,
              select_state_artifact_for_health,
          )

          def emit(**values):
              with Path(os.environ["GITHUB_OUTPUT"]).open(
                  "a",
                  encoding="utf-8",
              ) as handle:
                  for key, value in values.items():
                      handle.write(f"{key}={value}\n")

          try:
              payload = json.loads(
                  Path("/tmp/prospective-artifacts.json").read_text(
                      encoding="utf-8"
                  )
              )
              raw_artifacts = payload["artifacts"]
              if not isinstance(raw_artifacts, list):
                  raise TypeError
              artifacts = [
                  item
                  for item in raw_artifacts
                  if isinstance(item, dict)
                  and not item.get("expired", True)
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ]
          except (OSError, json.JSONDecodeError, KeyError, TypeError):
              emit(
                  status="failure",
                  reason_code="ARTIFACT_DISCOVERY_PAYLOAD_INVALID",
                  health_id="none",
                  lineage_id="none",
                  state_id="none",
              )
              raise SystemExit(0)

          health_items = [
              item
              for item in artifacts
              if str(item.get("name", "")).startswith(
                  "prospective-hype-clean-health-"
              )
          ]
          if not health_items:
              emit(
                  status="failure",
                  reason_code="HEALTH_ARTIFACT_MISSING",
                  health_id="none",
                  lineage_id="none",
                  state_id="none",
              )
              raise SystemExit(0)

          lineage_items = [
              item
              for item in artifacts
              if str(item.get("name", "")).startswith(
                  "prospective-hype-lineage-"
              )
          ]
          if not lineage_items:
              health = max(
                  health_items,
                  key=lambda item: (item["created_at"], item["id"]),
              )
              emit(
                  status="failure",
                  reason_code="LINEAGE_ARTIFACT_MISSING",
                  health_id=health["id"],
                  lineage_id="none",
                  state_id="none",
              )
              raise SystemExit(0)

          health = max(
              health_items,
              key=lambda item: (item["created_at"], item["id"]),
          )
          lineage = max(
              lineage_items,
              key=lambda item: (item["created_at"], item["id"]),
          )
          try:
              state_id = select_state_artifact_for_health(
                  raw_artifacts,
                  health,
              )
          except ProspectiveArtifactSelectionError as exc:
              emit(
                  status="failure",
                  reason_code=str(exc),
                  health_id=health["id"],
                  lineage_id=lineage["id"],
                  state_id="none",
              )
              raise SystemExit(0)

          emit(
              status="ok",
              reason_code="none",
              health_id=health["id"],
              lineage_id=lineage["id"],
              state_id=state_id,
          )
          PY

      - name: Verify source artifact producer provenance
        id: provenance
        if: ${{ steps.discover.outputs.status == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_ID: ${{ steps.discover.outputs.health_id }}
          LINEAGE_ID: ${{ steps.discover.outputs.lineage_id }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
        run: |
          set -euo pipefail
          {
            echo "status=failure"
            echo "reason_code=ARTIFACT_PROVENANCE_UNEXPECTED_FAILURE"
          } >> "$GITHUB_OUTPUT"

          for pair in "health:$HEALTH_ID" "lineage:$LINEAGE_ID" "state:$STATE_ID"; do
            label="${pair%%:*}"
            artifact_id="${pair#*:}"
            if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "/tmp/prospective-$label-artifact-meta.json"
            then
              {
                echo "status=failure"
                echo "reason_code=ARTIFACT_PROVENANCE_REQUEST_FAILED"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          health_run_id="$(
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-health-artifact-meta.json").read_text(
                  encoding="utf-8"
              )
          )
          print(payload["workflow_run"]["id"])
          PY
          )"
          lineage_run_id="$(
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-lineage-artifact-meta.json").read_text(
                  encoding="utf-8"
              )
          )
          print(payload["workflow_run"]["id"])
          PY
          )"

          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$health_run_id" \
            > /tmp/prospective-health-run.json
          then
            {
              echo "status=failure"
              echo "reason_code=ARTIFACT_PROVENANCE_REQUEST_FAILED"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$lineage_run_id" \
            > /tmp/prospective-lineage-run.json
          then
            {
              echo "status=failure"
              echo "reason_code=ARTIFACT_PROVENANCE_REQUEST_FAILED"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text(encoding="utf-8"))

          health = load("/tmp/prospective-health-artifact-meta.json")
          lineage = load("/tmp/prospective-lineage-artifact-meta.json")
          state = load("/tmp/prospective-state-artifact-meta.json")
          health_run = load("/tmp/prospective-health-run.json")
          lineage_run = load("/tmp/prospective-lineage-run.json")

          health_workflow = health.get("workflow_run")
          lineage_workflow = lineage.get("workflow_run")
          state_workflow = state.get("workflow_run")
          valid = (
              str(health.get("id")) == os.environ["HEALTH_ID"]
              and str(lineage.get("id")) == os.environ["LINEAGE_ID"]
              and str(state.get("id")) == os.environ["STATE_ID"]
              and str(health.get("name", "")).startswith(
                  "prospective-hype-clean-health-"
              )
              and str(lineage.get("name", "")).startswith(
                  "prospective-hype-lineage-"
              )
              and state.get("name") == "prospective-hype-clean-state"
              and health.get("expired") is False
              and lineage.get("expired") is False
              and state.get("expired") is False
              and isinstance(health_workflow, dict)
              and isinstance(lineage_workflow, dict)
              and isinstance(state_workflow, dict)
              and health_workflow.get("head_branch") == "main"
              and lineage_workflow.get("head_branch") == "main"
              and state_workflow.get("head_branch") == "main"
              and state_workflow.get("id") == health_workflow.get("id")
              and health_run.get("id") == health_workflow.get("id")
              and lineage_run.get("id") == lineage_workflow.get("id")
              and health_run.get("head_branch") == "main"
              and lineage_run.get("head_branch") == "main"
              and health_run.get("path")
              == ".github/workflows/prospective-hype-clean.yml"
              and lineage_run.get("path")
              == ".github/workflows/prospective-hype-lineage.yml"
              and health_run.get("repository", {}).get("full_name")
              == os.environ["GITHUB_REPOSITORY"]
              and lineage_run.get("repository", {}).get("full_name")
              == os.environ["GITHUB_REPOSITORY"]
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              if valid:
                  handle.write("status=ok\nreason_code=none\n")
              else:
                  handle.write(
                      "status=failure\n"
                      "reason_code=ARTIFACT_PRODUCER_PROVENANCE_INVALID\n"
                  )
          PY

      - name: Preserve discovery failure receipt
        if: ${{ always() && (steps.discover.outputs.status != 'ok' || steps.provenance.outputs.status != 'ok') }}
        env:
          AUDIT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          DISCOVERY_STATUS: ${{ steps.discover.outputs.status }}
          DISCOVERY_REASON: ${{ steps.discover.outputs.reason_code }}
          PROVENANCE_STATUS: ${{ steps.provenance.outputs.status }}
          PROVENANCE_REASON: ${{ steps.provenance.outputs.reason_code }}
          HEALTH_ID: ${{ steps.discover.outputs.health_id }}
          LINEAGE_ID: ${{ steps.discover.outputs.lineage_id }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
        run: |
          set -euo pipefail
          mkdir -p "$MONITOR_ROOT"
          if [[ "$DISCOVERY_STATUS" != "ok" ]]; then
            reason_code="$DISCOVERY_REASON"
          else
            reason_code="$PROVENANCE_REASON"
          fi
          cocomelon-prospective-hype-blind-monitor-failure \
            --audited-at-ms "$AUDIT_MS" \
            --stage discovery \
            --reason-code "$reason_code" \
            --health-artifact-id "$HEALTH_ID" \
            --lineage-artifact-id "$LINEAGE_ID" \
            --state-artifact-id "$STATE_ID" \
            > "$MONITOR_ROOT/failure.json"

      - name: Download operational health and lineage receipts
        id: download
        if: ${{ steps.discover.outputs.status == 'ok' && steps.provenance.outputs.status == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_ID: ${{ steps.discover.outputs.health_id }}
          LINEAGE_ID: ${{ steps.discover.outputs.lineage_id }}
        run: |
          set -euo pipefail
          {
            echo "status=failure"
            echo "reason_code=SOURCE_ARTIFACT_DOWNLOAD_UNEXPECTED_FAILURE"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$MONITOR_ROOT/health" "$MONITOR_ROOT/lineage"
          status="ok"
          reason_code="none"

          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HEALTH_ID/zip" \
            > /tmp/prospective-health.zip
          then
            status="failure"
            reason_code="HEALTH_ARTIFACT_DOWNLOAD_FAILED"
          elif ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$LINEAGE_ID/zip" \
            > /tmp/prospective-lineage.zip
          then
            status="failure"
            reason_code="LINEAGE_ARTIFACT_DOWNLOAD_FAILED"
          elif ! unzip -q /tmp/prospective-health.zip -d "$MONITOR_ROOT/health"
          then
            status="failure"
            reason_code="HEALTH_ARTIFACT_UNPACK_FAILED"
          elif ! unzip -q /tmp/prospective-lineage.zip -d "$MONITOR_ROOT/lineage"
          then
            status="failure"
            reason_code="LINEAGE_ARTIFACT_UNPACK_FAILED"
          elif [[ ! -f "$MONITOR_ROOT/health/prospective-hype-health.json" ]]
          then
            status="failure"
            reason_code="HEALTH_ARTIFACT_FILE_MISSING"
          elif [[ ! -f "$MONITOR_ROOT/lineage/lineage.json" ]]
          then
            status="failure"
            reason_code="LINEAGE_ARTIFACT_FILE_MISSING"
          fi

          {
            echo "status=$status"
            echo "reason_code=$reason_code"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve download failure receipt
        if: ${{ always() && steps.discover.outputs.status == 'ok' && steps.provenance.outputs.status == 'ok' && steps.download.outputs.status != 'ok' }}
        env:
          AUDIT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          REASON_CODE: ${{ steps.download.outputs.reason_code }}
          HEALTH_ID: ${{ steps.discover.outputs.health_id }}
          LINEAGE_ID: ${{ steps.discover.outputs.lineage_id }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-blind-monitor-failure \
            --audited-at-ms "$AUDIT_MS" \
            --stage download \
            --reason-code "$REASON_CODE" \
            --health-artifact-id "$HEALTH_ID" \
            --lineage-artifact-id "$LINEAGE_ID" \
            --state-artifact-id "$STATE_ID" \
            > "$MONITOR_ROOT/failure.json"

      - name: Build redacted campaign monitor receipt
        id: monitor
        if: ${{ steps.discover.outputs.status == 'ok' && steps.provenance.outputs.status == 'ok' && steps.download.outputs.status == 'ok' }}
        env:
          AUDIT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          HEALTH_ID: ${{ steps.discover.outputs.health_id }}
          LINEAGE_ID: ${{ steps.discover.outputs.lineage_id }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
        run: |
          set -euo pipefail
          monitor_rc=0
          cocomelon-prospective-hype-blind-monitor \
            --health "$MONITOR_ROOT/health/prospective-hype-health.json" \
            --lineage "$MONITOR_ROOT/lineage/lineage.json" \
            --state-artifact-id "$STATE_ID" \
            --audited-at-ms "$AUDIT_MS" \
            > "$MONITOR_ROOT/monitor.json" \
            2> /tmp/prospective-hype-monitor-error.json \
            || monitor_rc=$?
          echo "exit_code=$monitor_rc" >> "$GITHUB_OUTPUT"

          if [[ "$monitor_rc" -ne 0 ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            rm -f "$MONITOR_ROOT/monitor.json"
            reason_code="$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          reason = "MONITOR_BUILD_FAILED"
          try:
              payload = json.loads(
                  Path("/tmp/prospective-hype-monitor-error.json").read_text(
                      encoding="utf-8"
                  )
              )
              candidate = payload.get("error")
              if (
                  isinstance(candidate, str)
                  and len(candidate) <= 96
                  and re.fullmatch(r"[A-Z][A-Z0-9_]*", candidate)
              ):
                  reason = candidate
          except (OSError, json.JSONDecodeError):
              pass
          print(reason)
          PY
          )"
            cocomelon-prospective-hype-blind-monitor-failure \
              --audited-at-ms "$AUDIT_MS" \
              --stage build \
              --reason-code "$reason_code" \
              --health-artifact-id "$HEALTH_ID" \
              --lineage-artifact-id "$LINEAGE_ID" \
              --state-artifact-id "$STATE_ID" \
              > "$MONITOR_ROOT/failure.json"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "artifacts/prospective-hype-blind-monitor/monitor.json"
              ).read_text(encoding="utf-8")
          )
          assert payload["interim_economics_redacted"] is True
          assert payload["campaign_health_status"] in {
              "pre_validation",
              "healthy",
              "degraded",
              "irrecoverable",
          }
          assert payload["lineage_status"] in {
              "append_only_valid",
              "waiting_for_second_frozen_format_state",
          }
          assert len(payload["monitor_id"]) == 64
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          fi

      - name: Upload blind monitor receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-blind-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/prospective-hype-blind-monitor/monitor.json
            artifacts/prospective-hype-blind-monitor/failure.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Preserve monitor failure status
        if: ${{ always() }}
        env:
          DISCOVERY_STATUS: ${{ steps.discover.outputs.status }}
          PROVENANCE_STATUS: ${{ steps.provenance.outputs.status }}
          DOWNLOAD_STATUS: ${{ steps.download.outputs.status }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVERY_STATUS" != "ok" ]]; then
            exit 1
          fi
          if [[ "$PROVENANCE_STATUS" != "ok" ]]; then
            exit 1
          fi
          if [[ "$DOWNLOAD_STATUS" != "ok" ]]; then
            exit 1
          fi
          test -f "$MONITOR_ROOT/monitor.json"
          test ! -f "$MONITOR_ROOT/failure.json"
