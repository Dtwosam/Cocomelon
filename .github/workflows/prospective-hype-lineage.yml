name: Prospective HYPE Artifact Lineage Audit

on:
  schedule:
    - cron: "20 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-lineage.yml"
      - "src/cocomelon/research/prospective_artifact_lineage.py"
      - "src/cocomelon/research/prospective_lineage_failure.py"
      - "src/cocomelon/prospective_hype_lineage_cli.py"
      - "src/cocomelon/prospective_hype_lineage_failure_cli.py"
      - "tests/test_prospective_artifact_lineage.py"
      - "tests/test_prospective_lineage_failure.py"
      - "tests/test_prospective_lineage_failure_cli.py"
      - "tests/test_prospective_hype_lineage_workflow.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-lineage.yml"
      - "src/cocomelon/research/prospective_artifact_lineage.py"
      - "src/cocomelon/research/prospective_lineage_failure.py"
      - "src/cocomelon/prospective_hype_lineage_cli.py"
      - "src/cocomelon/prospective_hype_lineage_failure_cli.py"
      - "tests/test_prospective_artifact_lineage.py"
      - "tests/test_prospective_lineage_failure.py"
      - "tests/test_prospective_lineage_failure_cli.py"
      - "tests/test_prospective_hype_lineage_workflow.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prospective-hype-lineage-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STATE_ARTIFACT_NAME: prospective-hype-clean-state
      LINEAGE_ROOT: artifacts/prospective-hype-lineage

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Capture lineage audit clock
        id: clock
        run: |
          set -euo pipefail
          audit_ms="$(python - <<'PY'
          import time
          print(time.time_ns() // 1_000_000)
          PY
          )"
          echo "audited_at_ms=$audit_ms" >> "$GITHUB_OUTPUT"

      - name: Discover latest two cumulative main-state artifacts
        id: discover
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT_NAME&per_page=100" \
            > /tmp/prospective-state-artifacts.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-state-artifacts.json").read_text(
                  encoding="utf-8"
              )
          )
          artifacts = [
              item
              for item in payload["artifacts"]
              if not item["expired"]
              and item["workflow_run"]["head_branch"] == "main"
          ]
          artifacts.sort(key=lambda item: (item["created_at"], item["id"]))
          if len(artifacts) < 2:
              raise SystemExit("at least two cumulative main-state artifacts are required")

          previous, current = artifacts[-2:]

          def epoch_ms(value: str) -> int:
              resolved = datetime.fromisoformat(value.replace("Z", "+00:00"))
              return int(resolved.timestamp() * 1000)

          outputs = {
              "previous_id": previous["id"],
              "current_id": current["id"],
              "previous_audited_at_ms": epoch_ms(previous["created_at"]),
              "current_audited_at_ms": epoch_ms(current["created_at"]),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Verify selected state artifact producers
        id: provenance
        continue-on-error: true
        if: steps.discover.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ID: ${{ steps.discover.outputs.previous_id }}
          CURRENT_ID: ${{ steps.discover.outputs.current_id }}
        run: |
          set -euo pipefail
          for label in previous current; do
            if [[ "$label" == "previous" ]]; then
              artifact_id="$PREVIOUS_ID"
            else
              artifact_id="$CURRENT_ID"
            fi
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "/tmp/prospective-$label-artifact.json"
            run_id="$(
              python - "$label" <<'PY'
          import json
          import sys
          from pathlib import Path

          label = sys.argv[1]
          payload = json.loads(
              Path(f"/tmp/prospective-{label}-artifact.json").read_text(
                  encoding="utf-8"
              )
          )
          print(payload["workflow_run"]["id"])
          PY
            )"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              > "/tmp/prospective-$label-run.json"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_path = ".github/workflows/prospective-hype-clean.yml"
          for label, expected_id in (
              ("previous", os.environ["PREVIOUS_ID"]),
              ("current", os.environ["CURRENT_ID"]),
          ):
              artifact = json.loads(
                  Path(f"/tmp/prospective-{label}-artifact.json").read_text(
                      encoding="utf-8"
                  )
              )
              run = json.loads(
                  Path(f"/tmp/prospective-{label}-run.json").read_text(
                      encoding="utf-8"
                  )
              )
              workflow_run = artifact.get("workflow_run")
              if (
                  str(artifact.get("id")) != expected_id
                  or artifact.get("name") != "prospective-hype-clean-state"
                  or artifact.get("expired") is not False
                  or not isinstance(workflow_run, dict)
                  or workflow_run.get("head_branch") != "main"
                  or run.get("id") != workflow_run.get("id")
                  or run.get("head_branch") != "main"
                  or run.get("path") != expected_path
                  or run.get("repository", {}).get("full_name")
                  != os.environ["GITHUB_REPOSITORY"]
              ):
                  raise SystemExit(
                      f"{label.upper()}_STATE_ARTIFACT_PROVENANCE_INVALID"
                  )
          PY

      - name: Download previous and current cumulative states
        id: download
        continue-on-error: true
        if: steps.provenance.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ID: ${{ steps.discover.outputs.previous_id }}
          CURRENT_ID: ${{ steps.discover.outputs.current_id }}
        run: |
          set -euo pipefail
          mkdir -p "$LINEAGE_ROOT/previous" "$LINEAGE_ROOT/current"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_ID/zip" \
            > /tmp/prospective-previous.zip
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CURRENT_ID/zip" \
            > /tmp/prospective-current.zip
          unzip -q /tmp/prospective-previous.zip -d "$LINEAGE_ROOT/previous"
          unzip -q /tmp/prospective-current.zip -d "$LINEAGE_ROOT/current"

      - name: Verify latest frozen-format state and classify predecessor
        id: compatibility
        continue-on-error: true
        if: steps.download.outcome == 'success'
        env:
          PREVIOUS_ID: ${{ steps.discover.outputs.previous_id }}
          CURRENT_ID: ${{ steps.discover.outputs.current_id }}
          PREVIOUS_AUDITED_AT_MS: ${{ steps.discover.outputs.previous_audited_at_ms }}
          CURRENT_AUDITED_AT_MS: ${{ steps.discover.outputs.current_audited_at_ms }}
        run: |
          set -euo pipefail
          cocomelon-prospective-hype-state-readiness \
            --root "$LINEAGE_ROOT/current" \
            --artifact-id "$CURRENT_ID" \
            --as-of-ms "$CURRENT_AUDITED_AT_MS" \
            > /tmp/current-state-readiness.json

          if [[ -f "$LINEAGE_ROOT/previous/control-plane.json" ]]; then
            cocomelon-prospective-hype-state-readiness \
              --root "$LINEAGE_ROOT/previous" \
              --artifact-id "$PREVIOUS_ID" \
              --as-of-ms "$PREVIOUS_AUDITED_AT_MS" \
              > /tmp/previous-state-readiness.json
            echo "has_frozen_pair=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frozen_pair=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build immutable append-only lineage receipt
        id: build
        continue-on-error: true
        if: steps.compatibility.outcome == 'success'
        env:
          PREVIOUS_ID: ${{ steps.discover.outputs.previous_id }}
          CURRENT_ID: ${{ steps.discover.outputs.current_id }}
          PREVIOUS_AUDITED_AT_MS: ${{ steps.discover.outputs.previous_audited_at_ms }}
          CURRENT_AUDITED_AT_MS: ${{ steps.discover.outputs.current_audited_at_ms }}
          HAS_FROZEN_PAIR: ${{ steps.compatibility.outputs.has_frozen_pair }}
        run: |
          set -euo pipefail
          if [[ "$HAS_FROZEN_PAIR" == "true" ]]; then
            cocomelon-prospective-hype-lineage \
              --previous-root "$LINEAGE_ROOT/previous" \
              --current-root "$LINEAGE_ROOT/current" \
              --previous-artifact-id "$PREVIOUS_ID" \
              --current-artifact-id "$CURRENT_ID" \
              --previous-audited-at-ms "$PREVIOUS_AUDITED_AT_MS" \
              --current-audited-at-ms "$CURRENT_AUDITED_AT_MS" \
              > "$LINEAGE_ROOT/lineage.json"
          else
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          current = json.loads(
              Path("/tmp/current-state-readiness.json").read_text(
                  encoding="utf-8"
              )
          )
          payload = {
              "previous_artifact_id": os.environ["PREVIOUS_ID"],
              "current_artifact_id": os.environ["CURRENT_ID"],
              "current_audited_at_ms": int(os.environ["CURRENT_AUDITED_AT_MS"]),
              "lineage_status": "waiting_for_second_frozen_format_state",
              "reason_code": "previous_artifact_predates_control_plane_freeze",
              "campaign_id": current["campaign_id"],
              "runtime_attestation_id": current["runtime_attestation_id"],
              "control_plane_id": current["control_plane_id"],
              "current_state_digest": current["state_digest"],
              "current_observation_count": current["observation_count"],
              "current_outcome_count": current["outcome_count"],
              "schema_version": 1,
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              allow_nan=False,
          )
          payload["receipt_id"] = hashlib.sha256(
              canonical.encode("utf-8")
          ).hexdigest()
          Path(
              "artifacts/prospective-hype-lineage/lineage.json"
          ).write_text(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "artifacts/prospective-hype-lineage/lineage.json"
              ).read_text(encoding="utf-8")
          )
          assert payload["lineage_status"] in {
              "append_only_valid",
              "waiting_for_second_frozen_format_state",
          }
          assert len(payload["campaign_id"]) == 64
          assert len(payload["runtime_attestation_id"]) == 64
          assert len(payload["control_plane_id"]) == 64
          assert len(payload["current_state_digest"]) == 64
          assert len(payload["receipt_id"]) == 64
          if payload["lineage_status"] == "append_only_valid":
              assert len(payload["previous_state_digest"]) == 64
              assert (
                  payload["current_observation_count"]
                  >= payload["previous_observation_count"]
              )
              assert (
                  payload["current_outcome_count"]
                  >= payload["previous_outcome_count"]
              )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload lineage receipt
        id: success_upload
        continue-on-error: true
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-lineage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-lineage/lineage.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9


      - name: Preserve redacted lineage failure receipt
        if: >-
          always() &&
          (
            steps.discover.outcome == 'failure' ||
            steps.provenance.outcome == 'failure' ||
            steps.download.outcome == 'failure' ||
            steps.compatibility.outcome == 'failure' ||
            steps.build.outcome == 'failure' ||
            steps.success_upload.outcome == 'failure'
          )
        env:
          AUDIT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          DISCOVER_OUTCOME: ${{ steps.discover.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.success_upload.outcome }}
          PREVIOUS_ID: ${{ steps.discover.outputs.previous_id }}
          CURRENT_ID: ${{ steps.discover.outputs.current_id }}
        run: |
          set -euo pipefail
          stage=""
          reason_code=""
          if [[ "$DISCOVER_OUTCOME" == "failure" ]]; then
            stage="discovery"
            reason_code="LINEAGE_ARTIFACT_DISCOVERY_FAILED"
          elif [[ "$PROVENANCE_OUTCOME" == "failure" ]]; then
            stage="discovery"
            reason_code="LINEAGE_ARTIFACT_PROVENANCE_FAILED"
          elif [[ "$DOWNLOAD_OUTCOME" == "failure" ]]; then
            stage="download"
            reason_code="LINEAGE_STATE_DOWNLOAD_FAILED"
          elif [[ "$COMPATIBILITY_OUTCOME" == "failure" ]]; then
            stage="state"
            reason_code="LINEAGE_STATE_READINESS_FAILED"
          elif [[ "$BUILD_OUTCOME" == "failure" ]]; then
            stage="verify"
            reason_code="LINEAGE_APPEND_ONLY_VERIFY_FAILED"
          elif [[ "$UPLOAD_OUTCOME" == "failure" ]]; then
            stage="upload"
            reason_code="LINEAGE_RECEIPT_UPLOAD_FAILED"
          else
            echo "lineage failure stage could not be resolved" >&2
            exit 2
          fi

          mkdir -p "$LINEAGE_ROOT"
          cocomelon-prospective-hype-lineage-failure \
            --audited-at-ms "$AUDIT_MS" \
            --stage "$stage" \
            --reason-code "$reason_code" \
            --previous-artifact-id "${PREVIOUS_ID:-none}" \
            --current-artifact-id "${CURRENT_ID:-none}" \
            > "$LINEAGE_ROOT/failure.json"

      - name: Upload lineage failure receipt
        if: >-
          always() &&
          (
            steps.discover.outcome == 'failure' ||
            steps.provenance.outcome == 'failure' ||
            steps.download.outcome == 'failure' ||
            steps.compatibility.outcome == 'failure' ||
            steps.build.outcome == 'failure' ||
            steps.success_upload.outcome == 'failure'
          )
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-failed-lineage-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-lineage/failure.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Preserve lineage failure status
        if: >-
          always() &&
          (
            steps.discover.outcome == 'failure' ||
            steps.download.outcome == 'failure' ||
            steps.compatibility.outcome == 'failure' ||
            steps.build.outcome == 'failure' ||
            steps.success_upload.outcome == 'failure'
          )
        run: exit 1
