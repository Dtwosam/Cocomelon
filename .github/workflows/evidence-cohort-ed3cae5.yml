name: Genuine Mainnet Evidence Cohort ed3cae5

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  evidence-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      COHORT_CODE_REVISION: 571c13bfe0bab0312940617540ec973ee3eee3c5
      COHORT_TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 571c13bfe0bab0312940617540ec973ee3eee3c5
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Record genuine public mainnet evidence
        run: |
          set -euo pipefail
          mkdir -p evidence-cohort/output evidence-cohort/recording
          git rev-parse HEAD > evidence-cohort/output/workflow-head.txt
          printf '%s\n' "$COHORT_TRIGGER_SHA" > evidence-cohort/output/trigger-head.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > evidence-cohort/output/started-at-utc.txt
          cocomelon record-mainnet-evidence \
            --root evidence-cohort/recording \
            --seconds 1800 \
            --deep-limit 5 \
            > evidence-cohort/output/record.json
          date -u +%Y-%m-%dT%H:%M:%SZ > evidence-cohort/output/finished-at-utc.txt

      - name: Validate and replay recorded evidence offline
        run: |
          set -euo pipefail
          cocomelon validate-recording \
            --root evidence-cohort/recording \
            > evidence-cohort/output/validate.json
          cocomelon freeze-baseline-replay \
            --root evidence-cohort/recording \
            --out evidence-cohort/output/bundle.json \
            --starting-cash 10000 \
            > evidence-cohort/output/freeze.json
          cocomelon run-baseline-replay \
            --bundle evidence-cohort/output/bundle.json \
            --journal evidence-cohort/output/journal.sqlite3 \
            --execution evidence-cohort/output/execution.sqlite3 \
            --facts evidence-cohort/output/facts.sqlite3 \
            > evidence-cohort/output/replay.json
          RUN_ID=$(python -c 'import json; print(json.load(open("evidence-cohort/output/replay.json"))["run_id"])')
          cocomelon freeze-evaluation-dataset \
            --journal evidence-cohort/output/journal.sqlite3 \
            --facts evidence-cohort/output/facts.sqlite3 \
            --run-id "$RUN_ID" \
            > evidence-cohort/output/dataset.json

      - name: Assert pinned paper-only evidence semantics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("evidence-cohort/output")
          record = json.loads((root / "record.json").read_text())
          validate = json.loads((root / "validate.json").read_text())
          replay = json.loads((root / "replay.json").read_text())
          dataset = json.loads((root / "dataset.json").read_text())
          bundle = json.loads((root / "bundle.json").read_text())
          expected_revision = os.environ["COHORT_CODE_REVISION"]
          workflow_head = (root / "workflow-head.txt").read_text().strip()
          trigger_head = (root / "trigger-head.txt").read_text().strip()

          assert workflow_head == expected_revision
          assert bundle["manifest"]["code_revision"] == expected_revision
          assert len(trigger_head) == 40
          assert trigger_head != expected_revision
          assert record["network_access"] is True
          assert record["live_orders"] is False
          assert replay["network_access"] is False
          assert replay["live_orders"] is False
          assert "edge" not in replay
          assert "profitable" not in replay

          summary = {
              "evidence_kind": "genuine_public_hyperliquid_mainnet",
              "economic_claim": "none",
              "checked_out_code_revision": workflow_head,
              "trigger_head_sha": trigger_head,
              "recording_session_id": record["session_id"],
              "selected_markets": record["selected_markets"],
              "recorded_event_count": record["event_count"],
              "recorded_gap_count": record["gap_count"],
              "recorded_duplicate_count": record["duplicate_count"],
              "validated_segment_count": validate["segment_count"],
              "replay_run_id": replay["run_id"],
              "replay_result_digest": replay["result_digest"],
              "strategy_decisions": replay["strategy_decisions"],
              "risk_approvals": replay["risk_approvals"],
              "risk_rejections": replay["risk_rejections"],
              "execution_attempts": replay["execution_attempts"],
              "fills": replay["fills"],
              "opened_positions": replay["opened_positions"],
              "closed_positions": replay["closed_positions"],
              "closed_trade_count": len(replay["closed_trade_ids"]),
              "final_equity": replay["final_equity"],
              "data_complete": replay["data_complete"],
              "dataset_manifest_id": dataset["dataset_manifest_id"],
              "dataset_trade_count": dataset["trade_count"],
              "excluded_trade_count": dataset["excluded_trade_count"],
          }
          (root / "cohort-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload genuine evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-mainnet-evidence-cohort-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence-cohort/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
