name: Prospective Full-Stack Matched-Trade Ledger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-full-stack-matched-trade-ledger.yml"
      - "scripts/update_prospective_full_stack_matched_trade_ledger.py"
      - "src/cocomelon/research/prospective_full_stack_matched_trade_ledger.py"
  workflow_run:
    workflows:
      - "Continuous Mainnet Paper Trader"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Continuous Mainnet Paper Trader run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prospective-full-stack-matched-trade-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEDGER_ISSUE: "740"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Resolve exact source paper run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          INPUT_RUN_ID: ${{ inputs.source_run_id || '' }}
          INPUT_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '' }}
        run: |
          set -euo pipefail
          echo "source_eligible=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$EVENT_CONCLUSION" = "success" ]; then
            run_id="$EVENT_RUN_ID"
            run_attempt="$EVENT_RUN_ATTEMPT"
            resolution_mode="successful_event"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            resolution_mode="manual_exact"
          else
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=50"
            )"
            read -r run_id run_attempt <<< "$(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"])
                  break
          '
            )"
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              resolution_mode="latest_successful_after_non_success_wake"
            else
              resolution_mode="latest_successful_push"
            fi
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "source paper run identity is invalid" >&2
            exit 1
          fi

          artifact_for_run() {
            local candidate_run_id="$1"
            local candidate_attempt="$2"
            local expected_name="continuous-paper-learning-source-$candidate_run_id-$candidate_attempt"
            local artifacts_json
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            printf '%s' "$artifacts_json" |
            ARTIFACT_NAME="$expected_name" python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          name = os.environ["ARTIFACT_NAME"]
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == name and item.get("expired") is False
          ]
          if not matches:
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected at most one non-expired source artifact named {name}"
              )
          item = matches[0]
          digest = item.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("source artifact digest is missing or invalid")
          print(item["id"], item["name"], digest, sep="\t")
          '
          }

          artifact_line="$(artifact_for_run "$run_id" "$run_attempt")"
          if [ -z "$artifact_line" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            runs_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?branch=main&status=completed&per_page=50"
            )"
            mapfile -t artifact_candidates < <(
              printf '%s' "$runs_json" | python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          repo = os.environ["GITHUB_REPOSITORY"]
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("path") == ".github/workflows/continuous-paper.yml"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and (run.get("head_repository") or {}).get("full_name") == repo
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("run_attempt"), int)
              ):
                  print(run["id"], run["run_attempt"], sep="\t")
          '
            )
            for candidate in "${artifact_candidates[@]}"; do
              IFS=$'\t' read -r candidate_run_id candidate_attempt <<<"$candidate"
              if [ "$candidate_run_id" = "$run_id" ] && [ "$candidate_attempt" = "$run_attempt" ]; then
                continue
              fi
              candidate_artifact_line="$(
                artifact_for_run "$candidate_run_id" "$candidate_attempt"
              )"
              if [ -n "$candidate_artifact_line" ]; then
                run_id="$candidate_run_id"
                run_attempt="$candidate_attempt"
                artifact_line="$candidate_artifact_line"
                resolution_mode="latest_successful_with_compact_artifact"
                break
              fi
            done
          fi
          if [ -z "$artifact_line" ]; then
            echo "selected source has no authenticated compact artifact" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          head_sha="$(
            printf '%s' "$run_json" |
            SOURCE_ATTEMPT="$run_attempt" python -c '
          import json, os, sys
          run = json.load(sys.stdin)
          if run.get("path") != ".github/workflows/continuous-paper.yml":
              raise SystemExit("source workflow path mismatch")
          if run.get("head_branch") != "main":
              raise SystemExit("source run must be from main")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("source run must be completed successfully")
          if str(run.get("run_attempt")) != os.environ["SOURCE_ATTEMPT"]:
              raise SystemExit("source run attempt mismatch")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source repository mismatch")
          sha = run.get("head_sha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("source head sha is invalid")
          print(sha)
          '
          )"
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"$artifact_line"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "resolution_mode=$resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Download compact full-stack source
        id: compact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/full-stack-matched-source
          mkdir -p /tmp/full-stack-matched-source
          gh api             "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/full-stack-matched-source.zip
          unzip -q             /tmp/full-stack-matched-source.zip             -d /tmp/full-stack-matched-source

          journal_path="$(
            find /tmp/full-stack-matched-source               -type f -name journal.sqlite3 -print -quit
          )"
          summary_path="$(
            find /tmp/full-stack-matched-source               -type f               -name prospective-full-stack-entry-exit-summary.json               -print -quit
          )"
          if [ -z "$journal_path" ] || [ -z "$summary_path" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$journal_path"
          test -s "$summary_path"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "journal_path=$journal_path" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"

      - name: Publish waiting status
        if: ${{ steps.compact.outputs.eligible != 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          lines = [
              "## Full entry-exit stack matched-trade ledger",
              "",
              "**Status:** waiting for compact full-stack source",
              "",
              f"- source paper run: `{os.environ['SOURCE_RUN_ID']}`",
              f"- source paper attempt: `{os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source resolution: `{os.environ['RESOLUTION_MODE']}`",
              "",
              "No matched-trade row is credited from this run.",
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes readiness gates:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/full-stack-matched-ledger-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/full-stack-matched-ledger-status.md)"

      - name: Restore previous matched-trade ledger
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        id: previous
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous_path=""
          previous_workflow_run_id=""
          runs_json="$(
            gh api               "repos/$GITHUB_REPOSITORY/actions/workflows/prospective-full-stack-matched-trade-ledger.yml/runs?status=success&per_page=100"
          )"
          mapfile -t prior_runs < <(
            jq -r               --arg current "$CURRENT_RUN_ID"               '.workflow_runs
               | map(select((.id | tostring) != $current))
               | sort_by(.updated_at)
               | reverse
               | .[].id'               <<<"$runs_json"
          )
          for run_id in "${prior_runs[@]}"; do
            artifacts_json="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"
            )"
            artifact_line="$(
              jq -r '
                .artifacts
                | map(
                    select(
                      (.expired | not)
                      and (
                        .name
                        | startswith("prospective-full-stack-matched-trade-ledger-")
                      )
                    )
                  )
                | if length > 0
                  then [.[0].id, .[0].name] | @tsv
                  else ""
                  end
              ' <<<"$artifacts_json"
            )"
            if [ -z "$artifact_line" ]; then
              continue
            fi
            IFS=$'\t' read -r artifact_id artifact_name <<<"$artifact_line"
            rm -rf /tmp/previous-full-stack-matched-ledger
            mkdir -p /tmp/previous-full-stack-matched-ledger
            gh api               "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > /tmp/previous-full-stack-matched-ledger.zip
            unzip -q               /tmp/previous-full-stack-matched-ledger.zip               -d /tmp/previous-full-stack-matched-ledger
            candidate="$(
              find /tmp/previous-full-stack-matched-ledger                 -type f                 -name prospective-full-stack-matched-trade-ledger.json                 -print -quit
            )"
            if [ -n "$candidate" ] && [ -s "$candidate" ]; then
              previous_path="$candidate"
              previous_workflow_run_id="$run_id"
              break
            fi
          done
          echo "previous_path=$previous_path" >> "$GITHUB_OUTPUT"
          echo "previous_workflow_run_id=$previous_workflow_run_id" >> "$GITHUB_OUTPUT"

      - name: Extend append-only matched-trade ledger
        if: ${{ steps.compact.outputs.eligible == 'true' }}
        id: ledger
        continue-on-error: true
        shell: bash
        env:
          JOURNAL_PATH: ${{ steps.compact.outputs.journal_path }}
          SUMMARY_PATH: ${{ steps.compact.outputs.summary_path }}
          PREVIOUS_LEDGER_PATH: ${{ steps.previous.outputs.previous_path }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          set +e
          args=(
            "$JOURNAL_PATH"
            "$SUMMARY_PATH"
            --source-paper-run-id "$SOURCE_RUN_ID"
            --source-paper-run-attempt "$SOURCE_RUN_ATTEMPT"
            --source-artifact-name "$SOURCE_ARTIFACT_NAME"
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"
            --json-out prospective-full-stack-matched-trade-ledger.json
          )
          if [ -n "$PREVIOUS_LEDGER_PATH" ]; then
            args+=(--previous "$PREVIOUS_LEDGER_PATH")
          fi
          python scripts/update_prospective_full_stack_matched_trade_ledger.py             "${args[@]}"             > /tmp/full-stack-matched-ledger.stdout.json             2> /tmp/full-stack-matched-ledger.error
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test -s prospective-full-stack-matched-trade-ledger.json
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo "error<<EOF"
              cat /tmp/full-stack-matched-ledger.error
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish blocked matched-trade status
        if: >-
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean != 'true'
        shell: bash
        env:
          ERROR_TEXT: ${{ steps.ledger.outputs.error }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          lines = [
              "## Full entry-exit stack matched-trade ledger",
              "",
              "**Status:** BLOCKED — append-only invariant failure",
              "",
              f"- source paper run: `{os.environ['SOURCE_RUN_ID']}`",
              f"- source paper attempt: `{os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- error: `{os.environ.get('ERROR_TEXT', 'unknown error')}`",
              "",
              "No new matched-trade evidence is published from this run.",
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes readiness gates:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/full-stack-matched-ledger-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/full-stack-matched-ledger-status.md)"

      - name: Fail closed on matched-trade ledger drift
        if: >-
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean != 'true'
        shell: bash
        run: |
          echo "Full-stack matched-trade ledger is blocked." >&2
          exit 1

      - name: Publish clean matched-trade status
        if: >-
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          RESOLUTION_MODE: ${{ steps.source.outputs.resolution_mode }}
          PREVIOUS_WORKFLOW_RUN_ID: ${{ steps.previous.outputs.previous_workflow_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          ledger = json.loads(
              Path(
                  "prospective-full-stack-matched-trade-ledger.json"
              ).read_text(encoding="utf-8")
          )
          summary = ledger["summary"]
          overall = summary["overall"]
          readiness = summary["review_readiness"]
          robust = summary["robustness"]
          campaign = ledger["campaign"]

          def stamp(value):
              return datetime.fromtimestamp(
                  int(value) / 1000,
                  tz=UTC,
              ).isoformat()

          previous = os.environ["PREVIOUS_WORKFLOW_RUN_ID"] or "none"
          lines = [
              "## Full entry-exit stack matched-trade ledger",
              "",
              "**Status:** append-only clean",
              "",
              f"- common stack start: `{stamp(campaign['overlap_started_at_ms'])}`",
              f"- source paper run / attempt: `{os.environ['SOURCE_RUN_ID']} / {os.environ['SOURCE_RUN_ATTEMPT']}`",
              f"- source resolution: `{os.environ['RESOLUTION_MODE']}`",
              f"- previous ledger workflow run: `{previous}`",
              f"- terminal rows / previous / new / pending: `{ledger['row_count']} / {ledger['previous_row_count']} / {ledger['new_row_count']} / {ledger['pending_trade_count']}`",
              f"- actual / entry-stack / full-stack PnL: `{overall['actual_net_pnl']} / {overall['entry_stack_candidate_net_pnl']} / {overall['full_stack_candidate_net_pnl']}`",
              f"- actual / entry-stack / full-stack net R: `{overall['actual_net_r']} / {overall['entry_stack_candidate_net_r']} / {overall['full_stack_candidate_net_r']}`",
              f"- full-stack delta PnL / R: `{overall['full_stack_delta_net_pnl']} / {overall['full_stack_delta_net_r']}`",
              f"- breakeven incremental PnL / R: `{overall['breakeven_incremental_net_pnl']} / {overall['breakeven_incremental_net_r']}`",
              f"- sample / integrity / candidate profitable / improvement positive: `{readiness['sample_complete']} / {readiness['integrity_complete']} / {readiness['candidate_profitable']} / {readiness['improvement_positive']}`",
              f"- candidate LOO trade/market robust: `{readiness['candidate_single_trade_robust']} / {readiness['candidate_single_market_robust']}`",
              f"- delta LOO trade/market robust: `{readiness['delta_single_trade_robust']} / {readiness['delta_single_market_robust']}`",
              f"- candidate LOO trade min PnL/R: `{robust['candidate_leave_one_trade_out_min_pnl']} / {robust['candidate_leave_one_trade_out_min_r']}`",
              f"- candidate LOO market min PnL/R: `{robust['candidate_leave_one_market_out_min_pnl']} / {robust['candidate_leave_one_market_out_min_r']}`",
              f"- ready for evidence review: `{readiness['ready_for_evidence_review']}`",
              f"- rows SHA-256: `{ledger['rows_sha256']}`",
              f"- ledger SHA-256: `{ledger['ledger_sha256']}`",
              "",
              "Review readiness requires the final stack itself to be profitable in both PnL and net R, not merely better than actual paper.",
              "Any pending closed trade keeps integrity incomplete and blocks evidence review.",
              "Replacement-trade economics remain separate in Issue #738; this ledger is matched-trade contribution only.",
              "",
              "**Execution authority:** `false`",
              "**Promotion authority:** `false`",
              "**Changes readiness gates:** `false`",
              "**LIVE TRADING: DISABLED.**",
          ]
          Path("/tmp/full-stack-matched-ledger-status.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          gh api             --method PATCH             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE"             -f body="$(cat /tmp/full-stack-matched-ledger-status.md)"

      - name: Upload matched-trade ledger
        if: >-
          steps.compact.outputs.eligible == 'true' &&
          steps.ledger.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prospective-full-stack-matched-trade-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: prospective-full-stack-matched-trade-ledger.json
          if-no-files-found: error
          retention-days: 90
