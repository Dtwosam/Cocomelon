name: Temporary cadence tree walk-forward audit 36694359628

on:
  push:
    branches:
      - audit/cadence-tree-walkforward-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,research]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
          test -s /tmp/state/cadence-shadow-state.json
          test -d /tmp/state/learning-features/records
      - name: Evaluate disjoint tree walk-forward
        run: |
          set -euo pipefail
          python scripts/analyze_cadence_tree_walkforward.py \
            /tmp/state/cadence-shadow-state.json \
            /tmp/state/learning-features \
            --json-out cadence-tree-walkforward.json \
            > /tmp/cadence-tree-walkforward.stdout.json
          cmp cadence-tree-walkforward.json \
            /tmp/cadence-tree-walkforward.stdout.json
      - name: Summarize folds
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          r=json.loads(Path("cadence-tree-walkforward.json").read_text())
          print("## Fixed cadence tree across time")
          for key in (
              "status",
              "settled_rows",
              "fold_count",
              "validation_rows_per_fold",
              "candidate_net_return_sum",
              "actual_net_return_sum",
              "delta_net_return_sum",
              "positive_candidate_folds",
              "negative_candidate_folds",
              "flat_candidate_folds",
              "admitted_rows",
              "long_admitted_rows",
              "short_admitted_rows",
          ):
              print(f"- {key}: {r.get(key)}")
          print("### Folds")
          for fold in r.get("folds",[]):
              by=fold.get("by_direction",{})
              print(
                  f"- fold {fold['fold_index']}: "
                  f"train={fold['training_rows']} "
                  f"purged={fold['purged_overlap_rows']} "
                  f"admit={fold.get('admitted_rows')} "
                  f"sum={fold.get('candidate_net_return_sum')} "
                  f"raw={fold.get('actual_net_return_sum')} "
                  f"long={by.get('long',{}).get('admitted_rows')} "
                  f"short={by.get('short',{}).get('admitted_rows')}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-tree-walkforward-36694359628
          path: cadence-tree-walkforward.json
          if-no-files-found: error
          retention-days: 30
