name: Temporary cadence microstructure tree audit 36694359628

on:
  push:
    branches:
      - audit/cadence-microstructure-tree-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,research]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
          test -s /tmp/state/cadence-shadow-state.json
          test -d /tmp/state/learning-features/records
      - name: Evaluate microstructure cadence tree
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_microstructure_tree.py \
            /tmp/state/cadence-shadow-state.json \
            /tmp/state/learning-features \
            --cadence-ms 900000 \
            --horizon-ms 3600000 \
            --json-out cadence-microstructure-tree.json \
            > /tmp/cadence-microstructure-tree.stdout.json
          cmp cadence-microstructure-tree.json \
            /tmp/cadence-microstructure-tree.stdout.json
      - name: Summarize validation
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          r=json.loads(
              Path("cadence-microstructure-tree.json").read_text()
          )
          print("## 15m -> 1h microstructure cadence tree")
          for key in (
              "status",
              "training_rows",
              "validation_rows",
              "purged_overlap_rows",
              "admitted_rows",
              "skipped_rows",
              "actual_net_return_sum",
              "candidate_net_return_sum",
              "delta_net_return_sum",
              "candidate_mean_net_return",
              "positive_admitted_rows",
              "negative_admitted_rows",
              "structural_ready",
              "development_qualified",
          ):
              print(f"- {key}: {r.get(key)}")
          print("### Direction")
          for direction,item in r.get("by_direction",{}).items():
              print(
                  f"- {direction}: validation={item.get('validation_rows')} "
                  f"admitted={item.get('admitted_rows')} "
                  f"sum={item.get('candidate_net_return_sum')} "
                  f"mean={item.get('candidate_mean_net_return')}"
              )
          print("### Stability")
          for block in r.get("stability_blocks",[]):
              print(
                  f"- block {block['block_index']}: "
                  f"n={block['admitted_rows']} "
                  f"sum={block['candidate_net_return_sum']} "
                  f"mean={block['candidate_mean_net_return']} "
                  f"passes={block['passes']}"
              )
          print("### Prediction bands")
          for band in r.get("prediction_bands",[]):
              print(
                  f"- band {band['band_index']}: "
                  f"pred={band['prediction_min']}..{band['prediction_max']} "
                  f"actual_sum={band['actual_net_return_sum']} "
                  f"actual_mean={band['actual_mean_net_return']} "
                  f"+={band['positive_rows']} -={band['negative_rows']}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-microstructure-tree-36694359628
          path: cadence-microstructure-tree.json
          if-no-files-found: error
          retention-days: 30
