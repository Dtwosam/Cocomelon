name: Scheduled Research Mainnet Replay Campaign

on:
  schedule:
    - cron: "2 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-mainnet-replay-campaign
  cancel-in-progress: false

env:
  COCOMELON_EXECUTION_MODE: paper
  COCOMELON_API_URL: https://api.hyperliquid.xyz
  COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
  RESEARCH_CANDIDATE_ID: ${{ vars.RESEARCH_CANDIDATE_ID || 'scheduled-research-root' }}
  RESEARCH_CHALLENGER_CANDIDATE_ID: ${{ vars.RESEARCH_CHALLENGER_CANDIDATE_ID }}
  ATTEMPT_ID: research-${{ github.run_id }}-${{ github.run_attempt }}
  BATCH_ID: research-batch-${{ github.run_id }}-${{ github.run_attempt }}
  SOURCE_ID: research-mainnet-${{ github.run_id }}-${{ github.run_attempt }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  prepare-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_matrix: ${{ steps.candidates.outputs.matrix }}
    steps:
      - name: Checkout research campaign control revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare research campaign directories
        run: |
          set -euo pipefail
          mkdir -p research-campaign/state research-campaign/diagnostics
          printf '%s\n' 'research control preparation started' \
            > research-campaign/diagnostics/control-started.txt

      - name: Restore authoritative research registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ROWS="$(
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-authoritative-registry&per_page=100" \
              --jq '.artifacts
                | map(select(.expired == false and .workflow_run != null))
                | sort_by(.created_at)
                | reverse
                | .[]
                | [.id, .workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha]
                | @tsv'
          )"
          ARTIFACT_ID=""
          while IFS=$'\t' read -r CANDIDATE_ARTIFACT_ID RUN_ID ARTIFACT_BRANCH ARTIFACT_HEAD_SHA; do
            if [ -z "$CANDIDATE_ARTIFACT_ID" ] || [ -z "$RUN_ID" ]; then
              continue
            fi
            if [ "$ARTIFACT_BRANCH" != "main" ]; then
              continue
            fi
            RUN_IS_TRUSTED="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '(.head_branch == "main")
                  and (.status == "completed")
                  and (
                    ((.path == ".github/workflows/research-campaign-scheduled.yml")
                      and (.conclusion == "success" or .conclusion == "failure"))
                    or ((.path == ".github/workflows/research-v4-registry-sync.yml")
                      and (.conclusion == "success"))
                    or ((.path == ".github/workflows/research-candidate-register.yml")
                      and (.conclusion == "success") and (.event == "workflow_dispatch"))
                  )
                  and (.event == "schedule" or .event == "workflow_dispatch")'
            )"
            RUN_HEAD_SHA="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '.head_sha // empty'
            )"
            if [ "$RUN_IS_TRUSTED" != "true" ] || [ "$RUN_HEAD_SHA" != "$ARTIFACT_HEAD_SHA" ]; then
              continue
            fi
            ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID"
            break
          done <<< "$ARTIFACT_ROWS"
          if [ -z "$ARTIFACT_ID" ]; then
            printf '%s\n' \
              'Trusted authoritative research registry unavailable; V4 registry completeness cannot be proven.' \
              > research-campaign/diagnostics/authoritative-registry-unavailable.txt
            exit 65
          fi
          /usr/bin/gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > research-campaign/state/research-authoritative-registry.zip
          unzip -q \
            research-campaign/state/research-authoritative-registry.zip \
            -d research-campaign/state/restored
          REGISTRY_PATH="$(
            find research-campaign/state/restored -type f -name research.sqlite3 -print -quit
          )"
          if [ -z "$REGISTRY_PATH" ]; then
            printf '%s\n' \
              'Authoritative registry artifact did not contain research.sqlite3; V4 registry completeness is unavailable.' \
              > research-campaign/diagnostics/authoritative-registry-unavailable.txt
            exit 66
          fi
          cp "$REGISTRY_PATH" research-campaign/state/research.sqlite3

      - name: Resolve research fanout from authoritative registry
        id: candidates
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cocomelon.research.fanout import resolve_research_fanout, write_research_fanout_plan
          from cocomelon.research.registry import ResearchRegistry

          registry = ResearchRegistry(Path("research-campaign/state/research.sqlite3"))
          try:
              fanout = resolve_research_fanout(
                  registry,
                  root_candidate_id=os.environ["RESEARCH_CANDIDATE_ID"],
                  challenger_candidate_id=os.environ.get("RESEARCH_CHALLENGER_CANDIDATE_ID"),
                  run_id=os.environ["GITHUB_RUN_ID"],
                  run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              )
          finally:
              registry.close()
          write_research_fanout_plan("research-campaign/state/research-fanout.json", fanout)
          matrix = json.dumps({"include": [candidate.to_matrix_dict() for candidate in fanout]}, separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"matrix={matrix}\n")
          PY

      - name: Refuse duplicate successful research cohort for current UTC day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY_START="$(date -u +%Y-%m-%dT00:00:00Z)"
          SUCCESS_ROWS="$(
            /usr/bin/gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              | /usr/bin/jq -r \
                --arg day_start "$DAY_START" \
                --argjson current_run "$GITHUB_RUN_ID" '
                  .workflow_runs[]
                  | select(.id != $current_run)
                  | select(.head_branch == "main")
                  | select(.path == ".github/workflows/research-campaign-scheduled.yml")
                  | select(.event == "schedule" or .event == "workflow_dispatch")
                  | select(.status == "completed")
                  | select(.conclusion == "success")
                  | select(.created_at >= $day_start)
                  | [.id, .created_at]
                  | @tsv
                '
          )"
          if [ -n "$SUCCESS_ROWS" ]; then
            printf '%s\n' "$SUCCESS_ROWS" \
              > research-campaign/diagnostics/research-success-today.txt
            echo "successful research cohort already exists for current UTC day; refusing duplicate" >&2
            exit 77
          fi
          printf '%s\n' 'none' \
            > research-campaign/diagnostics/research-success-today.txt

      - name: Persist fanout attempts before candidate setup
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cocomelon.research.registry import ResearchRegistry
          from cocomelon.research.runner_history import record_runner_attempt_started

          payload = json.loads(Path("research-campaign/state/research-fanout.json").read_text(encoding="utf-8"))
          fanout = payload["candidates"]
          registry = ResearchRegistry(Path("research-campaign/state/research.sqlite3"))
          try:
              for candidate in fanout:
                  manifest = registry.load_candidate(candidate["candidate_id"])
                  if manifest.code_revision != candidate["code_revision"]:
                      raise RuntimeError("restored research candidate code revision changed")
                  record_runner_attempt_started(
                      registry.connection,
                      attempt_id=candidate["attempt_id"],
                      candidate_id=candidate["candidate_id"],
                      batch_id=candidate["batch_id"],
                      source_id=candidate["source_id"],
                      artifact_root=str(Path(os.environ["GITHUB_WORKSPACE"]) / "research-campaign" / candidate["artifact_key"] / "output"),
                  )
          finally:
              registry.close()
          PY

      - name: Refuse research capture while V4 acquisition is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # V4 workflow identity: .github/workflows/evidence-campaign-v4-scheduled.yml
          if ! ACTIVE_ROWS="$(scripts/research_v4_active_acquisition.sh)"; then
            printf '%s\n' 'V4 acquisition metadata unavailable; refusing research capture' \
              > research-campaign/diagnostics/v4-preflight-failed.txt
            exit 78
          fi
          if [ -n "$ACTIVE_ROWS" ]; then
            printf '%s\n' "$ACTIVE_ROWS" \
              > research-campaign/diagnostics/v4-active-run.txt
            echo "protected V4 acquisition is active; refusing research capture" >&2
            while IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_EVENT; do
              printf 'V4 run %s is %s (%s)\n' "$RUN_ID" "$RUN_STATUS" "$RUN_EVENT" >&2
            done <<< "$ACTIVE_ROWS"
            exit 76
          fi
          printf '%s\n' 'none' \
            > research-campaign/diagnostics/v4-active-run.txt

      - name: Upload prepared research control state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-prepared-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/
          if-no-files-found: error
          retention-days: 2

      - name: Upload isolated research fanout plan
        uses: actions/upload-artifact@v4
        with:
          name: research-fanout-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/state/research-fanout.json
          if-no-files-found: error
          retention-days: 2

  candidate-build:
    needs: prepare-control
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-control.outputs.candidate_matrix) }}
    continue-on-error: ${{ !matrix.required }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: none
    env:
      CANDIDATE_ID: ${{ matrix.candidate_id }}
    steps:
      - name: Checkout candidate code revision
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.code_revision }}
          path: candidate-src
          fetch-depth: 1
          clean: false
          persist-credentials: false

      - name: Checkout trusted strategy worker revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control-src
          fetch-depth: 1
          clean: false
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate-src/pyproject.toml

      - name: Install Cocomelon candidate build dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Freeze candidate strategy image before observation capture
        env:
          CANDIDATE_REVISION: ${{ matrix.code_revision }}
        run: |
          set -euo pipefail
          cat > Dockerfile.research-candidate <<'EOF'
          FROM python:3.12-slim
          WORKDIR /candidate
          COPY candidate-src /candidate
          RUN python -m pip install --no-cache-dir .
          RUN mkdir -p /trusted
          COPY control-src/src/cocomelon/research/strategy_worker.py /trusted/strategy_worker.py
          COPY control-src/src/cocomelon/research/strategy_seam.py /trusted/strategy_seam.py
          ENTRYPOINT ["python", "/trusted/strategy_worker.py"]
          EOF
          docker build --pull \
            -f Dockerfile.research-candidate \
            -t "research-candidate:${CANDIDATE_REVISION}" \
            .
          mkdir -p candidate-package
          docker save "research-candidate:${CANDIDATE_REVISION}" \
            | gzip -1 > candidate-package/candidate-image.tar.gz
          printf '%s\n' "$CANDIDATE_REVISION" > candidate-package/candidate-revision.txt

      - name: Upload candidate research stage
        uses: actions/upload-artifact@v4
        with:
          name: research-candidate-stage-${{ matrix.artifact_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-package/
          if-no-files-found: error
          retention-days: 2

  capture-control:
    needs:
      - prepare-control
      - candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted research capture control revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control-src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-src/pyproject.toml

      - name: Download prepared research control state
        uses: actions/download-artifact@v4
        with:
          name: research-prepared-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-control

      - name: Install trusted research capture runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./control-src

      - name: Acquire one public mainnet research cohort
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            research-campaign/recording \
            research-campaign/output \
            research-campaign/diagnostics
          printf '1\n' > research-campaign/output/acquisition-attempt.txt
          cd control-src

          if ! PRE_CAPTURE_ACTIVE_ROWS="$(
            "$GITHUB_WORKSPACE/control-src/scripts/research_v4_active_acquisition.sh"
          )"; then
            printf '%s\n' 'Actions metadata check failed immediately before research capture' \
              > "$GITHUB_WORKSPACE/research-campaign/diagnostics/v4-watch-failed.txt"
            echo "Actions metadata check failed immediately before research capture" >&2
            exit 78
          fi
          if [ -n "$PRE_CAPTURE_ACTIVE_ROWS" ]; then
            printf '%s\n' "$PRE_CAPTURE_ACTIVE_ROWS" \
              > "$GITHUB_WORKSPACE/research-campaign/diagnostics/v4-active-before-recorder.txt"
            echo "protected V4 acquisition is active immediately before research capture; aborting research cohort" >&2
            exit 76
          fi

          env -u GITHUB_TOKEN cocomelon record-mainnet-evidence \
            --root "$GITHUB_WORKSPACE/research-campaign/recording" \
            --seconds 1800 \
            --deep-limit 5 \
            > "$GITHUB_WORKSPACE/research-campaign/output/record-transport.json" &
          RECORDER_PID=$!

          (
            while kill -0 "$RECORDER_PID" 2>/dev/null; do
              if ! ACTIVE_ROWS="$(
                "$GITHUB_WORKSPACE/control-src/scripts/research_v4_active_acquisition.sh"
              )"; then
                printf '%s\n' 'Actions metadata watch failed during research capture' \
                  > "$GITHUB_WORKSPACE/research-campaign/diagnostics/v4-watch-failed.txt"
                kill "$RECORDER_PID" 2>/dev/null || true
                exit 78
              fi
              if [ -n "$ACTIVE_ROWS" ]; then
                printf '%s\n' "$ACTIVE_ROWS" \
                  > "$GITHUB_WORKSPACE/research-campaign/diagnostics/v4-became-active.txt"
                kill "$RECORDER_PID" 2>/dev/null || true
                exit 76
              fi
              sleep 10
            done
          ) &
          V4_WATCH_PID=$!

          if wait "$RECORDER_PID"; then
            RECORDER_STATUS=0
          else
            RECORDER_STATUS=$?
          fi

          if [ -f "$GITHUB_WORKSPACE/research-campaign/diagnostics/v4-became-active.txt" ]; then
            wait "$V4_WATCH_PID" || true
            echo "protected V4 acquisition became active during research capture; aborting research cohort" >&2
            exit 76
          fi
          if [ -f "$GITHUB_WORKSPACE/research-campaign/diagnostics/v4-watch-failed.txt" ]; then
            wait "$V4_WATCH_PID" || true
            echo "Actions metadata watch failed during research capture; aborting research cohort" >&2
            exit 78
          fi

          kill "$V4_WATCH_PID" 2>/dev/null || true
          wait "$V4_WATCH_PID" 2>/dev/null || true
          if [ "$RECORDER_STATUS" -ne 0 ]; then
            exit "$RECORDER_STATUS"
          fi

      - name: Prepare trusted frozen research source
        working-directory: control-src
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from cocomelon.research.cohort import prepare_research_capture_source

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          campaign = workspace / "research-campaign"
          prepare_research_capture_source(
              campaign / "recording",
              campaign / "output",
              trigger_head_sha=os.environ["GITHUB_SHA"],
          )
          PY

      - name: Bind trusted capture interval before candidate execution
        working-directory: control-src
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          import json
          from cocomelon.research.registry import ResearchRegistry
          from cocomelon.research.runner_history import bind_runner_attempt_source_interval

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          capture = json.loads((workspace / "research-campaign" / "output" / "capture-source.json").read_text(encoding="utf-8"))
          fanout = json.loads((workspace / "research-control" / "state" / "research-fanout.json").read_text(encoding="utf-8"))["candidates"]
          registry = ResearchRegistry(workspace / "research-control" / "state" / "research.sqlite3")
          try:
              for candidate in fanout:
                  bind_runner_attempt_source_interval(
                      registry.connection,
                      attempt_id=candidate["attempt_id"],
                      start_ms=int(capture["start_ms"]),
                      end_ms=int(capture["end_ms"]),
                  )
          finally:
              registry.close()
          PY

      - name: Upload capture-bound research control stage
        uses: actions/upload-artifact@v4
        with:
          name: research-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-control/
          if-no-files-found: error
          retention-days: 2

      - name: Upload trusted capture control stage
        uses: actions/upload-artifact@v4
        with:
          name: research-capture-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-control/
          if-no-files-found: error
          retention-days: 2

      - name: Upload trusted capture source stage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-capture-source-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research-campaign/recording/
            research-campaign/output/
            research-campaign/diagnostics/
          if-no-files-found: error
          retention-days: 2

  candidate-decisions:
    needs:
      - prepare-control
      - candidate-build
      - capture-control
      - refresh-authority
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-control.outputs.candidate_matrix) }}
    continue-on-error: ${{ !matrix.required }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: none
    env:
      CANDIDATE_ID: ${{ matrix.candidate_id }}
    steps:
      - name: Checkout trusted strategy orchestration revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control-src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-src/pyproject.toml

      - name: Download frozen candidate strategy image
        uses: actions/download-artifact@v4
        with:
          name: research-candidate-stage-${{ matrix.artifact_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-package

      - name: Download trusted capture source
        uses: actions/download-artifact@v4
        with:
          name: research-capture-source-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Download isolated research fanout plan
        uses: actions/download-artifact@v4
        with:
          name: research-fanout-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-fanout

      - name: Install trusted strategy orchestration runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./control-src

      - name: Materialize candidate replay source
        env:
          CANDIDATE_ID: ${{ matrix.candidate_id }}
        working-directory: control-src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cocomelon.research.cohort import materialize_research_candidate_source
          from cocomelon.research.fanout import ResearchFanoutCandidate

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          fanout_path = workspace / "research-fanout" / "research-fanout.json"
          fanout = json.loads(fanout_path.read_text(encoding="utf-8"))["candidates"]
          selected = next(
              item for item in fanout
              if item["candidate_id"] == os.environ["CANDIDATE_ID"]
          )
          candidate = ResearchFanoutCandidate(**selected).manifest
          campaign = workspace / "research-campaign"
          materialize_research_candidate_source(
              campaign / "recording",
              campaign / "output",
              capture_source_path=campaign / "output" / "capture-source.json",
              candidate=candidate,
          )
          PY

      - name: Load frozen candidate strategy image
        run: |
          set -euo pipefail
          gunzip -c candidate-package/candidate-image.tar.gz | docker load

      - name: Run candidate strategy against trusted contexts
        env:
          CANDIDATE_REVISION: ${{ matrix.code_revision }}
          CANDIDATE_SANDBOX_POLICY: --network none --read-only --cap-drop ALL --security-opt no-new-privileges
        working-directory: control-src
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/research-campaign/diagnostics"
          printf '%s\n' "$CANDIDATE_SANDBOX_POLICY" \
            > "$GITHUB_WORKSPACE/research-campaign/diagnostics/candidate-sandbox-policy.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          from cocomelon.research.strategy_seam import (
              DockerStrategyEvaluator,
              build_candidate_strategy_decisions,
          )

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          campaign = workspace / "research-campaign"
          revision = os.environ["CANDIDATE_REVISION"]
          build_candidate_strategy_decisions(
              recording_root=campaign / "recording",
              bundle_path=campaign / "output" / "bundle.json",
              output_path=campaign / "output" / "strategy-decisions.json",
              candidate_code_revision=revision,
              evaluator=DockerStrategyEvaluator(f"research-candidate:{revision}"),
          )
          PY

      - name: Upload candidate decision stage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-decision-stage-${{ matrix.artifact_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research-campaign/output/
            research-campaign/diagnostics/
          if-no-files-found: error
          retention-days: 2

  refresh-authority:
    needs:
      - prepare-control
      - capture-control
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout research authority control revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download prepared research control state for authority merge
        uses: actions/download-artifact@v4
        with:
          name: research-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Download trusted research capture stage
        uses: actions/download-artifact@v4
        with:
          # The former unsplit source identity was research-capture-stage-${{ github.run_id }}-${{ github.run_attempt }}.
          name: research-capture-source-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Resolve shared research capture interval
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("research-campaign/output/capture-source.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"BOUND_START_MS={int(payload['start_ms'])}\n")
              handle.write(f"BOUND_END_MS={int(payload['end_ms'])}\n")
          PY

      - name: Dispatch post-capture V4 authority synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > research-campaign/state/v4-sync-requested-at.txt
          /usr/bin/gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/research-v4-registry-sync.yml/dispatches" \
            -f ref=main

      - name: Download refreshed V4 authority after acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQUESTED_AT="$(cat research-campaign/state/v4-sync-requested-at.txt)"
          rm -rf research-campaign/state/refreshed-v4-authority
          for _ in $(seq 1 240); do
            RUN_ID="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/research-v4-registry-sync.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
                --jq ".workflow_runs
                  | map(select(.created_at >= \"$REQUESTED_AT\"
                    and .head_branch == \"main\"
                    and .path == \".github/workflows/research-v4-registry-sync.yml\"))
                  | sort_by(.created_at)
                  | reverse
                  | .[0].id // empty"
            )"
            if [ -z "$RUN_ID" ]; then
              sleep 10
              continue
            fi
            RUN_STATE="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '[.status, (.conclusion // ""), .head_branch, .event, .path] | @tsv'
            )"
            IFS=$'\t' read -r RUN_STATUS RUN_CONCLUSION RUN_BRANCH RUN_EVENT RUN_PATH <<< "$RUN_STATE"
            if [ "$RUN_STATUS" != "completed" ]; then
              sleep 10
              continue
            fi
            if [ "$RUN_CONCLUSION" != "success" ] \
              || [ "$RUN_BRANCH" != "main" ] \
              || [ "$RUN_EVENT" != "workflow_dispatch" ] \
              || [ "$RUN_PATH" != ".github/workflows/research-v4-registry-sync.yml" ]; then
              echo "post-capture V4 authority synchronization failed provenance validation" >&2
              exit 67
            fi
            ARTIFACT_ID="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
                --jq '.artifacts
                  | map(select(.expired == false and .name == "research-authoritative-registry"))
                  | .[0].id // empty'
            )"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "post-capture V4 authority synchronization produced no registry" >&2
              exit 68
            fi
            mkdir -p research-campaign/state/refreshed-v4-authority
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              > research-campaign/state/refreshed-v4-authority.zip
            unzip -q \
              research-campaign/state/refreshed-v4-authority.zip \
              -d research-campaign/state/refreshed-v4-authority
            REGISTRY_PATH="$(
              find research-campaign/state/refreshed-v4-authority \
                -type f -name research.sqlite3 -print -quit
            )"
            if [ -z "$REGISTRY_PATH" ]; then
              echo "trusted V4 sync artifact did not contain research.sqlite3" >&2
              exit 69
            fi
            cp "$REGISTRY_PATH" research-campaign/state/refreshed-v4-authority.sqlite3
            THROUGH_MS="$(
              REGISTRY_PATH=research-campaign/state/refreshed-v4-authority.sqlite3 python - <<'PY'
          import os
          import sqlite3

          connection = sqlite3.connect(os.environ["REGISTRY_PATH"])
          try:
              row = connection.execute(
                  "SELECT complete_through_ms FROM research_v4_registry_state WHERE singleton = 1"
              ).fetchone()
          finally:
              connection.close()
          if row is None:
              raise SystemExit(2)
          print(int(row[0]))
          PY
            )"
            if [ "$THROUGH_MS" -lt "$BOUND_END_MS" ]; then
              echo "fresh V4 authority does not cover bound research interval yet; retrying non-economic V4 authority synchronization" >&2
              rm -f research-campaign/state/refreshed-v4-authority.sqlite3
              rm -rf research-campaign/state/refreshed-v4-authority
              rm -f research-campaign/state/refreshed-v4-authority.zip
              sleep 60
              REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              printf '%s\n' "$REQUESTED_AT" \
                > research-campaign/state/v4-sync-requested-at.txt
              /usr/bin/gh api \
                --method POST \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/research-v4-registry-sync.yml/dispatches" \
                -f ref=main
              continue
            fi
            printf '%s\n' "$RUN_ID" > research-campaign/state/refreshed-v4-sync-run-id.txt
            printf '%s\n' "$THROUGH_MS" > research-campaign/state/refreshed-v4-complete-through-ms.txt
            break
          done
          if [ ! -f research-campaign/state/refreshed-v4-authority.sqlite3 ]; then
            echo "timed out waiting for post-capture V4 authority synchronization" >&2
            exit 71
          fi

      - name: Merge refreshed V4 authority after acquisition
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from cocomelon.research.registry import ResearchRegistry
          from cocomelon.research.v4_authority import merge_v4_authority_snapshot

          registry = ResearchRegistry(Path("research-campaign/state/research.sqlite3"))
          try:
              merge_v4_authority_snapshot(
                  registry,
                  Path("research-campaign/state/refreshed-v4-authority.sqlite3"),
              )
          finally:
              registry.close()
          PY

      - name: Assert shared capture is disjoint from protected V4
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from cocomelon.research.contracts import TimeInterval
          from cocomelon.research.registry import ResearchRegistry
          interval = TimeInterval(start_ms=int(os.environ["BOUND_START_MS"]), end_ms=int(os.environ["BOUND_END_MS"]))
          registry = ResearchRegistry(Path("research-campaign/state/research.sqlite3"))
          try:
              registry.assert_batch_disjoint_from_v4(interval)
          finally:
              registry.close()
          PY

      - name: Upload refreshed research stage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-refreshed-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/
          if-no-files-found: error
          retention-days: 2

  evaluate-research:
    needs:
      - refresh-authority
      - candidate-decisions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: research-authoritative-registry-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      registry_published: ${{ steps.publish-committed-registry.outcome }}
    steps:
      - name: Checkout trusted research runner control revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control-src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-src/pyproject.toml

      - name: Download refreshed research stage
        uses: actions/download-artifact@v4
        with:
          name: research-refreshed-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Download all candidate decision stages
        uses: actions/download-artifact@v4
        with:
          pattern: research-decision-stage-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/decisions

      - name: Install trusted research runner runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./control-src

      - name: Rebase staged registry onto latest trusted authority under publisher lock
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/control-src/src
        run: |
          set -euo pipefail
          rm -rf research-campaign/state/latest-authority research-campaign/state/latest-authority.zip
          ARTIFACT_ROWS="$(
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-authoritative-registry&per_page=100" \
              --jq '.artifacts
                | map(select(.expired == false and .workflow_run != null))
                | sort_by(.created_at)
                | reverse
                | .[]
                | [.id, .workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha]
                | @tsv'
          )"
          ARTIFACT_ID=""
          while IFS=$'\t' read -r CANDIDATE_ARTIFACT_ID RUN_ID ARTIFACT_BRANCH ARTIFACT_HEAD_SHA; do
            if [ -z "$CANDIDATE_ARTIFACT_ID" ] || [ -z "$RUN_ID" ]; then
              continue
            fi
            if [ "$ARTIFACT_BRANCH" != "main" ]; then
              continue
            fi
            RUN_IS_TRUSTED="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '(.head_branch == "main")
                  and (.status == "completed")
                  and (
                    ((.path == ".github/workflows/research-campaign-scheduled.yml")
                      and (.conclusion == "success" or .conclusion == "failure"))
                    or ((.path == ".github/workflows/research-v4-registry-sync.yml")
                      and (.conclusion == "success"))
                    or ((.path == ".github/workflows/research-candidate-register.yml")
                      and (.conclusion == "success") and (.event == "workflow_dispatch"))
                  )
                  and (.event == "schedule" or .event == "workflow_dispatch")'
            )"
            RUN_HEAD_SHA="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '.head_sha // empty'
            )"
            if [ "$RUN_IS_TRUSTED" != "true" ] || [ "$RUN_HEAD_SHA" != "$ARTIFACT_HEAD_SHA" ]; then
              continue
            fi
            ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID"
            break
          done <<< "$ARTIFACT_ROWS"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "latest trusted authority unavailable under publisher lock" >&2
            exit 72
          fi
          mkdir -p research-campaign/state/latest-authority
          /usr/bin/gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > research-campaign/state/latest-authority.zip
          unzip -q \
            research-campaign/state/latest-authority.zip \
            -d research-campaign/state/latest-authority
          REGISTRY_PATH="$(
            find research-campaign/state/latest-authority -type f -name research.sqlite3 -print -quit
          )"
          if [ -z "$REGISTRY_PATH" ]; then
            echo "latest trusted authority artifact did not contain research.sqlite3" >&2
            exit 73
          fi
          cp "$REGISTRY_PATH" research-campaign/state/latest-authority.sqlite3
          python - <<'PY'
          from pathlib import Path

          from cocomelon.research.registry import ResearchRegistry
          from cocomelon.research.v4_authority import merge_v4_authority_snapshot

          registry = ResearchRegistry(Path("research-campaign/state/research.sqlite3"))
          try:
              merge_v4_authority_snapshot(
                  registry,
                  Path("research-campaign/state/latest-authority.sqlite3"),
              )
          finally:
              registry.close()
          PY

      - name: Evaluate fanout candidates serially
        working-directory: control-src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from types import SimpleNamespace

          from cocomelon.research.cohort import complete_research_cohort
          from cocomelon.research.contracts import TimeInterval
          from cocomelon.research.registry import ResearchRegistry
          from cocomelon.research.runner_history import (
              ResearchRunnerAttemptStatus,
              finish_runner_attempt,
          )

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          campaign = workspace / "research-campaign"
          fanout_payload = json.loads(
              (campaign / "state" / "research-fanout.json").read_text(encoding="utf-8")
          )["candidates"]
          fanout = [SimpleNamespace(**payload) for payload in fanout_payload]
          capture = json.loads(
              (campaign / "output" / "capture-source.json").read_text(encoding="utf-8")
          )
          interval = TimeInterval(
              start_ms=int(capture["start_ms"]),
              end_ms=int(capture["end_ms"]),
          )
          for candidate in fanout:
              candidate_root = campaign / candidate.artifact_key
              recording_root = candidate_root / "recording"
              output_root = candidate_root / "output"
              decision_root = (
                  campaign
                  / "decisions"
                  / (
                      f"research-decision-stage-{candidate.artifact_key}-"
                      f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
                  )
              )
              try:
                  registry = ResearchRegistry(campaign / "state" / "research.sqlite3")
                  try:
                      registry.assert_batch_disjoint_from_v4(interval)
                      registry.record_touched_interval(
                          candidate.candidate_id,
                          interval,
                          source_id=candidate.source_id,
                      )
                  finally:
                      registry.close()

                  source_output = next(
                      path.parent for path in decision_root.rglob("bundle.json")
                  )
                  if candidate_root.exists():
                      shutil.rmtree(candidate_root)
                  candidate_root.mkdir(parents=True)
                  recording_root.symlink_to(campaign / "recording", target_is_directory=True)
                  shutil.copytree(source_output, output_root)

                  complete_research_cohort(
                      recording_root,
                      output_root,
                      strategy_decisions_path=output_root / "strategy-decisions.json",
                  )
                  runner_path = output_root / "runner.json"
                  with runner_path.open("w", encoding="utf-8") as runner_output:
                      subprocess.run(
                          [
                              "cocomelon-research-runner",
                              "run-artifact",
                              "--registry",
                              str(campaign / "state" / "research.sqlite3"),
                              "--attempt-id",
                              candidate.attempt_id,
                              "--candidate-id",
                              candidate.candidate_id,
                              "--batch-id",
                              candidate.batch_id,
                              "--source-id",
                              candidate.source_id,
                              "--artifact-root",
                              str(output_root),
                          ],
                          check=True,
                          stdout=runner_output,
                      )
              except Exception as exc:
                  registry = ResearchRegistry(campaign / "state" / "research.sqlite3")
                  try:
                      stored = registry.connection.execute(
                          "SELECT status FROM research_runner_attempts WHERE attempt_id = ?",
                          (candidate.attempt_id,),
                      ).fetchone()
                      if stored is not None and stored["status"] in {"running", "evaluating"}:
                          finish_runner_attempt(
                              registry.connection,
                              attempt_id=candidate.attempt_id,
                              status=ResearchRunnerAttemptStatus.FAILED,
                              start_ms=interval.start_ms,
                              end_ms=interval.end_ms,
                              report_id=None,
                              error_type=type(exc).__name__,
                              error_message=str(exc),
                          )
                  finally:
                      registry.close()
                  if candidate.required:
                      raise
          PY

      - name: Render research decision throughput summary
        continue-on-error: true
        run: |
          echo "Fanout evaluation completed; per-candidate artifacts remain TOUCHED / NON-PROMOTIONAL." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish committed authoritative research registry
        id: publish-committed-registry
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: research-authoritative-registry
          path: research-campaign/state/research.sqlite3
          if-no-files-found: error
          retention-days: 30

      - name: Render authenticated research status
        working-directory: control-src
        run: |
          set -euo pipefail
          cocomelon-research-status \
            --registry "$GITHUB_WORKSPACE/research-campaign/state/research.sqlite3" \
            --format json \
            > "$GITHUB_WORKSPACE/research-campaign/output/status.json"

      - name: Upload evaluated research stage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-evaluated-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/
          if-no-files-found: error
          retention-days: 2

  finalize-publish:
    needs:
      - prepare-control
      - candidate-build
      - capture-control
      - candidate-decisions
      - refresh-authority
      - evaluate-research
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: research-authoritative-registry-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted finalizer control revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control-src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download committed authoritative registry from evaluation
        if: ${{ always() && needs.evaluate-research.outputs.registry_published == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-authoritative-registry
          path: research-campaign/state

      - name: Download evaluated stage for publication
        if: ${{ always() && hashFiles('research-campaign/state/research.sqlite3') == '' && needs.evaluate-research.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-evaluated-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Download refreshed stage fallback
        if: ${{ always() && hashFiles('research-campaign/state/research.sqlite3') == '' && needs.refresh-authority.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-refreshed-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Download control stage fallback
        if: ${{ always() && hashFiles('research-campaign/state/research.sqlite3') == '' && needs.capture-control.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Download prepared control stage fallback
        if: ${{ always() && hashFiles('research-campaign/state/research.sqlite3') == '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-prepared-control-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign

      - name: Rebase recovered fallback registry onto latest trusted authority
        id: rebase-fallback-authority
        if: ${{ always() && hashFiles('research-campaign/state/research.sqlite3') != '' && needs.evaluate-research.outputs.registry_published != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/control-src/src
        run: |
          set -euo pipefail
          rm -rf \
            research-campaign/state/finalizer-latest-authority \
            research-campaign/state/finalizer-latest-authority.zip
          ARTIFACT_ROWS="$(
            /usr/bin/gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-authoritative-registry&per_page=100" \
              --jq '.artifacts
                | map(select(.expired == false and .workflow_run != null))
                | sort_by(.created_at)
                | reverse
                | .[]
                | [.id, .workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha]
                | @tsv'
          )"
          ARTIFACT_ID=""
          while IFS=$'\t' read -r CANDIDATE_ARTIFACT_ID RUN_ID ARTIFACT_BRANCH ARTIFACT_HEAD_SHA; do
            if [ -z "$CANDIDATE_ARTIFACT_ID" ] || [ -z "$RUN_ID" ]; then
              continue
            fi
            if [ "$ARTIFACT_BRANCH" != "main" ]; then
              continue
            fi
            RUN_IS_TRUSTED="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '(.head_branch == "main")
                  and (.status == "completed")
                  and (
                    ((.path == ".github/workflows/research-campaign-scheduled.yml")
                      and (.conclusion == "success" or .conclusion == "failure"))
                    or ((.path == ".github/workflows/research-v4-registry-sync.yml")
                      and (.conclusion == "success"))
                    or ((.path == ".github/workflows/research-candidate-register.yml")
                      and (.conclusion == "success") and (.event == "workflow_dispatch"))
                  )
                  and (.event == "schedule" or .event == "workflow_dispatch")'
            )"
            RUN_HEAD_SHA="$(
              /usr/bin/gh api \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '.head_sha // empty'
            )"
            if [ "$RUN_IS_TRUSTED" != "true" ] || [ "$RUN_HEAD_SHA" != "$ARTIFACT_HEAD_SHA" ]; then
              continue
            fi
            ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID"
            break
          done <<< "$ARTIFACT_ROWS"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "latest trusted authority unavailable to finalizer under publisher lock" >&2
            exit 74
          fi
          mkdir -p research-campaign/state/finalizer-latest-authority
          /usr/bin/gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > research-campaign/state/finalizer-latest-authority.zip
          unzip -q \
            research-campaign/state/finalizer-latest-authority.zip \
            -d research-campaign/state/finalizer-latest-authority
          REGISTRY_PATH="$(
            find research-campaign/state/finalizer-latest-authority \
              -type f -name research.sqlite3 -print -quit
          )"
          if [ -z "$REGISTRY_PATH" ]; then
            echo "latest trusted finalizer authority artifact did not contain research.sqlite3" >&2
            exit 75
          fi
          cp "$REGISTRY_PATH" research-campaign/state/finalizer-latest-authority.sqlite3
          python - <<'PY'
          from pathlib import Path

          from cocomelon.research.registry import ResearchRegistry
          from cocomelon.research.v4_authority import merge_v4_authority_snapshot

          registry = ResearchRegistry(Path("research-campaign/state/research.sqlite3"))
          try:
              merge_v4_authority_snapshot(
                  registry,
                  Path("research-campaign/state/finalizer-latest-authority.sqlite3"),
              )
          finally:
              registry.close()
          PY

      - name: Download capture evidence for final audit
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-capture-source-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/audit/capture

      - name: Download candidate decision evidence for final audit
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: research-decision-stage-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/audit/decisions

      - name: Download evaluated products for final audit
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-evaluated-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/audit/evaluated

      - name: Verify root+challenger rollout contract
        if: ${{ always() && hashFiles('research-campaign/state/research-fanout.json') != '' && hashFiles('research-campaign/state/research.sqlite3') != '' && hashFiles('research-campaign/audit/capture/output/capture-source.json') != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/control-src/src
        run: |
          set -euo pipefail
          CANDIDATE_COUNT="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("research-campaign/state/research-fanout.json").read_text(encoding="utf-8")
          )
          print(len(payload.get("candidates", [])))
          PY
          )"
          if [ "$CANDIDATE_COUNT" = "2" ]; then
            python -m cocomelon.research.rollout_verifier research-campaign
          fi

      - name: Persist workflow failure in attempt ledger
        if: ${{ always() }}
        env:
          PREPARE_CONTROL_RESULT: ${{ needs.prepare-control.result }}
          CANDIDATE_BUILD_RESULT: ${{ needs.candidate-build.result }}
          CAPTURE_CONTROL_RESULT: ${{ needs.capture-control.result }}
          CANDIDATE_DECISIONS_RESULT: ${{ needs.candidate-decisions.result }}
          REFRESH_AUTHORITY_RESULT: ${{ needs.refresh-authority.result }}
          EVALUATE_RESEARCH_RESULT: ${{ needs.evaluate-research.result }}
        run: |
          set -euo pipefail
          if [ ! -f research-campaign/state/research.sqlite3 ]; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          job_results = (
              ("prepare-control", os.environ["PREPARE_CONTROL_RESULT"]),
              ("candidate-build", os.environ["CANDIDATE_BUILD_RESULT"]),
              ("capture-control", os.environ["CAPTURE_CONTROL_RESULT"]),
              ("candidate-decisions", os.environ["CANDIDATE_DECISIONS_RESULT"]),
              ("refresh-authority", os.environ["REFRESH_AUTHORITY_RESULT"]),
              ("evaluate-research", os.environ["EVALUATE_RESEARCH_RESULT"]),
          )
          failed_jobs = [
              f"{name}={result}"
              for name, result in job_results
              if result in {"failure", "cancelled"}
          ]
          failure_detail = (
              ",".join(failed_jobs)
              if failed_jobs
              else "unclassified-finalizer-failure"
          )
          error_message = (
              "research campaign failed before authenticated checkpoint; "
              f"failed_jobs={failure_detail}"
          )

          connection = sqlite3.connect(Path("research-campaign/state/research.sqlite3"))
          try:
              table = connection.execute(
                  """
                  SELECT 1 FROM sqlite_master
                  WHERE type = 'table' AND name = 'research_runner_attempts'
                  """
              ).fetchone()
              if table is None:
                  raise SystemExit(0)
              fanout_path = Path("research-campaign/state/research-fanout.json")
              if not fanout_path.is_file():
                  connection.commit()
                  raise SystemExit(0)
              fanout = json.loads(fanout_path.read_text(encoding="utf-8"))["candidates"]
              for candidate in fanout:
                  cursor = connection.execute(
                      """
                      UPDATE research_runner_attempts
                      SET status = 'failed', report_id = NULL,
                          error_type = 'WorkflowFailure',
                          error_message = ?
                      WHERE attempt_id = ? AND status IN ('running', 'evaluating')
                      """,
                      (error_message, candidate["attempt_id"]),
                  )
                  if cursor.rowcount not in (0, 1):
                      raise RuntimeError(
                          "research runner failure finalization was ambiguous"
                      )
              connection.commit()
          finally:
              connection.close()
          PY

      - name: Upload complete research campaign audit trail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-campaign/
          if-no-files-found: error
          retention-days: 30

      - name: Publish authoritative research registry
        if: ${{ always() && hashFiles('research-campaign/state/research.sqlite3') != '' && needs.evaluate-research.outputs.registry_published != 'success' && steps.rebase-fallback-authority.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-authoritative-registry
          path: research-campaign/state/research.sqlite3
          if-no-files-found: error
          retention-days: 30

  dispatch-dashboard:
    needs: finalize-publish
    if: ${{ always() && needs.finalize-publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch authoritative research dashboard refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/research-dashboard.yml/dispatches" \
            -f ref=main
