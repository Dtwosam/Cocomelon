name: Prospective HYPE State Readiness Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-state-readiness.yml"
      - "src/cocomelon/research/prospective_state_readiness.py"
      - "src/cocomelon/prospective_hype_state_readiness_cli.py"
      - "tests/test_prospective_state_readiness.py"
      - "tests/test_prospective_hype_state_readiness_workflow.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-state-readiness.yml"
      - "src/cocomelon/research/prospective_state_readiness.py"
      - "src/cocomelon/prospective_hype_state_readiness_cli.py"
      - "tests/test_prospective_state_readiness.py"
      - "tests/test_prospective_hype_state_readiness_workflow.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STATE_ARTIFACT_NAME: prospective-hype-clean-state
      EVIDENCE_ROOT: artifacts/prospective-hype-clean

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore latest cumulative prospective state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          artifact_id="$(
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT_NAME&per_page=100"               --jq '[.artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == "main")]
                | sort_by(.created_at)
                | last
                | .id // empty'
          )"
          test -n "$artifact_id"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > /tmp/prospective-hype-state-meta.json
          run_id="$(
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/prospective-hype-state-meta.json").read_text(
                  encoding="utf-8"
              )
          )
          print(payload["workflow_run"]["id"])
          PY
          )"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > /tmp/prospective-hype-state-run.json

          ARTIFACT_ID="$artifact_id" python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(
              Path("/tmp/prospective-hype-state-meta.json").read_text(
                  encoding="utf-8"
              )
          )
          run = json.loads(
              Path("/tmp/prospective-hype-state-run.json").read_text(
                  encoding="utf-8"
              )
          )
          workflow_run = artifact.get("workflow_run")
          if (
              str(artifact.get("id")) != os.environ["ARTIFACT_ID"]
              or artifact.get("name") != "prospective-hype-clean-state"
              or artifact.get("expired") is not False
              or not isinstance(workflow_run, dict)
              or workflow_run.get("head_branch") != "main"
              or run.get("id") != workflow_run.get("id")
              or run.get("head_branch") != "main"
              or run.get("path") != ".github/workflows/prospective-hype-clean.yml"
              or run.get("repository", {}).get("full_name")
              != os.environ["GITHUB_REPOSITORY"]
          ):
              raise SystemExit("STATE_ARTIFACT_PRODUCER_PROVENANCE_INVALID")
          PY

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > /tmp/prospective-hype-state.zip
          unzip -q /tmp/prospective-hype-state.zip -d "$EVIDENCE_ROOT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Build immutable state-readiness receipt
        run: |
          set -euo pipefail
          mkdir -p artifacts/prospective-hype-state-readiness
          cocomelon-prospective-hype-state-readiness             --root "$EVIDENCE_ROOT"             --artifact-id "${{ steps.restore.outputs.artifact_id }}"             > artifacts/prospective-hype-state-readiness/readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "artifacts/prospective-hype-state-readiness/readiness.json"
              ).read_text(encoding="utf-8")
          )
          assert payload["readiness_status"] in {
              "ready_pre_cutover_state",
              "post_cutover_state_valid",
          }
          assert len(payload["campaign_id"]) == 64
          assert len(payload["state_digest"]) == 64
          assert len(payload["runtime_attestation_id"]) == 64
          assert len(payload["control_plane_id"]) == 64
          assert len(payload["receipt_id"]) == 64
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload state-readiness receipt
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-state-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prospective-hype-state-readiness/readiness.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
