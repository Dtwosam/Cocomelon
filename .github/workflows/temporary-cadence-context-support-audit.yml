name: Temporary cadence context support audit 36694359628

on:
  push:
    branches:
      - audit/cadence-context-support-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11092470461"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/state.zip -d /tmp/artifact
          mkdir -p /tmp/state
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
      - name: Diagnose exact context support
        run: |
          python - <<'PY' | tee cadence-context-support.json
          import json
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path

          from cocomelon.research.cadence_context_learning import (
              _resolve_rows,
          )
          from cocomelon.research.cadence_opportunity_audit import (
              load_cadence_outcomes,
          )
          from cocomelon.research.cadence_opportunity_learning import (
              _score_band,
          )
          from cocomelon.research.cadence_shadow import (
              FIFTEEN_MINUTES_MS,
              ONE_HOUR_MS,
          )
          from cocomelon.research.learning_feature_snapshots import (
              LearningFeatureSnapshotStore,
          )

          outcomes = load_cadence_outcomes(
              Path("/tmp/state/cadence-shadow-state.json")
          )
          surface = tuple(
              sorted(
                  (
                      row
                      for row in outcomes
                      if row.sample.cadence_ms == FIFTEEN_MINUTES_MS
                      and row.sample.horizon_ms == ONE_HOUR_MS
                  ),
                  key=lambda row: (
                      row.sample.boundary_ms,
                      row.sample.market.canonical,
                      row.sample.decision_id,
                  ),
              )
          )
          validation = surface[-100:]
          validation_start = validation[0].sample.boundary_ms
          training = tuple(
              row
              for row in surface[:-100]
              if row.sample.target_end_ms < validation_start
          )
          store = LearningFeatureSnapshotStore(
              Path("/tmp/state/learning-features")
          )
          training_rows, missing_train = _resolve_rows(training, store)
          validation_rows, missing_val = _resolve_rows(validation, store)
          if missing_train or missing_val:
              raise SystemExit(
                  f"missing snapshots train={len(missing_train)} "
                  f"val={len(missing_val)}"
              )

          train = defaultdict(list)
          val = defaultdict(list)
          for row in training_rows:
              key = (
                  row.outcome.sample.direction.value,
                  row.outcome.sample.lead_strategy,
                  _score_band(row.outcome.sample.score),
                  row.feature.trend_regime.value,
                  row.feature.volatility_regime.value,
              )
              train[key].append(row.outcome.net_return)
          for row in validation_rows:
              key = (
                  row.outcome.sample.direction.value,
                  row.outcome.sample.lead_strategy,
                  _score_band(row.outcome.sample.score),
                  row.feature.trend_regime.value,
                  row.feature.volatility_regime.value,
              )
              val[key].append(row.outcome.net_return)

          keys = [
              ("long", "trend", "80+", "up", "high"),
              ("long", "trend", "80+", "up", "low"),
              ("short", "trend", "80+", "down", "low"),
              ("short", "trend", "70-<75", "down", "low"),
          ]
          report = {}
          for key in keys:
              t = train.get(key, [])
              v = val.get(key, [])
              t_sorted = sorted(t)
              median = None
              if t_sorted:
                  n = len(t_sorted)
                  if n % 2:
                      median = t_sorted[n // 2]
                  else:
                      median = (
                          t_sorted[n // 2 - 1] + t_sorted[n // 2]
                      ) / Decimal(2)
              report["/".join(key)] = {
                  "training_rows": len(t),
                  "training_mean": (
                      None
                      if not t
                      else str(sum(t, Decimal("0")) / Decimal(len(t)))
                  ),
                  "training_median": (
                      None if median is None else str(median)
                  ),
                  "training_positive_rows": sum(x > 0 for x in t),
                  "training_negative_rows": sum(x < 0 for x in t),
                  "validation_rows": len(v),
                  "validation_mean": (
                      None
                      if not v
                      else str(sum(v, Decimal("0")) / Decimal(len(v)))
                  ),
                  "validation_sum": str(sum(v, Decimal("0"))),
                  "validation_positive_rows": sum(x > 0 for x in v),
                  "validation_negative_rows": sum(x < 0 for x in v),
              }
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-context-support-36694359628
          path: cadence-context-support.json
          if-no-files-found: error
          retention-days: 30
