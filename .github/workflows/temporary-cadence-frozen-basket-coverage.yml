name: Temporary cadence frozen basket coverage 36694359628

on:
  push:
    branches:
      - audit/cadence-frozen-basket-coverage-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
      - name: Measure frozen basket decision-time coverage
        run: |
          python - <<'PY' | tee cadence-frozen-basket-coverage.json
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          from cocomelon.research.cadence_opportunity_audit import (
              load_cadence_outcomes,
          )
          from cocomelon.research.cadence_shadow import (
              FIFTEEN_MINUTES_MS,
              ONE_HOUR_MS,
          )
          from cocomelon.research.learning_feature_snapshots import (
              LearningFeatureSnapshotStore,
          )
          from cocomelon.research.prospective_context_evidence import (
              FROZEN_CONTEXT_BASKET,
          )

          outcomes = load_cadence_outcomes(
              Path("/tmp/state/cadence-shadow-state.json")
          )
          surface = tuple(
              sorted(
                  (
                      row
                      for row in outcomes
                      if row.sample.cadence_ms == FIFTEEN_MINUTES_MS
                      and row.sample.horizon_ms == ONE_HOUR_MS
                  ),
                  key=lambda row: (
                      row.sample.boundary_ms,
                      row.sample.market.canonical,
                      row.sample.decision_id,
                  ),
              )
          )
          validation = surface[-100:]
          start = validation[0].sample.boundary_ms
          prefix = surface[:-100]
          training = tuple(
              row
              for row in prefix
              if row.sample.target_end_ms < start
          )

          store = LearningFeatureSnapshotStore(
              Path("/tmp/state/learning-features")
          )
          verified = store.iter_verified()
          by_as_of = defaultdict(dict)
          duplicate = []
          for item in verified:
              key = item.snapshot.as_of_ms
              market = item.snapshot.market.canonical
              if market in by_as_of[key]:
                  duplicate.append((key, market))
              by_as_of[key][market] = item.snapshot

          def summarize(rows):
              basket = tuple(FROZEN_CONTEXT_BASKET)
              coverage = Counter()
              exact = 0
              missing = Counter()
              return_1h_complete = 0
              target_snapshot_missing = 0
              target_asof_mismatch = 0
              examples = []
              for outcome in rows:
                  target = store.load(
                      outcome.sample.feature_snapshot_id
                  )
                  if target is None:
                      target_snapshot_missing += 1
                      continue
                  feature = target.snapshot
                  if feature.as_of_ms != outcome.sample.evaluated_at_ms:
                      target_asof_mismatch += 1
                  same = by_as_of.get(feature.as_of_ms, {})
                  present = tuple(
                      market for market in basket if market in same
                  )
                  coverage[len(present)] += 1
                  absent = tuple(
                      market for market in basket if market not in same
                  )
                  for market in absent:
                      missing[market] += 1
                  if len(present) == len(basket):
                      exact += 1
                      if all(
                          same[market].return_1h is not None
                          for market in basket
                      ):
                          return_1h_complete += 1
                  elif len(examples) < 10:
                      examples.append(
                          {
                              "decision_id": outcome.sample.decision_id,
                              "as_of_ms": feature.as_of_ms,
                              "target": outcome.sample.market.canonical,
                              "present": present,
                              "missing": absent,
                          }
                      )
              return {
                  "rows": len(rows),
                  "basket_size_coverage": dict(
                      sorted(coverage.items())
                  ),
                  "exact_frozen_basket_rows": exact,
                  "exact_frozen_basket_fraction": (
                      0 if not rows else exact / len(rows)
                  ),
                  "complete_1h_return_rows": return_1h_complete,
                  "missing_market_counts": dict(missing),
                  "target_snapshot_missing": target_snapshot_missing,
                  "target_asof_mismatch": target_asof_mismatch,
                  "incomplete_examples": examples,
              }

          report = {
              "frozen_basket": FROZEN_CONTEXT_BASKET,
              "feature_snapshot_count": len(verified),
              "duplicate_asof_market_pairs": len(duplicate),
              "training": summarize(training),
              "validation": summarize(validation),
          }
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-frozen-basket-coverage-36694359628
          path: cadence-frozen-basket-coverage.json
          if-no-files-found: error
          retention-days: 30
