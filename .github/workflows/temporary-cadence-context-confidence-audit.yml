name: Temporary cadence context confidence audit 36694359628

on:
  push:
    branches:
      - audit/cadence-context-confidence-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/state.zip -d /tmp/artifact
          mkdir -p /tmp/state
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
          test -s /tmp/state/cadence-shadow-state.json
          test -d /tmp/state/learning-features/records
      - name: Evaluate confidence-aware cadence context
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_context_confidence.py \
            /tmp/state/cadence-shadow-state.json \
            /tmp/state/learning-features \
            --cadence-ms 900000 \
            --horizon-ms 3600000 \
            --json-out cadence-context-confidence.json \
            > /tmp/cadence-context-confidence.stdout.json
          cmp cadence-context-confidence.json \
            /tmp/cadence-context-confidence.stdout.json
      - name: Summarize confidence validation
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("cadence-context-confidence.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## 15m -> 1h confidence-aware context learner")
          for field in (
              "status",
              "training_rows",
              "validation_rows",
              "purged_overlap_rows",
              "admitted_rows",
              "skipped_rows",
              "actual_net_return_sum",
              "candidate_net_return_sum",
              "delta_net_return_sum",
              "candidate_mean_net_return",
              "positive_admitted_rows",
              "negative_admitted_rows",
              "structural_ready",
              "development_qualified",
          ):
              print(f"- {field}: {report.get(field)}")
          print("### Direction")
          for direction, item in report.get("by_direction", {}).items():
              print(
                  f"- {direction}: validation={item.get('validation_rows')} "
                  f"admitted={item.get('admitted_rows')} "
                  f"sum={item.get('candidate_net_return_sum')} "
                  f"mean={item.get('candidate_mean_net_return')}"
              )
          print("### Stability")
          for block in report.get("stability_blocks", []):
              print(
                  f"- block {block['block_index']}: "
                  f"n={block['admitted_rows']} "
                  f"sum={block['candidate_net_return_sum']} "
                  f"mean={block['candidate_mean_net_return']} "
                  f"passes={block['passes']}"
              )
          print("### Admitted cohorts")
          for item in report.get("admitted_cohorts", []):
              print(
                  "- "
                  f"{item['direction']} / {item['lead_strategy']} / "
                  f"{item['score_band']} / {item['trend_regime']} / "
                  f"{item['volatility_regime']}: "
                  f"mean={item['training_mean_net_return']} "
                  f"se={item['training_standard_error']} "
                  f"lb={item['training_lower_bound']} "
                  f"(n={item['training_rows']}, "
                  f"{item['training_estimate_specificity']}), "
                  f"val_sum={item['validation_net_return_sum']} "
                  f"val_mean={item['validation_mean_net_return']} "
                  f"(n={item['validation_rows']})"
              )
          print("### Most negative skipped cohorts")
          for item in report.get("skipped_cohorts", [])[:8]:
              print(
                  "- "
                  f"{item['direction']} / {item['score_band']} / "
                  f"{item['trend_regime']} / "
                  f"{item['volatility_regime']}: "
                  f"mean={item['training_mean_net_return']} "
                  f"lb={item['training_lower_bound']} "
                  f"(n={item['training_rows']}), "
                  f"val_sum={item['validation_net_return_sum']}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-context-confidence-36694359628
          path: cadence-context-confidence.json
          if-no-files-found: error
          retention-days: 30
