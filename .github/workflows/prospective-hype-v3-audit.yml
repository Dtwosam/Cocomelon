name: Prospective HYPE V3 Independent Audit

on:
  pull_request:
    paths:
      - ".github/workflows/prospective-hype-v3-audit.yml"
      - "tests/test_prospective_hype_v3_audit_workflow.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospective-hype-v3-audit.yml"
  workflow_run:
    workflows:
      - "Prospective HYPE V3 Clean Observer"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify V3 audit workflow contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_prospective_hype_v3_audit_workflow.py -q

  audit:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUDIT_ROOT: artifacts/prospective-hype-v3-audit
      STATE_ARTIFACT_NAME: prospective-hype-v3-clean-state
      OBSERVER_WORKFLOW_PATH: .github/workflows/prospective-hype-v3-clean.yml
      PINNED_SOURCE_REVISION: 298723c52d6a3b09839d05451d3d7db9753815bf
      OBSERVER_WORKFLOW_BLOB_SHA: e00502dacb925d03bd90328f6ea39f6d195d0fa5
      DISPATCH_WORKFLOW_FILE: prospective-hype-v3-clean.yml
      RUN_TITLE_PREFIX: Prospective HYPE V3 capture
      UPSTREAM_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      UPSTREAM_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}

    steps:
      - name: Checkout frozen V3 source
        uses: actions/checkout@v7
        with:
          ref: 298723c52d6a3b09839d05451d3d7db9753815bf
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen V3 source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SOURCE_REVISION"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Capture audit clock
        id: clock
        run: |
          set -euo pipefail
          audit_ms="$(python - <<'PY'
          import time
          print(time.time_ns() // 1_000_000)
          PY
          )"
          echo "audited_at_ms=$audit_ms" >> "$GITHUB_OUTPUT"

      - name: Discover V3 state producer
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_ROOT"
          if [[ -n "$UPSTREAM_RUN_ID" && "$UPSTREAM_CONCLUSION" != "success" ]]; then
            {
              echo "status=failure"
              echo "reason_code=UPSTREAM_OBSERVER_NOT_SUCCESSFUL"
              echo "state_id=none"
              echo "producer_run_id=$UPSTREAM_RUN_ID"
              echo "state_created_at=none"
              echo "previous_state_id=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$UPSTREAM_RUN_ID" ]]; then
            if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100" \
              > /tmp/v3-upstream-jobs.json
            then
              {
                echo "status=failure"
                echo "reason_code=UPSTREAM_JOB_DISCOVERY_FAILED"
                echo "state_id=none"
                echo "producer_run_id=$UPSTREAM_RUN_ID"
                echo "state_created_at=none"
                echo "previous_state_id=none"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            printf '%s\n' '{"jobs":[]}' > /tmp/v3-upstream-jobs.json
          fi

          if ! gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT_NAME&per_page=100"             > /tmp/v3-state-artifacts.json
          then
            {
              echo "status=failure"
              echo "reason_code=STATE_ARTIFACT_DISCOVERY_FAILED"
              echo "state_id=none"
              echo "producer_run_id=none"
              echo "state_created_at=none"
              echo "previous_state_id=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/v3-state-artifacts.json").read_text(encoding="utf-8")
          )
          all_items = [
              item
              for item in payload.get("artifacts", [])
              if isinstance(item, dict)
              and item.get("expired") is False
              and item.get("name") == os.environ["STATE_ARTIFACT_NAME"]
              and isinstance(item.get("workflow_run"), dict)
              and item["workflow_run"].get("head_branch") == "main"
          ]
          upstream = os.environ.get("UPSTREAM_RUN_ID", "").strip()
          candidates = all_items
          if upstream:
              candidates = [
                  item
                  for item in all_items
                  if str(item["workflow_run"].get("id")) == upstream
              ]

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              if not candidates:
                  upstream_jobs = json.loads(
                      Path("/tmp/v3-upstream-jobs.json").read_text(encoding="utf-8")
                  )
                  conclusions = {
                      str(item.get("name")): item.get("conclusion")
                      for item in upstream_jobs.get("jobs", [])
                      if isinstance(item, dict)
                  }
                  duplicate_follower = (
                      bool(upstream)
                      and conclusions.get("prepare") == "success"
                      and conclusions.get("observe") == "skipped"
                  )
                  handle.write(
                      "status=" + ("follower" if duplicate_follower else "failure") + "\n"
                  )
                  handle.write(
                      "reason_code="
                      + (
                          "DUPLICATE_FOLLOWER_NO_STATE"
                          if duplicate_follower
                          else "STATE_ARTIFACT_MISSING"
                      )
                      + "\n"
                  )
                  handle.write("state_id=none\n")
                  handle.write(
                      "producer_run_id="
                      + (upstream if upstream else "none")
                      + "\n"
                  )
                  handle.write("state_created_at=none\n")
                  handle.write("previous_state_id=none\n")
              else:
                  selected = max(
                      candidates,
                      key=lambda item: (str(item["created_at"]), int(item["id"])),
                  )
                  selected_key = (
                      str(selected["created_at"]),
                      int(selected["id"]),
                  )
                  predecessors = [
                      item
                      for item in all_items
                      if (
                          str(item["created_at"]),
                          int(item["id"]),
                      ) < selected_key
                  ]
                  previous = (
                      max(
                          predecessors,
                          key=lambda item: (
                              str(item["created_at"]),
                              int(item["id"]),
                          ),
                      )
                      if predecessors
                      else None
                  )
                  handle.write("status=ok\n")
                  handle.write("reason_code=none\n")
                  handle.write(f"state_id={selected['id']}\n")
                  handle.write(
                      "producer_run_id="
                      f"{selected['workflow_run']['id']}\n"
                  )
                  handle.write(
                      f"state_created_at={selected['created_at']}\n"
                  )
                  handle.write(
                      "previous_state_id="
                      + ("none" if previous is None else str(previous["id"]))
                      + "\n"
                  )
          PY

      - name: Preserve duplicate follower audit receipt
        if: ${{ steps.discover.outputs.status == 'follower' }}
        env:
          AUDITED_AT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          PRODUCER_RUN_ID: ${{ steps.discover.outputs.producer_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          payload = {
              "kind": "prospective-hype-v3-independent-audit",
              "audited_at_ms": int(os.environ["AUDITED_AT_MS"]),
              "producer_run_id": os.environ["PRODUCER_RUN_ID"],
              "audit_status": "duplicate_follower",
              "reason_code": "DUPLICATE_FOLLOWER_NO_STATE",
              "interim_economics_redacted": True,
              "promotion_eligible": False,
              "schema_version": 1,
          }
          payload["audit_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          Path(os.environ["AUDIT_ROOT"], "audit.json").write_text(
              canonical(payload) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify producer provenance and find health artifact
        id: provenance
        if: ${{ steps.discover.outputs.status == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
          PREVIOUS_STATE_ID: ${{ steps.discover.outputs.previous_state_id }}
          PRODUCER_RUN_ID: ${{ steps.discover.outputs.producer_run_id }}
        run: |
          set -euo pipefail
          {
            echo "status=failure"
            echo "reason_code=PRODUCER_PROVENANCE_UNEXPECTED_FAILURE"
            echo "health_id=none"
            echo "previous_producer_run_id=none"
          } >> "$GITHUB_OUTPUT"

          if ! gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ID"             > /tmp/v3-state-meta.json
          then
            echo "reason_code=STATE_ARTIFACT_METADATA_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID"             > /tmp/v3-producer-run.json
          then
            echo "reason_code=PRODUCER_RUN_METADATA_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100"             > /tmp/v3-producer-artifacts.json
          then
            echo "reason_code=PRODUCER_ARTIFACT_LIST_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          producer_head_sha="$(
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/v3-producer-run.json").read_text(encoding="utf-8")
          )
          print(payload["head_sha"])
          PY
          )"
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/contents/$OBSERVER_WORKFLOW_PATH?ref=$producer_head_sha" \
            > /tmp/v3-producer-workflow-file.json
          then
            echo "reason_code=PRODUCER_WORKFLOW_BLOB_METADATA_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PREVIOUS_STATE_ID" != "none" ]]; then
            if ! gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_STATE_ID"               > /tmp/v3-previous-state-meta.json
            then
              echo "reason_code=PREVIOUS_STATE_ARTIFACT_METADATA_FAILED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            previous_run_id="$(
              python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/v3-previous-state-meta.json").read_text(encoding="utf-8")
          )
          print(payload["workflow_run"]["id"])
          PY
            )"
            if ! gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/runs/$previous_run_id"               > /tmp/v3-previous-producer-run.json
            then
              echo "reason_code=PREVIOUS_PRODUCER_RUN_METADATA_FAILED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            previous_head_sha="$(
              python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/v3-previous-producer-run.json").read_text(encoding="utf-8")
          )
          print(payload["head_sha"])
          PY
            )"
            if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/contents/$OBSERVER_WORKFLOW_PATH?ref=$previous_head_sha" \
              > /tmp/v3-previous-producer-workflow-file.json
            then
              echo "reason_code=PREVIOUS_PRODUCER_WORKFLOW_BLOB_METADATA_FAILED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            printf '{}\n' > /tmp/v3-previous-state-meta.json
            printf '{}\n' > /tmp/v3-previous-producer-run.json
            printf '{}\n' > /tmp/v3-previous-producer-workflow-file.json
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("/tmp/v3-state-meta.json").read_text(encoding="utf-8"))
          run = json.loads(Path("/tmp/v3-producer-run.json").read_text(encoding="utf-8"))
          payload = json.loads(
              Path("/tmp/v3-producer-artifacts.json").read_text(encoding="utf-8")
          )
          previous_state = json.loads(
              Path("/tmp/v3-previous-state-meta.json").read_text(encoding="utf-8")
          )
          previous_run = json.loads(
              Path("/tmp/v3-previous-producer-run.json").read_text(encoding="utf-8")
          )
          producer_workflow_file = json.loads(
              Path("/tmp/v3-producer-workflow-file.json").read_text(encoding="utf-8")
          )
          previous_producer_workflow_file = json.loads(
              Path("/tmp/v3-previous-producer-workflow-file.json").read_text(
                  encoding="utf-8"
              )
          )
          workflow = state.get("workflow_run")
          valid = (
              str(state.get("id")) == os.environ["STATE_ID"]
              and state.get("name") == os.environ["STATE_ARTIFACT_NAME"]
              and state.get("expired") is False
              and isinstance(workflow, dict)
              and str(workflow.get("id")) == os.environ["PRODUCER_RUN_ID"]
              and workflow.get("head_branch") == "main"
              and str(run.get("id")) == os.environ["PRODUCER_RUN_ID"]
              and run.get("head_branch") == "main"
              and run.get("path") == os.environ["OBSERVER_WORKFLOW_PATH"]
              and run.get("conclusion") == "success"
              and run.get("repository", {}).get("full_name")
              == os.environ["GITHUB_REPOSITORY"]
              and producer_workflow_file.get("sha")
              == os.environ["OBSERVER_WORKFLOW_BLOB_SHA"]
          )

          health_prefix = (
              "prospective-hype-v3-clean-health-"
              + os.environ["PRODUCER_RUN_ID"]
              + "-"
          )
          health = [
              item
              for item in payload.get("artifacts", [])
              if isinstance(item, dict)
              and item.get("expired") is False
              and str(item.get("name", "")).startswith(health_prefix)
          ]
          if len(health) != 1:
              valid = False

          previous_id = os.environ["PREVIOUS_STATE_ID"]
          previous_run_id = "none"
          if previous_id != "none":
              previous_workflow = previous_state.get("workflow_run")
              previous_run_id = str(previous_run.get("id", "none"))
              valid = valid and (
                  str(previous_state.get("id")) == previous_id
                  and previous_state.get("name") == os.environ["STATE_ARTIFACT_NAME"]
                  and previous_state.get("expired") is False
                  and isinstance(previous_workflow, dict)
                  and str(previous_workflow.get("id")) == previous_run_id
                  and previous_workflow.get("head_branch") == "main"
                  and previous_run.get("head_branch") == "main"
                  and previous_run.get("path") == os.environ["OBSERVER_WORKFLOW_PATH"]
                  and previous_run.get("conclusion") == "success"
                  and previous_run.get("repository", {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
                  and previous_producer_workflow_file.get("sha")
                  == os.environ["OBSERVER_WORKFLOW_BLOB_SHA"]
              )

          workflow_blob_valid = (
              producer_workflow_file.get("sha")
              == os.environ["OBSERVER_WORKFLOW_BLOB_SHA"]
          )
          previous_workflow_blob_valid = (
              previous_id == "none"
              or previous_producer_workflow_file.get("sha")
              == os.environ["OBSERVER_WORKFLOW_BLOB_SHA"]
          )
          reason_code = "PRODUCER_PROVENANCE_INVALID"
          if not workflow_blob_valid:
              reason_code = "PRODUCER_WORKFLOW_BLOB_DRIFT"
          elif not previous_workflow_blob_valid:
              reason_code = "PREVIOUS_PRODUCER_WORKFLOW_BLOB_DRIFT"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              if valid:
                  handle.write("status=ok\n")
                  handle.write("reason_code=none\n")
                  handle.write(f"health_id={health[0]['id']}\n")
                  handle.write(
                      f"previous_producer_run_id={previous_run_id}\n"
                  )
                  handle.write(
                      "workflow_blob_sha="
                      + os.environ["OBSERVER_WORKFLOW_BLOB_SHA"]
                      + "\n"
                  )
              else:
                  handle.write("status=failure\n")
                  handle.write(f"reason_code={reason_code}\n")
                  handle.write("health_id=none\n")
                  handle.write("previous_producer_run_id=none\n")
                  handle.write("workflow_blob_sha=none\n")
          PY

      - name: Download V3 state and health
        id: download
        if: ${{ steps.discover.outputs.status == 'ok' && steps.provenance.outputs.status == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
          PREVIOUS_STATE_ID: ${{ steps.discover.outputs.previous_state_id }}
          HEALTH_ID: ${{ steps.provenance.outputs.health_id }}
          WORKFLOW_BLOB_SHA: ${{ steps.provenance.outputs.workflow_blob_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_ROOT/state" "$AUDIT_ROOT/health"
          if [[ "$PREVIOUS_STATE_ID" != "none" ]]; then
            mkdir -p "$AUDIT_ROOT/previous-state"
          fi
          if ! gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ID/zip"             > /tmp/v3-state.zip
          then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason_code=STATE_DOWNLOAD_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HEALTH_ID/zip"             > /tmp/v3-health.zip
          then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason_code=HEALTH_DOWNLOAD_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! unzip -q /tmp/v3-state.zip -d "$AUDIT_ROOT/state"; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason_code=STATE_UNPACK_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! unzip -q /tmp/v3-health.zip -d "$AUDIT_ROOT/health"; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason_code=HEALTH_UNPACK_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PREVIOUS_STATE_ID" != "none" ]]; then
            if ! gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_STATE_ID/zip"               > /tmp/v3-previous-state.zip
            then
              echo "status=failure" >> "$GITHUB_OUTPUT"
              echo "reason_code=PREVIOUS_STATE_DOWNLOAD_FAILED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! unzip -q /tmp/v3-previous-state.zip -d "$AUDIT_ROOT/previous-state"; then
              echo "status=failure" >> "$GITHUB_OUTPUT"
              echo "reason_code=PREVIOUS_STATE_UNPACK_FAILED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"
          echo "reason_code=none" >> "$GITHUB_OUTPUT"

      - name: Capture V3 dispatch queue
        id: queue
        if: ${{ steps.download.outputs.status == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$DISPATCH_WORKFLOW_FILE/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > /tmp/v3-dispatch-runs.json
          then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "reason_code=none" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"workflow_runs":[]}' > /tmp/v3-dispatch-runs.json
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason_code=DISPATCH_QUEUE_DISCOVERY_FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Run independent V3 audit
        id: audit
        if: ${{ steps.download.outputs.status == 'ok' && steps.queue.outputs.status == 'ok' }}
        env:
          AUDITED_AT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
          PREVIOUS_STATE_ID: ${{ steps.discover.outputs.previous_state_id }}
          STATE_CREATED_AT: ${{ steps.discover.outputs.state_created_at }}
          PRODUCER_RUN_ID: ${{ steps.discover.outputs.producer_run_id }}
          PREVIOUS_PRODUCER_RUN_ID: ${{ steps.provenance.outputs.previous_producer_run_id }}
          HEALTH_ID: ${{ steps.provenance.outputs.health_id }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_ROOT"
          audit_rc=0
          python - <<'PY' > "$AUDIT_ROOT/audit.json" 2> /tmp/v3-audit-error.txt || audit_rc=$?
          import hashlib
          import json
          import os
          from datetime import datetime
          from decimal import Decimal, ROUND_CEILING
          from pathlib import Path

          from cocomelon.research.historical_discovery_freeze import (
              HYPE_DOWN_BEARISH_NEAR_BASKET_LONG_4H_V3,
          )
          from cocomelon.research.prospective_context_evidence import (
              MAX_ENTRY_CANDLE_AGE_MS,
              ProspectiveCampaignManifest,
              ProspectiveEvidenceStore,
          )
          from cocomelon.research.prospective_context_report import (
              HYPE_PROSPECTIVE_VALIDATION_V3,
          )
          from cocomelon.research.prospective_dispatch_queue import (
              HOUR_MS,
              future_capture_targets,
              missing_future_targets,
              next_protected_capture_ms,
              normalize_dispatch_runs,
          )
          from cocomelon.research.prospective_runtime_attestation import (
              ProspectiveRuntimeAttestation,
          )

          PINNED = "298723c52d6a3b09839d05451d3d7db9753815bf"
          MAX_STATE_AGE_MS = 2 * 60 * 60 * 1_000

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          def fail(code):
              raise SystemExit(code)

          audited_at_ms = int(os.environ["AUDITED_AT_MS"])
          spec = HYPE_DOWN_BEARISH_NEAR_BASKET_LONG_4H_V3
          plan = HYPE_PROSPECTIVE_VALIDATION_V3
          root = Path(os.environ["AUDIT_ROOT"]) / "state"

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected_manifest = ProspectiveCampaignManifest(
              candidate_spec_id=spec.spec_id,
              candidate_id=spec.candidate_id,
              validation_not_before_ms=spec.validation_not_before_ms,
          )
          expected_manifest_payload = json.loads(
              canonical(
                  {
                      **expected_manifest.identity_payload(),
                      "campaign_id": expected_manifest.campaign_id,
                  }
              )
          )
          if manifest != expected_manifest_payload:
              fail("CAMPAIGN_MANIFEST_MISMATCH")

          runtime_raw = json.loads((root / "runtime.json").read_text(encoding="utf-8"))
          runtime = ProspectiveRuntimeAttestation(
              candidate_spec_id=str(runtime_raw["candidate_spec_id"]),
              validation_plan_id=str(runtime_raw["validation_plan_id"]),
              observer_source_revision=str(runtime_raw["observer_source_revision"]),
              schema_version=int(runtime_raw["schema_version"]),
          )
          if runtime_raw.get("attestation_id") != runtime.attestation_id:
              fail("RUNTIME_ATTESTATION_ID_MISMATCH")
          if runtime.candidate_spec_id != spec.spec_id:
              fail("RUNTIME_CANDIDATE_MISMATCH")
          if runtime.validation_plan_id != plan.plan_id:
              fail("RUNTIME_PLAN_MISMATCH")
          if runtime.observer_source_revision != PINNED:
              fail("RUNTIME_SOURCE_REVISION_MISMATCH")

          control = json.loads(
              (root / "control-plane.json").read_text(encoding="utf-8")
          )
          expected_control = {
              "kind": "prospective-hype-v3-clean-control-plane",
              "candidate_spec_id": spec.spec_id,
              "validation_plan_id": plan.plan_id,
              "observer_source_revision": PINNED,
              "protected_capture_minute_utc": 3,
              "capture_transport": "rolling_workflow_dispatch_queue_v3",
              "queue_depth": 4,
              "queue_horizon_ms": 14_400_000,
              "prepare_handoff_lead_ms": 600_000,
              "duplicate_policy": "lowest_covering_run_id",
              "bootstrap_event": "push",
              "capture_event": "workflow_dispatch",
              "concurrency_mode": "target_leader_election",
              "max_entry_candle_age_ms": MAX_ENTRY_CANDLE_AGE_MS,
              "state_artifact_name": "prospective-hype-v3-clean-state",
              "evidence_root": "artifacts/prospective-hype-v3-clean",
              "prepare_job_timeout_minutes": 270,
              "observe_job_timeout_minutes": 30,
              "execution_mode": "paper",
              "api_url": "https://api.hyperliquid.xyz",
              "ws_url": "wss://api.hyperliquid.xyz/ws",
              "contents_permission": "read",
              "actions_permission": "write",
              "artifact_retention_days": 90,
              "schema_version": 3,
          }
          expected_control["control_plane_id"] = hashlib.sha256(
              canonical(expected_control).encode("utf-8")
          ).hexdigest()
          if control != expected_control:
              fail("CONTROL_PLANE_MISMATCH")

          store = ProspectiveEvidenceStore(root, spec=spec)
          observations = store.iter_observations()
          outcomes = store.iter_outcomes()

          previous_state_id = os.environ["PREVIOUS_STATE_ID"]
          previous_state_digest = None
          appended_observation_count = 0
          appended_outcome_count = 0
          lineage_status = "waiting_for_second_state"
          if previous_state_id != "none":
              previous_root = Path(os.environ["AUDIT_ROOT"]) / "previous-state"
              previous_manifest = json.loads(
                  (previous_root / "manifest.json").read_text(encoding="utf-8")
              )
              previous_runtime = json.loads(
                  (previous_root / "runtime.json").read_text(encoding="utf-8")
              )
              previous_control = json.loads(
                  (previous_root / "control-plane.json").read_text(encoding="utf-8")
              )
              if previous_manifest != manifest:
                  fail("CAMPAIGN_MANIFEST_DRIFT")
              if previous_runtime != runtime_raw:
                  fail("RUNTIME_ATTESTATION_DRIFT")
              if previous_control != control:
                  fail("CONTROL_PLANE_DRIFT")

              previous_store = ProspectiveEvidenceStore(previous_root, spec=spec)
              previous_observations = previous_store.iter_observations()
              previous_outcomes = previous_store.iter_outcomes()
              current_observations = {
                  item.observation_id: item for item in observations
              }
              current_outcomes = {
                  item.outcome_id: item for item in outcomes
              }
              for item in previous_observations:
                  if current_observations.get(item.observation_id) != item:
                      fail("PREVIOUS_OBSERVATION_REWRITTEN_OR_REMOVED")
              for item in previous_outcomes:
                  if current_outcomes.get(item.outcome_id) != item:
                      fail("PREVIOUS_OUTCOME_REWRITTEN_OR_REMOVED")

              previous_observation_ids = {
                  item.observation_id for item in previous_observations
              }
              previous_outcome_ids = {
                  item.outcome_id for item in previous_outcomes
              }
              appended_observation_count = sum(
                  item.observation_id not in previous_observation_ids
                  for item in observations
              )
              appended_outcome_count = sum(
                  item.outcome_id not in previous_outcome_ids
                  for item in outcomes
              )
              if previous_observations:
                  prior_max_anchor = max(
                      item.anchor_end_ms for item in previous_observations
                  )
                  if any(
                      item.observation_id not in previous_observation_ids
                      and item.anchor_end_ms <= prior_max_anchor
                      for item in observations
                  ):
                      fail("HISTORICAL_OBSERVATION_BACKFILL_FORBIDDEN")

              previous_state_digest = previous_store.state_digest
              lineage_status = "append_only_valid"

          if audited_at_ms < plan.validation_start_ms and (observations or outcomes):
              fail("PRE_CUTOVER_STATE_CONTAMINATED")
          if any(item.anchor_end_ms < plan.validation_start_ms for item in observations):
              fail("PRE_CUTOVER_OBSERVATION_PRESENT")
          if any(item.anchor_end_ms >= plan.validation_end_ms for item in observations):
              fail("POST_WINDOW_OBSERVATION_PRESENT")
          if len({item.anchor_end_ms for item in observations}) != len(observations):
              fail("DUPLICATE_OBSERVATION_ANCHOR")

          expected_to_date = plan.expected_anchor_count_as_of(audited_at_ms)
          observed_to_date = sum(
              1
              for item in observations
              if item.anchor_end_ms <= audited_at_ms
          )
          if observed_to_date > expected_to_date:
              fail("OBSERVATION_COUNT_EXCEEDS_EXPECTED_GRID")
          missed_to_date = expected_to_date - observed_to_date
          required = int(
              (
                  plan.min_capture_coverage * Decimal(plan.expected_anchor_count)
              ).to_integral_value(rounding=ROUND_CEILING)
          )
          missed_budget = plan.expected_anchor_count - required
          remaining_budget = missed_budget - missed_to_date

          state_created_ms = int(
              datetime.fromisoformat(
                  os.environ["STATE_CREATED_AT"].replace("Z", "+00:00")
              ).timestamp()
              * 1_000
          )
          state_age_ms = max(0, audited_at_ms - state_created_ms)
          if (
              audited_at_ms >= plan.first_expected_anchor_ms
              and state_age_ms > MAX_STATE_AGE_MS
          ):
              fail("STATE_ARTIFACT_STALE")

          dispatch_payload = json.loads(
              Path("/tmp/v3-dispatch-runs.json").read_text(encoding="utf-8")
          )
          if (
              not isinstance(dispatch_payload, dict)
              or not isinstance(dispatch_payload.get("workflow_runs"), list)
          ):
              fail("DISPATCH_QUEUE_PAYLOAD_INVALID")
          dispatch_runs = normalize_dispatch_runs(
              dispatch_payload["workflow_runs"]
          )
          next_target = next_protected_capture_ms(audited_at_ms)
          queue_base_target = next_target - HOUR_MS
          queue_targets = future_capture_targets(
              queue_base_target,
              depth=4,
          )
          missing_queue_targets = missing_future_targets(
              dispatch_runs,
              prefix=os.environ["RUN_TITLE_PREFIX"],
              target_capture_ms=queue_base_target,
              depth=4,
          )
          if missing_queue_targets:
              fail("DISPATCH_QUEUE_GAP")

          health_path = (
              Path(os.environ["AUDIT_ROOT"])
              / "health"
              / "prospective-hype-health.json"
          )
          health = json.loads(health_path.read_text(encoding="utf-8"))
          health_identity = {
              key: value
              for key, value in health.items()
              if key != "health_id"
          }
          calculated_health_id = hashlib.sha256(
              canonical(health_identity).encode("utf-8")
          ).hexdigest()
          if health.get("health_id") != calculated_health_id:
              fail("HEALTH_ID_MISMATCH")
          if health.get("plan_id") != plan.plan_id:
              fail("HEALTH_PLAN_MISMATCH")
          if health.get("expected_anchor_count") != plan.expected_anchor_count:
              fail("HEALTH_EXPECTED_ANCHOR_COUNT_MISMATCH")
          if health.get("required_final_observation_count") != required:
              fail("HEALTH_CAPTURE_REQUIREMENT_MISMATCH")
          if health.get("missed_anchor_budget") != missed_budget:
              fail("HEALTH_MISS_BUDGET_MISMATCH")
          if health.get("status") not in {
              "pre_validation",
              "healthy",
              "degraded",
              "irrecoverable",
          }:
              fail("HEALTH_STATUS_INVALID")

          status = (
              "pre_validation"
              if audited_at_ms < plan.first_expected_anchor_ms
              else "irrecoverable"
              if remaining_budget < 0
              else "degraded"
              if missed_to_date > 0
              else "healthy"
          )
          receipt = {
              "kind": "prospective-hype-v3-independent-audit",
              "audited_at_ms": audited_at_ms,
              "producer_run_id": os.environ["PRODUCER_RUN_ID"],
              "previous_producer_run_id": os.environ["PREVIOUS_PRODUCER_RUN_ID"],
              "state_artifact_id": os.environ["STATE_ID"],
              "previous_state_artifact_id": previous_state_id,
              "health_artifact_id": os.environ["HEALTH_ID"],
              "campaign_id": store.manifest.campaign_id,
              "candidate_spec_id": spec.spec_id,
              "validation_plan_id": plan.plan_id,
              "runtime_attestation_id": runtime.attestation_id,
              "control_plane_id": control["control_plane_id"],
              "observer_workflow_blob_sha": os.environ["WORKFLOW_BLOB_SHA"],
              "state_digest": store.state_digest,
              "previous_state_digest": previous_state_digest,
              "lineage_status": lineage_status,
              "appended_observation_count": appended_observation_count,
              "appended_outcome_count": appended_outcome_count,
              "observation_count": len(observations),
              "outcome_count": len(outcomes),
              "expected_anchor_count_to_date": expected_to_date,
              "observation_count_to_date": observed_to_date,
              "missed_anchor_count_to_date": missed_to_date,
              "remaining_missed_anchor_budget": remaining_budget,
              "state_artifact_age_ms": state_age_ms,
              "campaign_health_status": health["status"],
              "dispatch_queue_status": "covered",
              "dispatch_queue_depth": 4,
              "dispatch_queue_targets": queue_targets,
              "dispatch_queue_missing_targets": missing_queue_targets,
              "audit_status": status,
              "interim_economics_redacted": True,
              "promotion_eligible": False,
              "schema_version": 1,
          }
          receipt["audit_id"] = hashlib.sha256(
              canonical(receipt).encode("utf-8")
          ).hexdigest()
          print(canonical(receipt))
          PY

          if [[ "$audit_rc" -eq 0 ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "reason_code=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -f "$AUDIT_ROOT/audit.json"
          reason_code="$(python - <<'PY'
          import re
          from pathlib import Path

          raw = Path("/tmp/v3-audit-error.txt").read_text(encoding="utf-8").strip()
          candidate = raw.splitlines()[-1].strip() if raw else "V3_AUDIT_FAILED"
          if not re.fullmatch(r"[A-Z][A-Z0-9_]*", candidate):
              candidate = "V3_AUDIT_FAILED"
          print(candidate)
          PY
          )"
          echo "status=failure" >> "$GITHUB_OUTPUT"
          echo "reason_code=$reason_code" >> "$GITHUB_OUTPUT"

      - name: Preserve V3 audit failure receipt
        if: ${{ always() }}
        env:
          AUDITED_AT_MS: ${{ steps.clock.outputs.audited_at_ms }}
          DISCOVERY_STATUS: ${{ steps.discover.outputs.status }}
          DISCOVERY_REASON: ${{ steps.discover.outputs.reason_code }}
          PROVENANCE_STATUS: ${{ steps.provenance.outputs.status }}
          PROVENANCE_REASON: ${{ steps.provenance.outputs.reason_code }}
          DOWNLOAD_STATUS: ${{ steps.download.outputs.status }}
          DOWNLOAD_REASON: ${{ steps.download.outputs.reason_code }}
          QUEUE_STATUS: ${{ steps.queue.outputs.status }}
          QUEUE_REASON: ${{ steps.queue.outputs.reason_code }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          AUDIT_REASON: ${{ steps.audit.outputs.reason_code }}
          STATE_ID: ${{ steps.discover.outputs.state_id }}
          PREVIOUS_STATE_ID: ${{ steps.discover.outputs.previous_state_id }}
          PRODUCER_RUN_ID: ${{ steps.discover.outputs.producer_run_id }}
          HEALTH_ID: ${{ steps.provenance.outputs.health_id }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_ROOT"
          if [[ -f "$AUDIT_ROOT/audit.json" ]]; then
            rm -f "$AUDIT_ROOT/failure.json"
            exit 0
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )

          stages = (
              ("discovery", os.environ.get("DISCOVERY_STATUS"), os.environ.get("DISCOVERY_REASON")),
              ("provenance", os.environ.get("PROVENANCE_STATUS"), os.environ.get("PROVENANCE_REASON")),
              ("download", os.environ.get("DOWNLOAD_STATUS"), os.environ.get("DOWNLOAD_REASON")),
              ("queue", os.environ.get("QUEUE_STATUS"), os.environ.get("QUEUE_REASON")),
              ("audit", os.environ.get("AUDIT_STATUS"), os.environ.get("AUDIT_REASON")),
          )
          stage = "audit"
          reason = "V3_AUDIT_FAILED"
          for candidate_stage, status, candidate_reason in stages:
              if status not in {"ok", "success"}:
                  stage = candidate_stage
                  if candidate_reason and candidate_reason != "none":
                      reason = candidate_reason
                  break

          payload = {
              "kind": "prospective-hype-v3-independent-audit-failure",
              "audited_at_ms": int(os.environ["AUDITED_AT_MS"]),
              "stage": stage,
              "reason_code": reason,
              "producer_run_id": os.environ.get("PRODUCER_RUN_ID") or "none",
              "state_artifact_id": os.environ.get("STATE_ID") or "none",
              "previous_state_artifact_id": (
                  os.environ.get("PREVIOUS_STATE_ID") or "none"
              ),
              "health_artifact_id": os.environ.get("HEALTH_ID") or "none",
              "interim_economics_redacted": True,
              "promotion_eligible": False,
              "schema_version": 1,
          }
          payload["failure_id"] = hashlib.sha256(
              canonical(payload).encode("utf-8")
          ).hexdigest()
          Path(os.environ["AUDIT_ROOT"], "failure.json").write_text(
              canonical(payload) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload V3 independent audit receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: prospective-hype-v3-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/prospective-hype-v3-audit/audit.json
            artifacts/prospective-hype-v3-audit/failure.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Preserve V3 audit failure status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -f "$AUDIT_ROOT/audit.json"
          test ! -f "$AUDIT_ROOT/failure.json"
