name: Temporary cadence robustness audit 36694359628

on:
  push:
    branches:
      - audit/cadence-robustness-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/continuous-paper-state.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/continuous-paper-state.zip -d /tmp/artifact
          test -s /tmp/artifact/continuous-paper-state.tar
      - name: Extract cadence shadow state only
        run: |
          set -euo pipefail
          mkdir -p /tmp/state
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json
          test -s /tmp/state/cadence-shadow-state.json
      - name: Evaluate 15m to 1h robustness
        run: |
          set -euo pipefail
          python scripts/analyze_cadence_opportunity_robustness.py \
            /tmp/state/cadence-shadow-state.json \
            --cadence-ms 900000 \
            --horizon-ms 3600000 \
            --json-out cadence-opportunity-robustness.json \
            > /tmp/cadence-opportunity-robustness.stdout.json
          cmp cadence-opportunity-robustness.json \
            /tmp/cadence-opportunity-robustness.stdout.json
      - name: Summarize concentration and blocks
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("cadence-opportunity-robustness.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## 15m -> 1h cadence robustness")
          for field in (
              "status",
              "training_rows",
              "validation_rows",
              "purged_overlap_rows",
              "admitted_rows",
              "candidate_net_return_sum",
              "candidate_mean_net_return",
              "market_count",
              "positive_market_count",
              "negative_market_count",
              "largest_abs_market_share",
              "absolute_market_contribution_hhi",
              "candidate_net_return_sum_without_largest_positive_market",
              "leave_one_market_out_min_sum",
              "leave_one_market_out_max_sum",
          ):
              print(f"- {field}: {report.get(field)}")
          print("- diagnostic checks:")
          for key, value in report.get("diagnostic_checks", {}).items():
              print(f"  - {key}: {value}")
          print("### Chronological blocks")
          for block in report.get("blocks", []):
              print(
                  "- block "
                  f"{block['block_index']}: n={block['rows']} "
                  f"sum={block['net_return_sum']} "
                  f"mean={block['mean_net_return']}"
              )
          print("### Markets by absolute contribution")
          for market in report.get("markets", []):
              print(
                  "- "
                  f"{market['market']}: n={market['rows']} "
                  f"sum={market['net_return_sum']} "
                  f"mean={market['mean_net_return']} "
                  f"+={market['positive_rows']} "
                  f"-={market['negative_rows']}"
              )
              for block in market.get("blocks", []):
                  if block["rows"]:
                      print(
                          "    - block "
                          f"{block['block_index']}: n={block['rows']} "
                          f"sum={block['net_return_sum']} "
                          f"mean={block['mean_net_return']}"
                      )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-opportunity-robustness-36694359628
          path: cadence-opportunity-robustness.json
          if-no-files-found: error
          retention-days: 30
