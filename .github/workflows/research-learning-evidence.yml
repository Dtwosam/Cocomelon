name: Research Learning Evidence Sync

on:
  workflow_run:
    workflows: ["Scheduled Research Mainnet Replay Campaign"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Exact successful research campaign run ID to recover
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-learning-evidence-sync
  cancel-in-progress: false

env:
  COCOMELON_EXECUTION_MODE: paper

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current learning control plane
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify upstream run and download exact research campaign
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.upstream_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$DISPATCH_RUN_ID"
          fi
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "upstream research run id is invalid" >&2
            exit 64
          fi

          mkdir -p incoming/campaign
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"             > /tmp/upstream-run.json
          RUN_ID="$RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("/tmp/upstream-run.json").read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["RUN_ID"]):
              raise SystemExit("upstream research run id changed")
          if run.get("head_branch") != "main":
              raise SystemExit("upstream research run is not from main")
          if run.get("conclusion") != "success":
              raise SystemExit("upstream research run did not succeed")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("upstream research run event is invalid")
          if run.get("path") != ".github/workflows/research-campaign-scheduled.yml":
              raise SystemExit("upstream research workflow path is invalid")
          if run.get("name") != "Scheduled Research Mainnet Replay Campaign":
              raise SystemExit("upstream research workflow name is invalid")
          head_sha = run.get("head_sha")
          if (
              not isinstance(head_sha, str)
              or len(head_sha) != 40
              or any(char not in "0123456789abcdef" for char in head_sha)
          ):
              raise SystemExit("upstream research head sha is invalid")
          attempt = run.get("run_attempt")
          if isinstance(attempt, bool) or not isinstance(attempt, int) or attempt <= 0:
              raise SystemExit("upstream research run attempt is invalid")
          repository = run.get("head_repository") or {}
          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("upstream research run is from another repository")
          PY

          RUN_ATTEMPT="$(jq -r '.run_attempt' /tmp/upstream-run.json)"
          HEAD_SHA="$(jq -r '.head_sha' /tmp/upstream-run.json)"
          ARTIFACT_NAME="research-campaign-${RUN_ID}-${RUN_ATTEMPT}"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"             > /tmp/upstream-artifacts.json
          ARTIFACT_ROW="$(
            python - "$ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          payload = json.loads(
              Path("/tmp/upstream-artifacts.json").read_text(encoding="utf-8")
          )
          matches = [
              item
              for item in payload.get("artifacts", [])
              if item.get("name") == expected and item.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit("expected exactly one complete research campaign artifact")
          artifact = matches[0]
          digest = artifact.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("research campaign artifact digest is missing")
          print(str(artifact["id"]) + "\t" + digest)
          PY
          )"
          IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_DIGEST <<< "$ARTIFACT_ROW"
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/research-campaign.zip
          unzip -q /tmp/research-campaign.zip -d incoming/campaign
          {
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "head_sha=$HEAD_SHA"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_digest=$ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Restore latest trusted cumulative learning state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p learning-state
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-learning-state&per_page=100"             > /tmp/learning-state-artifacts.json
          ARTIFACT_ID="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/learning-state-artifacts.json").read_text(encoding="utf-8")
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          for artifact in artifacts:
              run_id = artifact["workflow_run"].get("id")
              if not isinstance(run_id, int):
                  continue
              completed = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(completed.stdout)
              path = run.get("path")
              trusted_events = {
                  ".github/workflows/research-learning-evidence.yml": {
                      "workflow_run",
                      "workflow_dispatch",
                  },
                  ".github/workflows/continuous-paper-learning-evidence.yml": {
                      "workflow_run",
                      "workflow_dispatch",
                  },
                  ".github/workflows/research-learning-state-continuity.yml": {
                      "schedule",
                      "workflow_dispatch",
                  },
              }.get(path)
              if (
                  trusted_events is not None
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and run.get("event") in trusted_events
                  and run.get("head_sha") == artifact["workflow_run"].get("head_sha")
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  print(artifact["id"])
                  break
          PY
          )"
          if [ -n "$ARTIFACT_ID" ]; then
            /usr/bin/gh api               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"               > /tmp/learning-state.zip
            unzip -q /tmp/learning-state.zip -d learning-state
          fi

      - name: Sync authenticated required-candidate paper evidence
        run: |
          set -euo pipefail
          cocomelon-research-learning-sync             --campaign-root incoming/campaign             --state-root learning-state             --upstream-run-id "${{ steps.upstream.outputs.run_id }}"             --upstream-run-attempt "${{ steps.upstream.outputs.run_attempt }}"             --upstream-head-sha "${{ steps.upstream.outputs.head_sha }}"             --upstream-artifact-id "${{ steps.upstream.outputs.artifact_id }}"             --upstream-artifact-digest "${{ steps.upstream.outputs.artifact_digest }}"             > learning-state/last-sync.json

      - name: Audit cumulative learning readiness without training
        run: |
          set -euo pipefail
          AS_OF_MS="$(date +%s%3N)"
          set +e
          cocomelon-learning-readiness             --learning-root learning-state/ledger             --feature-store-dir learning-state/features             --as-of-ms "$AS_OF_MS"             --kind paper_execution             --feature market             --feature direction             --feature return_5m             --feature return_15m             --feature return_1h             --feature funding             --feature open_interest             --feature trend_regime             --feature volatility_regime             > learning-state/readiness.json             2> /tmp/learning-readiness.err
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; then
            cat /tmp/learning-readiness.err >&2
            exit "$STATUS"
          fi

      - name: Render non-economic sync summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          sync = json.loads(
              Path("learning-state/last-sync.json").read_text(encoding="utf-8")
          )
          readiness = json.loads(
              Path("learning-state/readiness.json").read_text(encoding="utf-8")
          )
          print("## Research learning evidence sync")
          print(f"- scanned trades: {sync['scanned_trades']}")
          print(f"- new learning records: {sync['created_records']}")
          print(f"- cumulative learning records: {sync['learning_record_count']}")
          print(
              "- structural readiness: "
              + ("ready" if readiness["structurally_ready"] else "not ready")
          )
          print("- research-only: true")
          print("- execution enabled: false")
          PY

      - name: Publish cumulative research learning state
        uses: actions/upload-artifact@v7
        with:
          name: research-learning-state
          path: learning-state/
          if-no-files-found: error
          retention-days: 90
