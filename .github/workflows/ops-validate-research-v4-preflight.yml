name: One-shot Research V4 Preflight Validation

on:
  push:
    branches:
      - ops/validate-research-v4-preflight-20260902
    paths:
      - .github/workflows/ops-validate-research-v4-preflight.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch paper research campaign on main
        run: |
          set -euo pipefail
          /usr/bin/gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/research-campaign-scheduled.yml/dispatches" \
            -f ref=main
