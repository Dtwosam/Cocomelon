name: Artifact Action Upgrade Patch

on:
  push:
    branches:
      - chore/artifact-actions-node24

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/artifact-actions-node24
          fetch-depth: 0
      - name: Upgrade artifact action majors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "actions/upload-artifact@v4": "actions/upload-artifact@v7",
              "actions/download-artifact@v4": "actions/download-artifact@v8",
          }
          paths = list(Path(".github/workflows").glob("*.yml"))
          paths += [
              path
              for path in Path("tests").glob("*.py")
              if path.name != "test_github_actions_runtime_versions.py"
          ]
          for path in paths:
              source = path.read_text(encoding="utf-8")
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
          PY
          git diff --check
          python -m pytest tests/test_github_actions_runtime_versions.py -q || true
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows tests
          git commit -m "ci: upgrade artifact action runtime majors"
          git push origin HEAD:chore/artifact-actions-node24
