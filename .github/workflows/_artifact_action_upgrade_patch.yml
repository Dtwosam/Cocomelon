name: Artifact Action Upgrade Patch

on:
  push:
    branches:
      - chore/artifact-actions-node24

permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        path:
          - .github/workflows/evidence-campaign-scheduled.yml
          - .github/workflows/evidence-campaign-v4-scheduled.yml
          - .github/workflows/evidence-corpus-curator-v3.yml
          - .github/workflows/evidence-corpus-curator-v4.yml
          - .github/workflows/evidence-corpus-curator.yml
          - .github/workflows/phase9-selection-audit-archive.yml
          - .github/workflows/phase9-v3-one-shot.yml
          - .github/workflows/phase9-v4-one-shot.yml
          - .github/workflows/research-campaign-scheduled.yml
          - .github/workflows/research-v4-registry-sync.yml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/artifact-actions-node24
          fetch-depth: 1
          persist-credentials: false
      - name: Emit byte-exact upgraded file
        shell: bash
        env:
          TARGET: ${{ matrix.path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET"])
          source = path.read_text(encoding="utf-8")
          updated = source.replace("actions/upload-artifact@v4", "actions/upload-artifact@v7")
          updated = updated.replace("actions/download-artifact@v4", "actions/download-artifact@v8")
          path.write_text(updated, encoding="utf-8")
          PY
          git diff --check -- "$TARGET"
          printf 'TARGET_PATH=%s\n' "$TARGET"
          printf 'TARGET_B64_BEGIN\n'
          base64 -w0 "$TARGET"
          printf '\nTARGET_B64_END\n'
