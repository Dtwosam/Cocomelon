name: Research Learning State Continuity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-learning-state-continuity
  cancel-in-progress: false

env:
  MAX_STATE_AGE_DAYS: "14"

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted continuity control
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Locate latest trusted cumulative learning state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=research-learning-state&per_page=100"             > /tmp/learning-state-artifacts.json
          STATE_ROW="$(
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/learning-state-artifacts.json").read_text(encoding="utf-8")
          )
          artifacts = sorted(
              (
                  item
                  for item in payload.get("artifacts", [])
                  if item.get("expired") is False
                  and isinstance(item.get("workflow_run"), dict)
                  and item["workflow_run"].get("head_branch") == "main"
              ),
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )
          trusted_paths = {
              ".github/workflows/research-learning-evidence.yml": {
                  "workflow_run",
                  "workflow_dispatch",
              },
              ".github/workflows/research-learning-state-continuity.yml": {
                  "schedule",
                  "workflow_dispatch",
              },
          }
          for artifact in artifacts:
              workflow_run = artifact["workflow_run"]
              run_id = workflow_run.get("id")
              if not isinstance(run_id, int):
                  continue
              fetched = subprocess.run(
                  [
                      "/usr/bin/gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              run = json.loads(fetched.stdout)
              path = run.get("path")
              allowed_events = trusted_paths.get(path)
              if (
                  allowed_events is not None
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and run.get("event") in allowed_events
                  and run.get("head_sha") == workflow_run.get("head_sha")
                  and (run.get("head_repository") or {}).get("full_name")
                  == os.environ["GITHUB_REPOSITORY"]
              ):
                  created_at = artifact.get("created_at")
                  if not isinstance(created_at, str) or not created_at:
                      raise SystemExit("trusted learning state artifact is missing created_at")
                  print(
                      str(artifact["id"])
                      + "\t"
                      + created_at
                      + "\t"
                      + str(run_id)
                  )
                  break
          PY
          )"
          if [ -z "$STATE_ROW" ]; then
            {
              echo "exists=false"
              echo "artifact_id="
              echo "created_at="
              echo "source_run_id="
            } >> "$GITHUB_OUTPUT"
            echo "no trusted cumulative learning state exists yet"
            exit 0
          fi
          IFS=$'\t' read -r ARTIFACT_ID CREATED_AT SOURCE_RUN_ID <<< "$STATE_ROW"
          {
            echo "exists=true"
            echo "artifact_id=$ARTIFACT_ID"
            echo "created_at=$CREATED_AT"
            echo "source_run_id=$SOURCE_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether continuity refresh is needed
        id: freshness
        if: ${{ steps.state.outputs.exists == 'true' }}
        env:
          CREATED_AT: ${{ steps.state.outputs.created_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          NEEDS_REFRESH="$(
            python - <<'PY'
          import os
          from datetime import datetime, timezone

          created_at = datetime.fromisoformat(
              os.environ["CREATED_AT"].replace("Z", "+00:00")
          )
          if created_at.tzinfo is None:
              raise SystemExit("learning state created_at is not timezone-aware")
          now = datetime.now(timezone.utc)
          age_seconds = (now - created_at.astimezone(timezone.utc)).total_seconds()
          if age_seconds < 0:
              raise SystemExit("learning state artifact is from the future")
          max_age_seconds = int(os.environ["MAX_STATE_AGE_DAYS"]) * 86400
          forced = os.environ["EVENT_NAME"] == "workflow_dispatch"
          print("true" if forced or age_seconds >= max_age_seconds else "false")
          PY
          )"
          echo "needs_refresh=$NEEDS_REFRESH" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_REFRESH" = "true" ]; then
            echo "continuity refresh required"
          else
            echo "latest trusted learning state is still within freshness window"
          fi

      - name: Download exact trusted learning state
        if: ${{ steps.freshness.outputs.needs_refresh == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.state.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p learning-state
          /usr/bin/gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             > /tmp/learning-state.zip
          unzip -q /tmp/learning-state.zip -d learning-state

      - name: Verify cumulative state contents before checkpoint
        if: ${{ steps.freshness.outputs.needs_refresh == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from cocomelon.research.learning_feature_snapshots import (
              LearningFeatureSnapshotStore,
          )
          from cocomelon.research.learning_state_lineage import (
              verify_learning_state_lineage,
          )
          from cocomelon.research.outcome_learning import LearningEvidenceLedger

          root = Path("learning-state")
          sync_path = root / "last-sync.json"
          readiness_path = root / "readiness.json"
          if not sync_path.is_file() or not readiness_path.is_file():
              raise SystemExit("trusted learning state is missing control receipts")
          if not (root / "ledger").is_dir() or not (root / "features").is_dir():
              raise SystemExit("trusted learning state is missing evidence stores")

          sync = json.loads(sync_path.read_text(encoding="utf-8"))
          readiness = json.loads(readiness_path.read_text(encoding="utf-8"))
          for label, payload in (("sync", sync), ("readiness", readiness)):
              if payload.get("research_only") is not True:
                  raise SystemExit(f"{label} receipt is not research-only")
              if payload.get("promotion_eligible") is not False:
                  raise SystemExit(f"{label} receipt unexpectedly authorizes promotion")
              if payload.get("execution_ready") is not False:
                  raise SystemExit(f"{label} receipt unexpectedly authorizes execution")

          ledger = LearningEvidenceLedger(root / "ledger")
          features = LearningFeatureSnapshotStore(root / "features")
          records = ledger.iter_records()
          snapshots = features.iter_verified()
          if sync.get("learning_record_count") != len(records):
              raise SystemExit("learning record count does not match persisted ledger")
          if sync.get("feature_snapshot_count") != len(snapshots):
              raise SystemExit("feature snapshot count does not match persisted store")
          if sync.get("learning_state_digest") != ledger.state_digest:
              raise SystemExit("learning ledger digest mismatch")
          if sync.get("feature_state_digest") != features.state_digest:
              raise SystemExit("learning feature-store digest mismatch")

          lineage = verify_learning_state_lineage(
              root,
              learning_record_count=len(records),
              learning_state_digest=ledger.state_digest,
              feature_snapshot_count=len(snapshots),
              feature_state_digest=features.state_digest,
              require_entry=True,
          )
          if lineage is None:
              raise SystemExit("learning lineage is unexpectedly empty")
          if sync.get("lineage_sequence") != lineage.sequence:
              raise SystemExit("learning lineage sequence does not match sync receipt")
          if sync.get("lineage_entry_id") != lineage.entry_id:
              raise SystemExit("learning lineage entry does not match sync receipt")

          eligible = readiness.get("eligible_record_count")
          quarantined = readiness.get("quarantined_record_count")
          if (
              isinstance(eligible, bool)
              or not isinstance(eligible, int)
              or eligible < 0
              or isinstance(quarantined, bool)
              or not isinstance(quarantined, int)
              or quarantined < 0
              or eligible + quarantined != len(records)
          ):
              raise SystemExit("readiness record counts do not reconcile with ledger")

          upstream_run_id = sync.get("upstream_run_id")
          if (
              isinstance(upstream_run_id, bool)
              or not isinstance(upstream_run_id, int)
              or upstream_run_id <= 0
          ):
              raise SystemExit("sync upstream run id is invalid")
          PY

      - name: Render continuity summary
        if: ${{ steps.freshness.outputs.needs_refresh == 'true' }}
        run: |
          {
            echo "## Research learning state continuity"
            echo "- source run: ${{ steps.state.outputs.source_run_id }}"
            echo "- state content re-verified: true"
            echo "- state mutated: false"
            echo "- research-only: true"
            echo "- execution enabled: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Republish verified cumulative learning state
        if: ${{ steps.freshness.outputs.needs_refresh == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: research-learning-state
          path: learning-state/
          if-no-files-found: error
          retention-days: 90
