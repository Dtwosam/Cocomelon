name: Ops Stage Patched Research Campaign Blob

on:
  push:
    branches:
      - fix/research-candidate-diagnostics-dir-20260903
    paths:
      - ".github/workflows/ops-export-research-campaign-source.yml"

permissions:
  contents: write

jobs:
  stage-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-candidate-diagnostics-dir-20260903
          fetch-depth: 1

      - name: Patch and stage exact workflow bytes at non-workflow path
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/research-campaign-scheduled.yml")
          source = path.read_text(encoding="utf-8")
          prefix = "          set -euo pipefail\n"
          policy = (
              "          printf '%s\\n' \"$CANDIDATE_SANDBOX_POLICY\" "
              + "\\"
              + "\n"
          )
          old = prefix + policy
          new = (
              prefix
              + '          mkdir -p "$GITHUB_WORKSPACE/research-campaign/diagnostics"\n'
              + policy
          )
          if source.count(old) != 1:
              raise RuntimeError(
                  f"expected exactly one candidate policy precondition target; found {source.count(old)}"
              )
          patched = source.replace(old, new)
          staging = Path("ops/patched-research-campaign-scheduled.yml")
          staging.parent.mkdir(parents=True, exist_ok=True)
          staging.write_text(patched, encoding="utf-8")
          PY
          git diff --no-index --check \
            .github/workflows/research-campaign-scheduled.yml \
            ops/patched-research-campaign-scheduled.yml || test $? -eq 1
          git diff --no-index \
            .github/workflows/research-campaign-scheduled.yml \
            ops/patched-research-campaign-scheduled.yml || test $? -eq 1

      - name: Push only the non-workflow staging blob
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/patched-research-campaign-scheduled.yml
          git commit -m "ops: stage patched research campaign blob"
          git push origin HEAD:fix/research-candidate-diagnostics-dir-20260903
