name: Temporary complete research candidate execution binding

on:
  push:
    branches:
      - fix/research-bind-candidate-execution-20260911
    paths:
      - .github/workflows/_tmp-render-research-execution-binding-v2.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-bind-candidate-execution-20260911
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Render completed candidate execution binding patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/_tmp-render-research-execution-binding.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = helper.index(marker) + len(marker)
          end = helper.index("\n          PY", start)
          prior_patch = textwrap.dedent(helper[start:end])
          exec(compile(prior_patch, '<candidate-execution-renderer>', 'exec'))

          cohort_path = Path('src/cocomelon/research/cohort.py')
          text = cohort_path.read_text(encoding='utf-8')
          old = '''def _assert_replay_eligible(replay: dict[str, object]) -> None:\n    if replay.get("network_access") is not False:\n        raise ValueError("research cohort replay must be offline")\n    if replay.get(_ORDER_FLAG_KEY) is not False:\n        raise ValueError("research cohort replay must disable order execution")\n    if replay.get("data_complete") is not True:\n        raise ValueError("research cohort replay must be complete")\n    if replay.get("entry_window_ms") != RESEARCH_ENTRY_WINDOW_MS:\n        raise ValueError("research cohort replay entry window is not precommitted")\n    if replay.get("max_position_age_ms") != RESEARCH_MAX_POSITION_AGE_MS:\n        raise ValueError("research cohort replay exit horizon is not precommitted")\n'''
          new = '''def _assert_replay_eligible(\n    replay: dict[str, object],\n    *,\n    replay_config: BaselineReplayConfig,\n) -> None:\n    if replay.get("network_access") is not False:\n        raise ValueError("research cohort replay must be offline")\n    if replay.get(_ORDER_FLAG_KEY) is not False:\n        raise ValueError("research cohort replay must disable order execution")\n    if replay.get("data_complete") is not True:\n        raise ValueError("research cohort replay must be complete")\n    if replay.get("entry_window_ms") != RESEARCH_ENTRY_WINDOW_MS:\n        raise ValueError("research cohort replay entry window is not precommitted")\n    if replay.get("max_position_age_ms") != replay_config.execution.max_position_age_ms:\n        raise ValueError("research cohort replay exit horizon does not match frozen config")\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected replay eligibility block count')
          text = text.replace(old, new, 1)
          old_call = '    _assert_replay_eligible(replay)\n'
          new_call = '    _assert_replay_eligible(replay, replay_config=bundle.replay_config)\n'
          if text.count(old_call) != 1:
              raise SystemExit('unexpected replay eligibility call count')
          cohort_path.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')
          PY

      - name: Verify rendered patch
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pytest tests/test_research_candidate_execution_binding.py -q
          git diff --check

      - name: Upload rendered files
        uses: actions/upload-artifact@v4
        with:
          name: rendered-research-execution-binding-v2
          path: |
            src/cocomelon/research/cohort.py
            .github/workflows/research-campaign-scheduled.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
