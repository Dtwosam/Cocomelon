name: Phase 9 Mainnet Heartbeat Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase9-mainnet-heartbeat-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COCOMELON_EXECUTION_MODE: paper
      COCOMELON_API_URL: https://api.hyperliquid.xyz
      COCOMELON_WS_URL: wss://api.hyperliquid.xyz/ws
      COCOMELON_WS_CONNECT_SPACING_SECONDS: 15
      COHORT_CODE_REVISION: 9c3ff4727f885050806b7f8db6b90ef1066c52f9
    steps:
      - name: Checkout spaced pinned cohort
        uses: actions/checkout@v4
        with:
          ref: 9c3ff4727f885050806b7f8db6b90ef1066c52f9
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cocomelon
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Record mainnet heartbeat diagnostic
        run: |
          set -euo pipefail
          mkdir -p heartbeat-smoke/output heartbeat-smoke/recording
          git rev-parse HEAD > heartbeat-smoke/output/cohort-head.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat-smoke/output/started-at-utc.txt
          START_EPOCH=$(date +%s)

          python - <<'PY' > heartbeat-smoke/output/record-transport.json
          import json
          from pathlib import Path

          from cocomelon.config import Settings
          from cocomelon.evidence.cli_support import (
              _run_mainnet_evidence,
              record_mainnet_evidence_payload,
          )
          from cocomelon.evidence.redundant_stream import RedundantStreamMux
          from cocomelon.hyperliquid.ws_supervisor import event_stream_id

          trace_path = Path("heartbeat-smoke/output/lane-trace.jsonl")
          trace_path.touch()
          first_event_lanes: set[int] = set()
          original_on_event = RedundantStreamMux.on_event
          original_on_gap = RedundantStreamMux.on_gap

          def write_trace(payload: dict[str, object]) -> None:
              with trace_path.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(payload, sort_keys=True) + "\n")
                  handle.flush()

          async def traced_on_event(self, lane, event):  # type: ignore[no-untyped-def]
              first = lane not in first_event_lanes
              result = await original_on_event(self, lane, event)
              if first:
                  first_event_lanes.add(lane)
                  write_trace(
                      {
                          "type": "first_event",
                          "lane": lane,
                          "stream_id": event_stream_id(event),
                          "receive_ms": int(event.receive_time.timestamp() * 1_000),
                          "session_ready_lanes_after": sorted(self._session_ready_lanes),
                      }
                  )
              return result

          async def traced_on_gap(self, lane, gap):  # type: ignore[no-untyped-def]
              ready_before = sorted(self._session_ready_lanes)
              active_before = self.active_lane(gap.stream_id)
              result = await original_on_gap(self, lane, gap)
              write_trace(
                  {
                      "type": "gap",
                      "lane": lane,
                      "stream_id": gap.stream_id,
                      "started_ms": gap.started_ms,
                      "ended_ms": gap.ended_ms,
                      "reason": gap.reason,
                      "session_ready_lanes_before": ready_before,
                      "session_ready_lanes_after": sorted(self._session_ready_lanes),
                      "active_lane_before": active_before,
                      "active_lane_after": self.active_lane(gap.stream_id),
                  }
              )
              return result

          RedundantStreamMux.on_event = traced_on_event
          RedundantStreamMux.on_gap = traced_on_gap

          duration_seconds=90
          payload = record_mainnet_evidence_payload(
              Settings.from_env(),
              root="heartbeat-smoke/recording",
              seconds=duration_seconds,
              deep_limit=5,
              runner=_run_mainnet_evidence,
          )
          print(json.dumps(payload, sort_keys=True))
          PY

          END_EPOCH=$(date +%s)
          ELAPSED_SECONDS=$((END_EPOCH - START_EPOCH))
          printf '%s\n' "$ELAPSED_SECONDS" > heartbeat-smoke/output/elapsed-seconds.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat-smoke/output/finished-at-utc.txt
          if [ "$ELAPSED_SECONDS" -lt 85 ]; then
            echo "heartbeat smoke ended before crossing the old disconnect boundary" >&2
            exit 1
          fi

      - name: Normalize and assert heartbeat transport health
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cocomelon.evidence.transport_health import normalize_redundant_record_payload

          root = Path("heartbeat-smoke/output")
          raw = json.loads((root / "record-transport.json").read_text(encoding="utf-8"))
          record = normalize_redundant_record_payload(raw)
          (root / "record.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          elapsed_seconds = int((root / "elapsed-seconds.txt").read_text().strip())
          cohort_head = (root / "cohort-head.txt").read_text().strip()
          assert cohort_head == os.environ["COHORT_CODE_REVISION"]
          assert elapsed_seconds >= 85
          assert record["network_access"] is True
          assert record["live_orders"] is False
          assert record["gap_count"] == 0
          assert record["duplicate_count"] == 0
          assert record["anomaly_count"] == 0
          assert record["redundant_ws_lane_count"] == 2
          assert record["transport_health_semantics"] == "redundant-mainnet-merged-feed-v1"

          summary = {
              "purpose": "transport-heartbeat-smoke",
              "diagnostic_only": True,
              "cohort_revision": cohort_head,
              "elapsed_seconds": elapsed_seconds,
              "session_id": record["session_id"],
              "selected_markets": record["selected_markets"],
              "event_count": record["event_count"],
              "gap_count": record["gap_count"],
              "reconnect_count": record["reconnect_count"],
              "transport_reconnect_count": record["transport_reconnect_count"],
              "redundant_ws_lane_count": record["redundant_ws_lane_count"],
              "network_access": record["network_access"],
              "live_orders": record["live_orders"],
          }
          (root / "heartbeat-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload heartbeat diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase9-mainnet-heartbeat-smoke-${{ github.run_id }}
          path: heartbeat-smoke/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
