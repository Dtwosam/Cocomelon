name: Temporary cadence tree rank calibration audit 36694359628

on:
  push:
    branches:
      - audit/cadence-tree-rank-calibration-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,research]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
          test -s /tmp/state/cadence-shadow-state.json
          test -d /tmp/state/learning-features/records
      - name: Evaluate nested tree rank calibration
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_tree_rank_calibration.py \
            /tmp/state/cadence-shadow-state.json \
            /tmp/state/learning-features \
            --cadence-ms 900000 \
            --horizon-ms 3600000 \
            --json-out cadence-tree-rank-calibration.json \
            > /tmp/cadence-tree-rank-calibration.stdout.json
          cmp cadence-tree-rank-calibration.json \
            /tmp/cadence-tree-rank-calibration.stdout.json
      - name: Summarize nested calibration
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          r=json.loads(
              Path("cadence-tree-rank-calibration.json").read_text()
          )
          print("## Nested cadence-tree rank calibration")
          for k in (
              "status","outer_training_rows","outer_validation_rows",
              "outer_purged_overlap_rows","inner_training_rows",
              "inner_calibration_rows","inner_purged_overlap_rows",
              "selected_band_indices","admitted_rows","skipped_rows",
              "actual_net_return_sum","candidate_net_return_sum",
              "delta_net_return_sum","candidate_mean_net_return",
              "positive_admitted_rows","negative_admitted_rows",
              "structural_ready","development_qualified",
          ):
              print(f"- {k}: {r.get(k)}")
          print("### Calibration bands")
          for item in r.get("calibration_bands",[]):
              print(
                  f"- band {item['band_index']}: "
                  f"rows={item.get('rows')} "
                  f"mean={item.get('mean_net_return')} "
                  f"lb={item.get('lower_bound')} "
                  f"long={item.get('long_rows')} "
                  f"short={item.get('short_rows')} "
                  f"selected={item.get('selected')}"
              )
          print("### Final validation bands")
          for item in r.get("validation_bands",[]):
              print(
                  f"- band {item['band_index']}: "
                  f"rows={item.get('rows')} "
                  f"selected={item.get('selected')} "
                  f"sum={item.get('net_return_sum')} "
                  f"mean={item.get('mean_net_return')} "
                  f"long={item.get('long_rows')} "
                  f"short={item.get('short_rows')}"
              )
          print("### Direction")
          for direction,item in r.get("by_direction",{}).items():
              print(
                  f"- {direction}: validation={item.get('validation_rows')} "
                  f"admitted={item.get('admitted_rows')} "
                  f"sum={item.get('candidate_net_return_sum')} "
                  f"mean={item.get('candidate_mean_net_return')}"
              )
          print("### Stability")
          for block in r.get("stability_blocks",[]):
              print(
                  f"- block {block['block_index']}: "
                  f"n={block['admitted_rows']} "
                  f"sum={block['candidate_net_return_sum']} "
                  f"mean={block['candidate_mean_net_return']} "
                  f"passes={block['passes']}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-tree-rank-calibration-36694359628
          path: cadence-tree-rank-calibration.json
          if-no-files-found: error
          retention-days: 30
