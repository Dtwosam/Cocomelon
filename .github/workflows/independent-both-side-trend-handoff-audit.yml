name: Independent Both-Side Trend Paired Handoff Audit

on:
  # Bootstrap the exact first post-embargo trend source archive read-only,
  # even if its noncritical deferred research tail has not yet finished.
  # Never imply the source worker completed from a preliminary receipt.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/independent-both-side-trend-handoff-audit.yml"
  # workflow_run is sometimes suppressed for deeply chained paper handoffs.
  # Schedule has an independent GitHub event and selects actual source ZIPs.
  schedule:
    - cron: "17 */3 * * *"
  workflow_run:
    workflows:
      - Continuous Mainnet Paper Trader
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original continuous-paper source run ID (active permitted as preliminary only)
        required: true
        type: string
      source_run_attempt:
        description: Exact source attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: both-side-trend-handoff-audit-${{ github.event_name == 'push' && '38281228549' || github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}-${{ github.event_name == 'push' && '1' || github.event_name == 'schedule' && 'auto' || github.event_name == 'workflow_dispatch' && inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ ((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'push' && '38281228549' || github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event_name == 'push' && '1' || github.event_name == 'workflow_dispatch' && inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install independent paper evidence reviewer
        run: python -m pip install -e .

      - name: Resolve latest completed original worker with exact trend ZIP
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          mkdir -p /tmp/trend-paper-audit
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-paper.yml/runs?status=completed&branch=main&per_page=50" > /tmp/trend-paper-audit/completed-workers.json
          chosen_id=""
          chosen_attempt=""
          while read -r run_id run_attempt; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/trend-paper-audit/candidate-artifacts.json
            exact_name="continuous-paper-both-side-trend-paired-shadow-$run_id-$run_attempt"
            if jq -e --arg name "$exact_name" '
              [.artifacts[] | select(.name == $name and .expired == false)]
              | length == 1
            ' /tmp/trend-paper-audit/candidate-artifacts.json > /dev/null; then
              chosen_id="$run_id"
              chosen_attempt="$run_attempt"
              break
            fi
          done < <(
            jq -r '
              .workflow_runs[]
              | select(.status == "completed" and .head_branch == "main"
                and .event == "workflow_dispatch"
                and .path == ".github/workflows/continuous-paper.yml")
              | "\(.id) \(.run_attempt)"
            ' /tmp/trend-paper-audit/completed-workers.json
          )
          if [ -z "$chosen_id" ]; then
            echo "::error::No completed original worker with exact trend archive found in most recent 50 workflow runs" >&2
            exit 1
          fi
          printf 'SOURCE_RUN_ID=%s\nSOURCE_ATTEMPT=%s\n' "$chosen_id" "$chosen_attempt" >> "$GITHUB_ENV"
          echo "Scheduled independent audit of completed original paper run $chosen_id attempt $chosen_attempt" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch exact original paper worker source metadata
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Exact source run and attempt must be positive" >&2
            exit 1
          fi
          mkdir -p /tmp/trend-paper-audit
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/trend-paper-audit/run.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > /tmp/trend-paper-audit/jobs.json
          gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/trend-paper-audit/artifacts.json

      - name: Download exact independently published trend ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          name="continuous-paper-both-side-trend-paired-shadow-$SOURCE_RUN_ID-$SOURCE_ATTEMPT"
          artifact_id="$(jq -r --arg name "$name" '
            [.artifacts[] | select(.name == $name)]
            | if length == 1 then .[0].id else empty end
          ' /tmp/trend-paper-audit/artifacts.json)"
          if [ -z "$artifact_id" ]; then
            echo "::notice::Exact trend paired artifact missing; audit receipt will remain unverified"
            exit 0
          fi
          if ! curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-max-time 240 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output /tmp/trend-paper-audit/source.zip; then
            echo "::warning::Unable to download exact trend paired ZIP; leaving audit unverified"
            rm -f /tmp/trend-paper-audit/source.zip
          fi

      - name: Verify outer SHA, exact source identity and internal paired receipts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_both_side_trend_paired_handoff.py \
            --run-json /tmp/trend-paper-audit/run.json \
            --jobs-json /tmp/trend-paper-audit/jobs.json \
            --artifacts-json /tmp/trend-paper-audit/artifacts.json \
            --artifact-zip /tmp/trend-paper-audit/source.zip \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-attempt "$SOURCE_ATTEMPT" \
            --output trend-paired-handoff-audit.json
          test -s trend-paired-handoff-audit.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          receipt = json.loads(Path("trend-paired-handoff-audit.json").read_text())
          print("## Independent both-side trend paired paper handoff")
          print("- source class:", receipt["source_class"])
          print("- original source worker fully completed:", receipt.get("source_worker_completed", False))
          print("- original source worker succeeded:", receipt.get("source_worker_completed_successfully", False))
          print("- exact expected upgrade handoff separately verified:", receipt.get("expected_upgrade_handoff_proven", False))
          print("- audit state:", receipt["status"])
          print("- evidence failures:", receipt["reasons"])
          print("- outer ZIP SHA256:", receipt["archive_sha256"])
          print("- exact candidate ID:", receipt["expected_candidate_id"])
          print("- execution SQLite integrity verified:", receipt.get("archived_execution_sqlite_integrity_verified", False))
          print("- fill/fee/funding account reconciliation:", receipt.get("archived_execution_economics_reconciled", False))
          print("- reconciled lane accounting:", receipt.get("reconciled_lanes"))
          print("- frozen scoped market-data gap sources:", receipt.get("source_scoped_open_gap_diagnostics"))
          print("- original market feed gaps independently authenticated: FALSE")
          print("- positive after-cost account edge verified: FALSE")
          print("- live execution / promotion authority: FALSE / FALSE")
          PY

      # Historical anchor: independently authenticated first post-19:00 UTC
      # handoff artifact. This is source evidence, not an execution signal.
      - name: Download immutable original paired-ledger anchor
        if: ${{ always() && env.SOURCE_RUN_ID != '38281228549' && hashFiles('trend-paired-handoff-audit.json') != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh_api_bounded_retry.sh
          mkdir -p /tmp/trend-paper-audit
          anchor_run="38281228549"
          anchor_attempt="1"
          if ! gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$anchor_run" > /tmp/trend-paper-audit/anchor-run.json; then
            echo "::warning::Original paired-ledger anchor run unavailable; continuity unverified"
            exit 0
          fi
          if ! gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$anchor_run/jobs?per_page=100" > /tmp/trend-paper-audit/anchor-jobs.json; then
            echo "::warning::Original paired-ledger anchor jobs unavailable; continuity unverified"
            exit 0
          fi
          if ! gh_api_bounded_retry "repos/$GITHUB_REPOSITORY/actions/runs/$anchor_run/artifacts?per_page=100" > /tmp/trend-paper-audit/anchor-artifacts.json; then
            echo "::warning::Original paired-ledger anchor artifacts unavailable; continuity unverified"
            exit 0
          fi
          name="continuous-paper-both-side-trend-paired-shadow-$anchor_run-$anchor_attempt"
          anchor_artifact="$(jq -r --arg name "$name" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].id else empty end
          ' /tmp/trend-paper-audit/anchor-artifacts.json)"
          if [ -z "$anchor_artifact" ]; then
            echo "::warning::Exact original paired-ledger anchor ZIP absent; continuity unverified"
            exit 0
          fi
          if ! curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-max-time 240 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$anchor_artifact/zip" \
              --output /tmp/trend-paper-audit/anchor.zip; then
            echo "::warning::Original paired-ledger anchor ZIP unavailable; continuity unverified"
            rm -f /tmp/trend-paper-audit/anchor.zip
          fi

      - name: Verify exact original-to-successor signed ledger prefix
        if: ${{ always() && hashFiles('trend-paired-handoff-audit.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --source-run-id "$SOURCE_RUN_ID"
            --source-attempt "$SOURCE_ATTEMPT"
            --current-receipt trend-paired-handoff-audit.json
            --current-archive /tmp/trend-paper-audit/source.zip
            --output trend-paired-ledger-continuity.json
          )
          if [ "$SOURCE_RUN_ID" != "38281228549" ]; then
            # Absence of required files produces a durable unverified receipt,
            # never a silently successful cross-worker continuity claim.
            args+=(
              --anchor-run /tmp/trend-paper-audit/anchor-run.json
              --anchor-jobs /tmp/trend-paper-audit/anchor-jobs.json
              --anchor-artifacts /tmp/trend-paper-audit/anchor-artifacts.json
              --anchor-archive /tmp/trend-paper-audit/anchor.zip
            )
          fi
          python -m scripts.audit_both_side_trend_ledger_anchor "${args[@]}"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          receipt = json.loads(
              Path("trend-paired-ledger-continuity.json").read_text(encoding="utf-8")
          )
          print("## Independent cross-worker trend campaign continuity")
          print("- result:", receipt["status"])
          print("- reasons:", receipt["reasons"])
          print("- original source ZIP independently authenticated:", receipt.get("original_archive_independently_authenticated", False))
          print("- immutable original ledger prefix preserved:", receipt.get("original_anchor_prefix_preserved", False))
          print("- new signed forward checkpoint appended:", receipt.get("forward_worker_append_verified", False))
          print("- newly appended checkpoint count:", receipt.get("new_signed_checkpoint_count", 0))
          print("- after-cost profitable edge / market-feed completeness: UNPROVEN / UNPROVEN")
          print("- execution / promotion authority: FALSE / FALSE")
          PY

      - name: Upload read-only anchored paper campaign continuity receipt
        if: ${{ always() && hashFiles('trend-paired-ledger-continuity.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: independent-trend-ledger-continuity-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_ATTEMPT }}
          path: trend-paired-ledger-continuity.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable independent trend handoff receipt
        if: ${{ always() && hashFiles('trend-paired-handoff-audit.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: independently-audited-both-side-trend-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_ATTEMPT }}
          path: trend-paired-handoff-audit.json
          if-no-files-found: error
          retention-days: 90
