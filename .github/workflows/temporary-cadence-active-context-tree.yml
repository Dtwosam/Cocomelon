name: Temporary active-context cadence tree audit 36694359628

on:
  push:
    branches:
      - audit/cadence-active-context-tree-36694359628

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,research]"
      - name: Download exact predecessor paper state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11089237194"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/state.zip
          mkdir -p /tmp/artifact /tmp/state
          unzip -q /tmp/state.zip -d /tmp/artifact
          tar -xf /tmp/artifact/continuous-paper-state.tar \
            -C /tmp/state \
            ./cadence-shadow-state.json \
            ./learning-features
      - name: Evaluate active-context cadence tree
        run: |
          set -euo pipefail
          python scripts/evaluate_cadence_active_context_tree.py \
            /tmp/state/cadence-shadow-state.json \
            /tmp/state/learning-features \
            --cadence-ms 900000 \
            --horizon-ms 3600000 \
            --json-out cadence-active-context-tree.json \
            > /tmp/cadence-active-context-tree.stdout.json
          cmp cadence-active-context-tree.json \
            /tmp/cadence-active-context-tree.stdout.json
      - name: Summarize outer validation
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("cadence-active-context-tree.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## Active-context 15m -> 1h cadence tree")
          for field in (
              "status",
              "training_rows",
              "validation_rows",
              "purged_overlap_rows",
              "min_context_markets",
              "admitted_rows",
              "skipped_rows",
              "actual_net_return_sum",
              "candidate_net_return_sum",
              "delta_net_return_sum",
              "candidate_mean_net_return",
              "positive_admitted_rows",
              "negative_admitted_rows",
              "structural_ready",
              "development_qualified",
          ):
              print(f"- {field}: {report.get(field)}")
          print("### Direction")
          for direction, item in report.get("by_direction", {}).items():
              print(
                  f"- {direction}: validation={item.get('validation_rows')} "
                  f"admitted={item.get('admitted_rows')} "
                  f"sum={item.get('candidate_net_return_sum')} "
                  f"mean={item.get('candidate_mean_net_return')}"
              )
          print("### Stability")
          for block in report.get("stability_blocks", []):
              print(
                  f"- block {block['block_index']}: "
                  f"n={block['admitted_rows']} "
                  f"sum={block['candidate_net_return_sum']} "
                  f"mean={block['candidate_mean_net_return']} "
                  f"passes={block['passes']}"
              )
          print("### Context states")
          for item in report.get("by_context_state_1h", []):
              print(
                  f"- {item['context_state_1h']}: "
                  f"validation={item['validation_rows']} "
                  f"admitted={item['admitted_rows']} "
                  f"sum={item['candidate_net_return_sum']} "
                  f"mean={item['candidate_mean_net_return']}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-active-context-tree-36694359628
          path: cadence-active-context-tree.json
          if-no-files-found: error
          retention-days: 30
