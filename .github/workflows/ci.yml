name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
      - run: python -m pytest -q

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,research]"
      - run: >-
          python -m pytest
          tests/test_replay_compaction.py
          tests/test_parquet_replay_source.py
          tests/test_historical_dataset.py
          tests/test_historical_cross_market.py
          tests/test_historical_dataset_cli.py
          tests/test_historical_experiment.py
          tests/test_historical_experiment_cli.py
          tests/test_historical_ridge.py
          tests/test_historical_ridge_horizon.py
          tests/test_historical_ridge_stability.py
          tests/test_historical_occupancy.py
          tests/test_historical_portfolio_capacity.py
          tests/test_historical_ridge_occupancy.py
          tests/test_historical_ridge_portfolio_capacity.py
          tests/test_historical_model_comparison.py
          tests/test_historical_trade_archive.py
          tests/test_historical_archive_candles_cli.py
          tests/test_historical_archive_acquisition.py
          tests/test_historical_archive_acquisition_cli.py
          tests/test_historical_archive_experiment.py
          tests/test_historical_archive_presets.py
          tests/test_historical_archive_preset_cli.py
          tests/test_historical_archive_review.py
          tests/test_historical_archive_candidate_freeze.py
          tests/test_historical_archive_training_plan.py
          tests/test_historical_archive_final_calibration.py
          tests/test_python_source_attestation.py
          tests/test_historical_archive_overlap.py
          tests/test_historical_tree.py
          tests/test_historical_context_opportunity.py
          tests/test_historical_context_opportunity_report.py
          tests/test_historical_context_opportunity_cli.py
