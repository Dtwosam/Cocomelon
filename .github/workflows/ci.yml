name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
      - run: python -m pytest -q

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,research]"
      - run: >-
          python -m pytest
          tests/test_replay_compaction.py
          tests/test_parquet_replay_source.py
          -q

  stage-safe-gap-test:
    if: github.ref_name == 'fix/research-safe-gap-only-launch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stage updated research workflow contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_research_runner_workflow.py')
          source = path.read_text(encoding='utf-8')
          old = "    assert 'cron: \"2 7 * * *\"' in source\n"
          new = (
              "    trigger_block = source.split(\"\\npermissions:\\n\", 1)[0]\n"
              "    assert \"workflow_dispatch:\" in trigger_block\n"
              "    assert \"schedule:\" not in trigger_block\n"
          )
          if source.count(old) != 1:
              raise SystemExit('expected exactly one legacy direct-cron assertion')
          Path('staged-test-research-runner-workflow.py').write_text(
              source.replace(old, new), encoding='utf-8'
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staged-test-research-runner-workflow.py
          git commit -m "ci: stage safe-gap workflow contract test"
          git push origin HEAD:fix/research-safe-gap-only-launch
