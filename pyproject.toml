[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocomelon-trader"
version = "0.1.0"
description = "Autonomous Hyperliquid mainnet paper-to-live perpetual trading research system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "websockets>=17.0.1,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.14,<2",
]
research = [
  "boto3>=1.35,<2",
  "lz4>=4.3,<5",
  "numpy>=2.1,<3",
  "pyarrow>=25,<26",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
cocomelon = "cocomelon.cli:main"
cocomelon-mainnet-evidence = "cocomelon.mainnet_cli:main"
cocomelon-historical-backfill = "cocomelon.historical_backfill_cli:main"
cocomelon-historical-archive-candles = "cocomelon.historical_archive_candles_cli:main"
cocomelon-historical-archive = "cocomelon.historical_archive_acquisition_cli:main"
cocomelon-historical-archive-experiment = "cocomelon.historical_archive_experiment_cli:main"
cocomelon-historical-archive-preset = "cocomelon.historical_archive_preset_cli:main"
cocomelon-historical-archive-clean-observer = "cocomelon.historical_archive_clean_observer_cli:main"
cocomelon-historical-archive-clean-cycle = "cocomelon.historical_archive_clean_cycle_cli:main"
cocomelon-historical-archive-clean-runtime = "cocomelon.historical_archive_clean_runtime_cli:main"
cocomelon-historical-archive-clean-control-plane = "cocomelon.historical_archive_clean_control_plane_cli:main"
cocomelon-historical-dataset = "cocomelon.historical_dataset_cli:main"
cocomelon-historical-experiment = "cocomelon.historical_experiment_cli:main"
cocomelon-historical-model-comparison = "cocomelon.historical_model_comparison_cli:main"
cocomelon-historical-context-opportunity = "cocomelon.historical_context_opportunity_cli:main"
cocomelon-historical-context-occupancy = "cocomelon.historical_context_occupancy_cli:main"
cocomelon-historical-cross-sectional-spread = "cocomelon.historical_cross_sectional_spread_cli:main"
cocomelon-prospective-hype-observer = "cocomelon.prospective_hype_observer_cli:main"
cocomelon-prospective-hype-report = "cocomelon.prospective_hype_report_cli:main"
cocomelon-prospective-hype-readiness = "cocomelon.prospective_hype_readiness_cli:main"
cocomelon-prospective-hype-readiness-failure = "cocomelon.prospective_hype_readiness_failure_cli:main"
cocomelon-prospective-hype-state-readiness = "cocomelon.prospective_hype_state_readiness_cli:main"
cocomelon-prospective-hype-lineage = "cocomelon.prospective_hype_lineage_cli:main"
cocomelon-prospective-hype-lineage-failure = "cocomelon.prospective_hype_lineage_failure_cli:main"
cocomelon-prospective-hype-blind-monitor = "cocomelon.prospective_hype_blind_monitor_cli:main"
cocomelon-prospective-hype-blind-monitor-failure = "cocomelon.prospective_hype_blind_monitor_failure_cli:main"
cocomelon-prospective-hype-cutover = "cocomelon.prospective_hype_cutover_cli:main"
cocomelon-prospective-hype-cutover-failure = "cocomelon.prospective_hype_cutover_failure_cli:main"
cocomelon-research = "cocomelon.research_cli:main"
cocomelon-research-status = "cocomelon.research_dashboard_cli:main"
cocomelon-research-runner = "cocomelon.research_runner_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cocomelon"]
