[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocomelon-trader"
version = "0.1.0"
description = "Autonomous Hyperliquid mainnet paper-to-live perpetual trading research system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "websockets>=17.0.1,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.14,<2",
]
research = [
  "boto3>=1.35,<2",
  "lz4>=4.3,<5",
  "numpy>=2.1,<3",
  "pyarrow>=25,<26",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
cocomelon = "cocomelon.cli:main"
cocomelon-mainnet-evidence = "cocomelon.mainnet_cli:main"
cocomelon-historical-backfill = "cocomelon.historical_backfill_cli:main"
cocomelon-historical-archive-candles = "cocomelon.historical_archive_candles_cli:main"
