[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocomelon-trader"
version = "0.1.0"
description = "Autonomous Hyperliquid mainnet paper-to-live perpetual trading research system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "websockets>=17.0.1,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.14,<2",
]
research = [
  "pyarrow>=25,<26",
]

[project.scripts]
cocomelon = "cocomelon.cli:main"
cocomelon-mainnet-evidence = "cocomelon.mainnet_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cocomelon"]
